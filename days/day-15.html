<script>window.TOEFL_LESSON={"day":15,"week":3,"theme":"Defaults, Opt-Outs and Behavioral Policy","focus":"Listening: intention, emphasis and discourse","claim":"Default choices can influence behavior through inertia or perceived endorsement, so their benefits require more than enrollment statistics.","evidence":"People often retain a preselected option even when they are permitted to change it.","caveat":"High retention does not show that the default is financially suitable or understood by all users.","response":"Evaluate comprehension, ease of opting out, consequences and long-term outcomes alongside participation.","storageKey":"toefl110day15-diversity-v3","notice":"UNIVERSITY BENEFITS PORTAL — AUTOMATIC ENROLLMENT\n\nNew graduate assistants are enrolled by default in the campus transport pass program. The first monthly deduction will appear on next month's pay statement. Students who do not want the pass can opt out through the benefits portal by the 20th of this month.\n\nThe program is unrelated to the university medical plan. Students may change transport participation later, but deductions already processed cannot be refunded automatically. A plain-language guide is available in five languages through the employee support office.","academicPassage":"When a form presents one option already selected, many people leave it unchanged. Such a default may influence behavior even if the person is free to choose another option. This observation has led organizations to redesign enrollment forms for retirement savings, digital communication, and other services.\n\nA common explanation is inertia: changing the default requires attention and effort. Yet defaults can also appear to communicate a recommendation from the institution presenting them. Someone may assume that a preselected retirement contribution is the amount experts regard as suitable. These two mechanisms have different policy implications. Reducing effort barriers might help one group, while clearer guidance may be more useful to another.\n\nAutomatic enrollment can raise participation, but participation alone does not prove that people have made a better choice. A default savings rate may be too low for some workers, and opting out may be confusing for people with limited language access. Likewise, default consent to data sharing creates ethical concerns if individuals fail to understand what information will be collected.\n\nPolicy designers therefore consider not only how many people keep the default but also comprehension, long-term outcomes, and the ability to reverse a decision. A defensible intervention should preserve meaningful choice and explain consequences clearly. Otherwise, a seemingly helpful nudge risks substituting administrative convenience for individual welfare.","readingClozePassage":"A university introduced a travel pass that was selected automatically for new assistants. Participation ro__ quickly, an_ administrators descr____ the prog___ as succe_____. A fol___-up sur___ revealed th__ several stud____ had no_ noticed the recurring charge. Others knew about the pass but could not find the opt-out procedure. The staff revised the portal to display the cost clearly and explain how to change the selection. Their new evaluation considered comprehension and actual use, rather than treating every retained default as evidence of a satisfied participant.","cloze":[{"partial":"ro__","answer":"rose","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"an_","answer":"and","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"descr____","answer":"described","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"prog___","answer":"program","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"succe_____","answer":"successful","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"fol___","answer":"follow","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"sur___","answer":"survey","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"th__","answer":"that","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"stud____","answer":"students","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"no_","answer":"not","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"}],"questions":{"rd":[{"q":"How are new graduate assistants initially registered for the transport pass?","options":["They receive a pass through their medical plan.","They are enrolled only after purchasing a semester ticket.","They are automatically enrolled unless they opt out.","They must visit the office and sign a paper application."],"answer":2,"why":"실생활 공지의 해당 조건을 찾아 확인하세요. They are automatically enrolled unless they opt out."},{"q":"What happens if an assistant opts out after a deduction is processed?","options":["Opting out becomes impossible for the remainder of the degree.","Future deductions stop, but the past deduction is not automatically refunded.","All previous payments are refunded on the same day.","The assistant is removed from the medical plan."],"answer":1,"why":"공지의 별도 요건 또는 예외 조항에 명시된 행동은 Future deductions stop, but the past deduction is not automatically refunded.입니다."},{"q":"Which statement about the transport-pass program is correct?","options":["It is separate from the university medical plan.","The pass is compulsory for every assistant forever.","A processed deduction is always refunded immediately.","Opting out automatically cancels medical coverage."],"answer":0,"why":"공지의 예외 조항과 구체적인 적용 범위를 비교해야 합니다. 정답 근거: It is separate from the university medical plan."}],"ra":[{"q":"Which interpretation best reflects the author’s position in the debate in the passage on Defaults, Opt-Outs and Behavioral Policy?","options":["High enrollment numbers alone establish that a program improved wellbeing.","A preselected option is legally mandatory in every setting.","Everyone who retains a default has made an active informed choice.","Default choices can influence behavior through inertia or perceived endorsement, so their benefits require more than enrollment statistics."],"answer":3,"why":"중심 논지는 세부 사례에서 도출되는 가장 신중한 결론입니다. Default choices can influence behavior through inertia or perceived endorsement, so their benefits require more than enrollment statistics."},{"q":"What specific observation in the defaults, opt-outs and behavioral policy case motivates the discussion?","options":["A preselected option is legally mandatory in every setting.","High enrollment numbers alone establish that a program improved wellbeing.","People often retain a preselected option even when they are permitted to change it.","Everyone who retains a default has made an active informed choice."],"answer":2,"why":"지문의 사례·대조 정보를 직접 확인해야 합니다. People often retain a preselected option even when they are permitted to change it."},{"q":"Which qualification prevents the evidence about automatic enrollment from supporting an unconditional claim?","options":["A preselected option is legally mandatory in every setting.","High retention does not show that the default is financially suitable or understood by all users.","Everyone who retains a default has made an active informed choice.","High enrollment numbers alone establish that a program improved wellbeing."],"answer":1,"why":"한계 조건은 곧바로 틀린 결론이라는 뜻이 아니라 적용 범위를 제한합니다. High retention does not show that the default is financially suitable or understood by all users."},{"q":"Why does the author give the concrete example related to automatic enrollment rather than begin with a universal rule?","options":["It illustrates a specific relationship involving automatic enrollment while establishing the boundaries of the wider argument.","It lists the sequence of automatic enrollment observations without contributing to the author’s main point.","The example eliminates the need to compare evidence about automatic enrollment with alternative explanations.","The example proves that the implications of automatic enrollment hold in every possible location."],"answer":0,"why":"사례는 범위가 제한된 관찰 또는 비교를 통해 주장을 구체화하고 무조건적 일반화를 피하도록 돕습니다."},{"q":"Which investigation or action would best extend the reasoning about defaults, opt-outs and behavioral policy?","options":["High enrollment numbers alone establish that a program improved wellbeing.","Everyone who retains a default has made an active informed choice.","A preselected option is legally mandatory in every setting.","Evaluate comprehension, ease of opting out, consequences and long-term outcomes alongside participation."],"answer":3,"why":"추가 검증은 근거의 결함을 직접 보완하거나 대안 설명을 시험해야 합니다. Evaluate comprehension, ease of opting out, consequences and long-term outcomes alongside participation."}],"rp":[{"q":"In the defaults, opt-outs and behavioral policy passage, what does “inertia” most nearly mean in context?","options":["requirement to seek expert approval","formal prohibition of a new choice","tendency to keep the current choice","benefit received after opting out"],"answer":2,"why":"단어의 문맥상 의미를 판단해야 하며 직역만으로 결정하지 않습니다. inertia ≈ tendency to keep the current choice"},{"q":"An optional transport pass is selected automatically on a form. What safeguards informed choice?","options":["Counting retained selections as proof of satisfaction.","Clear costs, an understandable opt-out and the ability to revise the decision.","Omitting information about recurring deductions.","Making the opt-out difficult so participants stay enrolled."],"answer":1,"why":"새 상황에 지문 원리를 적용하는 고난도 추론 문항입니다. Clear costs, an understandable opt-out and the ability to revise the decision."}],"lq":[{"q":"Which response best addresses the speaker’s question about automatic enrollment?","options":["No, you can opt out, but check the deadline and the refund terms.","The campus has three bus routes.","The employee office has a guide in five languages.","Yes, automatic enrollment is legally permanent."],"answer":0,"why":"화자는 전제를 확인하고 있으므로 직접적인 정정과 관련 조건 설명이 적절합니다."}],"lc":[{"q":"What brings the first speaker to the conversation concerning automatic enrollment?","options":["An invitation to deliver a formal lecture explaining defaults, opt-outs and behavioral policy.","A plan to evaluate unrelated applicants for a different university program.","A request for the institution to change the academic field under discussion.","whether automatic transport enrollment is compulsory"],"answer":3,"why":"대화의 도입부에서 상대가 확인하려는 문제를 파악합니다. whether automatic transport enrollment is compulsory"},{"q":"What does the second speaker clarify about the issue raised in the defaults, opt-outs and behavioral policy dialogue?","options":["A preselected option is legally mandatory in every setting.","Everyone who retains a default has made an active informed choice.","the default is optional and processed deductions are not automatically refunded","High enrollment numbers alone establish that a program improved wellbeing."],"answer":2,"why":"Not necessarily, No, Exactly와 같은 정정 이후의 내용을 확인합니다. the default is optional and processed deductions are not automatically refunded"},{"q":"What will the first speaker most likely do after the discussion about automatic enrollment?","options":["Replace the entire project with an unrelated topic without consulting anyone.","review terms and opt out before the stated deadline if appropriate","Withdraw permanently from all activities discussed.","Disregard the advice and continue on the original assumption."],"answer":1,"why":"마지막 발화에서 다음 행동을 추론합니다. review terms and opt out before the stated deadline if appropriate"}],"la":[{"q":"What practical change or instruction is listeners expected to notice in the announcement about automatic enrollment?","options":["They are automatically enrolled unless they opt out.","They must visit the office and sign a paper application.","They receive a pass through their medical plan.","They are enrolled only after purchasing a semester ticket."],"answer":0,"why":"공지의 장소·시간·적용 조건을 듣고 핵심 변경사항을 선택합니다. They are automatically enrolled unless they opt out."},{"q":"Which additional requirement applies to listeners in the defaults, opt-outs and behavioral policy announcement?","options":["All previous payments are refunded on the same day.","Opting out becomes impossible for the remainder of the degree.","The assistant is removed from the medical plan.","Future deductions stop, but the past deduction is not automatically refunded."],"answer":3,"why":"보편적인 안내와 특정 조건에 해당하는 행동을 구별해야 합니다. Future deductions stop, but the past deduction is not automatically refunded."}],"lt":[{"q":"Which statement best summarizes the lecturer’s explanation of defaults, opt-outs and behavioral policy?","options":["High enrollment numbers alone establish that a program improved wellbeing.","Everyone who retains a default has made an active informed choice.","Default choices can influence behavior through inertia or perceived endorsement, so their benefits require more than enrollment statistics.","A preselected option is legally mandatory in every setting."],"answer":2,"why":"강의 중심 개념과 화자의 제한된 결론을 종합합니다. Default choices can influence behavior through inertia or perceived endorsement, so their benefits require more than enrollment statistics."},{"q":"What role does the lecturer’s example of automatic enrollment play in the explanation?","options":["A preselected option is legally mandatory in every setting.","People often retain a preselected option even when they are permitted to change it.","Everyone who retains a default has made an active informed choice.","High enrollment numbers alone establish that a program improved wellbeing."],"answer":1,"why":"강의 사례는 개념을 구체화하는 관측 자료 또는 비교입니다. People often retain a preselected option even when they are permitted to change it."},{"q":"What caution does the lecturer introduce after describing evidence related to automatic enrollment?","options":["High retention does not show that the default is financially suitable or understood by all users.","High enrollment numbers alone establish that a program improved wellbeing.","A preselected option is legally mandatory in every setting.","Everyone who retains a default has made an active informed choice."],"answer":0,"why":"화자가 However, but 등으로 도입하는 예외를 듣는 것이 핵심입니다. High retention does not show that the default is financially suitable or understood by all users."},{"q":"How would the lecturer most likely advise someone evaluating automatic enrollment in a new setting?","options":["High enrollment numbers alone establish that a program improved wellbeing.","Everyone who retains a default has made an active informed choice.","A preselected option is legally mandatory in every setting.","Evaluate comprehension, ease of opting out, consequences and long-term outcomes alongside participation."],"answer":3,"why":"강의의 마무리에서 제안하는 연구·실행 원칙을 응용합니다. Evaluate comprehension, ease of opting out, consequences and long-term outcomes alongside participation."}]},"audio":{"lq":"If I was enrolled automatically, am I required to keep the transport pass?","lc":"Assistant: I noticed a transport pass deduction scheduled for next month. Did I sign up for it?\nBenefits Adviser: New graduate assistants are automatically enrolled unless they opt out.\nAssistant: I didn't see a box asking me to agree. Does that mean it's mandatory?\nBenefits Adviser: No, participation is optional. The default is set to enrollment, but you can change it in the benefits portal.\nAssistant: If I opt out after the deduction appears, will I get the money back?\nBenefits Adviser: Future deductions will stop, but a processed payment is not refunded automatically. That's why the deadline matters.\nAssistant: Then I'd like to review the guide before deciding.\nBenefits Adviser: Good idea. It explains the cost and the alternatives in several languages.","la":"New graduate assistants, please review your transport-pass selection in the university benefits portal. Enrollment is automatic, but participation is not required. To avoid the first monthly deduction, opt out by the twentieth of this month. A change made after a deduction has already been processed will affect future payments but will not trigger an automatic refund. The employee support office can provide a guide in five languages.","lt":"Let's imagine a form where a university transport pass is already selected. Many students may leave that box unchanged. Does that mean they actively wanted the pass? Not necessarily.\n\nDefaults can work through inertia: changing a selection takes attention. They can also send an implied recommendation, as if the institution is saying, 'This is the normal choice.' Those explanations matter because they suggest different ways to make decisions clearer.\n\nAutomatic enrollment often raises participation, but a high participation rate is not the same as a good outcome for every individual. Someone who rarely travels might pay for a service they do not use. Others may not realize that opting out is possible.\n\nA responsible policy therefore gives clear information, an accessible way to change the decision, and a realistic deadline. The objective should be informed choice—not simply the highest number of people who remain enrolled."},"speaking":{"repeat":["Welcome to the workshop on automatic enrollment.","New graduate assistants are enrolled by default in the campus transport pass program.","The instructor asked us to compare the evidence about automatic enrollment before drawing conclusions.","People often retain a preselected option even when they are permitted to change it.","High retention does not show that the default is financially suitable or understood by all users.","Evaluate comprehension, ease of opting out, consequences and long-term outcomes alongside participation.","Although it might initially seem that a preselected option is legally mandatory in every setting, the evidence instead suggests that default choices can influence behavior through inertia or perceived endorsement, so their benefits require more than enrollment statistics."],"interviews":["What first interested you in behavioral economics / public policy, and how would you explain that interest to a friend?","Tell me about a time when a practical decision involving automatic enrollment was more complicated than you expected.","Do you think universities should give more attention to automatic enrollment in introductory courses? Explain your reasoning.","Imagine a classmate disagrees with your interpretation of automatic enrollment. How would you respond respectfully and precisely?"],"sample":"A policy that seems convenient can still be confusing if people do not realize they have a choice. I once noticed that an optional service had been selected automatically during an online purchase. I probably would have kept it if I had not examined the final price carefully. That experience made me more attentive to default options. I do not oppose automatic enrollment, because it can help people access useful services. But I think institutions have a responsibility to explain costs and provide a simple way to opt out. A default should make decisions easier, not quietly make them on someone's behalf."},"writing":{"build":[{"fragments":"whether the automatic enrollment / session has been rescheduled / Could you tell me","answer":"Could you tell me whether the automatic enrollment session has been rescheduled?","why":"간접 의문문 어순의 문장 구조와 주어-동사 관계를 확인하세요."},{"fragments":"The student who reviewed / noticed an important discrepancy / the automatic enrollment records","answer":"The student who reviewed the automatic enrollment records noticed an important discrepancy.","why":"관계절로 설명 추가의 문장 구조와 주어-동사 관계를 확인하세요."},{"fragments":"different conclusion / If the team had checked / the opt-out provision evidence earlier, / it might have reached a","answer":"If the team had checked the opt-out provision evidence earlier, it might have reached a different conclusion.","why":"조건절로 가능성 제시의 문장 구조와 주어-동사 관계를 확인하세요."},{"fragments":"examined did the committee approve / Only after the records related / to automatic enrollment had been / the report","answer":"Only after the records related to automatic enrollment had been examined did the committee approve the report.","why":"Only after 도치의 문장 구조와 주어-동사 관계를 확인하세요."},{"fragments":"requires not only reliable evidence / but also a clear account / A project involving automatic enrollment / of its limitations","answer":"A project involving automatic enrollment requires not only reliable evidence but also a clear account of its limitations.","why":"Not only A but also B 병렬의 문장 구조와 주어-동사 관계를 확인하세요."}],"emailTask":"A transport-pass deduction appeared on your assistantship pay statement although you thought enrollment was optional. Email employee support, explain when you submitted the opt-out request, ask which payments can be adjusted, and request written confirmation of your current status.","emailSample":"Dear Employee Support Office,\n\nA transport-pass deduction appeared on my most recent assistantship pay statement, although I had submitted an opt-out request through the benefits portal before the advertised deadline. I have retained the confirmation email showing the date of that request.\n\nCould you verify my current enrollment status and explain whether the deduction can be adjusted? I understand that payments already processed may not be refunded automatically, but I would appreciate a review of my specific case and written confirmation of any changes to future deductions.\n\nThank you for clarifying the process.\n\nSincerely,\nAlex","discussionTask":"Professor: Should public programs use automatic enrollment when participation is generally beneficial?\n\nStudent A — Emily: Defaults can help people overcome administrative barriers and participate in useful services.\n\nStudent B — Daniel: Automatic choices can undermine informed consent if costs and opt-out procedures are obscure.","discussionSample":"Automatic enrollment can be beneficial when it removes administrative barriers, but the conditions for meaningful choice must be protected. Imagine a university that automatically enrolls graduate assistants in a transport pass. Participation might rise simply because students do not notice the preselected option. Some assistants would benefit; others might pay for a service they rarely use. I would support the default only if the cost is stated prominently, the opt-out procedure is straightforward, and students can reverse the choice without unreasonable penalties. Participation rates should be evaluated alongside understanding and actual use. A good behavioral policy should help people act on their interests, not make it harder to refuse an option selected by an institution."},"vocabulary":[{"term":"default option","meaning":"기본 선택지","collocation":"set a default option","example":"Several independent observations led policy analysts to set a default option before publication.","synonym":"preselected choice","nuance":"","group":"core"},{"term":"automatic enrollment","meaning":"자동 등록","collocation":"introduce automatic enrollment","example":"A request from the university encouraged policy analysts to introduce automatic enrollment more transparently.","synonym":"enrollment without active selection","nuance":"","group":"core"},{"term":"opt-out provision","meaning":"탈퇴 선택 규정","collocation":"explain an opt-out provision","example":"Rather than generalizing from one case, policy analysts sought to explain an opt-out provision in several settings.","synonym":"ability to decline participation","nuance":"","group":"core"},{"term":"status quo bias","meaning":"현상유지 편향","collocation":"observe status quo bias","example":"The investigation would be less credible if policy analysts neglected to observe status quo bias.","synonym":"preference for existing conditions","nuance":"","group":"core"},{"term":"choice architecture","meaning":"선택 설계","collocation":"redesign choice architecture","example":"The procedures were revised so that policy analysts could redesign choice architecture consistently.","synonym":"design of the decision environment","nuance":"","group":"core"},{"term":"implicit endorsement","meaning":"암묵적 권장","collocation":"perceive implicit endorsement","example":"Before finalizing the interpretation, policy analysts decided to perceive implicit endorsement.","synonym":"assumed institutional approval","nuance":"","group":"core"},{"term":"administrative inertia","meaning":"행정상 관성","collocation":"reduce administrative inertia","example":"The students challenged policy analysts to reduce administrative inertia without overlooking contrary evidence.","synonym":"reluctance to change an administrative default","nuance":"","group":"core"},{"term":"meaningful consent","meaning":"실질적 동의","collocation":"obtain meaningful consent","example":"The instructor proposed that policy analysts should first obtain meaningful consent and then compare outcomes.","synonym":"consent based on understanding","nuance":"","group":"core"},{"term":"behavioral nudge","meaning":"행동 유도 장치","collocation":"evaluate a behavioral nudge","example":"When the initial explanation failed, policy analysts returned to the data to evaluate a behavioral nudge.","synonym":"small change intended to guide choices","nuance":"","group":"core"},{"term":"enrollment rate","meaning":"등록률","collocation":"track an enrollment rate","example":"The group discovered that it was possible to track an enrollment rate without assuming a single cause.","synonym":"proportion of people enrolled","nuance":"","group":"core"},{"term":"decision reversal","meaning":"결정 번복","collocation":"allow decision reversal","example":"A second research team challenged policy analysts to allow decision reversal with different assumptions.","synonym":"reversal of an earlier choice","nuance":"","group":"core"},{"term":"plain-language guide","meaning":"쉬운 언어 설명서","collocation":"publish a plain-language guide","example":"The revised protocol gave policy analysts a systematic way to publish a plain-language guide.","synonym":"instructions in accessible language","nuance":"","group":"core"},{"term":"contribution level","meaning":"납부 수준","collocation":"adjust a contribution level","example":"To address a practical difficulty, policy analysts chose to adjust a contribution level under controlled conditions.","synonym":"amount contributed","nuance":"","group":"core"},{"term":"policy paternalism","meaning":"정책적 온정주의","collocation":"debate policy paternalism","example":"Scholars debate policy paternalism when institutions choose defaults that strongly influence behavior.","synonym":"institutional influence over personal choices","nuance":"","group":"core"},{"term":"individual welfare","meaning":"개인 복지","collocation":"assess individual welfare","example":"In response to the reviewers, policy analysts agreed to assess individual welfare using an explicit procedure.","synonym":"wellbeing of an individual","nuance":"","group":"core"},{"term":"choice inertia","meaning":"선택의 관성","collocation":"overcome choice inertia","example":"A single unexpected result persuaded policy analysts to overcome choice inertia more carefully.","synonym":"resistance to changing an option","nuance":"","group":"advanced"},{"term":"presumed endorsement","meaning":"추정된 권장","collocation":"recognize presumed endorsement","example":"When the instruments returned inconsistent readings, policy analysts attempted to recognize presumed endorsement.","synonym":"belief that the institution recommends it","nuance":"","group":"advanced"},{"term":"behavioral friction","meaning":"행동에 필요한 번거로움","collocation":"reduce behavioral friction","example":"The supervising committee asked policy analysts to reduce behavioral friction and explain the criteria.","synonym":"extra steps that hinder action","nuance":"","group":"advanced"},{"term":"informed opt-out","meaning":"충분히 알고 하는 탈퇴","collocation":"enable informed opt-out","example":"Only after a careful review could policy analysts begin to enable informed opt-out.","synonym":"informed choice not to participate","nuance":"","group":"advanced"},{"term":"welfare consequence","meaning":"복지상의 결과","collocation":"assess welfare consequences","example":"Under the new conditions, policy analysts were asked to assess welfare consequences at an earlier stage.","synonym":"effect on welfare","nuance":"","group":"advanced"},{"term":"institutional preference","meaning":"기관의 선호","collocation":"infer an institutional preference","example":"The long-term monitoring plan required policy analysts to infer an institutional preference at regular intervals.","synonym":"option favored by the organization","nuance":"","group":"advanced"},{"term":"automatic deduction","meaning":"자동 공제","collocation":"stop automatic deductions","example":"At the discussion session, policy analysts explained their decision to stop automatic deductions.","synonym":"charge applied without extra action","nuance":"","group":"advanced"},{"term":"consent mechanism","meaning":"동의 메커니즘","collocation":"evaluate a consent mechanism","example":"The available resources enabled policy analysts to evaluate a consent mechanism during the pilot study.","synonym":"procedure to obtain consent","nuance":"","group":"advanced"},{"term":"administrative convenience","meaning":"행정적 편의","collocation":"weigh administrative convenience","example":"Although the preliminary results seemed convincing, policy analysts still needed to weigh administrative convenience.","synonym":"ease of administration","nuance":"","group":"advanced"},{"term":"policy effectiveness","meaning":"정책의 효과","collocation":"test policy effectiveness","example":"Because the evidence was incomplete, policy analysts agreed to test policy effectiveness again before deciding.","synonym":"achievement of policy goals","nuance":"","group":"advanced"},{"term":"long-term preference","meaning":"장기적 선호","collocation":"measure long-term preferences","example":"The report identified an overlooked opportunity for policy analysts to measure long-term preferences.","synonym":"preference over a longer period","nuance":"","group":"advanced"},{"term":"reversible selection","meaning":"되돌릴 수 있는 선택","collocation":"offer reversible selections","example":"After examining competing accounts, policy analysts were prepared to offer reversible selections.","synonym":"option that can be changed back","nuance":"","group":"advanced"},{"term":"financial suitability","meaning":"재정적 적합성","collocation":"assess financial suitability","example":"One limitation of the project was that policy analysts could not yet assess financial suitability reliably.","synonym":"appropriateness for one's finances","nuance":"","group":"advanced"},{"term":"enrollment transparency","meaning":"등록 절차 투명성","collocation":"improve enrollment transparency","example":"A later review prompted policy analysts to improve enrollment transparency, rather than accept the initial explanation.","synonym":"clear information about enrollment","nuance":"","group":"advanced"},{"term":"individual agency","meaning":"개인의 주체성","collocation":"respect individual agency","example":"Over a semester of fieldwork, policy analysts learned how to respect individual agency.","synonym":"ability to decide independently","nuance":"","group":"advanced"}],"meta":{"sourceType":"original practice content","etsOfficial":false,"benchmark":"TOEFL iBT January 2026 task-type descriptions / ETS sample 1","studyMinutes":120,"revision":"2026-11-23-diversity-v3","discipline":"Behavioral Economics / Public Policy","genre":"argument"}};</script>
