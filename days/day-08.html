<script>window.TOEFL_LESSON={"day":8,"week":2,"theme":"Archaeological Trade Routes and Isotopes","focus":"Reading: inference and text structure","claim":"Chemical evidence helps trace material movement, but it does not automatically reveal where or by whom an artifact was made.","evidence":"A minority of inland pottery fragments chemically resembled coastal clay while most matched local deposits.","caveat":"Transported raw clay, recycling and uncertain dating can produce similar chemical patterns.","response":"Combine chemical profiles with stratigraphy, residue evidence and transport features.","storageKey":"toefl110day8-diversity-v3","notice":"ARCHAEOLOGY DEPARTMENT — COLLECTION HANDLING RULES\n\nStudents reviewing the pottery collection must check in at the materials laboratory, not the public museum gallery. The analysis session begins at 1 p.m. Thursday. Original sherds may be handled only after students complete the object-handling briefing; printed photographs and 3D scans are available without the briefing.\n\nThe laboratory requires clean, dry hands and prohibits pens near the objects. Pencil notes are allowed. Students wishing to photograph the material must submit their request by Wednesday afternoon.","academicPassage":"An ancient pot found far from a coastline might have been traded, carried by a migrating family, or made locally in imitation of a fashionable style. Its shape alone rarely distinguishes these explanations. Archaeologists combine stylistic evidence with chemical and geological measurements to reconstruct how objects moved.\n\nIn one excavation, pottery recovered from an inland settlement contained a distinctive mineral mixture common in coastal clay deposits. Researchers compared the ratios of certain elements with samples from several geological regions. Most sherds matched local clay, but a small group aligned more closely with the coast. This contrast supported the possibility of exchange between communities with different resources.\n\nThe chemical match did not establish the exact route or identify the people who transported the vessels. Coastal clay could have been moved inland and shaped there. Craftspeople might also have reused old pots or added minerals during manufacture. Dating uncertainty adds another complication: pieces deposited in the same layer are not always produced in the same year.\n\nInvestigators therefore integrated chemical composition with excavation context, residue analysis, and evidence of transport infrastructure. A nearby track may strengthen a proposed route, but it cannot prove that every imported object followed it. The strongest historical account identifies several plausible pathways and shows which archaeological observations favor one over the others.","readingClozePassage":"An archaeological laboratory analyzed fragments of pottery found in an inland settlement. Most samp___ contained mine____ typical o_ the nea___ river val___. A fe_ pieces ha_ a compos_____ more consi_____ with cl__ from the distant coast. The chemical contrast suggested exchange, but it did not identify the people who transported the material. Archaeologists considered whether raw clay or finished vessels had moved between communities. They also compared excavation dates and traces of ancient roads before proposing a historical explanation.","cloze":[{"partial":"samp___","answer":"samples","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"mine____","answer":"minerals","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"o_","answer":"of","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"nea___","answer":"nearby","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"val___","answer":"valley","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"fe_","answer":"few","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"ha_","answer":"had","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"compos_____","answer":"composition","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"consi_____","answer":"consistent","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"cl__","answer":"clay","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"}],"questions":{"rd":[{"q":"Where should students report for Thursday’s ceramics session?","options":["The public museum gallery.","The student admissions office.","The archaeological field trench.","The departmental materials laboratory."],"answer":3,"why":"실생활 공지의 해당 조건을 찾아 확인하세요. The departmental materials laboratory."},{"q":"What must students do before handling the original sherds?","options":["Bring ink pens to label the objects.","Purchase personal preservation chemicals.","Complete the collection-handling briefing.","Submit a photography request after Thursday."],"answer":2,"why":"공지의 별도 요건 또는 예외 조항에 명시된 행동은 Complete the collection-handling briefing.입니다."},{"q":"What writing instrument is allowed near original pottery fragments?","options":["A permanent marker for labeling artifacts.","A pencil for notes.","A scanner with an integrated pen and flash.","An ink pen used directly over the sherds."],"answer":1,"why":"공지의 예외 조항과 구체적인 적용 범위를 비교해야 합니다. 정답 근거: A pencil for notes."}],"ra":[{"q":"How does the author integrate the different sources of evidence in the passage on Archaeological Trade Routes and Isotopes?","options":["Chemical evidence helps trace material movement, but it does not automatically reveal where or by whom an artifact was made.","A road close to an excavation proves that all imports followed that route.","Mineral composition identifies the exact year of manufacture.","A pottery shape alone proves that a specific merchant transported it."],"answer":0,"why":"중심 논지는 세부 사례에서 도출되는 가장 신중한 결론입니다. Chemical evidence helps trace material movement, but it does not automatically reveal where or by whom an artifact was made."},{"q":"What specific observation in the archaeological trade routes and isotopes case motivates the discussion?","options":["A pottery shape alone proves that a specific merchant transported it.","Mineral composition identifies the exact year of manufacture.","A road close to an excavation proves that all imports followed that route.","A minority of inland pottery fragments chemically resembled coastal clay while most matched local deposits."],"answer":3,"why":"지문의 사례·대조 정보를 직접 확인해야 합니다. A minority of inland pottery fragments chemically resembled coastal clay while most matched local deposits."},{"q":"Which qualification prevents the evidence about archaeological exchange from supporting an unconditional claim?","options":["A pottery shape alone proves that a specific merchant transported it.","A road close to an excavation proves that all imports followed that route.","Transported raw clay, recycling and uncertain dating can produce similar chemical patterns.","Mineral composition identifies the exact year of manufacture."],"answer":2,"why":"한계 조건은 곧바로 틀린 결론이라는 뜻이 아니라 적용 범위를 제한합니다. Transported raw clay, recycling and uncertain dating can produce similar chemical patterns."},{"q":"How does the example in the passage refine the broad claim about archaeological exchange?","options":["It lists the sequence of archaeological exchange observations without contributing to the author’s main point.","It illustrates a specific relationship involving archaeological exchange while establishing the boundaries of the wider argument.","The example eliminates the need to compare evidence about archaeological exchange with alternative explanations.","The example proves that the implications of archaeological exchange hold in every possible location."],"answer":1,"why":"사례는 범위가 제한된 관찰 또는 비교를 통해 주장을 구체화하고 무조건적 일반화를 피하도록 돕습니다."},{"q":"Which investigation or action would best extend the reasoning about archaeological trade routes and isotopes?","options":["Combine chemical profiles with stratigraphy, residue evidence and transport features.","A pottery shape alone proves that a specific merchant transported it.","A road close to an excavation proves that all imports followed that route.","Mineral composition identifies the exact year of manufacture."],"answer":0,"why":"추가 검증은 근거의 결함을 직접 보완하거나 대안 설명을 시험해야 합니다. Combine chemical profiles with stratigraphy, residue evidence and transport features."}],"rp":[{"q":"In the archaeological trade routes and isotopes passage, what does “sherds” most nearly mean in context?","options":["small geological trenches","complete wooden structures","residues from plant roots","broken pieces of pottery"],"answer":3,"why":"단어의 문맥상 의미를 판단해야 하며 직역만으로 결정하지 않습니다. sherds ≈ broken pieces of pottery"},{"q":"Clay from a coastal source is found in a pot made at an inland workshop. What does this indicate?","options":["The pot was necessarily fired at the coastal clay deposit.","The chemical profile reveals the potter’s identity.","The material’s origin and the object’s manufacture may differ.","A coastal merchant must have carried the completed pot."],"answer":2,"why":"새 상황에 지문 원리를 적용하는 고난도 추론 문항입니다. The material’s origin and the object’s manufacture may differ."}],"lq":[{"q":"Which response best addresses the speaker’s question about archaeological exchange?","options":["Only pottery with painted decoration can be analyzed.","Not necessarily; the raw clay could have been transported before the pot was made.","We will meet at one o’clock.","Yes, matching minerals reveal the potter’s full name."],"answer":1,"why":"화자는 전제를 확인하고 있으므로 직접적인 정정과 관련 조건 설명이 적절합니다."}],"lc":[{"q":"What brings the first speaker to the conversation concerning archaeological exchange?","options":["whether a coastal mineral match proves where a pot was made","An invitation to deliver a formal lecture explaining archaeological trade routes and isotopes.","A request for the institution to change the academic field under discussion.","A plan to evaluate unrelated applicants for a different university program."],"answer":0,"why":"대화의 도입부에서 상대가 확인하려는 문제를 파악합니다. whether a coastal mineral match proves where a pot was made"},{"q":"What does the second speaker clarify about the issue raised in the archaeological trade routes and isotopes dialogue?","options":["Mineral composition identifies the exact year of manufacture.","A road close to an excavation proves that all imports followed that route.","A pottery shape alone proves that a specific merchant transported it.","raw clay can be transported before manufacture"],"answer":3,"why":"Not necessarily, No, Exactly와 같은 정정 이후의 내용을 확인합니다. raw clay can be transported before manufacture"},{"q":"What will the first speaker most likely do after the discussion about archaeological exchange?","options":["Replace the entire project with an unrelated topic without consulting anyone.","Disregard the advice and continue on the original assumption.","distinguish raw-material source from manufacturing location","Withdraw permanently from all activities discussed."],"answer":2,"why":"마지막 발화에서 다음 행동을 추론합니다. distinguish raw-material source from manufacturing location"}],"la":[{"q":"What practical change or instruction is listeners expected to notice in the announcement about archaeological exchange?","options":["The archaeological field trench.","The departmental materials laboratory.","The student admissions office.","The public museum gallery."],"answer":1,"why":"공지의 장소·시간·적용 조건을 듣고 핵심 변경사항을 선택합니다. The departmental materials laboratory."},{"q":"Which additional requirement applies to listeners in the archaeological trade routes and isotopes announcement?","options":["Complete the collection-handling briefing.","Submit a photography request after Thursday.","Purchase personal preservation chemicals.","Bring ink pens to label the objects."],"answer":0,"why":"보편적인 안내와 특정 조건에 해당하는 행동을 구별해야 합니다. Complete the collection-handling briefing."}],"lt":[{"q":"Which statement best summarizes the lecturer’s explanation of archaeological trade routes and isotopes?","options":["A road close to an excavation proves that all imports followed that route.","Mineral composition identifies the exact year of manufacture.","A pottery shape alone proves that a specific merchant transported it.","Chemical evidence helps trace material movement, but it does not automatically reveal where or by whom an artifact was made."],"answer":3,"why":"강의 중심 개념과 화자의 제한된 결론을 종합합니다. Chemical evidence helps trace material movement, but it does not automatically reveal where or by whom an artifact was made."},{"q":"What role does the lecturer’s example of archaeological exchange play in the explanation?","options":["Mineral composition identifies the exact year of manufacture.","A pottery shape alone proves that a specific merchant transported it.","A minority of inland pottery fragments chemically resembled coastal clay while most matched local deposits.","A road close to an excavation proves that all imports followed that route."],"answer":2,"why":"강의 사례는 개념을 구체화하는 관측 자료 또는 비교입니다. A minority of inland pottery fragments chemically resembled coastal clay while most matched local deposits."},{"q":"What caution does the lecturer introduce after describing evidence related to archaeological exchange?","options":["Mineral composition identifies the exact year of manufacture.","Transported raw clay, recycling and uncertain dating can produce similar chemical patterns.","A road close to an excavation proves that all imports followed that route.","A pottery shape alone proves that a specific merchant transported it."],"answer":1,"why":"화자가 However, but 등으로 도입하는 예외를 듣는 것이 핵심입니다. Transported raw clay, recycling and uncertain dating can produce similar chemical patterns."},{"q":"How would the lecturer most likely advise someone evaluating archaeological exchange in a new setting?","options":["Combine chemical profiles with stratigraphy, residue evidence and transport features.","Mineral composition identifies the exact year of manufacture.","A road close to an excavation proves that all imports followed that route.","A pottery shape alone proves that a specific merchant transported it."],"answer":0,"why":"강의의 마무리에서 제안하는 연구·실행 원칙을 응용합니다. Combine chemical profiles with stratigraphy, residue evidence and transport features."}]},"audio":{"lq":"Does a mineral match tell us exactly where this pot was manufactured?","lc":"Student: The mineral profile of this sherd is similar to coastal clay. Can I write that it was made at the coast?\nArchaeologist: You can report the chemical match, but origin is not the only question.\nStudent: What other explanation is there?\nArchaeologist: The clay could have been transported inland and shaped by local potters. Or the sherd might come from a recycled vessel.\nStudent: Would the road excavated near the settlement settle the issue?\nArchaeologist: It makes exchange plausible, but the road could have been used for many kinds of goods. Context matters.\nStudent: So I should distinguish where the material originated from where the object was manufactured.\nArchaeologist: Precisely. Those are related questions, not interchangeable ones.","la":"Students scheduled for the pottery analysis session should report to the materials laboratory at one o'clock on Thursday. Please do not go to the public museum gallery. Original ceramic fragments can be handled only after the collection briefing, although photographs and digital models are open to everyone registered. Make notes in pencil and keep pens away from the objects. Any photography request must reach the laboratory by Wednesday afternoon.","lt":"Imagine finding a ceramic bowl in an inland town whose shape resembles coastal pottery. Is that enough to prove trade with the coast? No. Local artisans could have copied the design.\n\nChemical analysis gives us another kind of evidence. In one study, a handful of fragments had mineral profiles resembling coastal clay, whereas most pieces matched local material. That difference is consistent with some movement between the regions.\n\nBut be careful with the word 'movement.' Clay may have traveled without a finished pot, and a vessel can be reused long after its manufacture. A road nearby suggests a possible route, but does not identify who carried a specific object.\n\nThe archaeologist's task is to combine chemistry with dates, excavation context, and other finds. Each source narrows the possibilities without necessarily producing a single, certain story."},"speaking":{"repeat":["Welcome to the workshop on archaeological exchange.","Students reviewing the pottery collection must check in at the materials laboratory, not the public museum gallery.","The instructor asked us to compare the evidence about archaeological exchange before drawing conclusions.","A minority of inland pottery fragments chemically resembled coastal clay while most matched local deposits.","Transported raw clay, recycling and uncertain dating can produce similar chemical patterns.","Combine chemical profiles with stratigraphy, residue evidence and transport features.","Although it might initially seem that a pottery shape alone proves that a specific merchant transported it, the evidence instead suggests that chemical evidence helps trace material movement, but it does not automatically reveal where or by whom an artifact was made."],"interviews":["What first interested you in archaeology / material science, and how would you explain that interest to a friend?","Tell me about a time when a practical decision involving archaeological exchange was more complicated than you expected.","Do you think universities should give more attention to archaeological exchange in introductory courses? Explain your reasoning.","Imagine a classmate disagrees with your interpretation of archaeological exchange. How would you respond respectfully and precisely?"],"sample":"One aspect of archaeology that interests me is the way researchers combine different kinds of evidence. A chemical signature can show where clay may have originated, but it cannot necessarily reveal whether the clay or a completed pot was transported. I used to imagine archaeological findings as direct answers about the past. Now I see them as clues that must be interpreted alongside excavation context and chronology. If I visited a museum, I would enjoy seeing alternative reconstructions presented together. Comparing the possibilities would make the exhibition more intellectually engaging and demonstrate why careful uncertainty matters."},"writing":{"build":[{"fragments":"Could you tell me / session has been rescheduled / whether the archaeological exchange","answer":"Could you tell me whether the archaeological exchange session has been rescheduled?","why":"간접 의문문 어순의 문장 구조와 주어-동사 관계를 확인하세요."},{"fragments":"the elemental ratio records / noticed an important discrepancy / The student who reviewed","answer":"The student who reviewed the elemental ratio records noticed an important discrepancy.","why":"관계절로 설명 추가의 문장 구조와 주어-동사 관계를 확인하세요."},{"fragments":"it might have reached a / If the team had checked / different conclusion / the mineral profile evidence earlier,","answer":"If the team had checked the mineral profile evidence earlier, it might have reached a different conclusion.","why":"조건절로 가능성 제시의 문장 구조와 주어-동사 관계를 확인하세요."},{"fragments":"the report / examined did the committee approve / to archaeological exchange had been / Only after the records related","answer":"Only after the records related to archaeological exchange had been examined did the committee approve the report.","why":"Only after 도치의 문장 구조와 주어-동사 관계를 확인하세요."},{"fragments":"but also a clear account / A project involving archaeological exchange / of its limitations / requires not only reliable evidence","answer":"A project involving archaeological exchange requires not only reliable evidence but also a clear account of its limitations.","why":"Not only A but also B 병렬의 문장 구조와 주어-동사 관계를 확인하세요."}],"emailTask":"You are preparing a student poster on ancient pottery exchange. Email the materials-lab curator to request permission to use photographs of two analyzed sherds, state how the images will be credited, and ask whether chemical results may be cited before journal publication.","emailSample":"Dear Collections Curator,\n\nI am preparing a student poster on the movement of ceramics between coastal and inland settlements. Two pottery fragments examined in your laboratory would make valuable examples of how chemical evidence is interpreted alongside excavation context.\n\nCould I reproduce photographs of those fragments in a noncommercial university poster, provided that I include your preferred credit line? I would also like to know whether the preliminary mineral-profile results may be cited before the journal article is published, or whether I should limit the discussion to publicly available data.\n\nThank you for advising me on the appropriate use of the collection.\n\nSincerely,\nAlex","discussionTask":"Professor: Should museums display uncertain interpretations alongside reconstructed stories of ancient trade?\n\nStudent A — Emily: Yes. Showing competing explanations teaches visitors how historical knowledge is produced.\n\nStudent B — Daniel: Too many qualifications may confuse visitors who want a clear introduction to an unfamiliar culture.","discussionSample":"Museums should present uncertainty when an object can support several plausible historical explanations. A pottery fragment with a coastal mineral signature, for example, may indicate regional exchange, but the evidence does not reveal whether a finished pot or raw clay was transported. I understand that visitors often prefer a clear narrative. Yet clarity does not require pretending that a reconstruction is certain. An exhibition might illustrate two routes and explain which material observations favor each. That format helps visitors understand how archaeologists combine chemistry with excavation context. It also avoids turning tentative interpretations into apparently settled historical facts. A good museum label should make the strongest supported claim and then explain, in accessible language, what further evidence could change that account."},"vocabulary":[{"term":"ceramic sherd","meaning":"도자기 파편","collocation":"classify a ceramic sherd","example":"Students observed how archaeologists attempted to classify a ceramic sherd despite incomplete information.","synonym":"broken pottery fragment","nuance":"","group":"core"},{"term":"elemental ratio","meaning":"원소 비율","collocation":"compare elemental ratios","example":"A meaningful comparison would require archaeologists to compare elemental ratios independently.","synonym":"proportion of chemical elements","nuance":"","group":"core"},{"term":"mineral profile","meaning":"광물 조성 특성","collocation":"match a mineral profile","example":"A cautious interpretation allowed archaeologists to match a mineral profile while acknowledging uncertainty.","synonym":"mineral composition","nuance":"","group":"core"},{"term":"coastal clay","meaning":"해안 점토","collocation":"source coastal clay","example":"Several independent observations led archaeologists to source coastal clay before publication.","synonym":"clay from the coast","nuance":"","group":"core"},{"term":"excavation context","meaning":"발굴 맥락","collocation":"record excavation context","example":"A request from the university encouraged archaeologists to record excavation context more transparently.","synonym":"location within a dig","nuance":"","group":"core"},{"term":"residue analysis","meaning":"잔류물 분석","collocation":"conduct residue analysis","example":"Rather than generalizing from one case, archaeologists sought to conduct residue analysis in several settings.","synonym":"analysis of remaining material","nuance":"","group":"core"},{"term":"stratigraphic layer","meaning":"층위 지층","collocation":"date a stratigraphic layer","example":"The investigation would be less credible if archaeologists neglected to date a stratigraphic layer.","synonym":"layer of deposits","nuance":"","group":"core"},{"term":"transport network","meaning":"운송망","collocation":"reconstruct a transport network","example":"The procedures were revised so that archaeologists could reconstruct a transport network consistently.","synonym":"system of traded connections","nuance":"","group":"core"},{"term":"local imitation","meaning":"지역 모방품","collocation":"identify a local imitation","example":"Before finalizing the interpretation, archaeologists decided to identify a local imitation.","synonym":"locally produced copy","nuance":"","group":"core"},{"term":"reuse of vessels","meaning":"용기의 재사용","collocation":"document vessel reuse","example":"Evidence for the reuse of vessels was found in deposits from several occupation periods.","synonym":"secondary use of containers","nuance":"","group":"core"},{"term":"raw-material provenance","meaning":"원료 산지","collocation":"trace raw-material provenance","example":"The instructor proposed that archaeologists should first trace raw-material provenance and then compare outcomes.","synonym":"source of raw material","nuance":"","group":"core"},{"term":"comparative sample","meaning":"비교 시료","collocation":"collect comparative samples","example":"When the initial explanation failed, archaeologists returned to the data to collect comparative samples.","synonym":"reference specimen","nuance":"","group":"core"},{"term":"geochemical fingerprint","meaning":"지구화학적 지문","collocation":"establish a geochemical fingerprint","example":"The group discovered that it was possible to establish a geochemical fingerprint without assuming a single cause.","synonym":"distinctive chemical profile","nuance":"","group":"core"},{"term":"manufacturing location","meaning":"제작 위치","collocation":"infer manufacturing location","example":"A second research team challenged archaeologists to infer manufacturing location with different assumptions.","synonym":"place of production","nuance":"","group":"core"},{"term":"chronological uncertainty","meaning":"연대 불확실성","collocation":"acknowledge chronological uncertainty","example":"The revised protocol gave archaeologists a systematic way to acknowledge chronological uncertainty.","synonym":"uncertain historical dating","nuance":"","group":"core"},{"term":"isotopic signature","meaning":"동위원소 특성","collocation":"compare isotopic signatures","example":"To address a practical difficulty, archaeologists chose to compare isotopic signatures under controlled conditions.","synonym":"isotope pattern","nuance":"","group":"advanced"},{"term":"material origin","meaning":"재료의 원산지","collocation":"infer material origin","example":"It proved especially important for archaeologists to infer material origin during the second assessment.","synonym":"place a material came from","nuance":"","group":"advanced"},{"term":"depositional context","meaning":"퇴적·매장 맥락","collocation":"record depositional context","example":"In response to the reviewers, archaeologists agreed to record depositional context using an explicit procedure.","synonym":"surrounding deposition circumstances","nuance":"","group":"advanced"},{"term":"chronological sequence","meaning":"시간적 순서","collocation":"establish a chronological sequence","example":"A single unexpected result persuaded archaeologists to establish a chronological sequence more carefully.","synonym":"order of events","nuance":"","group":"advanced"},{"term":"artisanal production","meaning":"장인의 제작 활동","collocation":"investigate artisanal production","example":"When the instruments returned inconsistent readings, archaeologists attempted to investigate artisanal production.","synonym":"craft production","nuance":"","group":"advanced"},{"term":"exchange mechanism","meaning":"교환 메커니즘","collocation":"reconstruct an exchange mechanism","example":"The supervising committee asked archaeologists to reconstruct an exchange mechanism and explain the criteria.","synonym":"means of trade","nuance":"","group":"advanced"},{"term":"regional network","meaning":"지역 연결망","collocation":"map a regional network","example":"Only after a careful review could archaeologists begin to map a regional network.","synonym":"connections across regions","nuance":"","group":"advanced"},{"term":"interpretive restraint","meaning":"해석상의 절제","collocation":"exercise interpretive restraint","example":"Under the new conditions, archaeologists were asked to exercise interpretive restraint at an earlier stage.","synonym":"caution in drawing conclusions","nuance":"","group":"advanced"},{"term":"multiple hypotheses","meaning":"복수 가설","collocation":"compare multiple hypotheses","example":"The long-term monitoring plan required archaeologists to compare multiple hypotheses at regular intervals.","synonym":"competing explanations","nuance":"","group":"advanced"},{"term":"material continuity","meaning":"재료의 연속성","collocation":"test material continuity","example":"At the discussion session, archaeologists explained their decision to test material continuity.","synonym":"continued use of a material","nuance":"","group":"advanced"},{"term":"excavation record","meaning":"발굴 기록","collocation":"consult excavation records","example":"The available resources enabled archaeologists to consult excavation records during the pilot study.","synonym":"documentation of excavation","nuance":"","group":"advanced"},{"term":"alternative provenance","meaning":"대안적 출처 가설","collocation":"examine alternative provenance","example":"Although the preliminary results seemed convincing, archaeologists still needed to examine alternative provenance.","synonym":"another possible source","nuance":"","group":"advanced"},{"term":"geographic correspondence","meaning":"지리적 대응관계","collocation":"assess geographic correspondence","example":"Because the evidence was incomplete, archaeologists agreed to assess geographic correspondence again before deciding.","synonym":"agreement between locations","nuance":"","group":"advanced"},{"term":"chronometric dating","meaning":"절대연대 측정","collocation":"perform chronometric dating","example":"The report identified an overlooked opportunity for archaeologists to perform chronometric dating.","synonym":"scientific dating","nuance":"","group":"advanced"},{"term":"artifact distribution","meaning":"유물 분포","collocation":"analyze artifact distribution","example":"After examining competing accounts, archaeologists were prepared to analyze artifact distribution.","synonym":"spatial distribution of objects","nuance":"","group":"advanced"}],"meta":{"sourceType":"original practice content","etsOfficial":false,"benchmark":"TOEFL iBT January 2026 task-type descriptions / ETS sample 1","studyMinutes":120,"revision":"2026-11-23-diversity-v3","discipline":"Archaeology / Material Science","genre":"evidence-synthesis"}};</script>
