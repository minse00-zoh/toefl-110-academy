<script>window.TOEFL_LESSON={"day":10,"week":2,"theme":"Wetlands and Nutrient Filtration","focus":"Reading: inference and text structure","claim":"Wetland filtration varies with flow and chemistry, so a single calm-period measurement cannot represent total performance.","evidence":"The restored marsh trapped sediment in ordinary rain but released stored particles during an extreme storm.","caveat":"High flows and changing microbial conditions can alter the balance between storage and removal.","response":"Monitor inflow, outflow and ecological effects across seasons and storm events.","storageKey":"toefl110day10-diversity-v3","notice":"RIVER RESEARCH CENTER — WATER SAMPLING PRACTICUM\n\nThe wetlands field trip is scheduled for Saturday from 9 a.m. to noon. Students will meet at the south gate of the reservoir rather than at the campus laboratory. Waterproof boots are required, but the center will provide sampling bottles and safety vests.\n\nStudents must complete the field safety form by Friday at 3 p.m. Anyone who cannot enter wet ground may join the water-analysis team in the accessible station building; please notify the instructor beforehand.","academicPassage":"Wetlands can slow the movement of water across a landscape and intercept nutrients before they reach rivers or coastal waters. As water passes through shallow vegetation and sediment, particles may settle and microorganisms can transform certain nitrogen compounds. The result is often described as natural water filtration, but its effectiveness is neither unlimited nor constant.\n\nA restored marsh upstream of a reservoir reduced the concentration of suspended sediment during ordinary rainfall. After an unusually intense storm, however, inflow exceeded the marsh's capacity to retain particles, and some stored material was released downstream. The same site therefore appeared highly effective under one flow regime and much less effective under another.\n\nNutrient removal also involves biological tradeoffs. Some transformations reduce nitrate concentrations but release gases, and changing water levels can alter the chemical conditions that favor particular microbial pathways. Engineers interested in water quality must distinguish between temporary storage and permanent removal.\n\nA wetland can provide benefits beyond filtration, including habitat, flood buffering and recreation. Measuring only one chemical concentration misses these wider functions. Long-term assessments compare inflow and outflow across seasons, examine storm events, and record ecological responses. The most defensible management plans combine natural processes with realistic limits on pollution entering the watershed.","readingClozePassage":"Students studying a restored wetland sampled the water during several weeks of light rainfall. The concentration of suspended sediment declined as water moved through the marsh. After a major sto__, the samp____ team obse____ a diffe____ pattern. Rap__ inflow carr___ particles thro___ the veget_____ and distu____ material sto___ in the sediment. The students realized that calm-weather samples could not describe the wetland's performance under every condition. Their final report compared different flow periods and distinguished temporary storage from permanent nutrient removal.","cloze":[{"partial":"sto__","answer":"storm","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"samp____","answer":"sampling","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"obse____","answer":"observed","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"diffe____","answer":"different","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"Rap__","answer":"rapid","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"carr___","answer":"carried","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"thro___","answer":"through","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"veget_____","answer":"vegetation","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"distu____","answer":"disturbed","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"sto___","answer":"stored","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"}],"questions":{"rd":[{"q":"Where will Saturday’s wetland field group meet?","options":["At the graduate admissions hall.","At the south gate of the reservoir.","On the north side of the city museum.","Inside the campus chemistry laboratory."],"answer":1,"why":"실생활 공지의 해당 조건을 찾아 확인하세요. At the south gate of the reservoir."},{"q":"Which arrangement is available for students who cannot enter wet ground?","options":["Work with the water-analysis team in the accessible station.","Participate only after purchasing private sampling equipment.","Complete the laboratory report without any measurements.","Skip the safety form and join the boat team."],"answer":0,"why":"공지의 별도 요건 또는 예외 조항에 명시된 행동은 Work with the water-analysis team in the accessible station.입니다."},{"q":"Which items will the field station supply to the wetlands group?","options":["Private laboratory computers for remote participants.","Personal hiking clothes and replacement shoes.","Waterproof boots for all participants.","Sampling bottles and safety vests."],"answer":3,"why":"공지의 예외 조항과 구체적인 적용 범위를 비교해야 합니다. 정답 근거: Sampling bottles and safety vests."}],"ra":[{"q":"Which relationship among the system’s components does the passage stress in the passage on Wetlands and Nutrient Filtration?","options":["A calm-week sample captures the full yearly nutrient load.","Lower nitrate concentration always proves all nitrogen has been eliminated harmlessly.","Wetland filtration varies with flow and chemistry, so a single calm-period measurement cannot represent total performance.","Wetlands remove every pollutant at a constant rate regardless of water flow."],"answer":2,"why":"중심 논지는 세부 사례에서 도출되는 가장 신중한 결론입니다. Wetland filtration varies with flow and chemistry, so a single calm-period measurement cannot represent total performance."},{"q":"What specific observation in the wetlands and nutrient filtration case motivates the discussion?","options":["Lower nitrate concentration always proves all nitrogen has been eliminated harmlessly.","The restored marsh trapped sediment in ordinary rain but released stored particles during an extreme storm.","Wetlands remove every pollutant at a constant rate regardless of water flow.","A calm-week sample captures the full yearly nutrient load."],"answer":1,"why":"지문의 사례·대조 정보를 직접 확인해야 합니다. The restored marsh trapped sediment in ordinary rain but released stored particles during an extreme storm."},{"q":"Which qualification prevents the evidence about wetland sampling from supporting an unconditional claim?","options":["High flows and changing microbial conditions can alter the balance between storage and removal.","Wetlands remove every pollutant at a constant rate regardless of water flow.","Lower nitrate concentration always proves all nitrogen has been eliminated harmlessly.","A calm-week sample captures the full yearly nutrient load."],"answer":0,"why":"한계 조건은 곧바로 틀린 결론이라는 뜻이 아니라 적용 범위를 제한합니다. High flows and changing microbial conditions can alter the balance between storage and removal."},{"q":"Why does the author give the concrete example related to wetland sampling rather than begin with a universal rule?","options":["It lists the sequence of wetland sampling observations without contributing to the author’s main point.","The example proves that the implications of wetland sampling hold in every possible location.","The example eliminates the need to compare evidence about wetland sampling with alternative explanations.","It illustrates a specific relationship involving wetland sampling while establishing the boundaries of the wider argument."],"answer":3,"why":"사례는 범위가 제한된 관찰 또는 비교를 통해 주장을 구체화하고 무조건적 일반화를 피하도록 돕습니다."},{"q":"Which investigation or action would best extend the reasoning about wetlands and nutrient filtration?","options":["A calm-week sample captures the full yearly nutrient load.","Wetlands remove every pollutant at a constant rate regardless of water flow.","Monitor inflow, outflow and ecological effects across seasons and storm events.","Lower nitrate concentration always proves all nitrogen has been eliminated harmlessly."],"answer":2,"why":"추가 검증은 근거의 결함을 직접 보완하거나 대안 설명을 시험해야 합니다. Monitor inflow, outflow and ecological effects across seasons and storm events."}],"rp":[{"q":"In the wetlands and nutrient filtration passage, what does “intercept” most nearly mean in context?","options":["remove permanently from a database","capture before moving farther","measure with a digital sensor","release after storing for years"],"answer":1,"why":"단어의 문맥상 의미를 판단해야 하며 직역만으로 결정하지 않습니다. intercept ≈ capture before moving farther"},{"q":"A wetland captures pollutants in dry weather but releases sediment in a storm. What follows?","options":["Performance must be evaluated over different flow conditions.","A single calm-period sample determines annual removal.","High-flow measurements should be excluded from the analysis.","The marsh has no value for flood protection."],"answer":0,"why":"새 상황에 지문 원리를 적용하는 고난도 추론 문항입니다. Performance must be evaluated over different flow conditions."}],"lq":[{"q":"Which response best addresses the speaker’s question about wetland sampling?","options":["The field trip begins at nine.","The reservoir has several public entrances.","Yes, wetland chemistry never varies during storms.","Not reliably; storm flows can change both retention and release."],"answer":3,"why":"화자는 전제를 확인하고 있으므로 직접적인 정정과 관련 조건 설명이 적절합니다."}],"lc":[{"q":"What brings the first speaker to the conversation concerning wetland sampling?","options":["A request for the institution to change the academic field under discussion.","An invitation to deliver a formal lecture explaining wetlands and nutrient filtration.","whether calm-month samples establish wetland filtration performance","A plan to evaluate unrelated applicants for a different university program."],"answer":2,"why":"대화의 도입부에서 상대가 확인하려는 문제를 파악합니다. whether calm-month samples establish wetland filtration performance"},{"q":"What does the second speaker clarify about the issue raised in the wetlands and nutrient filtration dialogue?","options":["Lower nitrate concentration always proves all nitrogen has been eliminated harmlessly.","storm flows can change sediment retention","Wetlands remove every pollutant at a constant rate regardless of water flow.","A calm-week sample captures the full yearly nutrient load."],"answer":1,"why":"Not necessarily, No, Exactly와 같은 정정 이후의 내용을 확인합니다. storm flows can change sediment retention"},{"q":"What will the first speaker most likely do after the discussion about wetland sampling?","options":["use high-flow records and compare incoming and outgoing loads","Disregard the advice and continue on the original assumption.","Replace the entire project with an unrelated topic without consulting anyone.","Withdraw permanently from all activities discussed."],"answer":0,"why":"마지막 발화에서 다음 행동을 추론합니다. use high-flow records and compare incoming and outgoing loads"}],"la":[{"q":"What practical change or instruction is listeners expected to notice in the announcement about wetland sampling?","options":["On the north side of the city museum.","At the graduate admissions hall.","Inside the campus chemistry laboratory.","At the south gate of the reservoir."],"answer":3,"why":"공지의 장소·시간·적용 조건을 듣고 핵심 변경사항을 선택합니다. At the south gate of the reservoir."},{"q":"Which additional requirement applies to listeners in the wetlands and nutrient filtration announcement?","options":["Complete the laboratory report without any measurements.","Skip the safety form and join the boat team.","Work with the water-analysis team in the accessible station.","Participate only after purchasing private sampling equipment."],"answer":2,"why":"보편적인 안내와 특정 조건에 해당하는 행동을 구별해야 합니다. Work with the water-analysis team in the accessible station."}],"lt":[{"q":"Which statement best summarizes the lecturer’s explanation of wetlands and nutrient filtration?","options":["Wetlands remove every pollutant at a constant rate regardless of water flow.","Wetland filtration varies with flow and chemistry, so a single calm-period measurement cannot represent total performance.","Lower nitrate concentration always proves all nitrogen has been eliminated harmlessly.","A calm-week sample captures the full yearly nutrient load."],"answer":1,"why":"강의 중심 개념과 화자의 제한된 결론을 종합합니다. Wetland filtration varies with flow and chemistry, so a single calm-period measurement cannot represent total performance."},{"q":"What role does the lecturer’s example of wetland sampling play in the explanation?","options":["The restored marsh trapped sediment in ordinary rain but released stored particles during an extreme storm.","A calm-week sample captures the full yearly nutrient load.","Lower nitrate concentration always proves all nitrogen has been eliminated harmlessly.","Wetlands remove every pollutant at a constant rate regardless of water flow."],"answer":0,"why":"강의 사례는 개념을 구체화하는 관측 자료 또는 비교입니다. The restored marsh trapped sediment in ordinary rain but released stored particles during an extreme storm."},{"q":"What caution does the lecturer introduce after describing evidence related to wetland sampling?","options":["A calm-week sample captures the full yearly nutrient load.","Lower nitrate concentration always proves all nitrogen has been eliminated harmlessly.","Wetlands remove every pollutant at a constant rate regardless of water flow.","High flows and changing microbial conditions can alter the balance between storage and removal."],"answer":3,"why":"화자가 However, but 등으로 도입하는 예외를 듣는 것이 핵심입니다. High flows and changing microbial conditions can alter the balance between storage and removal."},{"q":"How would the lecturer most likely advise someone evaluating wetland sampling in a new setting?","options":["A calm-week sample captures the full yearly nutrient load.","Wetlands remove every pollutant at a constant rate regardless of water flow.","Monitor inflow, outflow and ecological effects across seasons and storm events.","Lower nitrate concentration always proves all nitrogen has been eliminated harmlessly."],"answer":2,"why":"강의의 마무리에서 제안하는 연구·실행 원칙을 응용합니다. Monitor inflow, outflow and ecological effects across seasons and storm events."}]},"audio":{"lq":"Can we judge the marsh’s annual performance from samples taken only in calm weather?","lc":"Student: Our sample suggests the marsh removed a lot of sediment last month. Can we call the wetland an effective filter?\nInstructor: Under the conditions you sampled, yes. But what happened during the recent storm?\nStudent: The water was much cloudier after the rainfall. We didn't take samples at the peak flow.\nInstructor: That's a gap. Wetland performance depends partly on water volume and residence time.\nStudent: So the average concentration from last month isn't enough?\nInstructor: It tells part of the story. We also need measurements during high-flow events and ideally the total load entering and leaving the marsh.\nStudent: Could I join the lab group for Saturday? I can't walk through the muddy ground easily.\nInstructor: Certainly. Let me know before Friday so we can assign you to the accessible analysis station.","la":"Students attending Saturday's wetland practicum should meet at the reservoir's south gate at nine o'clock, not at the campus laboratory. Please wear waterproof boots. Sampling bottles and safety vests will be supplied. All participants must submit a field safety form by three on Friday. An accessible indoor station is available for students who cannot enter muddy terrain, but the instructor needs to know in advance.","lt":"Wetlands are sometimes called nature's kidneys, but that metaphor can encourage the idea that they remove unlimited pollution. In reality, performance changes as water levels and nutrient loads change.\n\nVegetation slows water, allowing some particles to settle. Microorganisms can also transform nitrogen compounds, but these reactions depend on oxygen conditions and the time water spends in the marsh. During a large storm, fast-moving water may carry sediment straight through or even release material stored earlier.\n\nSuppose you measured only a calm month. You might report excellent filtration, yet overlook the events that deliver much of the annual nutrient load. A stronger assessment samples different flows and compares the total material entering and leaving.\n\nWe should also remember other functions: flood buffering, wildlife habitat, and public recreation. A management plan that optimizes one chemical measure at the expense of all other benefits could be shortsighted."},"speaking":{"repeat":["Welcome to the workshop on wetland sampling.","The wetlands field trip is scheduled for Saturday from 9 a.","The instructor asked us to compare the evidence about wetland sampling before drawing conclusions.","The restored marsh trapped sediment in ordinary rain but released stored particles during an extreme storm.","High flows and changing microbial conditions can alter the balance between storage and removal.","Monitor inflow, outflow and ecological effects across seasons and storm events.","Although it might initially seem that wetlands remove every pollutant at a constant rate regardless of water flow, the evidence instead suggests that wetland filtration varies with flow and chemistry, so a single calm-period measurement cannot represent total performance."],"interviews":["What first interested you in environmental science, and how would you explain that interest to a friend?","Tell me about a time when a practical decision involving wetland sampling was more complicated than you expected.","Do you think universities should give more attention to wetland sampling in introductory courses? Explain your reasoning.","Imagine a classmate disagrees with your interpretation of wetland sampling. How would you respond respectfully and precisely?"],"sample":"I would like environmental projects to report results across different conditions rather than relying on a single average. In a wetlands example, a marsh removed sediment during ordinary rainfall but released some stored material in a severe storm. If we measured only the calm period, we might reach an overly optimistic conclusion. I think the responsible approach is to track both typical and extreme events, even when the results become less impressive. This idea applies beyond environmental science: decisions are stronger when we examine the situations in which a system might fail, not just the ones in which it performs well."},"writing":{"build":[{"fragments":"whether the wetland sampling / Could you tell me / session has been rescheduled","answer":"Could you tell me whether the wetland sampling session has been rescheduled?","why":"간접 의문문 어순의 문장 구조와 주어-동사 관계를 확인하세요."},{"fragments":"The student who reviewed / noticed an important discrepancy / the sediment load records","answer":"The student who reviewed the sediment load records noticed an important discrepancy.","why":"관계절로 설명 추가의 문장 구조와 주어-동사 관계를 확인하세요."},{"fragments":"If the team had checked / different conclusion / it might have reached a / the residence time evidence earlier,","answer":"If the team had checked the residence time evidence earlier, it might have reached a different conclusion.","why":"조건절로 가능성 제시의 문장 구조와 주어-동사 관계를 확인하세요."},{"fragments":"examined did the committee approve / Only after the records related / the report / to wetland sampling had been","answer":"Only after the records related to wetland sampling had been examined did the committee approve the report.","why":"Only after 도치의 문장 구조와 주어-동사 관계를 확인하세요."},{"fragments":"of its limitations / but also a clear account / A project involving wetland sampling / requires not only reliable evidence","answer":"A project involving wetland sampling requires not only reliable evidence but also a clear account of its limitations.","why":"Not only A but also B 병렬의 문장 구조와 주어-동사 관계를 확인하세요."}],"emailTask":"You missed the highest-flow sampling period because the field station closed during a storm. Email the water-quality supervisor to explain the missing data, propose using logged sensor readings, and ask permission to revise your analysis protocol.","emailSample":"Dear Water Quality Supervisor,\n\nI am reviewing the data collected during our wetlands practicum. Unfortunately, the field station was closed at the height of last week's storm, so our manual samples do not represent the period of greatest flow. Reporting only the calm-weather results could overstate the marsh's filtration performance.\n\nWould you approve a revised analysis that incorporates the station's archived turbidity and flow-sensor readings? I would identify their different measurement methods explicitly and avoid treating them as identical to our manual samples. Please let me know whether any additional documentation is required before I update the report.\n\nThank you for your guidance.\n\nBest regards,\nAlex","discussionTask":"Professor: When restoring wetlands, should agencies emphasize pollution removal or preserving habitat complexity?\n\nStudent A — Emily: Water quality is an urgent measurable goal for downstream communities.\n\nStudent B — Daniel: Maximizing filtration alone can overlook flood protection, biodiversity and long-term stability.","discussionSample":"Wetland restoration should protect habitat complexity while maintaining clear water-quality goals. Monitoring nutrient concentrations is important because downstream communities depend on cleaner water. However, a wetland's performance changes with rainfall and flow conditions; a site that retains particles in calm weather can release stored material during a storm. If an agency maximizes filtration using only a narrow chemical measure, it may overlook flood buffering, wildlife habitat, or long-term resilience. I would require monitoring across seasons and major storms, including ecological indicators alongside inflow and outflow measurements. That approach does not diminish the importance of pollution reduction. It recognizes that wetlands provide several interdependent services and that success should not be reduced to a single number."},"vocabulary":[{"term":"nutrient retention","meaning":"영양염류 보유","collocation":"measure nutrient retention","example":"A single unexpected result persuaded wetland researchers to measure nutrient retention more carefully.","synonym":"holding nutrients in place","nuance":"","group":"core"},{"term":"sediment load","meaning":"퇴적물 부하","collocation":"estimate sediment load","example":"When the instruments returned inconsistent readings, wetland researchers attempted to estimate sediment load.","synonym":"amount of suspended sediment","nuance":"","group":"core"},{"term":"residence time","meaning":"체류 시간","collocation":"calculate residence time","example":"The supervising committee asked wetland researchers to calculate residence time and explain the criteria.","synonym":"duration water remains","nuance":"","group":"core"},{"term":"microbial pathway","meaning":"미생물 반응 경로","collocation":"identify a microbial pathway","example":"Only after a careful review could wetland researchers begin to identify a microbial pathway.","synonym":"process involving microorganisms","nuance":"","group":"core"},{"term":"nitrate transformation","meaning":"질산염 변환","collocation":"monitor nitrate transformation","example":"Under the new conditions, wetland researchers were asked to monitor nitrate transformation at an earlier stage.","synonym":"conversion of nitrate","nuance":"","group":"core"},{"term":"hydrological regime","meaning":"수문 체계","collocation":"characterize a hydrological regime","example":"The long-term monitoring plan required wetland researchers to characterize a hydrological regime at regular intervals.","synonym":"pattern of water movement","nuance":"","group":"core"},{"term":"inflow concentration","meaning":"유입수 농도","collocation":"record inflow concentration","example":"At the discussion session, wetland researchers explained their decision to record inflow concentration.","synonym":"nutrient level entering a site","nuance":"","group":"core"},{"term":"outflow monitoring","meaning":"유출수 관측","collocation":"conduct outflow monitoring","example":"The available resources enabled wetland researchers to conduct outflow monitoring during the pilot study.","synonym":"measurement of outgoing water","nuance":"","group":"core"},{"term":"flood buffering","meaning":"홍수 완충","collocation":"provide flood buffering","example":"Although the preliminary results seemed convincing, wetland researchers still needed to provide flood buffering.","synonym":"reduction of flood impacts","nuance":"","group":"core"},{"term":"watershed pollution","meaning":"유역 오염","collocation":"reduce watershed pollution","example":"Because the evidence was incomplete, wetland researchers agreed to reduce watershed pollution again before deciding.","synonym":"pollution across a drainage basin","nuance":"","group":"core"},{"term":"particle settling","meaning":"입자 침강","collocation":"enhance particle settling","example":"The report identified an overlooked opportunity for wetland researchers to enhance particle settling.","synonym":"deposition of particles","nuance":"","group":"core"},{"term":"storm pulse","meaning":"폭풍우 유입 급증","collocation":"track a storm pulse","example":"After examining competing accounts, wetland researchers were prepared to track a storm pulse.","synonym":"short high-flow event","nuance":"","group":"core"},{"term":"biogeochemical cycle","meaning":"생지화학적 순환","collocation":"analyze a biogeochemical cycle","example":"One limitation of the project was that wetland researchers could not yet analyze a biogeochemical cycle reliably.","synonym":"cycling of chemical elements","nuance":"","group":"core"},{"term":"wetland vegetation","meaning":"습지 식생","collocation":"restore wetland vegetation","example":"A later review prompted wetland researchers to restore wetland vegetation, rather than accept the initial explanation.","synonym":"plants of a wetland","nuance":"","group":"core"},{"term":"water quality indicator","meaning":"수질 지표","collocation":"compare water quality indicators","example":"Over a semester of fieldwork, wetland researchers learned how to compare water quality indicators.","synonym":"measure of water condition","nuance":"","group":"core"},{"term":"water residence","meaning":"수체 체류","collocation":"estimate water residence","example":"In their final presentation, wetland researchers described what it meant to estimate water residence.","synonym":"time spent in a waterbody","nuance":"","group":"advanced"},{"term":"hydrological pulse","meaning":"수문 급증","collocation":"monitor hydrological pulses","example":"Careful documentation enabled wetland researchers to monitor hydrological pulses without repeating the same mistake.","synonym":"temporary surge in flow","nuance":"","group":"advanced"},{"term":"seasonal variability","meaning":"계절 변동성","collocation":"capture seasonal variability","example":"In a subsequent case, wetland researchers had to capture seasonal variability under rather different conditions.","synonym":"change across seasons","nuance":"","group":"advanced"},{"term":"retention capacity","meaning":"보유 용량","collocation":"measure retention capacity","example":"The final recommendation urged wetland researchers to measure retention capacity before proceeding.","synonym":"ability to retain materials","nuance":"","group":"advanced"},{"term":"ecological co-benefit","meaning":"생태적 부가편익","collocation":"quantify ecological co-benefits","example":"In the first trial, wetland researchers were not yet able to quantify ecological co-benefits consistently.","synonym":"additional environmental benefit","nuance":"","group":"advanced"},{"term":"pollutant pathway","meaning":"오염물 이동 경로","collocation":"trace pollutant pathways","example":"The absence of reliable records made it difficult for wetland researchers to trace pollutant pathways.","synonym":"route taken by a pollutant","nuance":"","group":"advanced"},{"term":"microbial conversion","meaning":"미생물 전환","collocation":"model microbial conversion","example":"The project team provided a checklist to help wetland researchers model microbial conversion.","synonym":"chemical change by microbes","nuance":"","group":"advanced"},{"term":"waterborne transport","meaning":"물에 의한 운반","collocation":"measure waterborne transport","example":"Students observed how wetland researchers attempted to measure waterborne transport despite incomplete information.","synonym":"movement carried by water","nuance":"","group":"advanced"},{"term":"dynamic equilibrium","meaning":"동적 평형","collocation":"assess dynamic equilibrium","example":"A meaningful comparison would require wetland researchers to assess dynamic equilibrium independently.","synonym":"balance under changing conditions","nuance":"","group":"advanced"},{"term":"restoration performance","meaning":"복원 성과","collocation":"evaluate restoration performance","example":"A cautious interpretation allowed wetland researchers to evaluate restoration performance while acknowledging uncertainty.","synonym":"outcome of restoration","nuance":"","group":"advanced"},{"term":"stormwater runoff","meaning":"우수 유출","collocation":"manage stormwater runoff","example":"Several independent observations led wetland researchers to manage stormwater runoff before publication.","synonym":"runoff after rainfall","nuance":"","group":"advanced"},{"term":"environmental baseline","meaning":"환경 기준선","collocation":"establish an environmental baseline","example":"A request from the university encouraged wetland researchers to establish an environmental baseline more transparently.","synonym":"starting environmental condition","nuance":"","group":"advanced"},{"term":"nutrient concentration","meaning":"영양염 농도","collocation":"compare nutrient concentrations","example":"Rather than generalizing from one case, wetland researchers sought to compare nutrient concentrations in several settings.","synonym":"amount of dissolved nutrients","nuance":"","group":"advanced"},{"term":"water quality trend","meaning":"수질 변화 추세","collocation":"track water quality trends","example":"The investigation would be less credible if wetland researchers neglected to track water quality trends.","synonym":"pattern of water-quality change","nuance":"","group":"advanced"},{"term":"flow-dependent outcome","meaning":"유량 의존 결과","collocation":"interpret flow-dependent outcomes","example":"The procedures were revised so that wetland researchers could interpret flow-dependent outcomes consistently.","synonym":"result dependent on water flow","nuance":"","group":"advanced"}],"meta":{"sourceType":"original practice content","etsOfficial":false,"benchmark":"TOEFL iBT January 2026 task-type descriptions / ETS sample 1","studyMinutes":120,"revision":"2026-11-23-diversity-v3","discipline":"Environmental Science","genre":"systems"}};</script>
