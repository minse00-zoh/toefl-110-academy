<script>window.TOEFL_LESSON={"day":20,"week":4,"theme":"Collective Decisions Under Uncertainty","focus":"Speaking: fluency and elaboration","claim":"Effective collective decisions require surfacing unique evidence before a group settles on a preferred option.","evidence":"Independent risk summaries revealed a rare temperature-dependent sensor error missing from the original report.","caveat":"Agreement can reflect hierarchy and incomplete information rather than a thorough review of alternatives.","response":"Collect independent risk assessments, retest anomalies and document outstanding uncertainties.","storageKey":"toefl110day20-diversity-v3","notice":"ENGINEERING PROJECT OFFICE — DESIGN REVIEW PROCEDURE\n\nThe final sensor design review will begin Thursday at 2 p.m. in Meeting Room E. Each team member must submit an individual risk summary by Wednesday at 5 p.m. Summaries will be anonymized before the group discussion.\n\nThe presentation may include preliminary results, but any unresolved calibration concern must appear on the limitations slide. Slides submitted after Wednesday's deadline may be discussed only if the chair approves an exception. Please do not delete earlier test records when revising charts.","academicPassage":"Teams making consequential decisions often seek consensus, but agreement does not necessarily indicate that all important evidence has been considered. Members may share their most familiar information and leave unique observations unspoken, especially when senior colleagues announce a preferred course of action early.\n\nA research consortium planning a public demonstration faced a choice between two sensor designs. The inexpensive design passed its standard laboratory checks, while the more expensive version performed better during sudden temperature changes. Several engineers favored the cheaper device, but one technician had recorded intermittent failures during outdoor testing. The failures were rare enough to be absent from the summary report.\n\nThe team initially interpreted the lack of complaints as evidence that the cheaper sensor was sufficiently reliable. A structured review changed the discussion. Each member listed concerns independently before seeing the others' recommendations. The technician's observations prompted a targeted thermal test, which revealed a problem in one operating condition. The result did not mean that the expensive sensor was always preferable, but it altered the risk assessment.\n\nDecision scientists argue that a good process should preserve disagreement long enough for relevant evidence to surface. Methods such as anonymous initial judgments, pre-agreed acceptance criteria, and explicit records of unresolved risks can reduce the pressure to conform. The aim is not to prevent consensus; it is to ensure that the final agreement reflects an honest evaluation of the alternatives.","readingClozePassage":"A project team considered two sensor designs before an important demonstration. Most engin____ preferred th_ inexpensive mod__ because rout___ laboratory tes__ looked satisf______. A techn_____ had obse____ rare err___ during sud___ temperature changes, but those records were not in the summary. A structured review invited every member to list concerns independently. The unusual measurements then received attention, and a targeted test reproduced the problem. The team postponed its final decision until the risk had been discussed openly. Agreement became more valuable once the relevant evidence was shared.","cloze":[{"partial":"engin____","answer":"engineers","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"th_","answer":"the","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"mod__","answer":"model","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"rout___","answer":"routine","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"tes__","answer":"tests","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"satisf______","answer":"satisfactory","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"techn_____","answer":"technician","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"obse____","answer":"observed","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"err___","answer":"errors","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"sud___","answer":"sudden","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"}],"questions":{"rd":[{"q":"How will the individual risk summaries be used in the design review?","options":["They will be discarded once the slides are submitted.","They will be graded by the university admissions office.","They will be shared only after the final sensor is purchased.","They will be anonymized before group discussion."],"answer":3,"why":"실생활 공지의 해당 조건을 찾아 확인하세요. They will be anonymized before group discussion."},{"q":"What must the team do with unresolved calibration concerns?","options":["Delete earlier logs to avoid confusing the audience.","Omit them unless the chair has already chosen a new sensor.","Include them on the limitations slide.","Replace them with a statement that all tests passed."],"answer":2,"why":"공지의 별도 요건 또는 예외 조항에 명시된 행동은 Include them on the limitations slide.입니다."},{"q":"What should members do with earlier measurement logs when revising design-review charts?","options":["Replace raw records with the chair’s final summary only.","Retain the original test records.","Share only the lowest-temperature measurements.","Delete readings that differ from the preferred conclusion."],"answer":1,"why":"공지의 예외 조항과 구체적인 적용 범위를 비교해야 합니다. 정답 근거: Retain the original test records."}],"ra":[{"q":"What problem does the author argue the proposed process should address in the passage on Collective Decisions Under Uncertainty?","options":["Effective collective decisions require surfacing unique evidence before a group settles on a preferred option.","A unanimous vote guarantees that every relevant test has been examined.","Rare anomalies should be deleted from a final technical report.","The least expensive sensor is always the best choice for public demonstrations."],"answer":0,"why":"중심 논지는 세부 사례에서 도출되는 가장 신중한 결론입니다. Effective collective decisions require surfacing unique evidence before a group settles on a preferred option."},{"q":"What specific observation in the collective decisions under uncertainty case motivates the discussion?","options":["Rare anomalies should be deleted from a final technical report.","The least expensive sensor is always the best choice for public demonstrations.","A unanimous vote guarantees that every relevant test has been examined.","Independent risk summaries revealed a rare temperature-dependent sensor error missing from the original report."],"answer":3,"why":"지문의 사례·대조 정보를 직접 확인해야 합니다. Independent risk summaries revealed a rare temperature-dependent sensor error missing from the original report."},{"q":"Which qualification prevents the evidence about sensor design from supporting an unconditional claim?","options":["The least expensive sensor is always the best choice for public demonstrations.","Rare anomalies should be deleted from a final technical report.","Agreement can reflect hierarchy and incomplete information rather than a thorough review of alternatives.","A unanimous vote guarantees that every relevant test has been examined."],"answer":2,"why":"한계 조건은 곧바로 틀린 결론이라는 뜻이 아니라 적용 범위를 제한합니다. Agreement can reflect hierarchy and incomplete information rather than a thorough review of alternatives."},{"q":"Why does the author give the concrete example related to sensor design rather than begin with a universal rule?","options":["It lists the sequence of sensor design observations without contributing to the author’s main point.","It illustrates a specific relationship involving sensor design while establishing the boundaries of the wider argument.","The example eliminates the need to compare evidence about sensor design with alternative explanations.","The example proves that the implications of sensor design hold in every possible location."],"answer":1,"why":"사례는 범위가 제한된 관찰 또는 비교를 통해 주장을 구체화하고 무조건적 일반화를 피하도록 돕습니다."},{"q":"Which investigation or action would best extend the reasoning about collective decisions under uncertainty?","options":["Collect independent risk assessments, retest anomalies and document outstanding uncertainties.","A unanimous vote guarantees that every relevant test has been examined.","The least expensive sensor is always the best choice for public demonstrations.","Rare anomalies should be deleted from a final technical report."],"answer":0,"why":"추가 검증은 근거의 결함을 직접 보완하거나 대안 설명을 시험해야 합니다. Collect independent risk assessments, retest anomalies and document outstanding uncertainties."}],"rp":[{"q":"In the collective decisions under uncertainty passage, what does “intermittent” most nearly mean in context?","options":["producing a perfectly stable reading","documented only in a final budget","always associated with normal room temperature","occurring occasionally rather than continuously"],"answer":3,"why":"단어의 문맥상 의미를 판단해야 하며 직역만으로 결정하지 않습니다. intermittent ≈ occurring occasionally rather than continuously"},{"q":"A technical team agrees on a design before a rare failure is disclosed. What would improve the decision?","options":["Select the most expensive option without considering performance.","Take an anonymous vote and refuse to discuss the result.","Collect independent concerns and test the failure before final approval.","Delete the unusual record because most tests passed."],"answer":2,"why":"새 상황에 지문 원리를 적용하는 고난도 추론 문항입니다. Collect independent concerns and test the failure before final approval."}],"lq":[{"q":"Which response best addresses the speaker’s question about sensor design?","options":["The review is in Meeting Room E.","Not yet; document the anomaly and assess whether it changes the safety decision.","The chair has already selected the final slide order.","Of course—rare errors never matter in engineering."],"answer":1,"why":"화자는 전제를 확인하고 있으므로 직접적인 정정과 관련 조건 설명이 적절합니다."}],"lc":[{"q":"What brings the first speaker to the conversation concerning sensor design?","options":["whether rare temperature failures can be ignored in a sensor choice","An invitation to deliver a formal lecture explaining collective decisions under uncertainty.","A plan to evaluate unrelated applicants for a different university program.","A request for the institution to change the academic field under discussion."],"answer":0,"why":"대화의 도입부에서 상대가 확인하려는 문제를 파악합니다. whether rare temperature failures can be ignored in a sensor choice"},{"q":"What does the second speaker clarify about the issue raised in the collective decisions under uncertainty dialogue?","options":["A unanimous vote guarantees that every relevant test has been examined.","Rare anomalies should be deleted from a final technical report.","The least expensive sensor is always the best choice for public demonstrations.","anomaly records must be assessed before design approval"],"answer":3,"why":"Not necessarily, No, Exactly와 같은 정정 이후의 내용을 확인합니다. anomaly records must be assessed before design approval"},{"q":"What will the first speaker most likely do after the discussion about sensor design?","options":["Withdraw permanently from all activities discussed.","Replace the entire project with an unrelated topic without consulting anyone.","send the temperature trace and repeat the targeted test","Disregard the advice and continue on the original assumption."],"answer":2,"why":"마지막 발화에서 다음 행동을 추론합니다. send the temperature trace and repeat the targeted test"}],"la":[{"q":"What practical change or instruction is listeners expected to notice in the announcement about sensor design?","options":["They will be graded by the university admissions office.","They will be anonymized before group discussion.","They will be shared only after the final sensor is purchased.","They will be discarded once the slides are submitted."],"answer":1,"why":"공지의 장소·시간·적용 조건을 듣고 핵심 변경사항을 선택합니다. They will be anonymized before group discussion."},{"q":"Which additional requirement applies to listeners in the collective decisions under uncertainty announcement?","options":["Include them on the limitations slide.","Omit them unless the chair has already chosen a new sensor.","Replace them with a statement that all tests passed.","Delete earlier logs to avoid confusing the audience."],"answer":0,"why":"보편적인 안내와 특정 조건에 해당하는 행동을 구별해야 합니다. Include them on the limitations slide."}],"lt":[{"q":"Which statement best summarizes the lecturer’s explanation of collective decisions under uncertainty?","options":["Rare anomalies should be deleted from a final technical report.","The least expensive sensor is always the best choice for public demonstrations.","A unanimous vote guarantees that every relevant test has been examined.","Effective collective decisions require surfacing unique evidence before a group settles on a preferred option."],"answer":3,"why":"강의 중심 개념과 화자의 제한된 결론을 종합합니다. Effective collective decisions require surfacing unique evidence before a group settles on a preferred option."},{"q":"What role does the lecturer’s example of sensor design play in the explanation?","options":["A unanimous vote guarantees that every relevant test has been examined.","Rare anomalies should be deleted from a final technical report.","Independent risk summaries revealed a rare temperature-dependent sensor error missing from the original report.","The least expensive sensor is always the best choice for public demonstrations."],"answer":2,"why":"강의 사례는 개념을 구체화하는 관측 자료 또는 비교입니다. Independent risk summaries revealed a rare temperature-dependent sensor error missing from the original report."},{"q":"What caution does the lecturer introduce after describing evidence related to sensor design?","options":["Rare anomalies should be deleted from a final technical report.","Agreement can reflect hierarchy and incomplete information rather than a thorough review of alternatives.","The least expensive sensor is always the best choice for public demonstrations.","A unanimous vote guarantees that every relevant test has been examined."],"answer":1,"why":"화자가 However, but 등으로 도입하는 예외를 듣는 것이 핵심입니다. Agreement can reflect hierarchy and incomplete information rather than a thorough review of alternatives."},{"q":"How would the lecturer most likely advise someone evaluating sensor design in a new setting?","options":["Collect independent risk assessments, retest anomalies and document outstanding uncertainties.","The least expensive sensor is always the best choice for public demonstrations.","Rare anomalies should be deleted from a final technical report.","A unanimous vote guarantees that every relevant test has been examined."],"answer":0,"why":"강의의 마무리에서 제안하는 연구·실행 원칙을 응용합니다. Collect independent risk assessments, retest anomalies and document outstanding uncertainties."}]},"audio":{"lq":"Since the cheaper sensor passed routine checks, can we ignore one unusual temperature failure?","lc":"Engineer: I think we should choose the cheaper sensor. Most of the tests look fine.\nTechnician: I agree about the routine tests, but the outdoor temperature trial showed an intermittent error.\nEngineer: Why wasn't that in the summary?\nTechnician: It was rare, and I wasn't sure it belonged in the main results. I included it in the raw log.\nEngineer: That's exactly the kind of detail we need before approving the design. Could you send the temperature trace?\nTechnician: Certainly. It doesn't prove the sensor is unusable, but we should repeat the test.\nEngineer: Let's add it to the risk summary and decide after the targeted test rather than assuming it is insignificant.","la":"Project teams participating in Thursday's design review should send an individual risk summary by five o'clock Wednesday afternoon. The chair will anonymize the summaries to encourage open discussion. Preliminary results may be presented, but all known calibration concerns must be documented on the limitations slide. The review begins at two in Meeting Room E. Please retain earlier measurement logs when revising any charts.","lt":"Why do groups sometimes make poor decisions even when they contain knowledgeable people? One reason is that shared information dominates a discussion, while evidence known to only one member may never be mentioned.\n\nIn a sensor project, most engineers knew the inexpensive design passed routine checks. A technician alone had seen rare errors during abrupt temperature changes. Because the errors were not in the summary, the team nearly approved the design without considering them.\n\nA structured review asked every member to record concerns independently before the group met. Once the technician's results were disclosed, a targeted test reproduced the problem. The team did not have to select the expensive option automatically; it needed to reassess the risk.\n\nThis illustrates the value of delaying consensus. Collecting independent judgments and documenting unresolved evidence can make a group's final decision more defensible."},"speaking":{"repeat":["Welcome to the workshop on sensor design.","The final sensor design review will begin Thursday at 2 p.","The instructor asked us to compare the evidence about sensor design before drawing conclusions.","Independent risk summaries revealed a rare temperature-dependent sensor error missing from the original report.","Agreement can reflect hierarchy and incomplete information rather than a thorough review of alternatives.","Collect independent risk assessments, retest anomalies and document outstanding uncertainties.","Although it might initially seem that a unanimous vote guarantees that every relevant test has been examined, the evidence instead suggests that effective collective decisions require surfacing unique evidence before a group settles on a preferred option."],"interviews":["What first interested you in decision science / management, and how would you explain that interest to a friend?","Tell me about a time when a practical decision involving sensor design was more complicated than you expected.","Do you think universities should give more attention to sensor design in introductory courses? Explain your reasoning.","Imagine a classmate disagrees with your interpretation of sensor design. How would you respond respectfully and precisely?"],"sample":"I once worked on a technical group project where everyone initially agreed on the same solution. A quieter teammate then raised a concern about a measurement that had behaved unexpectedly. We were tempted to ignore it because the deadline was close, but we repeated the test and discovered that the issue appeared under a particular condition. Our final choice became more complicated, yet I felt more confident in it. The experience taught me that leadership is not about producing immediate agreement. It is about making people comfortable enough to share inconvenient evidence and then using that evidence to make a defensible decision."},"writing":{"build":[{"fragments":"session has been rescheduled / whether the sensor design / Could you tell me","answer":"Could you tell me whether the sensor design session has been rescheduled?","why":"간접 의문문 어순의 문장 구조와 주어-동사 관계를 확인하세요."},{"fragments":"The student who reviewed / noticed an important discrepancy / the group consensus records","answer":"The student who reviewed the group consensus records noticed an important discrepancy.","why":"관계절로 설명 추가의 문장 구조와 주어-동사 관계를 확인하세요."},{"fragments":"If the team had checked / different conclusion / the unshared evidence evidence earlier, / it might have reached a","answer":"If the team had checked the unshared evidence evidence earlier, it might have reached a different conclusion.","why":"조건절로 가능성 제시의 문장 구조와 주어-동사 관계를 확인하세요."},{"fragments":"to sensor design had been / Only after the records related / examined did the committee approve / the report","answer":"Only after the records related to sensor design had been examined did the committee approve the report.","why":"Only after 도치의 문장 구조와 주어-동사 관계를 확인하세요."},{"fragments":"requires not only reliable evidence / A project involving sensor design / but also a clear account / of its limitations","answer":"A project involving sensor design requires not only reliable evidence but also a clear account of its limitations.","why":"Not only A but also B 병렬의 문장 구조와 주어-동사 관계를 확인하세요."}],"emailTask":"You are a junior engineer who found an intermittent measurement error absent from the team’s review slides. Email the project chair respectfully to describe the observation, attach or reference the test record, propose a targeted repeat test, and ask that the limitation be included before approval.","emailSample":"Dear Project Review Chair,\n\nWhile checking the data for Thursday's sensor demonstration, I found an intermittent measurement error during rapid temperature changes. The observation is documented in the outdoor test log but does not appear in the current summary slides.\n\nI do not yet know whether the error affects the final design choice. However, I recommend repeating the thermal test under controlled conditions and recording the limitation before the review. I can forward the raw temperature trace and my notes immediately. Could you confirm whether we may include a short explanation on the limitations slide?\n\nThank you for considering this concern before the design is approved.\n\nBest regards,\nAlex","discussionTask":"Professor: Should project leaders require anonymous preliminary votes before major technical decisions?\n\nStudent A — Emily: Yes, anonymous judgments may reduce conformity pressure and help reveal overlooked evidence.\n\nStudent B — Daniel: Anonymity can weaken accountability if members are not prepared to defend the reasoning behind their recommendations.","discussionSample":"Anonymous preliminary judgments can improve major technical decisions if they are followed by an accountable discussion of the evidence. In a team considering two sensor designs, a junior technician may hesitate to mention a rare failure after senior colleagues have publicly endorsed the cheaper option. Independent risk summaries give that concern a chance to surface before consensus forms. Yet anonymity should not become a way to avoid explaining one's reasoning. Once the evidence is collected, the group should examine the test conditions, repeat critical measurements and record who is responsible for resolving each issue. I would use anonymous initial assessments as a safeguard against conformity, not as a substitute for transparent final decisions."},"vocabulary":[{"term":"independent judgment","meaning":"독립적 판단","collocation":"solicit independent judgment","example":"The report identified an overlooked opportunity for design engineers to solicit independent judgment.","synonym":"judgment formed without group pressure","nuance":"","group":"core"},{"term":"group consensus","meaning":"집단 합의","collocation":"reach group consensus","example":"After examining competing accounts, design engineers were prepared to reach group consensus.","synonym":"agreement across a group","nuance":"","group":"core"},{"term":"unshared evidence","meaning":"공유되지 않은 증거","collocation":"surface unshared evidence","example":"One limitation of the project was that design engineers could not yet surface unshared evidence reliably.","synonym":"information not shared with others","nuance":"","group":"core"},{"term":"conformity pressure","meaning":"동조 압력","collocation":"reduce conformity pressure","example":"A later review prompted design engineers to reduce conformity pressure, rather than accept the initial explanation.","synonym":"pressure to match the majority","nuance":"","group":"core"},{"term":"technical anomaly","meaning":"기술적 이상 현상","collocation":"investigate a technical anomaly","example":"Over a semester of fieldwork, design engineers learned how to investigate a technical anomaly.","synonym":"unexpected engineering behavior","nuance":"","group":"core"},{"term":"design review","meaning":"설계 검토","collocation":"conduct a design review","example":"In their final presentation, design engineers described what it meant to conduct a design review.","synonym":"formal evaluation of a design","nuance":"","group":"core"},{"term":"risk summary","meaning":"위험 요약","collocation":"submit a risk summary","example":"Careful documentation enabled design engineers to submit a risk summary without repeating the same mistake.","synonym":"summary of possible failures","nuance":"","group":"core"},{"term":"acceptance criterion","meaning":"수락 기준","collocation":"define an acceptance criterion","example":"In a subsequent case, design engineers had to define an acceptance criterion under rather different conditions.","synonym":"condition for formal acceptance","nuance":"","group":"core"},{"term":"thermal excursion","meaning":"급격한 온도 변화","collocation":"simulate a thermal excursion","example":"The final recommendation urged design engineers to simulate a thermal excursion before proceeding.","synonym":"brief temperature excursion","nuance":"","group":"core"},{"term":"calibration concern","meaning":"교정 관련 우려","collocation":"document a calibration concern","example":"In the first trial, design engineers were not yet able to document a calibration concern consistently.","synonym":"concern about measurement accuracy","nuance":"","group":"core"},{"term":"targeted retest","meaning":"목표 재시험","collocation":"perform a targeted retest","example":"The absence of reliable records made it difficult for design engineers to perform a targeted retest.","synonym":"focused repeat test","nuance":"","group":"core"},{"term":"decision record","meaning":"의사결정 기록","collocation":"maintain a decision record","example":"The project team provided a checklist to help design engineers maintain a decision record.","synonym":"written record of a decision","nuance":"","group":"core"},{"term":"anonymous ballot","meaning":"익명 투표","collocation":"conduct an anonymous ballot","example":"Students observed how design engineers attempted to conduct an anonymous ballot despite incomplete information.","synonym":"vote without identifiable names","nuance":"","group":"core"},{"term":"unresolved risk","meaning":"미해결 위험","collocation":"disclose an unresolved risk","example":"A meaningful comparison would require design engineers to disclose an unresolved risk independently.","synonym":"issue yet to be resolved","nuance":"","group":"core"},{"term":"responsible escalation","meaning":"책임 있는 상향 보고","collocation":"practice responsible escalation","example":"A cautious interpretation allowed design engineers to practice responsible escalation while acknowledging uncertainty.","synonym":"appropriate reporting of concerns","nuance":"","group":"core"},{"term":"minority evidence","meaning":"소수만 보유한 증거","collocation":"surface minority evidence","example":"Several independent observations led design engineers to surface minority evidence before publication.","synonym":"information known only to a minority","nuance":"","group":"advanced"},{"term":"decision quality","meaning":"의사결정 품질","collocation":"evaluate decision quality","example":"A request from the university encouraged design engineers to evaluate decision quality more transparently.","synonym":"effectiveness of the chosen decision","nuance":"","group":"advanced"},{"term":"technical dissent","meaning":"기술적 이견","collocation":"invite technical dissent","example":"Rather than generalizing from one case, design engineers sought to invite technical dissent in several settings.","synonym":"technical disagreement","nuance":"","group":"advanced"},{"term":"premature agreement","meaning":"성급한 동의","collocation":"avoid premature agreement","example":"The investigation would be less credible if design engineers neglected to avoid premature agreement.","synonym":"agreement reached too early","nuance":"","group":"advanced"},{"term":"systematic uncertainty","meaning":"체계적 불확실성","collocation":"document systematic uncertainty","example":"The procedures were revised so that design engineers could document systematic uncertainty consistently.","synonym":"uncertainty arising across a process","nuance":"","group":"advanced"},{"term":"risk prioritization","meaning":"위험 우선순위 설정","collocation":"perform risk prioritization","example":"Before finalizing the interpretation, design engineers decided to perform risk prioritization.","synonym":"ordering risks by importance","nuance":"","group":"advanced"},{"term":"independent review","meaning":"독립적 검토","collocation":"commission an independent review","example":"The students challenged design engineers to commission an independent review without overlooking contrary evidence.","synonym":"separate expert review","nuance":"","group":"advanced"},{"term":"operational trade-off","meaning":"운영상 상충관계","collocation":"weigh operational trade-offs","example":"The instructor proposed that design engineers should first weigh operational trade-offs and then compare outcomes.","synonym":"tradeoff in running a system","nuance":"","group":"advanced"},{"term":"anomaly escalation","meaning":"이상 현상 보고","collocation":"require anomaly escalation","example":"When the initial explanation failed, design engineers returned to the data to require anomaly escalation.","synonym":"reporting an abnormal finding","nuance":"","group":"advanced"},{"term":"evidence asymmetry","meaning":"증거의 비대칭","collocation":"reduce evidence asymmetry","example":"The group discovered that it was possible to reduce evidence asymmetry without assuming a single cause.","synonym":"unequal distribution of information","nuance":"","group":"advanced"},{"term":"collective deliberation","meaning":"집단 숙의","collocation":"structure collective deliberation","example":"A second research team challenged design engineers to structure collective deliberation with different assumptions.","synonym":"reasoning as a group","nuance":"","group":"advanced"},{"term":"decision threshold","meaning":"결정 임계값","collocation":"set a decision threshold","example":"The revised protocol gave design engineers a systematic way to set a decision threshold.","synonym":"minimum required evidence for approval","nuance":"","group":"advanced"},{"term":"uncertainty register","meaning":"불확실성 등록부","collocation":"maintain an uncertainty register","example":"To address a practical difficulty, design engineers chose to maintain an uncertainty register under controlled conditions.","synonym":"log of outstanding uncertainties","nuance":"","group":"advanced"},{"term":"transparent rationale","meaning":"투명한 결정 근거","collocation":"provide a transparent rationale","example":"It proved especially important for design engineers to provide a transparent rationale during the second assessment.","synonym":"clearly explained justification","nuance":"","group":"advanced"},{"term":"accountable leadership","meaning":"책임 있는 리더십","collocation":"demonstrate accountable leadership","example":"In response to the reviewers, design engineers agreed to demonstrate accountable leadership using an explicit procedure.","synonym":"leadership open to responsibility","nuance":"","group":"advanced"}],"meta":{"sourceType":"original practice content","etsOfficial":false,"benchmark":"TOEFL iBT January 2026 task-type descriptions / ETS sample 1","studyMinutes":120,"revision":"2026-11-23-diversity-v3","discipline":"Decision Science / Management","genre":"problem-solution"}};</script>
