<script>window.TOEFL_LESSON={"day":9,"week":2,"theme":"Neighborhood Networks and Social Capital","focus":"Reading: inference and text structure","claim":"Networks can support collective action while reproducing exclusion unless participation is deliberately broadened.","evidence":"The neighborhood with fewer meetings had broader participation because it offered interpretation, childcare and flexible comment options.","caveat":"Dense ties among established residents may exclude newcomers and restrict information exchange.","response":"Measure who participates and build connections within and across social groups.","storageKey":"toefl110day9-diversity-v3","notice":"NEIGHBORHOOD COUNCIL — OPEN FORUM\n\nTuesday's housing and parks forum begins at 6:30 p.m. in the community center. Simultaneous interpretation in Korean and Spanish will be available. Families may use the supervised children's room between 6 p.m. and 8:30 p.m., but places must be reserved through the council's website by Monday evening.\n\nResidents may speak for up to two minutes during the open-comment section. Written comments are accepted until Friday, including from people who cannot attend in person. Proof of home ownership is not required.","academicPassage":"Urban neighborhoods with dense social ties can coordinate activities that individuals would struggle to organize alone. Residents who know one another may share tools, exchange childcare, or mobilize support after a storm. Sociologists sometimes describe these relationships as social capital: resources made available through networks of trust and cooperation.\n\nYet network density is not automatically beneficial to everyone. An association of long-time homeowners may secure park improvements efficiently while excluding newer renters from planning meetings. The same close ties that make collective action easier can also make a group resistant to outsiders or alternative views.\n\nResearchers studying two districts observed that both held frequent community meetings, but only one offered translation, childcare and flexible meeting times. Participation in the more accessible district was broader, even though its total number of meetings was lower. Counting gatherings alone would therefore have overstated how inclusive the first neighborhood was.\n\nSome residents also prefer weaker ties that connect them beyond their immediate community. A person seeking employment may benefit more from contact with people in different occupations than from repeatedly consulting close friends who share the same information. Effective local policy may need to cultivate both close-knit support and connections across social groups. The quality and distribution of relationships matter at least as much as their apparent abundance.","readingClozePassage":"A neighborhood council wanted to increase public participation in decisions about local parks. Its fir__ survey coun___ meeting atten_____, and th_ numbers appe____ impressive. Inter_____, however, sho___ that rent___ and pare___ on even___ shifts were underrepresented. The council experimented with childcare, interpretation, and written-comment options. Although the number of in-person attendees changed little, a broader range of residents contributed useful suggestions. The organizers concluded that an inclusive process should be measured by whose perspectives are heard, not merely by the size of the audience.","cloze":[{"partial":"fir__","answer":"first","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"coun___","answer":"counted","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"atten_____","answer":"attendance","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"th_","answer":"the","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"appe____","answer":"appeared","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"Inter_____","answer":"interviews","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"sho___","answer":"showed","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"rent___","answer":"renters","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"pare___","answer":"parents","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"even___","answer":"evening","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"}],"questions":{"rd":[{"q":"Who may participate in the council’s housing forum?","options":["Renters and homeowners in the community.","Only speakers fluent in two languages.","Only people with proof of property ownership.","Only people with a child-care reservation."],"answer":0,"why":"실생활 공지의 해당 조건을 찾아 확인하세요. Renters and homeowners in the community."},{"q":"What can residents do if they cannot attend Tuesday’s meeting?","options":["Request a private property-owner ballot.","Vote by sending a text after the next monthly meeting.","Ask the interpreter to speak for them without submitting comments.","Submit written comments through Friday."],"answer":3,"why":"공지의 별도 요건 또는 예외 조항에 명시된 행동은 Submit written comments through Friday.입니다."},{"q":"What does the council say about eligibility to speak at the forum?","options":["Residents who submit a written comment lose the right to attend.","Only people who reserved childcare may speak.","Home ownership is not required.","Renters must obtain permission from a landlord."],"answer":2,"why":"공지의 예외 조항과 구체적인 적용 범위를 비교해야 합니다. 정답 근거: Home ownership is not required."}],"ra":[{"q":"What widely held assumption does the example complicate in the passage on Neighborhood Networks and Social Capital?","options":["Strong connections among close friends make wider professional contacts unnecessary.","Networks can support collective action while reproducing exclusion unless participation is deliberately broadened.","A large number of meetings proves that every group is represented.","Only residents who own property can contribute meaningful local knowledge."],"answer":1,"why":"중심 논지는 세부 사례에서 도출되는 가장 신중한 결론입니다. Networks can support collective action while reproducing exclusion unless participation is deliberately broadened."},{"q":"What specific observation in the neighborhood networks and social capital case motivates the discussion?","options":["The neighborhood with fewer meetings had broader participation because it offered interpretation, childcare and flexible comment options.","Only residents who own property can contribute meaningful local knowledge.","A large number of meetings proves that every group is represented.","Strong connections among close friends make wider professional contacts unnecessary."],"answer":0,"why":"지문의 사례·대조 정보를 직접 확인해야 합니다. The neighborhood with fewer meetings had broader participation because it offered interpretation, childcare and flexible comment options."},{"q":"Which qualification prevents the evidence about community participation from supporting an unconditional claim?","options":["Strong connections among close friends make wider professional contacts unnecessary.","Only residents who own property can contribute meaningful local knowledge.","A large number of meetings proves that every group is represented.","Dense ties among established residents may exclude newcomers and restrict information exchange."],"answer":3,"why":"한계 조건은 곧바로 틀린 결론이라는 뜻이 아니라 적용 범위를 제한합니다. Dense ties among established residents may exclude newcomers and restrict information exchange."},{"q":"What purpose does the author’s case study serve in evaluating community participation?","options":["The example eliminates the need to compare evidence about community participation with alternative explanations.","The example proves that the implications of community participation hold in every possible location.","It illustrates a specific relationship involving community participation while establishing the boundaries of the wider argument.","It lists the sequence of community participation observations without contributing to the author’s main point."],"answer":2,"why":"사례는 범위가 제한된 관찰 또는 비교를 통해 주장을 구체화하고 무조건적 일반화를 피하도록 돕습니다."},{"q":"Which investigation or action would best extend the reasoning about neighborhood networks and social capital?","options":["Strong connections among close friends make wider professional contacts unnecessary.","Measure who participates and build connections within and across social groups.","A large number of meetings proves that every group is represented.","Only residents who own property can contribute meaningful local knowledge."],"answer":1,"why":"추가 검증은 근거의 결함을 직접 보완하거나 대안 설명을 시험해야 합니다. Measure who participates and build connections within and across social groups."}],"rp":[{"q":"In the neighborhood networks and social capital passage, what does “overstated” most nearly mean in context?","options":["made to appear greater than it was","replaced with an unrelated topic","omitted from the meeting record","given a lower numerical value"],"answer":0,"why":"단어의 문맥상 의미를 판단해야 하며 직역만으로 결정하지 않습니다. overstated ≈ made to appear greater than it was"},{"q":"A neighborhood holds many meetings but excludes workers on evening shifts. What is a better indicator of inclusion?","options":["A requirement to own property before speaking.","Whether existing association members already agree.","The number of agenda items read at each meeting.","Participation by different resident groups using accessible formats."],"answer":3,"why":"새 상황에 지문 원리를 적용하는 고난도 추론 문항입니다. Participation by different resident groups using accessible formats."}],"lq":[{"q":"Which response best addresses the speaker’s question about community participation?","options":["The discussion starts at six thirty.","The council publishes several newsletters each year.","No, renters are welcome and can submit written comments too.","Yes, only homeowners may use the community center."],"answer":2,"why":"화자는 전제를 확인하고 있으므로 직접적인 정정과 관련 조건 설명이 적절합니다."}],"lc":[{"q":"What brings the first speaker to the conversation concerning community participation?","options":["A request for the institution to change the academic field under discussion.","whether only homeowners can speak at the neighborhood forum","A plan to evaluate unrelated applicants for a different university program.","An invitation to deliver a formal lecture explaining neighborhood networks and social capital."],"answer":1,"why":"대화의 도입부에서 상대가 확인하려는 문제를 파악합니다. whether only homeowners can speak at the neighborhood forum"},{"q":"What does the second speaker clarify about the issue raised in the neighborhood networks and social capital dialogue?","options":["renters are welcome and can submit written comments","A large number of meetings proves that every group is represented.","Only residents who own property can contribute meaningful local knowledge.","Strong connections among close friends make wider professional contacts unnecessary."],"answer":0,"why":"Not necessarily, No, Exactly와 같은 정정 이후의 내용을 확인합니다. renters are welcome and can submit written comments"},{"q":"What will the first speaker most likely do after the discussion about community participation?","options":["Withdraw permanently from all activities discussed.","Disregard the advice and continue on the original assumption.","Replace the entire project with an unrelated topic without consulting anyone.","encourage tenant participation and submit comments by Friday"],"answer":3,"why":"마지막 발화에서 다음 행동을 추론합니다. encourage tenant participation and submit comments by Friday"}],"la":[{"q":"What practical change or instruction is listeners expected to notice in the announcement about community participation?","options":["Only people with proof of property ownership.","Only people with a child-care reservation.","Renters and homeowners in the community.","Only speakers fluent in two languages."],"answer":2,"why":"공지의 장소·시간·적용 조건을 듣고 핵심 변경사항을 선택합니다. Renters and homeowners in the community."},{"q":"Which additional requirement applies to listeners in the neighborhood networks and social capital announcement?","options":["Vote by sending a text after the next monthly meeting.","Submit written comments through Friday.","Ask the interpreter to speak for them without submitting comments.","Request a private property-owner ballot."],"answer":1,"why":"보편적인 안내와 특정 조건에 해당하는 행동을 구별해야 합니다. Submit written comments through Friday."}],"lt":[{"q":"Which statement best summarizes the lecturer’s explanation of neighborhood networks and social capital?","options":["Networks can support collective action while reproducing exclusion unless participation is deliberately broadened.","Only residents who own property can contribute meaningful local knowledge.","Strong connections among close friends make wider professional contacts unnecessary.","A large number of meetings proves that every group is represented."],"answer":0,"why":"강의 중심 개념과 화자의 제한된 결론을 종합합니다. Networks can support collective action while reproducing exclusion unless participation is deliberately broadened."},{"q":"What role does the lecturer’s example of community participation play in the explanation?","options":["Strong connections among close friends make wider professional contacts unnecessary.","A large number of meetings proves that every group is represented.","Only residents who own property can contribute meaningful local knowledge.","The neighborhood with fewer meetings had broader participation because it offered interpretation, childcare and flexible comment options."],"answer":3,"why":"강의 사례는 개념을 구체화하는 관측 자료 또는 비교입니다. The neighborhood with fewer meetings had broader participation because it offered interpretation, childcare and flexible comment options."},{"q":"What caution does the lecturer introduce after describing evidence related to community participation?","options":["Strong connections among close friends make wider professional contacts unnecessary.","A large number of meetings proves that every group is represented.","Dense ties among established residents may exclude newcomers and restrict information exchange.","Only residents who own property can contribute meaningful local knowledge."],"answer":2,"why":"화자가 However, but 등으로 도입하는 예외를 듣는 것이 핵심입니다. Dense ties among established residents may exclude newcomers and restrict information exchange."},{"q":"How would the lecturer most likely advise someone evaluating community participation in a new setting?","options":["A large number of meetings proves that every group is represented.","Measure who participates and build connections within and across social groups.","Strong connections among close friends make wider professional contacts unnecessary.","Only residents who own property can contribute meaningful local knowledge."],"answer":1,"why":"강의의 마무리에서 제안하는 연구·실행 원칙을 응용합니다. Measure who participates and build connections within and across social groups."}]},"audio":{"lq":"Do I need to own my apartment to comment at the community forum?","lc":"Renter: I thought this council meeting was only for homeowners. Is that why the registration form asks for an address?\nOrganizer: No, renters are welcome. We ask for an address simply to understand which neighborhood people are commenting on.\nRenter: I work late, so I may miss the public-comment period.\nOrganizer: You can submit a written comment until Friday. It will be included in the meeting record.\nRenter: Will someone be available to interpret for my neighbor?\nOrganizer: Yes, we have Korean and Spanish interpreters. Families can also reserve childcare, but those places fill up quickly.\nRenter: That's helpful. I'll encourage a few other tenants to take part.\nOrganizer: Please do. We want the forum to represent more than the people who usually attend.","la":"The neighborhood council welcomes both renters and homeowners to tonight's open forum. Interpretation is available in Korean and Spanish. Speakers have two minutes for comments, and written statements can be submitted online until Friday by people who cannot attend. The supervised children's room is open until eight thirty, but only for families who reserved a place in advance. We ask everyone to respect the time limit so all groups can be heard.","lt":"A neighborhood with frequent meetings might appear to have strong social capital. But let's ask who attends those meetings. If they are dominated by long-term homeowners, renters and newcomers may have little influence even if the calendar is full.\n\nIn one comparison, a district with fewer meetings had wider participation because it provided childcare, interpretation and flexible ways to submit comments. More meetings did not mean more inclusion.\n\nA second distinction is between close ties and wider connections. Close friends can supply emergency help, but contacts outside one's regular circle can bring new job information or different perspectives. A community benefits from both kinds of relationship.\n\nSo don't measure social capital only by how many people know one another. Ask who is connected to whom, what resources move through those ties, and whose voices remain absent."},"speaking":{"repeat":["Welcome to the workshop on community participation.","Tuesday's housing and parks forum begins at 6:30 p.","The instructor asked us to compare the evidence about community participation before drawing conclusions.","The neighborhood with fewer meetings had broader participation because it offered interpretation, childcare and flexible comment options.","Dense ties among established residents may exclude newcomers and restrict information exchange.","Measure who participates and build connections within and across social groups.","Although it might initially seem that a large number of meetings proves that every group is represented, the evidence instead suggests that networks can support collective action while reproducing exclusion unless participation is deliberately broadened."],"interviews":["What first interested you in sociology / urban studies, and how would you explain that interest to a friend?","Tell me about a time when a practical decision involving community participation was more complicated than you expected.","Do you think universities should give more attention to community participation in introductory courses? Explain your reasoning.","Imagine a classmate disagrees with your interpretation of community participation. How would you respond respectfully and precisely?"],"sample":"I believe community meetings should be designed for residents who are least able to attend them, not just for those who participate regularly. A forum held on one weekday evening may be convenient for homeowners but difficult for shift workers or parents. If I helped organize it, I would provide online comments, interpretation and childcare where possible. I would also check whether the suggestions from renters and newcomers were actually considered. These changes might seem small, but they would make participation more meaningful. To me, a strong community is not simply one where people know each other; it is one where different people can contribute."},"writing":{"build":[{"fragments":"Could you tell me / session has been rescheduled / whether the community participation","answer":"Could you tell me whether the community participation session has been rescheduled?","why":"간접 의문문 어순의 문장 구조와 주어-동사 관계를 확인하세요."},{"fragments":"The student who reviewed / the bonding ties records / noticed an important discrepancy","answer":"The student who reviewed the bonding ties records noticed an important discrepancy.","why":"관계절로 설명 추가의 문장 구조와 주어-동사 관계를 확인하세요."},{"fragments":"If the team had checked / the bridging ties evidence earlier, / it might have reached a / different conclusion","answer":"If the team had checked the bridging ties evidence earlier, it might have reached a different conclusion.","why":"조건절로 가능성 제시의 문장 구조와 주어-동사 관계를 확인하세요."},{"fragments":"Only after the records related / the report / examined did the committee approve / to community participation had been","answer":"Only after the records related to community participation had been examined did the committee approve the report.","why":"Only after 도치의 문장 구조와 주어-동사 관계를 확인하세요."},{"fragments":"but also a clear account / requires not only reliable evidence / of its limitations / A project involving community participation","answer":"A project involving community participation requires not only reliable evidence but also a clear account of its limitations.","why":"Not only A but also B 병렬의 문장 구조와 주어-동사 관계를 확인하세요."}],"emailTask":"You want to submit a comment about park accessibility but cannot attend the neighborhood forum. Email the council secretary to explain why, include your recommendation, and ask whether the comment will appear in the official meeting record.","emailSample":"Dear Council Secretary,\n\nI would like to contribute to Tuesday's discussion about neighborhood parks, but my work schedule prevents me from attending the evening meeting. I am therefore submitting a written comment before Friday's deadline.\n\nThe narrow path beside Riverside Park is difficult for people using mobility aids. I recommend that the council examine options for widening it and improving the lighting near the entrance. Could you confirm that this comment will be included in the official meeting record and shared with the planning committee?\n\nThank you for ensuring that residents who cannot attend in person still have a way to participate.\n\nBest wishes,\nAlex","discussionTask":"Professor: Should community councils prioritize attendance numbers or representation across demographic groups when evaluating success?\n\nStudent A — Emily: Large attendance is a practical sign that residents are interested and engaged.\n\nStudent B — Daniel: Participation measures are misleading unless renters, newcomers and families can contribute on equal terms.","discussionSample":"I would judge the success of a neighborhood council by who can participate, not merely by the size of the audience. A meeting attended by many established homeowners may still fail to represent renters, newcomers, and families with evening responsibilities. Attendance figures are useful for planning room capacity, but they do not reveal whose perspectives have been excluded. Providing interpretation, childcare, and written-comment options can broaden participation even when total attendance is modest. I would therefore track both the number of participants and the range of resident groups represented. Councils could also report whether feedback changed a proposal, since inclusion involves more than allowing someone to speak. The better measure is whether diverse residents have a meaningful opportunity to influence decisions."},"vocabulary":[{"term":"social capital","meaning":"사회적 자본","collocation":"build social capital","example":"After examining competing accounts, community organizers were prepared to build social capital.","synonym":"resources within social relationships","nuance":"","group":"core"},{"term":"bonding ties","meaning":"결속형 관계","collocation":"strengthen bonding ties","example":"One limitation of the project was that community organizers could not yet strengthen bonding ties reliably.","synonym":"ties within similar groups","nuance":"","group":"core"},{"term":"bridging ties","meaning":"교량형 관계","collocation":"cultivate bridging ties","example":"A later review prompted community organizers to cultivate bridging ties, rather than accept the initial explanation.","synonym":"links across different groups","nuance":"","group":"core"},{"term":"community association","meaning":"주민 협의체","collocation":"join a community association","example":"Over a semester of fieldwork, community organizers learned how to join a community association.","synonym":"local civic organization","nuance":"","group":"core"},{"term":"collective action","meaning":"집합적 행동","collocation":"coordinate collective action","example":"In their final presentation, community organizers described what it meant to coordinate collective action.","synonym":"joint efforts","nuance":"","group":"core"},{"term":"participation barrier","meaning":"참여 장벽","collocation":"remove a participation barrier","example":"Careful documentation enabled community organizers to remove a participation barrier without repeating the same mistake.","synonym":"obstacle to involvement","nuance":"","group":"core"},{"term":"residential tenure","meaning":"거주 기간","collocation":"compare residential tenure","example":"In a subsequent case, community organizers had to compare residential tenure under rather different conditions.","synonym":"length of residence","nuance":"","group":"core"},{"term":"inclusive forum","meaning":"포용적 공개 토론회","collocation":"host an inclusive forum","example":"The final recommendation urged community organizers to host an inclusive forum before proceeding.","synonym":"forum open to everyone","nuance":"","group":"core"},{"term":"informal support","meaning":"비공식적 지원","collocation":"rely on informal support","example":"In the first trial, community organizers were not yet able to rely on informal support consistently.","synonym":"unofficial help","nuance":"","group":"core"},{"term":"cross-group connection","meaning":"집단 간 연결","collocation":"facilitate cross-group connections","example":"The absence of reliable records made it difficult for community organizers to facilitate cross-group connections.","synonym":"relationships across groups","nuance":"","group":"core"},{"term":"neighborhood cohesion","meaning":"지역사회 결속","collocation":"assess neighborhood cohesion","example":"The project team provided a checklist to help community organizers assess neighborhood cohesion.","synonym":"sense of neighborhood unity","nuance":"","group":"core"},{"term":"local representation","meaning":"지역 대표성","collocation":"improve local representation","example":"Students observed how community organizers attempted to improve local representation despite incomplete information.","synonym":"local voice in decisions","nuance":"","group":"core"},{"term":"public-comment period","meaning":"공개 발언 시간","collocation":"extend a public-comment period","example":"A meaningful comparison would require community organizers to extend a public-comment period independently.","synonym":"period for public responses","nuance":"","group":"core"},{"term":"resident outreach","meaning":"주민 참여 독려","collocation":"organize resident outreach","example":"A cautious interpretation allowed community organizers to organize resident outreach while acknowledging uncertainty.","synonym":"engagement with local residents","nuance":"","group":"core"},{"term":"network diversity","meaning":"연결망 다양성","collocation":"measure network diversity","example":"Several independent observations led community organizers to measure network diversity before publication.","synonym":"variety in social ties","nuance":"","group":"core"},{"term":"reciprocal obligation","meaning":"상호 의무","collocation":"recognize reciprocal obligations","example":"A request from the university encouraged community organizers to recognize reciprocal obligations more transparently.","synonym":"two-way responsibility","nuance":"","group":"advanced"},{"term":"social cohesion","meaning":"사회적 응집성","collocation":"strengthen social cohesion","example":"Rather than generalizing from one case, community organizers sought to strengthen social cohesion in several settings.","synonym":"connectedness in a community","nuance":"","group":"advanced"},{"term":"resident turnover","meaning":"주민 이동률","collocation":"track resident turnover","example":"The investigation would be less credible if community organizers neglected to track resident turnover.","synonym":"movement of residents","nuance":"","group":"advanced"},{"term":"bridging network","meaning":"집단을 잇는 연결망","collocation":"build a bridging network","example":"The procedures were revised so that community organizers could build a bridging network consistently.","synonym":"cross-group connections","nuance":"","group":"advanced"},{"term":"institutional trust","meaning":"제도에 대한 신뢰","collocation":"increase institutional trust","example":"Before finalizing the interpretation, community organizers decided to increase institutional trust.","synonym":"trust in institutions","nuance":"","group":"advanced"},{"term":"informal exclusion","meaning":"비공식적 배제","collocation":"identify informal exclusion","example":"The students challenged community organizers to identify informal exclusion without overlooking contrary evidence.","synonym":"unofficial barriers to entry","nuance":"","group":"advanced"},{"term":"participatory process","meaning":"참여 절차","collocation":"design a participatory process","example":"The instructor proposed that community organizers should first design a participatory process and then compare outcomes.","synonym":"process enabling participation","nuance":"","group":"advanced"},{"term":"distributional equity","meaning":"분배 형평성","collocation":"evaluate distributional equity","example":"When the initial explanation failed, community organizers returned to the data to evaluate distributional equity.","synonym":"fairness across groups","nuance":"","group":"advanced"},{"term":"community resilience","meaning":"지역사회 회복력","collocation":"assess community resilience","example":"The group discovered that it was possible to assess community resilience without assuming a single cause.","synonym":"capacity of a community to adapt","nuance":"","group":"advanced"},{"term":"collective efficacy","meaning":"집단 효능감","collocation":"measure collective efficacy","example":"A second research team challenged community organizers to measure collective efficacy with different assumptions.","synonym":"confidence in collective action","nuance":"","group":"advanced"},{"term":"group representation","meaning":"집단 대표성","collocation":"improve group representation","example":"The revised protocol gave community organizers a systematic way to improve group representation.","synonym":"representation of different groups","nuance":"","group":"advanced"},{"term":"residential mobility","meaning":"거주 이동성","collocation":"study residential mobility","example":"To address a practical difficulty, community organizers chose to study residential mobility under controlled conditions.","synonym":"movement between homes","nuance":"","group":"advanced"},{"term":"social fragmentation","meaning":"사회적 분절","collocation":"reduce social fragmentation","example":"It proved especially important for community organizers to reduce social fragmentation during the second assessment.","synonym":"breakdown of community ties","nuance":"","group":"advanced"},{"term":"resource exchange","meaning":"자원 교환","collocation":"facilitate resource exchange","example":"In response to the reviewers, community organizers agreed to facilitate resource exchange using an explicit procedure.","synonym":"sharing of resources","nuance":"","group":"advanced"},{"term":"stakeholder outreach","meaning":"이해관계자 참여 독려","collocation":"conduct stakeholder outreach","example":"A single unexpected result persuaded community organizers to conduct stakeholder outreach more carefully.","synonym":"engagement with affected people","nuance":"","group":"advanced"}],"meta":{"sourceType":"original practice content","etsOfficial":false,"benchmark":"TOEFL iBT January 2026 task-type descriptions / ETS sample 1","studyMinutes":120,"revision":"2026-11-23-diversity-v3","discipline":"Sociology / Urban Studies","genre":"counterexample"}};</script>
