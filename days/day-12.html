<script>window.TOEFL_LESSON={"day":12,"week":3,"theme":"Sleep and Learning","focus":"Listening: intention and discourse structure","claim":"Two groups studied a vocabulary set for the same total time but followed different schedules.","evidence":"Students who spaced their practice over several evenings retained more words a week later than students who crammed.","caveat":"Differences in stress, previous knowledge and sleep regularity could partly influence the comparison.","response":"The instructor planned randomized practice schedules with both immediate and delayed assessments.","storageKey":"toefl110day12-quality-v2","notice":"STUDENT SERVICES ANNOUNCEMENT — Learning-Science Study Group\n\nDear participants,\n\nWe are updating the arrangements for the sleep and learning activity next Wednesday. An issue has been identified: a learner assumes the exercises can all be completed the evening before. Please note the following requirement: the planned practice requires three separate sessions and a record of their timing. The practical next step is clear: the student should follow the schedule rather than compress the work. Please send any questions or corrected documents by Wednesday at 2 p.m.. Participants who cannot meet the condition should contact the course office rather than assuming that an existing registration resolves the issue.\n\nKind regards,\nStudent Research Services","academicPassage":"Sleep and Learning\n\nTwo groups studied a vocabulary set for the same total time but followed different schedules. In this fictional university case, the investigators were not simply looking for a statistically detectable difference. They needed to decide what the evidence could justify, for whom the result might be relevant, and which assumptions would have to remain valid. That distinction is important because a pattern that seems clear in one set of observations may change when the procedure or comparison group changes.\n\nThe initial comparison was informative. Students who spaced their practice over several evenings retained more words a week later than students who crammed. This was a useful result, but it raised a further question: was the observed pattern produced by the factor of interest, or could some aspect of the method have influenced it? One particularly revealing detail was the delayed one-week retention test. Its significance lay not in providing an immediate answer but in showing which part of the research design needed closer attention.\n\nThe main methodological difficulty was the following: Differences in stress, previous knowledge and sleep regularity could partly influence the comparison. This qualification does not render the original observation irrelevant. Rather, it changes the degree of confidence that readers should place in a broad interpretation. An analyst who reports only the encouraging result risks confusing a possible explanation with an established mechanism. By contrast, an analyst who discloses the limitation enables readers to assess the evidence on its own terms.\n\nThe proposed next step addressed that problem directly. The instructor planned randomized practice schedules with both immediate and delayed assessments. Further investigation would be especially valuable if it could distinguish the favored interpretation from a plausible competing account. Consequently, the most defensible conclusion is neither unconditional acceptance nor automatic rejection. It is a claim whose strength is proportional to the quality and scope of the evidence.","readingClozePassage":"Researchers studying sleep and learning initially proposed a straightforward interpretation. Two groups studied a vocabulary set for the same total time but followed different schedules. They then compared their observations with additional evidence. Students who spaced their practice over several even____ retained mo__ words a we__ later th__ students wh_ crammed. Th_ preliminary resu___ were inform_____, but a care___ analyst sti__ needed to identify alternative accounts, document the relevant assumptions, and consider whether the observed pattern would remain stable under different conditions. The instructor planned randomized practice schedules with both immediate and delayed assessments. A balanced report should distinguish the available evidence from conclusions that extend beyond it.","cloze":[{"partial":"even____","answer":"evenings","meaning":"문맥과 문법에 따른 철자 복원"},{"partial":"mo__","answer":"more","meaning":"문맥과 문법에 따른 철자 복원"},{"partial":"we__","answer":"week","meaning":"문맥과 문법에 따른 철자 복원"},{"partial":"th__","answer":"than","meaning":"문맥과 문법에 따른 철자 복원"},{"partial":"wh_","answer":"who","meaning":"문맥과 문법에 따른 철자 복원"},{"partial":"Th_","answer":"The","meaning":"문맥과 문법에 따른 철자 복원"},{"partial":"resu___","answer":"results","meaning":"문맥과 문법에 따른 철자 복원"},{"partial":"inform_____","answer":"informative","meaning":"문맥과 문법에 따른 철자 복원"},{"partial":"care___","answer":"careful","meaning":"문맥과 문법에 따른 철자 복원"},{"partial":"sti__","answer":"still","meaning":"문맥과 문법에 따른 철자 복원"}],"questions":{"rd":[{"q":"What is the main purpose of the message?","options":["To announce that all registrations have been canceled","To clarify a problem, a requirement and an appropriate next step","To summarize the historical development of the field","To invite readers to submit unrelated research proposals"],"answer":1,"why":"공지에는 문제·필수 조건·구체적인 후속 조치가 명시되어 있습니다."},{"q":"Which response would comply with the stated requirement?","options":["The student should follow the schedule rather than compress the work.","Ignore the issue because the registration already exists","Submit only the same incomplete document without any change","Wait until after the deadline without notifying the office"],"answer":0,"why":"정답은 공지에 제시된 후속 조치의 바꿔 말하기입니다."},{"q":"What does the writer imply about the participant’s previous assumption?","options":["It has already been accepted as university policy.","It makes further verification unnecessary.","It requires every participant to withdraw immediately.","It is incomplete and should not determine the next action."],"answer":3,"why":"기존 오해를 바로잡기 위해 새로운 조건과 조치를 안내하고 있습니다."}],"ra":[{"q":"Which statement best captures the central idea of the passage?","options":["A positive initial outcome makes follow-up investigation unnecessary.","Methodological uncertainty prevents any responsible decision.","An observation is useful only when its interpretation accounts for relevant limitations and alternatives.","A result obtained in one setting automatically applies elsewhere."],"answer":2,"why":"지문은 관측과 확정적 인과 해석을 구분하고 주장 강도를 근거에 비례시키라고 설명합니다."},{"q":"What did the investigators observe in the fictional case?","options":["The instructor planned randomized practice schedules with both immediate and delayed assessments.","Students who spaced their practice over several evenings retained more words a week later than students who crammed.","The researchers had no preliminary result to examine.","Every competing explanation was eliminated before the first comparison."],"answer":1,"why":"두 번째 단락의 관찰 결과에 직접 근거한 선택지입니다. 제안된 후속 조치와 실제 관측을 구분하세요."},{"q":"Why does the author specifically mention the delayed one-week retention test?","options":["To identify a detail whose interpretation requires methodological scrutiny.","To prove that the entire study should be discarded.","To show that every alternative explanation has been disproved.","To suggest that a single technical detail is more important than all other evidence."],"answer":0,"why":"해당 세부사항은 연구 설계에서 추가 검토가 필요한 부분의 예시로 제시됩니다."},{"q":"Which limitation most directly weakens an unconditional conclusion?","options":["The topic attracted interest from several academic departments.","The authors included a title and organized their paragraphs.","The case concerns a practical problem rather than a purely abstract theory.","Differences in stress, previous knowledge and sleep regularity could partly influence the comparison."],"answer":3,"why":"세 번째 단락은 경쟁 설명을 고려해야 하는 구체적인 방법론적 한계를 밝힙니다."},{"q":"Which conclusion would the author most likely support?","options":["A result deserves confidence whenever it seems intuitively plausible.","Any unresolved question makes the findings wholly worthless.","The results justify further inquiry, but their implications must remain appropriately qualified.","The investigation should avoid discussing alternative interpretations."],"answer":2,"why":"마지막 단락은 전면적 수용과 전면적 거부를 모두 경계합니다."}],"rp":[{"q":"Which follow-up would most directly address the issue raised in the passage?","options":["Repeat the original conclusion more strongly without new evidence.","The instructor planned randomized practice schedules with both immediate and delayed assessments.","Remove the methodological qualification from the public summary.","Replace the observations with expert opinion alone."],"answer":1,"why":"후속 연구 제안은 한계가 드러난 부분을 직접 다룹니다."},{"q":"Which wording would be the most defensible for a summary?","options":["The evidence is consistent with a promising interpretation, although competing explanations remain possible.","The initial observations definitively prove the mechanism in every context.","The remaining uncertainty means that the data contain no information.","No reader needs to know which assumptions the researchers made."],"answer":0,"why":"가능성을 인정하되 인과·일반화의 범위를 신중하게 제한해야 합니다."}],"lq":[{"q":"Which response best fits the speaker’s intention?","options":["Yes, the earlier draft is final, so no further checks are needed.","Not until the next semester; the office has stopped all current activities.","Yes, the initial application automatically overrides every later condition.","Not quite. The planned practice requires three separate sessions and a record of their timing, so we need to resolve that point before proceeding."],"answer":3,"why":"화자는 승인 여부를 재확인합니다. 단정적 동의가 아니라 남아 있는 조건을 완곡하게 알려야 합니다."}],"lc":[{"q":"Why does the student contact the coordinator?","options":["To withdraw permanently from the program.","To request an unrelated transcript of grades.","To resolve an outstanding requirement before the activity.","To replace the activity with an independent examination."],"answer":2,"why":"문의 목적은 미해결 조건과 필요한 후속 조치를 확인하는 데 있습니다."},{"q":"What was the student’s mistaken assumption?","options":["All applications had been canceled without notification.","Total study time is the only determinant of retention.","The office had already completed every required check.","The activity was scheduled for the previous semester."],"answer":1,"why":"학생은 이전 정보만으로 충분하다고 생각했고 담당자가 그 오해를 수정합니다."},{"q":"What will the student probably do next?","options":["The student should follow the schedule rather than compress the work.","Ask the class to disregard the announcement.","Submit unrelated paperwork without reading the revised rule.","Wait until the deadline has passed before responding."],"answer":0,"why":"담당자는 구체적인 다음 조치를 제시했고 학생이 이를 실행하겠다고 말합니다."}],"la":[{"q":"What is the announcement mainly about?","options":["The cancellation of all campus activities.","A new application deadline for an unrelated program.","An invitation to an off-campus social event.","A remaining procedural condition and how participants can address it."],"answer":3,"why":"핵심은 기존 활동의 조건을 재안내하고 필요한 조치를 요청하는 것입니다."},{"q":"What are participants advised to do if they cannot meet the condition?","options":["Assume previous registration overrides the rule.","Post personal records on a public social network.","Contact the coordinator to discuss an appropriate arrangement.","Enter the restricted session without permission."],"answer":2,"why":"공지에 조건을 충족하지 못하면 담당자에게 문의하도록 명시되어 있습니다."}],"lt":[{"q":"What is the principal point of the lecture?","options":["An initial pattern is sufficient proof of its own cause.","Evidence should be interpreted in light of assumptions and competing explanations.","All practical decisions should be postponed indefinitely.","A researcher should always choose the most complicated explanation."],"answer":1,"why":"강의는 관측과 그 관측에 대한 설명을 분리하고, 근거에 맞는 주장만 제시하라고 강조합니다."},{"q":"Why does the professor contrast two groups reviewing the same figures?","options":["To illustrate why testing assumptions can change the strength of an interpretation.","To show that the second group collected completely different data.","To argue that research committees should avoid independent review.","To imply that more confident reviewers are necessarily more accurate."],"answer":0,"why":"동일한 자료라도 가정에 대한 태도 때문에 결론의 신뢰성이 달라질 수 있음을 설명합니다."},{"q":"How does the lecturer use the example of the delayed one-week retention test?","options":["As proof that the entire research program has failed.","As a detail that is explicitly irrelevant to the interpretation.","As an example of a result obtained through a randomized experiment in every case.","As a concrete point at which additional scrutiny may be necessary."],"answer":3,"why":"세부사항은 논증의 취약 지점을 구체적으로 보여주는 역할입니다."},{"q":"What would the lecturer most likely advise researchers to do?","options":["Remove uncertain information from the published summary.","Treat the initial explanation as the only possible interpretation.","The instructor planned randomized practice schedules with both immediate and delayed assessments.","Replace empirical observations with the most persuasive opinion."],"answer":2,"why":"끝부분에서 제시된 후속 연구가 직접적인 개선 방향입니다."}]},"audio":{"lq":"I assumed the learning-science study group arrangements were already settled. Was I mistaken?","lc":"Ken: Hi, I have a question about the sleep and learning activity. I thought our plan was complete.\nCoordinator: Thanks for checking. The current concern is that a learner assumes the exercises can all be completed the evening before.\nKen: I see. I assumed that total study time is the only determinant of retention. So the existing materials aren't sufficient?\nCoordinator: Not quite. The planned practice requires three separate sessions and a record of their timing. We can still work with the current booking, but that condition matters.\nKen: Do I have to submit a new application, or is there something more specific I should do?\nCoordinator: You don't need to start over. Please follow the schedule rather than compress the work, and make sure the office receives the update by Wednesday at 2 p.m..\nKen: That helps. I'll explain the change to the team so no one relies on the earlier assumption.\nCoordinator: Great. Let me know if the requirement creates a practical problem; there may be an alternative arrangement.","la":"This is a notice from the learning-science study group team. Students preparing for the sleep and learning activity should review the updated instructions in their campus accounts. An important issue remains: a learner assumes the exercises can all be completed the evening before. The requirement has not been waived: the planned practice requires three separate sessions and a record of their timing. To avoid delays, please follow the schedule rather than compress the work before Wednesday at 2 p.m.. If you cannot complete the required step, contact the coordinator instead of assuming your earlier registration will be accepted. Updates will be sent through the official student portal, not through personal social media accounts.","lt":"In today's lecture on sleep and learning, consider a hypothetical research team facing a very practical decision. Two groups studied a vocabulary set for the same total time but followed different schedules. At first, the investigation appeared straightforward, since the team had a concrete pattern to examine. Students who spaced their practice over several evenings retained more words a week later than students who crammed.\n\nNow, why isn't that the end of the story? Differences in stress, previous knowledge and sleep regularity could partly influence the comparison. That matters because the observation and its explanation are not interchangeable. A useful way to think about this is to imagine two groups of investigators reviewing the same figures. One group treats the first interpretation as settled; the other asks which assumption, if changed, would produce a different conclusion. The second approach may be slower, but it is much less likely to confuse a plausible account with a demonstrated one.\n\nThe team therefore proposed a specific follow-up: The instructor planned randomized practice schedules with both immediate and delayed assessments. Notice the function of the delayed one-week retention test: it identifies a particular point at which the argument needs closer examination. The lesson is not that researchers must postpone every decision until they know everything. Rather, they should describe the limits of their evidence and explain which further result would change their minds."},"speaking":{"repeat":["The revised report is available at the research office.","The team examined the delayed one-week retention test before presenting its preliminary findings.","Although the early results seemed promising, the investigators had not eliminated every alternative explanation.","Two groups studied a vocabulary set for the same total time but followed different schedules.","Students who spaced their practice over several evenings retained more words a week later than students who crammed.","Differences in stress, previous knowledge and sleep regularity could partly influence the comparison.","Had the researchers ignored the uncertainty surrounding the delayed one-week retention test, the final recommendation might have sounded more decisive than the available evidence could justify."],"interviews":["What course or research activity have you enjoyed most at university, and why?","Have you ever had to revise an assumption after learning about sleep and learning or a related subject? Describe the experience.","Should university instructors give students more opportunities to question the conclusions of published research? Support your view with an example.","A group wants to implement a policy based on the evidence in this case. What safeguards would you recommend, and how would you address potential objections?"],"sample":"I think students should be encouraged to challenge a conclusion respectfully, even when the initial result appears convincing. The case of sleep and learning illustrates why. Students who spaced their practice over several evenings retained more words a week later than students who crammed. However, differences in stress, previous knowledge and sleep regularity could partly influence the comparison. If I were responsible for advising the group, I would ask the team to compare at least one competing explanation and identify what evidence might change its recommendation. That would not mean dismissing the existing research. Rather, it would help us communicate uncertainty clearly and make a decision that other people could evaluate. In my experience, that kind of transparency improves both the credibility of a project and cooperation among the people involved."},"writing":{"build":[{"answer":"Only after the committee reviewed the evidence did it recommend a limited pilot.","fragments":"evidence did it / Only after the / recommend a limited pilot / committee reviewed the","why":"Only after의 문두 배치에 따른 주절 도치"},{"answer":"Had the investigators ignored the competing explanation, their conclusion would have been less credible.","fragments":"have been less credible / ignored the competing explanation, / Had the investigators / their conclusion would","why":"If를 생략한 과거완료 가정법 도치"},{"answer":"The researcher whose proposal was selected explained the methodological limitations.","fragments":"whose proposal was / the methodological limitations / The researcher / selected explained","why":"whose를 사용한 소유관계 절"},{"answer":"What the panel wanted to establish was whether the outcome could be replicated.","fragments":"was whether the / wanted to establish / outcome could be replicated / What the panel","why":"What 주어절과 whether 보어절"},{"answer":"The more carefully the team documents its assumptions, the easier the findings become to evaluate.","fragments":"assumptions, the easier the / The more carefully / findings become to evaluate / the team documents its","why":"The more A, the more B 상관 비교급"}],"emailTask":"You are helping with a university activity on sleep and learning. A problem has arisen: a learner assumes the exercises can all be completed the evening before.\n\nWrite a polite email to the campus coordinator. In your message:\n• explain the situation and why it matters;\n• request a realistic remedy consistent with this rule: the planned practice requires three separate sessions and a record of their timing;\n• ask for confirmation before the announced deadline.","emailSample":"Dear Student Services Team,\n\nI am writing about our upcoming university activity on sleep and learning. We have encountered a difficulty that could affect the preparation: a learner assumes the exercises can all be completed the evening before. I understand that the procedure is intended to protect the quality and reliability of the activity, and I would like to resolve the issue before it affects other participants.\n\nAs I understand the current requirement, the planned practice requires three separate sessions and a record of their timing. Would it be possible for our team to follow the schedule rather than compress the work? If a different form or supporting record is needed, please let me know so that we can provide the correct information rather than repeating the original submission.\n\nCould you confirm the appropriate next step by Wednesday at 2 p.m.? Thank you for your assistance and for helping us keep the arrangements clear for everyone involved.\n\nKind regards,\nKen Park","discussionTask":"Professor: We are considering how universities should respond to evidence about sleep and learning. Should a university act on promising preliminary findings, or wait for stronger evidence before changing its practices?\n\nStudent A — Elena: I favor cautious early action. Students who spaced their practice over several evenings retained more words a week later than students who crammed. If an initiative can be monitored and reversed, refusing to try it may also have costs.\n\nStudent B — Marcus: I would insist on stronger evidence first. Differences in stress, previous knowledge and sleep regularity could partly influence the comparison. Otherwise, we might spend resources responding to a misleading pattern.","discussionSample":"I would take a position between Elena's willingness to act and Marcus's concern about premature conclusions. In the case of sleep and learning, students who spaced their practice over several evenings retained more words a week later than students who crammed. This is a meaningful observation, and it would be unreasonable to ignore it entirely. Nevertheless, differences in stress, previous knowledge and sleep regularity could partly influence the comparison. The critical distinction, in my view, is whether a decision can be monitored, evaluated and revised. I would therefore recommend a limited pilot that could test competing interpretations. A practical first step would follow this suggestion: The instructor planned randomized practice schedules with both immediate and delayed assessments. Participants should be told which benefits are expected, which uncertainties remain and what outcome would justify changing course. That approach responds to the promising evidence without treating a tentative interpretation as a settled fact."},"vocabulary":[{"term":"sleep regularity","meaning":"수면 규칙성","collocation":"examine sleep regularity","example":"The seminar on sleep and learning began by clarifying what sleep regularity means in this particular setting.","synonym":"","nuance":"주제 핵심 표현 · Sleep and Learning","group":"core"},{"term":"memory consolidation","meaning":"기억 공고화","collocation":"examine memory consolidation","example":"Reviewers asked for a detailed account of memory consolidation before accepting the proposed interpretation.","synonym":"","nuance":"주제 핵심 표현 · Sleep and Learning","group":"core"},{"term":"retrieval practice","meaning":"인출 연습","collocation":"examine retrieval practice","example":"The field notes addressed retrieval practice as a possible source of variation across sites.","synonym":"","nuance":"주제 핵심 표현 · Sleep and Learning","group":"core"},{"term":"circadian rhythm","meaning":"일주기 리듬","collocation":"examine circadian rhythm","example":"An explanation of circadian rhythm was included because it affected the scope of the research claim.","synonym":"","nuance":"주제 핵심 표현 · Sleep and Learning","group":"core"},{"term":"cognitive fatigue","meaning":"인지 피로","collocation":"examine cognitive fatigue","example":"The revised procedure made cognitive fatigue explicit rather than leaving it to individual judgment.","synonym":"","nuance":"주제 핵심 표현 · Sleep and Learning","group":"core"},{"term":"sleep deprivation","meaning":"수면 부족","collocation":"examine sleep deprivation","example":"Students compared the role of sleep deprivation in the initial and follow-up investigations.","synonym":"","nuance":"주제 핵심 표현 · Sleep and Learning","group":"core"},{"term":"retention interval","meaning":"기억 유지 간격","collocation":"examine retention interval","example":"The panel considered whether retention interval had been overlooked in the preliminary assessment.","synonym":"","nuance":"주제 핵심 표현 · Sleep and Learning","group":"core"},{"term":"spaced repetition","meaning":"간격 반복","collocation":"examine spaced repetition","example":"A new section on spaced repetition allowed independent readers to evaluate the evidence more carefully.","synonym":"","nuance":"주제 핵심 표현 · Sleep and Learning","group":"core"},{"term":"cognitive load","meaning":"인지 부하","collocation":"examine cognitive load","example":"The project could not proceed responsibly without an agreed definition of cognitive load.","synonym":"","nuance":"주제 핵심 표현 · Sleep and Learning","group":"core"},{"term":"study schedule","meaning":"학습 일정","collocation":"conduct study schedule","example":"The investigators distinguished study schedule from the more direct outcome reported in the summary.","synonym":"","nuance":"주제 핵심 표현 · Sleep and Learning","group":"core"},{"term":"restorative sleep","meaning":"회복 수면","collocation":"examine restorative sleep","example":"The research team reconsidered restorative sleep after discussing a limitation of the first dataset.","synonym":"","nuance":"주제 핵심 표현 · Sleep and Learning","group":"core"},{"term":"learning transfer","meaning":"학습 전이","collocation":"examine learning transfer","example":"The concluding report explained how learning transfer might influence the next stage of the inquiry.","synonym":"","nuance":"주제 핵심 표현 · Sleep and Learning","group":"core"},{"term":"notwithstanding","meaning":"~에도 불구하고","collocation":"notwithstanding the limitation","example":"Notwithstanding the limitation, the study offered an important starting point for inquiry.","synonym":"despite","nuance":"격식 있는 문어 표현","group":"advanced"},{"term":"by extension","meaning":"더 나아가 유추하면","collocation":"by extension the policy","example":"The finding affects instructors and, by extension, the students who rely on their guidance.","synonym":"consequently","nuance":"범위를 연장한 추론","group":"advanced"},{"term":"rather than","meaning":"~하기보다는","collocation":"rather than assuming success","example":"Rather than assuming success, the team compared several competing explanations.","synonym":"instead of","nuance":"기존 선택과 대조되는 대안","group":"advanced"},{"term":"give rise to","meaning":"~을 발생시키다","collocation":"give rise to uncertainty","example":"Unreported exclusions can give rise to uncertainty about the original analysis.","synonym":"produce","nuance":"원인·결과 연결에 자주 쓰임","group":"advanced"},{"term":"be consistent with","meaning":"~와 양립하다","collocation":"be consistent with several accounts","example":"The observed pattern may be consistent with several competing explanations.","synonym":"not contradict","nuance":"일치해도 유일 원인을 뜻하진 않음","group":"advanced"},{"term":"be susceptible to","meaning":"~에 취약하다","collocation":"be susceptible to bias","example":"Retrospective accounts may be susceptible to bias when details are forgotten.","synonym":"be vulnerable to","nuance":"영향을 받기 쉬움","group":"advanced"},{"term":"be transparent about","meaning":"~을 투명하게 밝히다","collocation":"be transparent about uncertainty","example":"Researchers should be transparent about uncertainty in early findings.","synonym":"disclose openly","nuance":"한계를 공개적으로 명시","group":"advanced"},{"term":"provisionally","meaning":"잠정적으로","collocation":"provisionally accept the result","example":"Reviewers agreed to provisionally accept the result until a replication study was completed.","synonym":"tentatively","nuance":"최종 확정 전 승인","group":"advanced"},{"term":"nuanced","meaning":"미묘한 차이를 반영한","collocation":"a nuanced interpretation","example":"The revised article offered a nuanced interpretation rather than declaring the intervention a complete success.","synonym":"subtle","nuance":"흑백논리가 아닌 세밀한 구분","group":"advanced"},{"term":"feasible","meaning":"실행 가능한","collocation":"a feasible alternative","example":"A smaller pilot offered a feasible alternative to a costly university-wide rollout.","synonym":"practicable","nuance":"현실 제약을 고려한 실행 가능성","group":"advanced"},{"term":"qualify","meaning":"주장에 조건·범위를 달다","collocation":"qualify a claim","example":"The author needed to qualify a claim that originally sounded universal.","synonym":"limit","nuance":"정확성을 위해 주장 강도를 제한","group":"advanced"},{"term":"undermine","meaning":"약화시키다","collocation":"undermine confidence","example":"Missing records can undermine confidence in an otherwise carefully designed study.","synonym":"weaken","nuance":"신뢰·주장·효과 등을 약화","group":"advanced"},{"term":"prioritize","meaning":"우선순위를 부여하다","collocation":"prioritize urgent needs","example":"The team chose to prioritize urgent needs without ignoring longer-term goals.","synonym":"rank first","nuance":"제약 속 우선순위 선택","group":"advanced"},{"term":"exacerbate","meaning":"악화시키다","collocation":"exacerbate existing inequalities","example":"Poorly targeted funding can exacerbate existing inequalities between districts.","synonym":"aggravate","nuance":"부정적 상황을 더욱 심각하게 함","group":"advanced"},{"term":"characterize","meaning":"특성을 규명하다","collocation":"characterize the variation","example":"The pilot was designed to characterize the variation across student cohorts.","synonym":"describe systematically","nuance":"특징을 체계적으로 밝힘","group":"advanced"},{"term":"synthesize","meaning":"종합하다","collocation":"synthesize multiple findings","example":"A review can synthesize multiple findings without treating all studies as equally reliable.","synonym":"integrate","nuance":"다른 근거를 통합해 정리","group":"advanced"},{"term":"pervasive","meaning":"광범위하게 퍼진","collocation":"a pervasive problem","example":"The audit found a pervasive problem with documentation across several units.","synonym":"widespread","nuance":"널리 스며들어 있는 상태","group":"advanced"},{"term":"methodical","meaning":"체계적인","collocation":"a methodical review","example":"A methodical review made it easier to detect inconsistent records.","synonym":"systematic","nuance":"순서와 절차가 있는 검토","group":"advanced"}],"meta":{"sourceType":"original-fictional-content","etsOfficial":false,"benchmark":"ETS 2026 sample task format","studyMinutes":120}};</script>
