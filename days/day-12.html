<script>window.TOEFL_LESSON={"day":12,"week":3,"theme":"Why Musical Tuning Systems Changed","focus":"Listening: intention, emphasis and discourse","claim":"Equal temperament is a practical compromise that supports modulation and transposition at the cost of perfectly pure intervals.","evidence":"Earlier keyboard temperaments favored some keys, while equal temperament gives all transposed intervals the same size pattern.","caveat":"Equal temperament does not create the purest possible frequency ratios, and not all ensembles use it.","response":"Compare tuning systems in their historical and instrumental contexts rather than treating one as universally best.","storageKey":"toefl110day12-diversity-v3","notice":"SCHOOL OF MUSIC — HISTORICAL KEYBOARD RECITAL\n\nThe recital on Thursday begins at 7 p.m. in the Old Chapel. A short demonstration of two historical tuning systems will take place at 6:15 p.m. in the adjacent rehearsal room. Seats for the demonstration are limited, so ticket holders must reserve that portion separately by Wednesday noon.\n\nPlease silence phones before entering. Recording the recital is prohibited, but photographs may be taken before performers come onstage. The main concert ticket does not guarantee entry to the tuning demonstration.","academicPassage":"A piano keyboard seems to divide the octave into twelve obvious steps, but this arrangement reflects a historical compromise. In many musical traditions, intervals were tuned according to ratios of vibrating frequencies. Two notes whose frequencies formed simple ratios often sounded particularly stable together. The difficulty was that a set of perfectly tuned intervals in one key could sound awkward when music moved to another key.\n\nEuropean instrument makers experimented with several solutions. Some keyboard temperaments made a limited set of keys exceptionally resonant while leaving distant keys noticeably harsh. Composers writing in those systems had to consider which tonal centers an instrument could support. As instrumental music became more mobile across keys and venues, players wanted a tuning scheme that would operate consistently in a broader range of compositions.\n\nEqual temperament divides the octave into twelve equal logarithmic intervals. The result does not preserve every mathematically pure interval: some thirds are slightly less consonant than they would be under just intonation. Its advantage is that a melody can be transposed to another key without changing the pattern of interval sizes on a fixed-pitch instrument.\n\nThe adoption of equal temperament was not a single moment when musicians abandoned all earlier practices. Tuning choices still vary among ensembles, periods, and non-Western traditions. Historical instruments reveal that a technical compromise can become a cultural convention, even while alternative practices remain valuable for different musical goals.","readingClozePassage":"A music student played the same melody on two keyboards tuned in different ways. On th_ first instr_____, several cho___ sounded espec_____ smooth i_ one ke_ but rou__ in anot___. The sec___ instrument prod____ a more consistent pattern after the melody was transposed. The instructor explained that each tuning system involved a compromise between pure frequency relationships and flexibility across keys. Students listened again and described how the change in temperament altered the character of the music. The exercise linked acoustic principles to historical performance choices.","cloze":[{"partial":"th_","answer":"the","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"instr_____","answer":"instrument","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"cho___","answer":"chords","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"espec_____","answer":"especially","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"i_","answer":"in","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"ke_","answer":"key","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"rou__","answer":"rough","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"anot___","answer":"another","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"sec___","answer":"second","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"prod____","answer":"produced","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"}],"questions":{"rd":[{"q":"What will take place before the main recital?","options":["A free recording workshop for ticket holders.","A mandatory piano exam for all audience members.","A public instrument auction in the concert hall.","A separately reserved demonstration of historical tuning systems."],"answer":3,"why":"실생활 공지의 해당 조건을 찾아 확인하세요. A separately reserved demonstration of historical tuning systems."},{"q":"What must visitors do to attend the tuning demonstration?","options":["Record the recital and submit the audio online.","Bring their own portable instrument.","Reserve a limited seat by Wednesday noon.","Buy a new ticket at the chapel after seven."],"answer":2,"why":"공지의 별도 요건 또는 예외 조항에 명시된 행동은 Reserve a limited seat by Wednesday noon.입니다."},{"q":"When does the music department permit photographs during the recital event?","options":["Only after recording the concert audio.","Before the performers come onstage.","During the full musical performance with flash.","During the special demonstration without a reservation."],"answer":1,"why":"공지의 예외 조항과 구체적인 적용 범위를 비교해야 합니다. 정답 근거: Before the performers come onstage."}],"ra":[{"q":"What overarching historical development does this account emphasize in the passage on Why Musical Tuning Systems Changed?","options":["Equal temperament is a practical compromise that supports modulation and transposition at the cost of perfectly pure intervals.","Tuning practice became identical in all musical cultures after the nineteenth century.","Equal temperament makes each interval mathematically purer than just intonation.","Every historical keyboard was always tuned in twelve equal steps."],"answer":0,"why":"중심 논지는 세부 사례에서 도출되는 가장 신중한 결론입니다. Equal temperament is a practical compromise that supports modulation and transposition at the cost of perfectly pure intervals."},{"q":"What specific observation in the why musical tuning systems changed case motivates the discussion?","options":["Tuning practice became identical in all musical cultures after the nineteenth century.","Every historical keyboard was always tuned in twelve equal steps.","Equal temperament makes each interval mathematically purer than just intonation.","Earlier keyboard temperaments favored some keys, while equal temperament gives all transposed intervals the same size pattern."],"answer":3,"why":"지문의 사례·대조 정보를 직접 확인해야 합니다. Earlier keyboard temperaments favored some keys, while equal temperament gives all transposed intervals the same size pattern."},{"q":"Which qualification prevents the evidence about historical tuning from supporting an unconditional claim?","options":["Equal temperament makes each interval mathematically purer than just intonation.","Every historical keyboard was always tuned in twelve equal steps.","Equal temperament does not create the purest possible frequency ratios, and not all ensembles use it.","Tuning practice became identical in all musical cultures after the nineteenth century."],"answer":2,"why":"한계 조건은 곧바로 틀린 결론이라는 뜻이 아니라 적용 범위를 제한합니다. Equal temperament does not create the purest possible frequency ratios, and not all ensembles use it."},{"q":"Why are the contrasting conditions introduced in the account of historical tuning?","options":["It lists the sequence of historical tuning observations without contributing to the author’s main point.","It illustrates a specific relationship involving historical tuning while establishing the boundaries of the wider argument.","The example proves that the implications of historical tuning hold in every possible location.","The example eliminates the need to compare evidence about historical tuning with alternative explanations."],"answer":1,"why":"사례는 범위가 제한된 관찰 또는 비교를 통해 주장을 구체화하고 무조건적 일반화를 피하도록 돕습니다."},{"q":"Which investigation or action would best extend the reasoning about why musical tuning systems changed?","options":["Compare tuning systems in their historical and instrumental contexts rather than treating one as universally best.","Every historical keyboard was always tuned in twelve equal steps.","Tuning practice became identical in all musical cultures after the nineteenth century.","Equal temperament makes each interval mathematically purer than just intonation."],"answer":0,"why":"추가 검증은 근거의 결함을 직접 보완하거나 대안 설명을 시험해야 합니다. Compare tuning systems in their historical and instrumental contexts rather than treating one as universally best."}],"rp":[{"q":"In the why musical tuning systems changed passage, what does “consonant” most nearly mean in context?","options":["being performed unusually softly","producing a louder note","having the shortest duration","sounding stable or harmonious"],"answer":3,"why":"단어의 문맥상 의미를 판단해야 하며 직역만으로 결정하지 않습니다. consonant ≈ sounding stable or harmonious"},{"q":"A musician wants to play a historical keyboard piece in several remote keys. Which tradeoff matters?","options":["All tuning systems preserve every pure interval across all keys.","A fixed-pitch instrument can retune itself during each chord.","Equal temperament supports transposition but changes some pure intervals.","Earlier temperaments were invented after modern equal temperament."],"answer":2,"why":"새 상황에 지문 원리를 적용하는 고난도 추론 문항입니다. Equal temperament supports transposition but changes some pure intervals."}],"lq":[{"q":"Which response best addresses the speaker’s question about historical tuning?","options":["The organ has been moved to the Old Chapel.","Not necessarily; its historical temperament makes some keys sound more strained.","Yes, every historical keyboard should sound like a modern piano.","The recital begins at seven."],"answer":1,"why":"화자는 전제를 확인하고 있으므로 직접적인 정정과 관련 조건 설명이 적절합니다."}],"lc":[{"q":"What brings the first speaker to the conversation concerning historical tuning?","options":["why the historical organ sounds different after a key change","A request for the institution to change the academic field under discussion.","An invitation to deliver a formal lecture explaining why musical tuning systems changed.","A plan to evaluate unrelated applicants for a different university program."],"answer":0,"why":"대화의 도입부에서 상대가 확인하려는 문제를 파악합니다. why the historical organ sounds different after a key change"},{"q":"What does the second speaker clarify about the issue raised in the why musical tuning systems changed dialogue?","options":["Every historical keyboard was always tuned in twelve equal steps.","Equal temperament makes each interval mathematically purer than just intonation.","Tuning practice became identical in all musical cultures after the nineteenth century.","a historical temperament intentionally favors certain keys"],"answer":3,"why":"Not necessarily, No, Exactly와 같은 정정 이후의 내용을 확인합니다. a historical temperament intentionally favors certain keys"},{"q":"What will the first speaker most likely do after the discussion about historical tuning?","options":["Withdraw permanently from all activities discussed.","Replace the entire project with an unrelated topic without consulting anyone.","keep the historical tuning for the demonstration","Disregard the advice and continue on the original assumption."],"answer":2,"why":"마지막 발화에서 다음 행동을 추론합니다. keep the historical tuning for the demonstration"}],"la":[{"q":"What practical change or instruction is listeners expected to notice in the announcement about historical tuning?","options":["A free recording workshop for ticket holders.","A separately reserved demonstration of historical tuning systems.","A public instrument auction in the concert hall.","A mandatory piano exam for all audience members."],"answer":1,"why":"공지의 장소·시간·적용 조건을 듣고 핵심 변경사항을 선택합니다. A separately reserved demonstration of historical tuning systems."},{"q":"Which additional requirement applies to listeners in the why musical tuning systems changed announcement?","options":["Reserve a limited seat by Wednesday noon.","Buy a new ticket at the chapel after seven.","Record the recital and submit the audio online.","Bring their own portable instrument."],"answer":0,"why":"보편적인 안내와 특정 조건에 해당하는 행동을 구별해야 합니다. Reserve a limited seat by Wednesday noon."}],"lt":[{"q":"Which statement best summarizes the lecturer’s explanation of why musical tuning systems changed?","options":["Every historical keyboard was always tuned in twelve equal steps.","Tuning practice became identical in all musical cultures after the nineteenth century.","Equal temperament makes each interval mathematically purer than just intonation.","Equal temperament is a practical compromise that supports modulation and transposition at the cost of perfectly pure intervals."],"answer":3,"why":"강의 중심 개념과 화자의 제한된 결론을 종합합니다. Equal temperament is a practical compromise that supports modulation and transposition at the cost of perfectly pure intervals."},{"q":"What role does the lecturer’s example of historical tuning play in the explanation?","options":["Equal temperament makes each interval mathematically purer than just intonation.","Tuning practice became identical in all musical cultures after the nineteenth century.","Earlier keyboard temperaments favored some keys, while equal temperament gives all transposed intervals the same size pattern.","Every historical keyboard was always tuned in twelve equal steps."],"answer":2,"why":"강의 사례는 개념을 구체화하는 관측 자료 또는 비교입니다. Earlier keyboard temperaments favored some keys, while equal temperament gives all transposed intervals the same size pattern."},{"q":"What caution does the lecturer introduce after describing evidence related to historical tuning?","options":["Every historical keyboard was always tuned in twelve equal steps.","Equal temperament does not create the purest possible frequency ratios, and not all ensembles use it.","Equal temperament makes each interval mathematically purer than just intonation.","Tuning practice became identical in all musical cultures after the nineteenth century."],"answer":1,"why":"화자가 However, but 등으로 도입하는 예외를 듣는 것이 핵심입니다. Equal temperament does not create the purest possible frequency ratios, and not all ensembles use it."},{"q":"How would the lecturer most likely advise someone evaluating historical tuning in a new setting?","options":["Compare tuning systems in their historical and instrumental contexts rather than treating one as universally best.","Tuning practice became identical in all musical cultures after the nineteenth century.","Equal temperament makes each interval mathematically purer than just intonation.","Every historical keyboard was always tuned in twelve equal steps."],"answer":0,"why":"강의의 마무리에서 제안하는 연구·실행 원칙을 응용합니다. Compare tuning systems in their historical and instrumental contexts rather than treating one as universally best."}]},"audio":{"lq":"Is the organ out of tune because this passage sounds rough in one key?","lc":"Student: I'm practicing a piece on the historic organ, but one key sounds unusually rough. Did I tune the instrument incorrectly?\nInstructor: Not necessarily. It uses a temperament that favors some keys more than others.\nStudent: But on the modern piano, the same passage sounds consistent after transposition.\nInstructor: Exactly. The modern piano is generally tuned in equal temperament. It sacrifices some pure intervals so that distant keys become more usable.\nStudent: Could I retune the organ before the recital?\nInstructor: Please don't. Its historical tuning is part of the demonstration. Try the passage in the intended key and listen to the contrast.\nStudent: I see. The difference itself is what we want the audience to hear.","la":"Good evening, and welcome to the School of Music's historical keyboard recital. Before the main performance begins at seven, we will offer a short tuning demonstration in the adjacent rehearsal room at six fifteen. This demonstration requires a separate reservation because seating is limited. Please do not record the recital. We invite you to take photographs before the musicians enter and to silence all electronic devices once the performance starts.","lt":"Why would a historical keyboard sound beautiful in one key and strained in another? The explanation involves how its intervals were tuned. Simple frequency ratios produce particularly stable combinations, but maintaining those relationships across many keys creates a problem for fixed-pitch instruments.\n\nEarlier temperaments often favored certain keys. That wasn't a defect so much as a design choice suited to particular music. Equal temperament took another approach: it divided the octave into twelve equal steps. Each interval is a compromise, but the pattern remains the same when a piece is moved to a different key.\n\nNotice that this was not a sudden invention that made all older tuning systems obsolete. String ensembles can still adjust notes to fit the harmony, and historical performers may deliberately select earlier temperaments.\n\nThe larger point is that a widely accepted standard can solve one practical problem while giving up something valuable in another context."},"speaking":{"repeat":["Welcome to the workshop on historical tuning.","The recital on Thursday begins at 7 p.","The instructor asked us to compare the evidence about historical tuning before drawing conclusions.","Earlier keyboard temperaments favored some keys, while equal temperament gives all transposed intervals the same size pattern.","Equal temperament does not create the purest possible frequency ratios, and not all ensembles use it.","Compare tuning systems in their historical and instrumental contexts rather than treating one as universally best.","Although it might initially seem that every historical keyboard was always tuned in twelve equal steps, the evidence instead suggests that equal temperament is a practical compromise that supports modulation and transposition at the cost of perfectly pure intervals."],"interviews":["What first interested you in music history / acoustics, and how would you explain that interest to a friend?","Tell me about a time when a practical decision involving historical tuning was more complicated than you expected.","Do you think universities should give more attention to historical tuning in introductory courses? Explain your reasoning.","Imagine a classmate disagrees with your interpretation of historical tuning. How would you respond respectfully and precisely?"],"sample":"I would support teaching the history of musical tuning because it changes how we listen. A modern piano sounds consistent in different keys, so I once assumed that the twelve-step division of the octave was simply natural. I later discovered that equal temperament is a compromise: it supports transposition but alters some mathematically pure intervals. Hearing a historical keyboard in different keys would help students understand that technology shapes musical possibilities. I do not think every performer needs to become an acoustics expert. Still, comparing the sound of two tuning systems could make a familiar piece of music seem entirely new."},"writing":{"build":[{"fragments":"session has been rescheduled / whether the historical tuning / Could you tell me","answer":"Could you tell me whether the historical tuning session has been rescheduled?","why":"간접 의문문 어순의 문장 구조와 주어-동사 관계를 확인하세요."},{"fragments":"The student who reviewed / the just intonation records / noticed an important discrepancy","answer":"The student who reviewed the just intonation records noticed an important discrepancy.","why":"관계절로 설명 추가의 문장 구조와 주어-동사 관계를 확인하세요."},{"fragments":"it might have reached a / different conclusion / If the team had checked / the frequency ratio evidence earlier,","answer":"If the team had checked the frequency ratio evidence earlier, it might have reached a different conclusion.","why":"조건절로 가능성 제시의 문장 구조와 주어-동사 관계를 확인하세요."},{"fragments":"examined did the committee approve / to historical tuning had been / the report / Only after the records related","answer":"Only after the records related to historical tuning had been examined did the committee approve the report.","why":"Only after 도치의 문장 구조와 주어-동사 관계를 확인하세요."},{"fragments":"of its limitations / requires not only reliable evidence / A project involving historical tuning / but also a clear account","answer":"A project involving historical tuning requires not only reliable evidence but also a clear account of its limitations.","why":"Not only A but also B 병렬의 문장 구조와 주어-동사 관계를 확인하세요."}],"emailTask":"You booked a ticket for a historical keyboard recital but missed the separate sign-up for the tuning demonstration. Email the music department to ask if a cancellation list is available, explain why the demonstration matters to your coursework, and request an alternative recording or handout if seats are full.","emailSample":"Dear Music Department,\n\nI have a ticket for Thursday's historical keyboard recital, but I only recently realized that the earlier tuning demonstration requires a separate reservation. The demonstration is especially relevant to my coursework because I am comparing historical temperaments with modern equal temperament.\n\nAre there any seats available through a cancellation list? If the session is full, could you recommend a handout, approved recording, or another opportunity to hear the instruments in different keys? I understand that recording the main recital is prohibited and will respect that rule.\n\nThank you for helping me explore this aspect of music history.\n\nSincerely,\nAlex","discussionTask":"Professor: Should music schools teach historical tuning systems alongside modern equal temperament?\n\nStudent A — Emily: Yes, students gain insight into how technology and musical conventions changed together.\n\nStudent B — Daniel: Modern tuning is sufficient for most performances, so extensive historical study may have limited practical value.","discussionSample":"Music students benefit from studying historical tuning systems because a modern keyboard reflects a series of practical decisions rather than a universal law of sound. Equal temperament makes transposition easier on fixed-pitch instruments, but it slightly alters intervals that could be tuned more purely in other systems. Hearing those differences helps students understand why composers once chose certain keys and why historical performances can sound distinctive. I agree that contemporary performance skills should remain central to the curriculum. A short comparative course or demonstration would be enough for most students; specialists could study the mathematics in greater depth. The objective is not to replace modern tuning but to recognize the musical consequences of the compromise it represents."},"vocabulary":[{"term":"equal temperament","meaning":"평균율","collocation":"apply equal temperament","example":"The final recommendation urged musicians to apply equal temperament before proceeding.","synonym":"twelve-equal-step tuning","nuance":"","group":"core"},{"term":"just intonation","meaning":"순정률","collocation":"compare just intonation","example":"In the first trial, musicians were not yet able to compare just intonation consistently.","synonym":"frequency-ratio-based tuning","nuance":"","group":"core"},{"term":"frequency ratio","meaning":"주파수 비율","collocation":"calculate a frequency ratio","example":"The absence of reliable records made it difficult for musicians to calculate a frequency ratio.","synonym":"proportion between frequencies","nuance":"","group":"core"},{"term":"consonant interval","meaning":"협화 음정","collocation":"produce a consonant interval","example":"Instrument makers tried to produce a consonant interval, even when a tuning system favored some keys over others.","synonym":"pleasant-sounding interval","nuance":"","group":"core"},{"term":"tonal center","meaning":"조성 중심","collocation":"establish a tonal center","example":"Students observed how musicians attempted to establish a tonal center despite incomplete information.","synonym":"home key","nuance":"","group":"core"},{"term":"keyboard temperament","meaning":"건반 악기 조율 체계","collocation":"select a keyboard temperament","example":"A meaningful comparison would require musicians to select a keyboard temperament independently.","synonym":"system for keyboard pitches","nuance":"","group":"core"},{"term":"chromatic modulation","meaning":"반음계적 전조","collocation":"perform chromatic modulation","example":"A cautious interpretation allowed musicians to perform chromatic modulation while acknowledging uncertainty.","synonym":"changing key by semitone","nuance":"","group":"core"},{"term":"fixed-pitch instrument","meaning":"고정음고 악기","collocation":"tune a fixed-pitch instrument","example":"Several independent observations led musicians to tune a fixed-pitch instrument before publication.","synonym":"instrument with fixed notes","nuance":"","group":"core"},{"term":"octave division","meaning":"옥타브 분할","collocation":"change octave division","example":"A request from the university encouraged musicians to change octave division more transparently.","synonym":"partition of one octave","nuance":"","group":"core"},{"term":"pure third","meaning":"순수한 3도 음정","collocation":"tune a pure third","example":"Rather than generalizing from one case, musicians sought to tune a pure third in several settings.","synonym":"unadjusted major third","nuance":"","group":"core"},{"term":"historical performance","meaning":"역사적 연주","collocation":"research historical performance","example":"The investigation would be less credible if musicians neglected to research historical performance.","synonym":"historically informed playing","nuance":"","group":"core"},{"term":"transposed melody","meaning":"이조된 선율","collocation":"play a transposed melody","example":"The procedures were revised so that musicians could play a transposed melody consistently.","synonym":"melody in a different key","nuance":"","group":"core"},{"term":"resonance pattern","meaning":"공명 양상","collocation":"compare resonance patterns","example":"Before finalizing the interpretation, musicians decided to compare resonance patterns.","synonym":"pattern of sound reinforcement","nuance":"","group":"core"},{"term":"musical convention","meaning":"음악 관습","collocation":"adopt a musical convention","example":"The students challenged musicians to adopt a musical convention without overlooking contrary evidence.","synonym":"accepted musical practice","nuance":"","group":"core"},{"term":"temperament compromise","meaning":"조율상 타협","collocation":"understand a temperament compromise","example":"The instructor proposed that musicians should first understand a temperament compromise and then compare outcomes.","synonym":"tradeoff in tuning","nuance":"","group":"core"},{"term":"acoustic interval","meaning":"음향적 음정","collocation":"compare acoustic intervals","example":"When the initial explanation failed, musicians returned to the data to compare acoustic intervals.","synonym":"pitch distance determined by acoustics","nuance":"","group":"advanced"},{"term":"frequency spectrum","meaning":"주파수 스펙트럼","collocation":"analyze a frequency spectrum","example":"The group discovered that it was possible to analyze a frequency spectrum without assuming a single cause.","synonym":"distribution of frequencies","nuance":"","group":"advanced"},{"term":"harmonic series","meaning":"배음열","collocation":"illustrate a harmonic series","example":"A second research team challenged musicians to illustrate a harmonic series with different assumptions.","synonym":"series of overtones","nuance":"","group":"advanced"},{"term":"tonal flexibility","meaning":"조성 전환의 유연성","collocation":"increase tonal flexibility","example":"The revised protocol gave musicians a systematic way to increase tonal flexibility.","synonym":"freedom to change keys","nuance":"","group":"advanced"},{"term":"intonation adjustment","meaning":"음정 조정","collocation":"make an intonation adjustment","example":"To address a practical difficulty, musicians chose to make an intonation adjustment under controlled conditions.","synonym":"fine-tuning of pitch","nuance":"","group":"advanced"},{"term":"historical instrument","meaning":"역사적 악기","collocation":"restore a historical instrument","example":"It proved especially important for musicians to restore a historical instrument during the second assessment.","synonym":"instrument from an earlier era","nuance":"","group":"advanced"},{"term":"sonic contrast","meaning":"청각적 대비","collocation":"demonstrate sonic contrast","example":"In response to the reviewers, musicians agreed to demonstrate sonic contrast using an explicit procedure.","synonym":"difference in perceived sound","nuance":"","group":"advanced"},{"term":"technical compromise","meaning":"기술적 타협","collocation":"accept a technical compromise","example":"A single unexpected result persuaded musicians to accept a technical compromise more carefully.","synonym":"engineering compromise","nuance":"","group":"advanced"},{"term":"compositional practice","meaning":"작곡 관행","collocation":"study compositional practice","example":"When the instruments returned inconsistent readings, musicians attempted to study compositional practice.","synonym":"practice of composing","nuance":"","group":"advanced"},{"term":"musical transposition","meaning":"음악의 이조","collocation":"practice musical transposition","example":"The supervising committee asked musicians to practice musical transposition and explain the criteria.","synonym":"moving music to another key","nuance":"","group":"advanced"},{"term":"instrument tuning","meaning":"악기 조율","collocation":"refine instrument tuning","example":"Only after a careful review could musicians begin to refine instrument tuning.","synonym":"adjustment of an instrument","nuance":"","group":"advanced"},{"term":"logarithmic scale","meaning":"로그 척도","collocation":"use a logarithmic scale","example":"Under the new conditions, musicians were asked to use a logarithmic scale at an earlier stage.","synonym":"scale based on logarithms","nuance":"","group":"advanced"},{"term":"pitch stability","meaning":"음고 안정성","collocation":"maintain pitch stability","example":"The long-term monitoring plan required musicians to maintain pitch stability at regular intervals.","synonym":"consistent pitch","nuance":"","group":"advanced"},{"term":"performance tradition","meaning":"연주 전통","collocation":"preserve a performance tradition","example":"At the discussion session, musicians explained their decision to preserve a performance tradition.","synonym":"inherited manner of playing","nuance":"","group":"advanced"},{"term":"auditory perception","meaning":"청각 지각","collocation":"investigate auditory perception","example":"The available resources enabled musicians to investigate auditory perception during the pilot study.","synonym":"perception of sound","nuance":"","group":"advanced"}],"meta":{"sourceType":"original practice content","etsOfficial":false,"benchmark":"TOEFL iBT January 2026 task-type descriptions / ETS sample 1","studyMinutes":120,"revision":"2026-11-23-diversity-v3","discipline":"Music History / Acoustics","genre":"chronology"}};</script>
