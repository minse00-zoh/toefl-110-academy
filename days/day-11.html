<script>window.TOEFL_LESSON={"day":11,"week":3,"theme":"Code-Switching and Pragmatic Meaning","focus":"Listening: intention, emphasis and discourse","claim":"Code-switching can perform different social and pragmatic functions depending on who is speaking and why.","evidence":"A student's language change while quoting her grandmother preserved a recognizable voice rather than signaling a lexical gap.","caveat":"Listeners can interpret the same switch differently, including as exclusion when they lack the second language.","response":"Analyze conversational context and speakers’ reported intentions before assigning a function.","storageKey":"toefl110day11-diversity-v3","notice":"LANGUAGE CENTER — CONVERSATION PARTNER PROGRAM\n\nRegistration for the bilingual conversation-partner program closes Wednesday at 5 p.m. Participants may select preferred languages and meeting formats on the portal. The orientation will be held online on Friday at 4 p.m.; the access link will be emailed to approved applicants.\n\nStudents may attend up to two sessions as observers before choosing a partner. However, observers cannot receive program credit until they complete the registration and attend orientation. Requests for sign-language interpretation should be submitted by Tuesday noon.","academicPassage":"People who speak more than one language do not always keep those languages separate. During a conversation they may switch languages within a sentence, between turns, or when addressing a new participant. Such code-switching was once widely treated in schools as evidence of confusion. Contemporary linguistic research instead examines what speakers accomplish through the choice.\n\nA bilingual student might begin an explanation in English, switch to Spanish when quoting a relative, then return to English for the rest of the discussion. The switch can signal a change in audience, mark a quotation, or express a relationship that would be less immediate in translation. It does not necessarily indicate that the speaker lacks vocabulary in the first language.\n\nNevertheless, the meaning of a switch depends on context. Some listeners perceive it as friendly solidarity; others may see it as excluding people who cannot understand the second language. In a formal interview, a change in language may follow institutional expectations rather than personal preference. Researchers therefore examine recordings together with the speakers' own accounts of what they intended.\n\nThe most important analytical distinction is between a visible linguistic pattern and its social interpretation. The same two words can carry different pragmatic effects depending on the participants, setting and preceding conversation. Code-switching is not inherently inclusive or exclusive; it is a communicative resource whose function must be inferred from interaction.","readingClozePassage":"In a bilingual conversation class, a student repeated a phrase exactly as her grandmother had said it. The phr___ was i_ Spanish, alth____ the re__ of th_ story wa_ in Engl___. A class____ initially assu___ she ha_ forgotten an English equivalent. When asked, the speaker explained that the original words conveyed the relative's personality more vividly. The discussion helped the class see why language switching can carry meaning beyond vocabulary choice. Its effect depends on the audience, the setting, and the speaker's intention.","cloze":[{"partial":"phr___","answer":"phrase","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"i_","answer":"in","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"alth____","answer":"although","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"re__","answer":"rest","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"th_","answer":"the","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"wa_","answer":"was","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"Engl___","answer":"english","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"class____","answer":"classmate","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"assu___","answer":"assumed","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"ha_","answer":"had","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"}],"questions":{"rd":[{"q":"How will approved students receive the orientation access link?","options":["From their conversation partner during the first session.","By collecting a paper ticket at the library desk.","By email after the application is approved.","Through a public social-media post without registration."],"answer":2,"why":"실생활 공지의 해당 조건을 찾아 확인하세요. By email after the application is approved."},{"q":"What is required before observers can earn participation credit?","options":["Observing one session without submitting any form.","Completing registration and the online orientation.","Selecting three partners rather than one.","Submitting the application after the deadline."],"answer":1,"why":"공지의 별도 요건 또는 예외 조항에 명시된 행동은 Completing registration and the online orientation.입니다."},{"q":"How long may someone observe conversation sessions before choosing a partner?","options":["Up to two sessions.","An unlimited number of credit-bearing sessions.","Exactly six sessions without any registration.","Only the orientation session, with no observation afterward."],"answer":0,"why":"공지의 예외 조항과 구체적인 적용 범위를 비교해야 합니다. 정답 근거: Up to two sessions."}],"ra":[{"q":"What lesson does the specific case lead the author to draw in the passage on Code-Switching and Pragmatic Meaning?","options":["Switching languages necessarily indicates a lack of proficiency.","A given code-switch always expresses friendship regardless of audience.","All bilingual speakers switch languages only when they are quoting relatives.","Code-switching can perform different social and pragmatic functions depending on who is speaking and why."],"answer":3,"why":"중심 논지는 세부 사례에서 도출되는 가장 신중한 결론입니다. Code-switching can perform different social and pragmatic functions depending on who is speaking and why."},{"q":"What specific observation in the code-switching an pragmatic meaning?","options":["Switching languages necessarily indicates a lack of proficiency.","A given code-switch always expresses friendship regardless of audience.","All bilingual speakers switch languages only when they are quoting relatives.","Analyze conversational context and speakers’ reported intentions before assigning a function."],"answer":3,"why":"추가 검증은 근거의 결함을 직접 보완하거나 대안 설명을 시험해야 합니다. Analyze conversational context and speakers’ reported intentions before assigning a function."}],"rp":[{"q":"In the code-switching and pragmatic meaning passage, what does “inherently” most nearly mean in context?","options":["according to official regulations","without any interruption","by its very nature","only in a particular setting"],"answer":2,"why":"단어의 문맥상 의미를 판단해야 하며 직역만으로 결정하지 않습니다. inherently ≈ by its very nature"},{"q":"A bilingual speaker changes languages while impersonating a relative. What should an observer ask?","options":["Why the speaker lacks enough words in both languages.","Whether the switch marks the quoted voice or another social function.","Whether every listener necessarily feels excluded.","Which language is objectively better for storytelling."],"answer":1,"why":"새 상황에 지문 원리를 적용하는 고난도 추론 문항입니다. Whether the switch marks the quoted voice or another social function."}],"lq":[{"q":"Which response best addresses the speaker’s question about bilingual conversation?","options":["No. First consider whether the switch serves a deliberate narrative purpose.","Each participant receives a partner number.","The orientation takes place Friday.","Yes, because code-switching is necessarily a grammar error."],"answer":0,"why":"화자는 전제를 확인하고 있으므로 직접적인 정정과 관련 조건 설명이 적절합니다."}],"lc":[{"q":"What brings the first speaker to the conversation concerning bilingual conversation?","options":["A plan to evaluate unrelated applicants for a different university program.","A request for the institution to change the academic field under discussion.","An invitation to deliver a formal lecture explaining code-switching and pragmatic meaning.","whether code-switching should automatically be corrected"],"answer":3,"why":"대화의 도입부에서 상대가 확인하려는 문제를 파악합니다. whether code-switching should automatically be corrected"},{"q":"What does the second speaker clarify about the issue raised in the code-switching and pragmatic meaning dialogue?","options":["All bilingual speakers switch languages only when they are quoting relatives.","A given code-switch always expresses friendship regardless of audience.","a switch can preserve the quoted speaker’s voice","Switching languages necessarily indicates a lack of proficiency."],"answer":2,"why":"Not necessarily, No, Exactly와 같은 정정 이후의 내용을 확인합니다. a switch can preserve the quoted speaker’s voice"},{"q":"What will the first speaker most likely do after the discussion about bilingual conversation?","options":["Disregard the advice and continue on the original assumption.","ask about intention and request translation where needed","Withdraw permanently from all activities discussed.","Replace the entire project with an unrelated topic without consulting anyone."],"answer":1,"why":"마지막 발화에서 다음 행동을 추론합니다. ask about intention and request translation where needed"}],"la":[{"q":"What practical change or instruction is listeners expected to notice in the announcement about bilingual conversation?","options":["By email after the application is approved.","From their conversation partner during the first session.","Through a public social-media post without registration.","By collecting a paper ticket at the library desk."],"answer":0,"why":"공지의 장소·시간·적용 조건을 듣고 핵심 변경사항을 선택합니다. By email after the application is approved."},{"q":"Which additional requirement applies to listeners in the code-switching and pragmatic meaning announcement?","options":["Submitting the application after the deadline.","Observing one session without submitting any form.","Selecting three partners rather than one.","Completing registration and the online orientation."],"answer":3,"why":"보편적인 안내와 특정 조건에 해당하는 행동을 구별해야 합니다. Completing registration and the online orientation."}],"lt":[{"q":"Which statement best summarizes the lecturer’s explanation of code-switching and pragmatic meaning?","options":["A given code-switch always expresses friendship regardless of audience.","All bilingual speakers switch languages only when they are quoting relatives.","Code-switching can perform different social and pragmatic functions depending on who is speaking and why.","Switching languages necessarily indicates a lack of proficiency."],"answer":2,"why":"강의 중심 개념과 화자의 제한된 결론을 종합합니다. Code-switching can perform different social and pragmatic functions depending on who is speaking and why."},{"q":"What role does the lecturer’s example of bilingual conversation play in the explanation?","options":["A given code-switch always expresses friendship regardless of audience.","A student's language change while quoting her grandmother preserved a recognizable voice rather than signaling a lexical gap.","All bilingual speakers switch languages only when they are quoting relatives.","Switching languages necessarily indicates a lack of proficiency."],"answer":1,"why":"강의 사례는 개념을 구체화하는 관측 자료 또는 비교입니다. A student's language change while quoting her grandmother preserved a recognizable voice rather than signaling a lexical gap."},{"q":"What caution does the lecturer introduce after describing evidence related to bilingual conversation?","options":["Listeners can interpret the same switch differently, including as exclusion when they lack the second language.","Switching languages necessarily indicates a lack of proficiency.","All bilingual speakers switch languages only when they are quoting relatives.","A given code-switch always expresses friendship regardless of audience."],"answer":0,"why":"화자가 However, but 등으로 도입하는 예외를 듣는 것이 핵심입니다. Listeners can interpret the same switch differently, including as exclusion when they lack the second language."},{"q":"How would the lecturer most likely advise someone evaluating bilingual conversation in a new setting?","options":["Switching languages necessarily indicates a lack of proficiency.","All bilingual speakers switch languages only when they are quoting relatives.","A given code-switch always expresses friendship regardless of audience.","Analyze conversational context and speakers’ reported intentions before assigning a function."],"answer":3,"why":"강의의 마무리에서 제안하는 연구·실행 원칙을 응용합니다. Analyze conversational context and speakers’ reported intentions before assigning a function."}]},"audio":{"lq":"If my partner switches languages when quoting her grandmother, should I always correct it?","lc":"Student: My conversation partner sometimes switches to another language halfway through a story. Should I correct her?\nTutor: Not automatically. Do you know why she switches?\nStudent: She usually does it when quoting her grandparents. I thought it meant she couldn't find the English words.\nTutor: It may be a way of preserving the original voice of the quote. You could ask what effect she's trying to create.\nStudent: What if I don't understand the quoted phrase?\nTutor: Then ask for a translation. Communication is collaborative; the switch doesn't have to exclude anyone.\nStudent: So I should focus on the situation rather than treating every switch as a mistake.\nTutor: Exactly. Context is part of the meaning.","la":"Welcome to the language center's conversation-partner program. The orientation will be held online Friday at four o'clock. Registered participants will receive the joining link by email. Students may observe up to two sessions without choosing a partner, but observers cannot claim participation credit until they finish registration and orientation. Interpretation requests must be received by Tuesday at noon so that arrangements can be made.","lt":"Here's a question for linguists: when a bilingual speaker shifts languages in the middle of a conversation, what does the shift mean? It might show who they are addressing, or it might reproduce a quotation as it originally sounded.\n\nOne student switched from English into Spanish while telling a story about her grandmother. A classmate assumed she simply lacked an English expression. But when asked, the speaker explained that she wanted the grandmother's voice to remain recognizable. The switch served a narrative purpose.\n\nNow imagine the same phrase in a meeting where only one other person understands Spanish. Some listeners could feel left out. The meaning isn't contained in the words alone; it also depends on the relationship between speakers and the activity they are engaged in.\n\nWe therefore analyze recorded interactions and ask participants about their intentions instead of deciding in advance whether code-switching is a linguistic failure or a social success."},"speaking":{"repeat":["Welcome to the workshop on bilingual conversation.","Registration for the bilingual conversation-partner program closes Wednesday at 5 p.","The instructor asked us to compare the evidence about bilingual conversation before drawing conclusions.","A student's language change while quoting her grandmother preserved a recognizable voice rather than signaling a lexical gap.","Listeners can interpret the same switch differently, including as exclusion when they lack the second language.","Analyze conversational context and speakers’ reported intentions before assigning a function.","Although it might initially seem that switching languages necessarily indicates a lack of proficiency, the evidence instead suggests that code-switching can perform different social and pragmatic functions depending on who is speaking and why."],"interviews":["What first interested you in linguistics / pragmatics, and how would you explain that interest to a friend?","Tell me about a time when a practical decision involving bilingual conversation was more complicated than you expected.","Do you think universities should give more attention to bilingual conversation in introductory courses? Explain your reasoning.","Imagine a classmate disagrees with your interpretation of bilingual conversation. How would you respond respectfully and precisely?"],"sample":"I used to think that switching languages during a conversation showed that someone had forgotten a word. Then a bilingual friend explained that she sometimes used her family language when quoting her grandparents because the original expression captured their personality. That made me realize how much meaning depends on context. I would not insist that speakers avoid code-switching in every situation. However, I would encourage a short explanation when listeners do not understand the second language. The aim is to preserve authentic expression while keeping the conversation inclusive. That strikes me as more respectful than treating every language switch as an error."},"writing":{"build":[{"fragments":"Could you tell me / whether the bilingual conversation / session has been rescheduled","answer":"Could you tell me whether the bilingual conversation session has been rescheduled?","why":"간접 의문문 어순의 문장 구조와 주어-동사 관계를 확인하세요."},{"fragments":"noticed an important discrepancy / The student who reviewed / the pragmatic meaning records","answer":"The student who reviewed the pragmatic meaning records noticed an important discrepancy.","why":"관계절로 설명 추가의 문장 구조와 주어-동사 관계를 확인하세요."},{"fragments":"different conclusion / it might have reached a / If the team had checked / the discourse context evidence earlier,","answer":"If the team had checked the discourse context evidence earlier, it might have reached a different conclusion.","why":"조건절로 가능성 제시의 문장 구조와 주어-동사 관계를 확인하세요."},{"fragments":"to bilingual conversation had been / the report / Only after the records related / examined did the committee approve","answer":"Only after the records related to bilingual conversation had been examined did the committee approve the report.","why":"Only after 도치의 문장 구조와 주어-동사 관계를 확인하세요."},{"fragments":"of its limitations / but also a clear account / requires not only reliable evidence / A project involving bilingual conversation","answer":"A project involving bilingual conversation requires not only reliable evidence but also a clear account of its limitations.","why":"Not only A but also B 병렬의 문장 구조와 주어-동사 관계를 확인하세요."}],"emailTask":"You enrolled in the conversation-partner program but did not receive the orientation link. Email the language center, give your registration date, ask whether your application is approved, and request the access details before Friday.","emailSample":"Dear Language Center Team,\n\nI registered for the bilingual conversation-partner program on Monday, but I have not received the access link for Friday's online orientation. I am concerned that my application may still be awaiting approval.\n\nCould you check my registration status and let me know whether any information is missing? If my application has been accepted, I would appreciate receiving the joining instructions before four o'clock on Friday. I am particularly interested in the program's guidance on supporting partners who use different languages during the same conversation.\n\nThank you for your assistance.\n\nKind regards,\nAlex","discussionTask":"Professor: Should bilingual students be encouraged to use multiple languages during classroom discussion?\n\nStudent A — Emily: Yes, multilingual expression can help students convey identity and engage with complex ideas.\n\nStudent B — Daniel: Sometimes, but instructors must ensure that contributions remain accessible to participants who speak only one language.","discussionSample":"I would encourage multilingual expression in classroom discussions, but only within a framework that keeps everyone able to participate. A student switching languages while quoting a family member may be preserving an important element of the story, not demonstrating poor proficiency. Banning the switch could remove that nuance. On the other hand, listeners who do not understand the quoted phrase may feel excluded. An instructor could invite the speaker to give a brief explanation or translation after the quotation. This would make linguistic diversity a resource for learning rather than an obstacle to collective discussion. The purpose of a classroom conversation is not to enforce a single language choice in every situation; it is to ensure that ideas can be shared and examined."},"vocabulary":[{"term":"code-switching","meaning":"언어 전환","collocation":"analyze code-switching","example":"The procedures were revised so that linguists could analyze code-switching consistently.","synonym":"alternation between languages","nuance":"","group":"core"},{"term":"pragmatic meaning","meaning":"화용적 의미","collocation":"interpret pragmatic meaning","example":"Before finalizing the interpretation, linguists decided to interpret pragmatic meaning.","synonym":"meaning shaped by use","nuance":"","group":"core"},{"term":"discourse context","meaning":"담화 맥락","collocation":"reconstruct discourse context","example":"The students challenged linguists to reconstruct discourse context without overlooking contrary evidence.","synonym":"surrounding conversation","nuance":"","group":"core"},{"term":"quoted speech","meaning":"인용된 발화","collocation":"preserve quoted speech","example":"The instructor proposed that linguists should first preserve quoted speech and then compare outcomes.","synonym":"reproduction of another's words","nuance":"","group":"core"},{"term":"language repertoire","meaning":"언어 사용 자원","collocation":"draw on a language repertoire","example":"When the initial explanation failed, linguists returned to the data to draw on a language repertoire.","synonym":"available languages","nuance":"","group":"core"},{"term":"communicative function","meaning":"의사소통 기능","collocation":"identify a communicative function","example":"The group discovered that it was possible to identify a communicative function without assuming a single cause.","synonym":"purpose of a message","nuance":"","group":"core"},{"term":"solidarity marker","meaning":"유대감 표시","collocation":"recognize a solidarity marker","example":"A second research team challenged linguists to recognize a solidarity marker with different assumptions.","synonym":"signal of group belonging","nuance":"","group":"core"},{"term":"audience design","meaning":"청중 고려 언어 선택","collocation":"examine audience design","example":"The revised protocol gave linguists a systematic way to examine audience design.","synonym":"adjusting speech to listeners","nuance":"","group":"core"},{"term":"interactional cue","meaning":"상호작용 단서","collocation":"respond to an interactional cue","example":"To address a practical difficulty, linguists chose to respond to an interactional cue under controlled conditions.","synonym":"signal within an interaction","nuance":"","group":"core"},{"term":"lexical gap","meaning":"어휘 공백","collocation":"infer a lexical gap","example":"It proved especially important for linguists to infer a lexical gap during the second assessment.","synonym":"unavailable exact vocabulary item","nuance":"","group":"core"},{"term":"bilingual identity","meaning":"이중언어 정체성","collocation":"express bilingual identity","example":"In response to the reviewers, linguists agreed to express bilingual identity using an explicit procedure.","synonym":"identity across languages","nuance":"","group":"core"},{"term":"contextual interpretation","meaning":"맥락적 해석","collocation":"offer a contextual interpretation","example":"A single unexpected result persuaded linguists to offer a contextual interpretation more carefully.","synonym":"meaning dependent on situation","nuance":"","group":"core"},{"term":"turn-taking","meaning":"발언 순서 교대","collocation":"manage turn-taking","example":"When the instruments returned inconsistent readings, linguists attempted to manage turn-taking.","synonym":"allocation of speaking turns","nuanc 의미","collocation":"explain implicit meaning","example":"Because the evidence was incomplete, linguists agreed to explain implicit meaning again before deciding.","synonym":"unstated meaning","nuance":"","group":"advanced"},{"term":"interactional alignment","meaning":"상호작용상의 조율","collocation":"build interactional alignment","example":"The report identified an overlooked opportunity for linguists to build interactional alignment.","synonym":"mutual adjustment in discussion","nuance":"","group":"advanced"},{"term":"language alternation","meaning":"언어 교대","collocation":"document language alternation","example":"After examining competing accounts, linguists were prepared to document language alternation.","synonym":"switching between languages","nuance":"","group":"advanced"},{"term":"metalinguistic awareness","meaning":"언어에 대한 메타인지","collocation":"develop metalinguistic awareness","example":"One limitation of the project was that linguists could not yet develop metalinguistic awareness reliably.","synonym":"awareness of language itself","nuance":"","group":"advanced"},{"term":"narrative stance","meaning":"서술자의 태도","collocation":"signal a narrative stance","example":"A later review prompted linguists to signal a narrative stance, rather than accept the initial explanation.","synonym":"perspective in a narrative","nuance":"","group":"advanced"},{"term":"communicative breakdown","meaning":"의사소통 실패","collocation":"prevent communicative breakdown","example":"Over a semester of fieldwork, linguists learned how to prevent communicative breakdown.","synonym":"failure to communicate","nuance":"","group":"advanced"},{"term":"semantic nuance","meaning":"의미상의 미묘한 차이","collocation":"preserve semantic nuance","example":"In their final presentation, linguists described what it meant to preserve semantic nuance.","synonym":"subtle difference in meaning","nuance":"","group":"advanced"},{"term":"addressee orientation","meaning":"청자 지향성","collocation":"consider addressee orientation","example":"Careful documentation enabled linguists to consider addressee orientation without repeating the same mistake.","synonym":"attention to the listener","nuance":"","group":"advanced"},{"term":"audience sensitivity","meaning":"청중 민감성","collocation":"demonstrate audience sensitivity","example":"In a subsequent case, linguists had to demonstrate audience sensitivity under rather different conditions.","synonym":"sensitivity to listeners","nuance":"","group":"advanced"},{"term":"cross-linguistic transfer","meaning":"언어 간 전이","collocation":"examine cross-linguistic transfer","example":"The final recommendation urged linguists to examine cross-linguistic transfer before proceeding.","synonym":"influence between languages","nuance":"","group":"advanced"}],"meta":{"sourceType":"original practice content","etsOfficial":false,"benchmark":"TOEFL iBT January 2026 task-type descriptions / ETS sample 1","studyMinutes":120,"revision":"2026-11-23-diversity-v3","discipline":"Linguistics / Pragmatics","genre":"case"}};</script>
