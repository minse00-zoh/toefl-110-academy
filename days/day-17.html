<script>window.TOEFL_LESSON={"day":17,"week":4,"theme":"Museums, Repatriation and Cultural Ownership","focus":"Speaking: fluency and elaboration","claim":"Museum stewardship must consider cultural authority and acquisition history, not only legal title or physical preservation.","evidence":"A community may seek a ceremonial object's return despite a museum’s valid legal record of acquisition.","caveat":"Digital replicas and temporary loans do not necessarily replace an original object’s living cultural role.","response":"Review provenance and consult originating communities about appropriate forms of stewardship.","storageKey":"toefl110day17-diversity-v3","notice":"UNIVERSITY MUSEUM — COMMUNITY HERITAGE FORUM\n\nA public forum on collection provenance will take place Friday at 5:30 p.m. in the lecture theater. The museum will provide live captioning and an online viewing link. In-person seats are free but must be reserved by Thursday evening.\n\nA community representative will speak first, followed by the museum's collections director. Audience questions will be collected on cards; the moderator will select questions to ensure that both perspectives receive time. Visitors are asked not to photograph ceremonial objects displayed outside the forum.","academicPassage":"Museums preserve objects, but the question of who should control those objects can be contentious. Some collections grew through legitimate exchanges, while others were assembled during periods of conquest, unequal bargaining power, or colonial administration. Legal ownership and cultural legitimacy therefore do not always coincide.\n\nConsider a carved ceremonial object displayed in a national museum far from the community that created it. The museum argues that its climate-controlled galleries can protect the material and that visitors from many countries can study it. Community representatives respond that the object was removed without meaningful consent and remains important to living ceremonies. For them, the issue is not only whether the carving will survive, but who has the authority to decide its use and interpretation.\n\nPossible responses include unconditional return, long-term loans, joint curatorship, and agreements to share research records. Each arrangement has benefits and limitations. A digital scan can improve access, but a reproduction may not serve the cultural role of the original. Similarly, a loan that allows temporary exhibition does not necessarily resolve an underlying claim to ownership.\n\nA responsible decision should examine provenance, the circumstances of acquisition, and the wishes of relevant communities. It should also be transparent about conflicts among educational access, preservation, and cultural rights. There is rarely a universal formula that replaces dialogue with all those affected.","readingClozePassage":"A museum displayed a ceremonial carving acquired more than a century ago. The institution posse____ a docu____ describing th_ transfer, bu_ community represen_______ questioned whet___ their ances____ had be__ able t_ consent fre___. A curator proposed creating a digital replica to improve access. Community members welcomed the educational benefit but emphasized that the original still played a role in contemporary ceremonies. Discussions therefore considered the carving's history, ownership, and current cultural meaning. The participants realized that preserving an object and deciding who should control it are related but different responsibilities.","cloze":[{"partial":"posse____","answer":"possessed","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"docu____","answer":"document","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"th_","answer":"the","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"bu_","answer":"but","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"represen_______","answer":"representatives","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"whet___","answer":"whether","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"ances____","answer":"ancestors","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"be__","answer":"been","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"t_","answer":"to","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"fre___","answer":"freely","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"}],"questions":{"rd":[{"q":"How will audience questions be handled during the heritage forum?","options":["Written on cards and selected by a moderator.","Submitted anonymously to a public social-media feed.","Restricted to visitors who bought museum memberships.","Asked only after the museum director leaves."],"answer":0,"why":"실생활 공지의 해당 조건을 찾아 확인하세요. Written on cards and selected by a moderator."},{"q":"What must visitors do to attend the forum in person?","options":["Purchase a photography permit for ceremonial objects.","Register for the museum’s permanent exhibition course.","Present a university library card at the entrance.","Reserve a free seat by Thursday evening."],"answer":3,"why":"공지의 별도 요건 또는 예외 조항에 명시된 행동은 Reserve a free seat by Thursday evening.입니다."},{"q":"Which service makes the heritage forum accessible to remote viewers?","options":["Unrestricted photography of ceremonial objects.","A recorded guided tour available only to museum employees.","An online viewing link with live captioning.","A mandatory in-person ticket purchase."],"answer":2,"why":"공지의 예외 조항과 구체적인 적용 범위를 비교해야 합니다. 정답 근거: An online viewing link with live captioning."}],"ra":[{"q":"Which position is most compatible with the author’s balanced discussion in the passage on Museums, Repatriation and Cultural Ownership?","options":["A digital replica is always equivalent to an original ceremonial object.","Museum stewardship must consider cultural authority and acquisition history, not only legal title or physical preservation.","Repatriation decisions depend only on the physical size of the artifact.","Legal ownership automatically resolves every cultural claim."],"answer":1,"why":"중심 논지는 세부 사례에서 도출되는 가장 신중한 결론입니다. Museum stewardship must consider cultural authority and acquisition history, not only legal title or physical preservation."},{"q":"What specific observation in the museums, repatriation and cultural ownership case motivates the discussion?","options":["A community may seek a ceremonial object's return despite a museum’s valid legal record of acquisition.","Repatriation decisions depend only on the physical size of the artifact.","Legal ownership automatically resolves every cultural claim.","A digital replica is always equivalent to an original ceremonial object."],"answer":0,"why":"지문의 사례·대조 정보를 직접 확인해야 합니다. A community may seek a ceremonial object's return despite a museum’s valid legal record of acquisition."},{"q":"Which qualification prevents the evidence about museum stewardship from supporting an unconditional claim?","options":["Legal ownership automatically resolves every cultural claim.","Repatriation decisions depend only on the physical size of the artifact.","A digital replica is always equivalent to an original ceremonial object.","Digital replicas and temporary loans do not necessarily replace an original object’s living cultural role."],"answer":3,"why":"한계 조건은 곧바로 틀린 결론이라는 뜻이 아니라 적용 범위를 제한합니다. Digital replicas and temporary loans do not necessarily replace an original object’s living cultural role."},{"q":"Why are the contrasting conditions introduced in the account of museum stewardship?","options":["It lists the sequence of museum stewardship observations without contributing to the author’s main point.","The example eliminates the need to compare evidence about museum stewardship with alternative explanations.","It illustrates a specific relationship involving museum stewardship while establishing the boundaries of the wider argument.","The example proves that the implications of museum stewardship hold in every possible location."],"answer":2,"why":"사례는 범위가 제한된 관찰 또는 비교를 통해 주장을 구체화하고 무조건적 일반화를 피하도록 돕습니다."},{"q":"Which investigation or action would best extend the reasoning about museums, repatriation and cultural ownership?","options":["Legal ownership automatically resolves every cultural claim.","Review provenance and consult originating communities about appropriate forms of stewardship.","A digital replica is always equivalent to an original ceremonial object.","Repatriation decisions depend only on the physical size of the artifact."],"answer":1,"why":"추가 검증은 근거의 결함을 직접 보완하거나 대안 설명을 시험해야 합니다. Review provenance and consult originating communities about appropriate forms of stewardship."}],"rp":[{"q":"In the museums, repatriation and cultural ownership passage, what does “provenance” most nearly mean in context?","options":["history of an object’s origin and ownership","cost of maintaining a museum building","exact geographical location of every visitor","chemical reaction of a digital replica"],"answer":0,"why":"단어의 문맥상 의미를 판단해야 하며 직역만으로 결정하지 않습니다. provenance ≈ history of an object’s origin and ownership"},{"q":"A museum offers a digital replica but the original remains central to a community ceremony. What is missing?","options":["A larger digital file size for the replica.","Confirmation that a scan has the same ceremonial function.","A decision about the museum gift shop’s opening hours.","An agreement about cultural authority and use of the original."],"answer":3,"why":"새 상황에 지문 원리를 적용하는 고난도 추론 문항입니다. An agreement about cultural authority and use of the original."}],"lq":[{"q":"Which response best addresses the speaker’s question about museum stewardship?","options":["Yes, a replica always transfers cultural authority.","The museum keeps the collection in a climate-controlled room.","Not necessarily; a digital image cannot always replace the original’s ceremonial significance.","The public forum starts at five thirty."],"answer":2,"why":"화자는 전제를 확인하고 있으므로 직접적인 정정과 관련 조건 설명이 적절합니다."}],"lc":[{"q":"What brings the first speaker to the conversation concerning museum stewardship?","options":["A request for the institution to change the academic field under discussion.","why a community requests an artifact’s return despite a legal museum record","An invitation to deliver a formal lecture explaining museums, repatriation and cultural ownership.","A plan to evaluate unrelated applicants for a different university program."],"answer":1,"why":"대화의 도입부에서 상대가 확인하려는 문제를 파악합니다. why a community requests an artifact’s return despite a legal museum record"},{"q":"What does the second speaker clarify about the issue raised in the museums, repatriation and cultural ownership dialogue?","options":["legal ownership does not necessarily settle questions of consent and cultural authority","Repatriation decisions depend only on the physical size of the artifact.","Legal ownership automatically resolves every cultural claim.","A digital replica is always equivalent to an original ceremonial object."],"answer":0,"why":"Not necessarily, No, Exactly와 같은 정정 이후의 내용을 확인합니다. legal ownership does not necessarily settle questions of consent and cultural authority"},{"q":"What will the first speaker most likely do after the discussion about museum stewardship?","options":["Disregard the advice and continue on the original assumption.","Withdraw permanently from all activities discussed.","Replace the entire project with an unrelated topic without consulting anyone.","acknowledge the unresolved dispute on the exhibition label"],"answer":3,"why":"마지막 발화에서 다음 행동을 추론합니다. acknowledge the unresolved dispute on the exhibition label"}],"la":[{"q":"What practical change or instruction is listeners expected to notice in the announcement about museum stewardship?","options":["Restricted to visitors who bought museum memberships.","Asked only after the museum director leaves.","Written on cards and selected by a moderator.","Submitted anonymously to a public social-media feed."],"answer":2,"why":"공지의 장소·시간·적용 조건을 듣고 핵심 변경사항을 선택합니다. Written on cards and selected by a moderator."},{"q":"Which additional requirement applies to listeners in the museums, repatriation and cultural ownership announcement?","options":["Register for the museum’s permanent exhibition course.","Reserve a free seat by Thursday evening.","Purchase a photography permit for ceremonial objects.","Present a university library card at the entrance."],"answer":1,"why":"보편적인 안내와 특정 조건에 해당하는 행동을 구별해야 합니다. Reserve a free seat by Thursday evening."}],"lt":[{"q":"Which statement best summarizes the lecturer’s explanation of museums, repatriation and cultural ownership?","options":["Museum stewardship must consider cultural authority and acquisition history, not only legal title or physical preservation.","Legal ownership automatically resolves every cultural claim.","A digital replica is always equivalent to an original ceremonial object.","Repatriation decisions depend only on the physical size of the artifact."],"answer":0,"why":"강의 중심 개념과 화자의 제한된 결론을 종합합니다. Museum stewardship must consider cultural authority and acquisition history, not only legal title or physical preservation."},{"q":"What role does the lecturer’s example of museum stewardship play in the explanation?","options":["A digital replica is always equivalent to an original ceremonial object.","Repatriation decisions depend only on the physical size of the artifact.","Legal ownership automatically resolves every cultural claim.","A community may seek a ceremonial object's return despite a museum’s valid legal record of acquisition."],"answer":3,"why":"강의 사례는 개념을 구체화하는 관측 자료 또는 비교입니다. A community may seek a ceremonial object's return despite a museum’s valid legal record of acquisition."},{"q":"What caution does the lecturer introduce after describing evidence related to museum stewardship?","options":["Repatriation decisions depend only on the physical size of the artifact.","A digital replica is always equivalent to an original ceremonial object.","Digital replicas and temporary loans do not necessarily replace an original object’s living cultural role.","Legal ownership automatically resolves every cultural claim."],"answer":2,"why":"화자가 However, but 등으로 도입하는 예외를 듣는 것이 핵심입니다. Digital replicas and temporary loans do not necessarily replace an original object’s living cultural role."},{"q":"How would the lecturer most likely advise someone evaluating museum stewardship in a new setting?","options":["A digital replica is always equivalent to an original ceremonial object.","Review provenance and consult originating communities about appropriate forms of stewardship.","Repatriation decisions depend only on the physical size of the artifact.","Legal ownership automatically resolves every cultural claim."],"answer":1,"why":"강의의 마무리에서 제안하는 연구·실행 원칙을 응용합니다. Review provenance and consult originating communities about appropriate forms of stewardship."}]},"audio":{"lq":"Would providing a digital scan settle the community’s request to return the carving?","lc":"Student: Our museum label says the ceremonial carving was acquired legally, so why is the community requesting its return?\nCurator: Legal ownership is one part of the issue. The community argues that its representatives did not meaningfully consent to the transfer.\nStudent: Would offering a high-resolution digital scan solve the problem?\nCurator: A scan might expand educational access, but it may not serve the object's ceremonial role.\nStudent: Then what options are being considered?\nCurator: Direct return, shared curatorship, and long-term loans. The museum is discussing those with community representatives.\nStudent: Should our exhibition label explain that the issue is unresolved?\nCurator: Yes. We should describe the dispute honestly rather than presenting one legal document as the whole history.","la":"Welcome to the university museum's community heritage forum. Tonight's program begins with a community representative, followed by the collections director. Please write audience questions on the cards provided; the moderator will choose a balanced selection. Live captioning is available in the theater and online. We remind visitors that photographs of the ceremonial objects outside this room are not permitted. Thank you for allowing the speakers to complete their remarks.","lt":"A museum object can carry several kinds of value. It may be an important historical source, a beautifully made artifact, and something still used in a living community. Those values do not always point toward the same decision.\n\nSuppose a museum owns a ceremonial carving under an old legal agreement, but the community that created it says the transfer occurred without genuine consent. The museum may emphasize preservation and public education. The community may emphasize cultural authority and the object's continuing role.\n\nWhat about a digital replica? It can make the carving visible to students around the world, but it cannot necessarily replace the original in a ceremony. A shared exhibition or loan may help cooperation without settling ownership.\n\nThat is why curators study the circumstances of acquisition and talk with the people affected. Repatriation is not simply a shipping decision; it is a question about relationships, rights and interpretation."},"speaking":{"repeat":["Welcome to the workshop on museum stewardship.","A public forum on collection provenance will take place Friday at 5:30 p.","The instructor asked us to compare the evidence about museum stewardship before drawing conclusions.","A community may seek a ceremonial object's return despite a museum’s valid legal record of acquisition.","Digital replicas and temporary loans do not necessarily replace an original object’s living cultural role.","Review provenance and consult originating communities about appropriate forms of stewardship.","Although it might initially seem that legal ownership automatically resolves every cultural claim, the evidence instead suggests that museum stewardship must consider cultural authority and acquisition history, not only legal title or physical preservation."],"interviews":["What first interested you in cultural heritage / anthropology, and how would you explain that interest to a friend?","Tell me about a time when a practical decision involving museum stewardship was more complicated than you expected.","Do you think universities should give more attention to museum stewardship in introductory courses? Explain your reasoning.","Imagine a classmate disagrees with your interpretation of museum stewardship. How would you respond respectfully and precisely?"],"sample":"I think museums should involve communities in decisions about culturally important objects. I used to believe that legal ownership was the main consideration. However, learning about ceremonial objects removed during periods of unequal power made me question that assumption. A museum can preserve an artifact carefully while the community of origin still regards it as part of a living tradition. I would not apply a single solution to every case. Instead, I would examine the acquisition history, listen to community representatives and consider how return or shared stewardship might work. For me, respectful dialogue is essential to responsible cultural preservation."},"writing":{"build":[{"fragments":"Could you tell me / session has been rescheduled / whether the museum stewardship","answer":"Could you tell me whether the museum stewardship session has been rescheduled?","why":"간접 의문문 어순의 문장 구조와 주어-동사 관계를 확인하세요."},{"fragments":"The student who reviewed / noticed an important discrepancy / the object provenance records","answer":"The student who reviewed the object provenance records noticed an important discrepancy.","why":"관계절로 설명 추가의 문장 구조와 주어-동사 관계를 확인하세요."},{"fragments":"it might have reached a / If the team had checked / different conclusion / the ceremonial significance evidence earlier,","answer":"If the team had checked the ceremonial significance evidence earlier, it might have reached a different conclusion.","why":"조건절로 가능성 제시의 문장 구조와 주어-동사 관계를 확인하세요."},{"fragments":"the report / examined did the committee approve / to museum stewardship had been / Only after the records related","answer":"Only after the records related to museum stewardship had been examined did the committee approve the report.","why":"Only after 도치의 문장 구조와 주어-동사 관계를 확인하세요."},{"fragments":"but also a clear account / A project involving museum stewardship / of its limitations / requires not only reliable evidence","answer":"A project involving museum stewardship requires not only reliable evidence but also a clear account of its limitations.","why":"Not only A but also B 병렬의 문장 구조와 주어-동사 관계를 확인하세요."}],"emailTask":"You are preparing a class presentation on the museum’s cultural heritage forum. Email the public-programs office to request permission to quote the speakers, ask where to find their approved statements, and confirm the rules for using photographs of the disputed object.","emailSample":"Dear Public Programs Office,\n\nI am preparing a class presentation about the museum's community heritage forum. I hope to discuss the different perspectives on the ceremonial carving's provenance and the options currently under consideration.\n\nWould you permit brief quotations from the speakers' approved public statements? If a transcript or authorized summary will be available, I would be grateful for a link. I would also like to confirm whether the exhibition's photographs may be reproduced in a presentation shared only with classmates, since I understand that photographs of the ceremonial objects themselves are restricted.\n\nThank you for helping me present the discussion accurately and respectfully.\n\nSincerely,\nAlex","discussionTask":"Professor: Should museums return culturally significant objects when acquisition records are disputed?\n\nStudent A — Emily: Returning objects can acknowledge community authority and correct historical imbalances.\n\nStudent B — Daniel: Museums can protect fragile collections and make them accessible to diverse audiences through shared stewardship.","discussionSample":"I support returning culturally significant objects when evidence indicates that the original transfer lacked meaningful consent, although each case deserves careful examination. An artifact may be physically protected in a museum while remaining important to living ceremonies in its community of origin. A digital replica can improve educational access, but it may not substitute for the original object's cultural role. Shared curatorship or a long-term loan can sometimes support cooperation, but such arrangements should not be imposed as replacements for legitimate ownership claims. I would begin with provenance research and consultation with community representatives, then negotiate a solution that addresses care, access and authority. The aim should be a fair relationship, not simply the transfer of an object from one building to another."},"vocabulary":[{"term":"cultural repatriation","meaning":"문화재 반환","collocation":"negotiate cultural repatriation","example":"Only after a careful review could museum curators begin to negotiate cultural repatriation.","synonym":"return of cultural objects","nuance":"","group":"core"},{"term":"object provenance","meaning":"소장품 출처 이력","collocation":"document object provenance","example":"Under the new conditions, museum curators were asked to document object provenance at an earlier stage.","synonym":"history of an object's ownership","nuance":"","group":"core"},{"term":"ceremonial significance","meaning":"의례적 의미","collocation":"recognize ceremonial significance","example":"The long-term monitoring plan required museum curators to recognize ceremonial significance at regular intervals.","synonym":"importance in ceremonies","nuance":"","group":"core"},{"term":"community consent","meaning":"공동체 동의","collocation":"obtain community consent","example":"At the discussion session, museum curators explained their decision to obtain community consent.","synonym":"agreement from the originating community","nuance":"","group":"core"},{"term":"joint curatorship","meaning":"공동 큐레이션","collocation":"develop joint curatorship","example":"The available resources enabled museum curators to develop joint curatorship during the pilot study.","synonym":"shared responsibility for a collection","nuance":"","group":"core"},{"term":"collection stewardship","meaning":"소장품 관리 책임","collocation":"reconsider collection stewardship","example":"Although the preliminary results seemed convincing, museum curators still needed to reconsider collection stewardship.","synonym":"responsible museum care","nuance":"","group":"core"},{"term":"contested acquisition","meaning":"취득 경위 분쟁","collocation":"investigate contested acquisition","example":"Because the evidence was incomplete, museum curators agreed to investigate contested acquisition again before deciding.","synonym":"disputed transfer into a collection","nuance":"","group":"core"},{"term":"long-term loan","meaning":"장기 대여","collocation":"arrange a long-term loan","example":"The museum could arrange a long-term loan without settling the deeper disagreement about cultural ownership.","synonym":"extended temporary loan","nuance":"","group":"core"},{"term":"digital replica","meaning":"디지털 복제품","collocation":"create a digital replica","example":"After examining competing accounts, museum curators were prepared to create a digital replica.","synonym":"digital copy","nuance":"","group":"core"},{"term":"living heritage","meaning":"살아 있는 문화유산","collocation":"protect living heritage","example":"One limitation of the project was that museum curators could not yet protect living heritage reliably.","synonym":"heritage still used today","nuance":"","group":"core"},{"term":"heritage authority","meaning":"문화유산에 대한 결정권","collocation":"respect heritage authority","example":"A later review prompted museum curators to respect heritage authority, rather than accept the initial explanation.","synonym":"right to speak for a tradition","nuance":"","group":"core"},{"term":"legal title","meaning":"법적 소유권","collocation":"verify legal title","example":"Over a semester of fieldwork, museum curators learned how to verify legal title.","synonym":"legal claim of ownership","nuance":"","group":"core"},{"term":"public interpretation","meaning":"대중 해설","collocation":"revise public interpretation","example":"In their final presentation, museum curators described what it meant to revise public interpretation.","synonym":"public explanation of an exhibit","nuance":"","group":"core"},{"term":"museum accession","meaning":"박물관 수장품 등록","collocation":"trace a museum accession","example":"Careful documentation enabled museum curators to trace a museum accession without repeating the same mistake.","synonym":"formal acquisition into a museum","nuance":"","group":"core"},{"term":"conservation responsibility","meaning":"보존 책임","collocation":"share conservation responsibility","example":"In a subsequent case, museum curators had to share conservation responsibility under rather different conditions.","synonym":"responsibility for object preservation","nuance":"","group":"core"},{"term":"contested heritage","meaning":"소유 논란이 있는 문화유산","collocation":"examine contested heritage","example":"The final recommendation urged museum curators to examine contested heritage before proceeding.","synonym":"heritage under dispute","nuance":"","group":"advanced"},{"term":"cultural continuity","meaning":"문화적 연속성","collocation":"support cultural continuity","example":"In the first trial, museum curators were not yet able to support cultural continuity consistently.","synonym":"continuation of traditions","nuance":"","group":"advanced"},{"term":"historical injustice","meaning":"역사적 부당함","collocation":"acknowledge historical injustice","example":"The absence of reliable records made it difficult for museum curators to acknowledge historical injustice.","synonym":"past wrongdoing","nuance":"","group":"advanced"},{"term":"collective identity","meaning":"집단 정체성","collocation":"protect collective identity","example":"The project team provided a checklist to help museum curators protect collective identity.","synonym":"identity shared by a group","nuance":"","group":"advanced"},{"term":"provenance research","meaning":"소장 이력 조사","collocation":"conduct provenance research","example":"Students observed how museum curators attempted to conduct provenance research despite incomplete information.","synonym":"investigation of ownership history","nuance":"","group":"advanced"},{"term":"restitution claim","meaning":"반환 청구","collocation":"review a restitution claim","example":"A meaningful comparison would require museum curators to review a restitution claim independently.","synonym":"request for return of an object","nuance":"","group":"advanced"},{"term":"custodial obligation","meaning":"보관 의무","collocation":"fulfill a custodial obligation","example":"A cautious interpretation allowed museum curators to fulfill a custodial obligation while acknowledging uncertainty.","synonym":"duty of care in possession","nuance":"","group":"advanced"},{"term":"interpretive authority","meaning":"해석 권한","collocation":"share interpretive authority","example":"Several independent observations led museum curators to share interpretive authority before publication.","synonym":"authority to explain cultural meaning","nuance":"","group":"advanced"},{"term":"community consultation","meaning":"공동체 협의","collocation":"undertake community consultation","example":"A request from the university encouraged museum curators to undertake community consultation more transparently.","synonym":"discussion with affected communities","nuance":"","group":"advanced"},{"term":"ethical stewardship","meaning":"윤리적 관리","collocation":"practice ethical stewardship","example":"Rather than generalizing from one case, museum curators sought to practice ethical stewardship in several settings.","synonym":"responsible management of cultural materials","nuance":"","group":"advanced"},{"term":"heritage dispute","meaning":"문화유산 분쟁","collocation":"mediate a heritage dispute","example":"The investigation would be less credible if museum curators neglected to mediate a heritage dispute.","synonym":"disagreement over cultural assets","nuance":"","group":"advanced"},{"term":"reciprocal partnership","meaning":"호혜적 협력관계","collocation":"establish a reciprocal partnership","example":"The procedures were revised so that museum curators could establish a reciprocal partnership consistently.","synonym":"two-way institutional cooperation","nuance":"","group":"advanced"},{"term":"material heritage","meaning":"물질 문화유산","collocation":"conserve material heritage","example":"Before finalizing the interpretation, museum curators decided to conserve material heritage.","synonym":"physical cultural objects","nuance":"","group":"advanced"},{"term":"public accountability","meaning":"대중에 대한 책임성","collocation":"ensure public accountability","example":"The students challenged museum curators to ensure public accountability without overlooking contrary evidence.","synonym":"responsibility to the public","nuance":"","group":"advanced"},{"term":"negotiated settlement","meaning":"합의에 의한 해결","collocation":"seek a negotiated settlement","example":"The instructor proposed that museum curators should first seek a negotiated settlement and then compare outcomes.","synonym":"settlement reached through talks","nuance":"","group":"advanced"}],"meta":{"sourceType":"original practice content","etsOfficial":false,"benchmark":"TOEFL iBT January 2026 task-type descriptions / ETS sample 1","studyMinutes":120,"revision":"2026-11-23-diversity-v3","discipline":"Cultural Heritage / Anthropology","genre":"debate"}};</script>
