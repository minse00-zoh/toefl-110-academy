<script>window.TOEFL_LESSON={"day":19,"week":4,"theme":"Hybrid Work and Professional Development","focus":"Speaking: fluency and elaboration","claim":"Hybrid work outcomes vary across tasks, mentoring needs and evaluation practices, so uniform attendance rules may be misleading.","evidence":"In-person analysts received more informal mentoring, whereas remote analysts reported fewer interruptions during individual writing.","caveat":"Managerial visibility bias and unequal access to informal guidance can affect career development.","response":"Match work arrangements to activities and evaluate both performance and equitable mentoring access.","storageKey":"toefl110day19-diversity-v3","notice":"CAREER DEVELOPMENT CENTER — HYBRID INTERNSHIP ORIENTATION\n\nStudents beginning a hybrid internship must attend an in-person orientation on Monday at 9 a.m. in Conference Room 2. After orientation, work locations will vary by project. Interns should submit their preferred mentoring meeting time through the internship portal by Friday afternoon.\n\nThe attendance requirement applies only to the initial orientation, not to every Monday of the internship. Students needing an accommodation may contact the placement adviser before the program starts. Remote login credentials will be distributed after orientation.","academicPassage":"Hybrid work arrangements divide working time between shared workplaces and remote locations. Advocates emphasize flexibility and reduced commuting, while critics worry that dispersed teams may make mentoring and informal learning more difficult. Both arguments are plausible, but their effects depend on the tasks, organizational culture and employees involved.\n\nA professional-services firm compared training outcomes for new analysts assigned to different schedules. Those who spent some days working alongside experienced colleagues reported receiving more spontaneous advice. Remote analysts, however, completed individual writing tasks with fewer interruptions and rated their time-management autonomy more highly. Neither pattern established that one schedule was better for every kind of work.\n\nAn important complication is visibility. Managers may mistake frequent physical presence for contribution and overlook employees whose work is less observable. Conversely, junior staff may struggle to seek help when a remote team has no clear method for informal questions. A policy focused only on attendance days can miss these consequences.\n\nThe strongest evaluations examine measurable outcomes and career development together. Projects may need scheduled collaboration, independent concentration, and opportunities for feedback at different times. Instead of assuming that one fixed office requirement is ideal, organizations can define which activities benefit from proximity and then measure whether everyone has fair access to those opportunities.","readingClozePassage":"A group of interns worked part of each week from home and part in a shared office. They repo____ that qui__ remote da__ helped th__ finish indiv_____ writing assign_____. However, so__ junior colle_____ missed info____ advice th__ would normally hear in the office. Their supervisor introduced regular mentoring meetings and reviewed performance using completed work rather than attendance alone. The change did not make every task easier, but it gave the group a clearer way to balance concentration and collaboration. The interns began to judge a work schedule by the activities it supported.","cloze":[{"partial":"repo____","answer":"reported","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"qui__","answer":"quiet","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"da__","answer":"days","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"th__","answer":"them","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"indiv_____","answer":"individual","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"assign_____","answer":"assignments","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"so__","answer":"some","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"colle_____","answer":"colleagues","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"info____","answer":"informal","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"th__","answer":"they","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"}],"questions":{"rd":[{"q":"Which part of the hybrid internship requires in-person attendance?","options":["Every individual writing assignment.","All mentoring sessions after the first week.","The initial Monday orientation.","Every Monday throughout the placement."],"answer":2,"why":"실생활 공지의 해당 조건을 찾아 확인하세요. The initial Monday orientation."},{"q":"What should interns submit by Friday afternoon?","options":["Their final internship performance report.","Their preferred time for a mentoring meeting.","A signed request to work from home every day.","A reimbursement form for all commuting costs."],"answer":1,"why":"공지의 별도 요건 또는 예외 조항에 명시된 행동은 Their preferred time for a mentoring meeting.입니다."},{"q":"When will interns receive the remote login credentials?","options":["After the in-person orientation.","Before the internship application is submitted.","Only after the final performance evaluation.","On every subsequent Monday in the office."],"answer":0,"why":"공지의 예외 조항과 구체적인 적용 범위를 비교해야 합니다. 정답 근거: After the in-person orientation."}],"ra":[{"q":"What tradeoff should a careful evaluation acknowledge in the passage on Hybrid Work and Professional Development?","options":["Employee career development can be evaluated using attendance days alone.","Remote workers are necessarily less productive than their office-based colleagues.","A fixed office schedule improves every task for all employees.","Hybrid work outcomes vary across tasks, mentoring needs and evaluation practices, so uniform attendance rules may be misleading."],"answer":3,"why":"중심 논지는 세부 사례에서 도출되는 가장 신중한 결론입니다. Hybrid work outcomes vary across tasks, mentoring needs and evaluation practices, so uniform attendance rules may be misleading."},{"q":"What specific observation in the hybrid work and professional development case motivates the discussion?","options":["Remote workers are necessarily less productive than their office-based colleagues.","A fixed office schedule improves every task for all employees.","In-person analysts received more informal mentoring, whereas remote analysts reported fewer interruptions during individual writing.","Employee career development can be evaluated using attendance days alone."],"answer":2,"why":"지문의 사례·대조 정보를 직접 확인해야 합니다. In-person analysts received more informal mentoring, whereas remote analysts reported fewer interruptions during individual writing."},{"q":"Which qualification prevents the evidence about mentoring arrangements from supporting an unconditional claim?","options":["Remote workers are necessarily less productive than their office-based colleagues.","Managerial visibility bias and unequal access to informal guidance can affect career development.","A fixed office schedule improves every task for all employees.","Employee career development can be evaluated using attendance days alone."],"answer":1,"why":"한계 조건은 곧바로 틀린 결론이라는 뜻이 아니라 적용 범위를 제한합니다. Managerial visibility bias and unequal access to informal guidance can affect career development."},{"q":"What purpose does the author’s case study serve in evaluating mentoring arrangements?","options":["It illustrates a specific relationship involving mentoring arrangements while establishing the boundaries of the wider argument.","The example proves that the implications of mentoring arrangements hold in every possible location.","The example eliminates the need to compare evidence about mentoring arrangements with alternative explanations.","It lists the sequence of mentoring arrangements observations without contributing to the author’s main point."],"answer":0,"why":"사례는 범위가 제한된 관찰 또는 비교를 통해 주장을 구체화하고 무조건적 일반화를 피하도록 돕습니다."},{"q":"Which investigation or action would best extend the reasoning about hybrid work and professional development?","options":["Remote workers are necessarily less productive than their office-based colleagues.","A fixed office schedule improves every task for all employees.","Employee career development can be evaluated using attendance days alone.","Match work arrangements to activities and evaluate both performance and equitable mentoring access."],"answer":3,"why":"추가 검증은 근거의 결함을 직접 보완하거나 대안 설명을 시험해야 합니다. Match work arrangements to activities and evaluate both performance and equitable mentoring access."}],"rp":[{"q":"In the hybrid work and professional development passage, what does “autonomy” most nearly mean in context?","options":["ability to work without any colleagues","number of days spent commuting","freedom to organize one’s work","requirement to be constantly supervised"],"answer":2,"why":"단어의 문맥상 의미를 판단해야 하며 직역만으로 결정하지 않습니다. autonomy ≈ freedom to organize one’s work"},{"q":"A junior analyst writes well remotely but rarely speaks to senior colleagues. What should a hybrid policy address?","options":["Measure contribution solely through office attendance.","Provide deliberate opportunities for mentoring without eliminating focused work.","Require every task to occur during a large group meeting.","Assume independent writing performance captures career development."],"answer":1,"why":"새 상황에 지문 원리를 적용하는 고난도 추론 문항입니다. Provide deliberate opportunities for mentoring without eliminating focused work."}],"lq":[{"q":"Which response best addresses the speaker’s question about mentoring arrangements?","options":["No, later work locations depend on your project team.","Yes, every Monday is a mandatory office day.","The internship portal opens on Fridays.","The orientation begins at nine."],"answer":0,"why":"화자는 전제를 확인하고 있으므로 직접적인 정정과 관련 조건 설명이 적절합니다."}],"lc":[{"q":"What brings the first speaker to the conversation concerning mentoring arrangements?","options":["A request for the institution to change the academic field under discussion.","An invitation to deliver a formal lecture explaining hybrid work and professional development.","A plan to evaluate unrelated applicants for a different university program.","whether Monday in-person attendance is a permanent internship rule"],"answer":3,"why":"대화의 도입부에서 상대가 확인하려는 문제를 파악합니다. whether Monday in-person attendance is a permanent internship rule"},{"q":"What does the second speaker clarify about the issue raised in the hybrid work and professional development dialogue?","options":["Employee career development can be evaluated using attendance days alone.","Remote workers are necessarily less productive than their office-based colleagues.","only the initial orientation is mandatory in person","A fixed office schedule improves every task for all employees."],"answer":2,"why":"Not necessarily, No, Exactly와 같은 정정 이후의 내용을 확인합니다. only the initial orientation is mandatory in person"},{"q":"What will the first speaker most likely do after the discussion about mentoring arrangements?","options":["Disregard the advice and continue on the original assumption.","submit a mentoring time preference and clarify later schedules","Withdraw permanently from all activities discussed.","Replace the entire project with an unrelated topic without consulting anyone."],"answer":1,"why":"마지막 발화에서 다음 행동을 추론합니다. submit a mentoring time preference and clarify later schedules"}],"la":[{"q":"What practical change or instruction is listeners expected to notice in the announcement about mentoring arrangements?","options":["The initial Monday orientation.","Every individual writing assignment.","Every Monday throughout the placement.","All mentoring sessions after the first week."],"answer":0,"why":"공지의 장소·시간·적용 조건을 듣고 핵심 변경사항을 선택합니다. The initial Monday orientation."},{"q":"Which additional requirement applies to listeners in the hybrid work and professional development announcement?","options":["Their final internship performance report.","A signed request to work from home every day.","A reimbursement form for all commuting costs.","Their preferred time for a mentoring meeting."],"answer":3,"why":"보편적인 안내와 특정 조건에 해당하는 행동을 구별해야 합니다. Their preferred time for a mentoring meeting."}],"lt":[{"q":"Which statement best summarizes the lecturer’s explanation of hybrid work and professional development?","options":["A fixed office schedule improves every task for all employees.","Employee career development can be evaluated using attendance days alone.","Hybrid work outcomes vary across tasks, mentoring needs and evaluation practices, so uniform attendance rules may be misleading.","Remote workers are necessarily less productive than their office-based colleagues."],"answer":2,"why":"강의 중심 개념과 화자의 제한된 결론을 종합합니다. Hybrid work outcomes vary across tasks, mentoring needs and evaluation practices, so uniform attendance rules may be misleading."},{"q":"What role does the lecturer’s example of mentoring arrangements play in the explanation?","options":["Remote workers are necessarily less productive than their office-based colleagues.","In-person analysts received more informal mentoring, whereas remote analysts reported fewer interruptions during individual writing.","Employee career development can be evaluated using attendance days alone.","A fixed office schedule improves every task for all employees."],"answer":1,"why":"강의 사례는 개념을 구체화하는 관측 자료 또는 비교입니다. In-person analysts received more informal mentoring, whereas remote analysts reported fewer interruptions during individual writing."},{"q":"What caution does the lecturer introduce after describing evidence related to mentoring arrangements?","options":["Managerial visibility bias and unequal access to informal guidance can affect career development.","Remote workers are necessarily less productive than their office-based colleagues.","Employee career development can be evaluated using attendance days alone.","A fixed office schedule improves every task for all employees."],"answer":0,"why":"화자가 However, but 등으로 도입하는 예외를 듣는 것이 핵심입니다. Managerial visibility bias and unequal access to informal guidance can affect career development."},{"q":"How would the lecturer most likely advise someone evaluating mentoring arrangements in a new setting?","options":["A fixed office schedule improves every task for all employees.","Employee career development can be evaluated using attendance days alone.","Remote workers are necessarily less productive than their office-based colleagues.","Match work arrangements to activities and evaluate both performance and equitable mentoring access."],"answer":3,"why":"강의의 마무리에서 제안하는 연구·실행 원칙을 응용합니다. Match work arrangements to activities and evaluate both performance and equitable mentoring access."}]},"audio":{"lq":"Does the Monday in-person orientation mean I have to go to the office every Monday?","lc":"Intern: The internship description says “hybrid,” but my supervisor expects me in the office on Monday. Is that a permanent rule?\nAdviser: No, Monday is the initial orientation. After that, your schedule depends on the project team.\nIntern: I'm worried I won't get enough feedback if I work remotely most days.\nAdviser: That's a reasonable concern. Have you arranged recurring mentoring time with your supervisor?\nIntern: Not yet. I thought I was supposed to ask questions only in person.\nAdviser: You can also schedule online check-ins. The important thing is establishing a reliable channel for feedback.\nIntern: I'll submit my preferred meeting time through the portal, then.\nAdviser: Good. That should make expectations clear before the placement begins.","la":"Welcome to the Career Development Center's hybrid internship program. All interns must attend the initial orientation in person on Monday at nine o'clock in Conference Room Two. This is a one-time requirement; subsequent work locations will depend on each project. Submit your mentoring meeting preference by Friday afternoon, and contact the placement adviser if you require an accommodation. Remote credentials will be distributed after orientation.","lt":"Hybrid work is often discussed as a choice between home and office, but that framing hides an important distinction: different tasks need different kinds of interaction.\n\nIn a firm studying new analysts, in-person days produced more spontaneous mentoring conversations. Remote days often supported concentrated individual writing. Neither environment was superior for every task.\n\nThere is also a fairness issue. An employee who works remotely may contribute just as much as someone physically present, but a manager might notice the office-based colleague more often. At the same time, junior workers may find it hard to ask informal questions without a clear mentoring channel.\n\nRather than setting an office quota and assuming that solves the problem, organizations should identify which activities benefit from proximity and evaluate learning, productivity and recognition separately."},"speaking":{"repeat":["Welcome to the workshop on mentoring arrangements.","Students beginning a hybrid internship must attend an in-person orientation on Monday at 9 a.","The instructor asked us to compare the evidence about mentoring arrangements before drawing conclusions.","In-person analysts received more informal mentoring, whereas remote analysts reported fewer interruptions during individual writing.","Managerial visibility bias and unequal access to informal guidance can affect career development.","Match work arrangements to activities and evaluate both performance and equitable mentoring access.","Although it might initially seem that a fixed office schedule improves every task for all employees, the evidence instead suggests that hybrid work outcomes vary across tasks, mentoring needs and evaluation practices, so uniform attendance rules may be misleading."],"interviews":["What first interested you in organizational psychology / labor economics, and how would you explain that interest to a friend?","Tell me about a time when a practical decision involving mentoring arrangements was more complicated than you expected.","Do you think universities should give more attention to mentoring arrangements in introductory courses? Explain your reasoning.","Imagine a classmate disagrees with your interpretation of mentoring arrangements. How would you respond respectfully and precisely?"],"sample":"I think new employees benefit from both face-to-face mentoring and periods of focused work. During a group project, informal conversations helped me understand expectations that were never written in the instructions. At the same time, I completed my analytical writing more efficiently when I could work without interruptions. That experience makes me skeptical of a rigid rule requiring everyone to be in the office on the same number of days. I would prefer teams to schedule mentoring and collaboration deliberately while allowing flexibility for individual tasks. The real measure of success should be learning and performance, not simply physical presence."},"writing":{"build":[{"fragments":"session has been rescheduled / whether the mentoring arrangements / Could you tell me","answer":"Could you tell me whether the mentoring arrangements session has been rescheduled?","why":"간접 의문문 어순의 문장 구조와 주어-동사 관계를 확인하세요."},{"fragments":"The student who reviewed / noticed an important discrepancy / the informal mentoring records","answer":"The student who reviewed the informal mentoring records noticed an important discrepancy.","why":"관계절로 설명 추가의 문장 구조와 주어-동사 관계를 확인하세요."},{"fragments":"the proximity benefit evidence earlier, / If the team had checked / different conclusion / it might have reached a","answer":"If the team had checked the proximity benefit evidence earlier, it might have reached a different conclusion.","why":"조건절로 가능성 제시의 문장 구조와 주어-동사 관계를 확인하세요."},{"fragments":"the report / to mentoring arrangements had been / Only after the records related / examined did the committee approve","answer":"Only after the records related to mentoring arrangements had been examined did the committee approve the report.","why":"Only after 도치의 문장 구조와 주어-동사 관계를 확인하세요."},{"fragments":"but also a clear account / of its limitations / requires not only reliable evidence / A project involving mentoring arrangements","answer":"A project involving mentoring arrangements requires not only reliable evidence but also a clear account of its limitations.","why":"Not only A but also B 병렬의 문장 구조와 주어-동사 관계를 확인하세요."}],"emailTask":"You will start a hybrid internship and want regular feedback from your supervisor. Email the placement adviser to describe your planned work arrangement, propose two mentoring meeting times, and ask how remote work will be evaluated.","emailSample":"Dear Placement Adviser,\n\nI am looking forward to starting my hybrid internship next week. My current understanding is that the initial Monday orientation will be held in person, after which the balance of remote and office work will depend on the project.\n\nTo ensure that I receive regular feedback, I would like to propose a mentoring check-in either on Tuesday at 10 a.m. or Thursday at 3 p.m. Could you let me know which option would be most suitable for my supervisor? I would also appreciate clarification on how individual remote assignments will be evaluated alongside collaborative work.\n\nThank you for helping me establish clear expectations.\n\nBest regards,\nAlex","discussionTask":"Professor: Should early-career employees spend more days in the office than experienced colleagues?\n\nStudent A — Emily: Face-to-face interaction can make spontaneous learning and professional relationships easier for newcomers.\n\nStudent B — Daniel: Rigid office requirements may disadvantage workers with long commutes or accessibility needs without improving their work.","discussionSample":"I would encourage newcomers to spend some structured time with colleagues in person, but I would avoid a blanket office requirement. Early-career employees can learn a great deal from overhearing discussions, asking spontaneous questions and observing experienced coworkers. At the same time, remote work may allow them to concentrate on analytical writing without constant interruptions. The challenge is designing a schedule around learning needs rather than equating presence with productivity. Teams could designate mentoring days and hold regular online check-ins while giving interns flexibility for independent tasks. Managers should assess the quality of work and access to feedback separately. That would protect professional development without placing unnecessary burdens on employees with long commutes or accessibility needs."},"vocabulary":[{"term":"hybrid schedule","meaning":"혼합형 근무 일정","collocation":"negotiate a hybrid schedule","example":"The project team provided a checklist to help internship advisers negotiate a hybrid schedule.","synonym":"mix of remote and on-site work","nuance":"","group":"core"},{"term":"informal mentoring","meaning":"비공식 멘토링","collocation":"provide informal mentoring","example":"Students observed how internship advisers attempted to provide informal mentoring despite incomplete information.","synonym":"learning through casual guidance","nuance":"","group":"core"},{"term":"proximity benefit","meaning":"근접 근무의 이점","collocation":"assess proximity benefits","example":"A meaningful comparison would require internship advisers to assess proximity benefits independently.","synonym":"benefit of being physically nearby","nuance":"","group":"core"},{"term":"visibility bias","meaning":"가시성 편향","collocation":"reduce visibility bias","example":"A cautious interpretation allowed internship advisers to reduce visibility bias while acknowledging uncertainty.","synonym":"preference for more visible workers","nuance":"","group":"core"},{"term":"remote coordination","meaning":"원격 협업 조율","collocation":"improve remote coordination","example":"Several independent observations led internship advisers to improve remote coordination before publication.","synonym":"collaboration from different locations","nuance":"","group":"core"},{"term":"performance metric","meaning":"성과 지표","collocation":"define a performance metric","example":"A request from the university encouraged internship advisers to define a performance metric more transparently.","synonym":"measure of job performance","nuance":"","group":"core"},{"term":"career progression","meaning":"경력 발전","collocation":"support career progression","example":"Rather than generalizing from one case, internship advisers sought to support career progression in several settings.","synonym":"advancement in a profession","nuance":"","group":"core"},{"term":"focused work","meaning":"집중 업무","collocation":"protect focused work","example":"The investigation would be less credible if internship advisers neglected to protect focused work.","synonym":"work requiring sustained attention","nuance":"","group":"core"},{"term":"workplace autonomy","meaning":"업무 자율성","collocation":"increase workplace autonomy","example":"The procedures were revised so that internship advisers could increase workplace autonomy consistently.","synonym":"freedom to manage work","nuance":"","group":"core"},{"term":"attendance requirement","meaning":"출근 요건","collocation":"clarify an attendance requirement","example":"Before finalizing the interpretation, internship advisers decided to clarify an attendance requirement.","synonym":"rule about being present","nuance":"","group":"core"},{"term":"mentoring channel","meaning":"멘토링 연락 체계","collocation":"establish a mentoring channel","example":"The students challenged internship advisers to establish a mentoring channel without overlooking contrary evidence.","synonym":"structured mentor-mentee interaction","nuance":"","group":"core"},{"term":"feedback cadence","meaning":"피드백 주기","collocation":"agree on a feedback cadence","example":"The instructor proposed that internship advisers should first agree on a feedback cadence and then compare outcomes.","synonym":"regularity of feedback","nuance":"","group":"core"},{"term":"collaborative task","meaning":"협업 과제","collocation":"schedule a collaborative task","example":"When the initial explanation failed, internship advisers returned to the data to schedule a collaborative task.","synonym":"task shared across colleagues","nuance":"","group":"core"},{"term":"commuting burden","meaning":"통근 부담","collocation":"reduce commuting burden","example":"The group discovered that it was possible to reduce commuting burden without assuming a single cause.","synonym":"cost of daily travel","nuance":"","group":"core"},{"term":"equitable recognition","meaning":"공정한 성과 인정","collocation":"promote equitable recognition","example":"A second research team challenged internship advisers to promote equitable recognition with different assumptions.","synonym":"fair acknowledgment of work","nuance":"","group":"core"},{"term":"professional autonomy","meaning":"직업상 자율성","collocation":"grant professional autonomy","example":"The revised protocol gave internship advisers a systematic way to grant professional autonomy.","synonym":"ability to direct professional tasks","nuance":"","group":"advanced"},{"term":"informal learning","meaning":"비공식 학습","collocation":"facilitate informal learning","example":"To address a practical difficulty, internship advisers chose to facilitate informal learning under controlled conditions.","synonym":"unplanned knowledge exchange","nuance":"","group":"advanced"},{"term":"performance visibility","meaning":"성과 가시성","collocation":"improve performance visibility","example":"It proved especially important for internship advisers to improve performance visibility during the second assessment.","synonym":"how visible a person's work appears","nuance":"","group":"advanced"},{"term":"remote supervision","meaning":"원격 감독","collocation":"provide remote supervision","example":"In response to the reviewers, internship advisers agreed to provide remote supervision using an explicit procedure.","synonym":"oversight from a distance","nuance":"","group":"advanced"},{"term":"mentoring frequency","meaning":"멘토링 빈도","collocation":"increase mentoring frequency","example":"A single unexpected result persuaded internship advisers to increase mentoring frequency more carefully.","synonym":"frequency of mentoring contact","nuance":"","group":"advanced"},{"term":"occupational flexibility","meaning":"직무 유연성","collocation":"offer occupational flexibility","example":"When the instruments returned inconsistent readings, internship advisers attempted to offer occupational flexibility.","synonym":"choice of where and when to work","nuance":"","group":"advanced"},{"term":"task interdependence","meaning":"과제 상호의존성","collocation":"assess task interdependence","example":"The supervising committee asked internship advisers to assess task interdependence and explain the criteria.","synonym":"degree that tasks rely on one another","nuance":"","group":"advanced"},{"term":"asynchronous collaboration","meaning":"비동기 협업","collocation":"enable asynchronous collaboration","example":"Only after a careful review could internship advisers begin to enable asynchronous collaboration.","synonym":"collaboration at different times","nuance":"","group":"advanced"},{"term":"workplace inclusion","meaning":"직장 내 포용","collocation":"strengthen workplace inclusion","example":"Under the new conditions, internship advisers were asked to strengthen workplace inclusion at an earlier stage.","synonym":"full involvement in working life","nuance":"","group":"advanced"},{"term":"career mobility","meaning":"경력 이동성","collocation":"support career mobility","example":"The long-term monitoring plan required internship advisers to support career mobility at regular intervals.","synonym":"movement toward advanced roles","nuance":"","group":"advanced"},{"term":"onboarding practice","meaning":"업무 적응 절차","collocation":"improve onboarding practices","example":"At the discussion session, internship advisers explained their decision to improve onboarding practices.","synonym":"process of introducing new staff","nuance":"","group":"advanced"},{"term":"managerial evaluation","meaning":"관리자의 평가","collocation":"audit managerial evaluations","example":"The available resources enabled internship advisers to audit managerial evaluations during the pilot study.","synonym":"supervisor's assessment","nuance":"","group":"advanced"},{"term":"communication norm","meaning":"의사소통 관행","collocation":"establish communication norms","example":"Although the preliminary results seemed convincing, internship advisers still needed to establish communication norms.","synonym":"shared expectations about communication","nuance":"","group":"advanced"},{"term":"remote accessibility","meaning":"원격근무 접근성","collocation":"improve remote accessibility","example":"Because the evidence was incomplete, internship advisers agreed to improve remote accessibility again before deciding.","synonym":"availability of remote arrangements","nuance":"","group":"advanced"},{"term":"feedback structure","meaning":"피드백 체계","collocation":"create a feedback structure","example":"The report identified an overlooked opportunity for internship advisers to create a feedback structure.","synonym":"pattern of giving feedback","nuance":"","group":"advanced"}],"meta":{"sourceType":"original practice content","etsOfficial":false,"benchmark":"TOEFL iBT January 2026 task-type descriptions / ETS sample 1","studyMinutes":120,"revision":"2026-11-23-diversity-v3","discipline":"Organizational Psychology / Labor Economics","genre":"tradeoff"}};</script>
