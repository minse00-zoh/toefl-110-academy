<script>window.TOEFL_LESSON={"day":18,"week":4,"theme":"Accessible Public Transport and Urban Inclusion","focus":"Speaking: fluency and elaboration","claim":"Transport accessibility should be assessed across complete journeys rather than by geographic proximity or equipment counts alone.","evidence":"Similar numbers of stops produced unequal usability because ramps, low-floor buses and transfer reliability differed.","caveat":"A nominally accessible lift or travel app is inadequate when unavailable or inaccessible in practice.","response":"Audit origin-to-destination journeys with users and publish accessible real-time alternatives.","storageKey":"toefl110day18-diversity-v3","notice":"CITY TRANSIT AUTHORITY — ACCESSIBLE ROUTE UPDATE\n\nThe lift at Central Station's west entrance will be closed from Monday through Thursday for repairs. Step-free access remains available at the east entrance, approximately 250 meters from the usual stop. A temporary signposted route connects the bus platforms to the east lift.\n\nPassengers who need assistance may call the transit support line at least 30 minutes before arrival. The rail service itself will operate on its normal timetable. Bus Route 18 has not changed its stopping pattern.","academicPassage":"A public transport network can look extensive on a map while remaining difficult to use for some passengers. A station may appear close to a home, yet the route to its entrance might involve a staircase, a steep pavement, or a crossing without an audible signal. Counting stations within walking distance does not fully describe access.\n\nTransport planners increasingly distinguish geographic coverage from usable accessibility. In one evaluation, two neighborhoods had similar numbers of bus stops. However, the district with low-floor buses and reliable ramps enabled more residents with mobility impairments to complete a trip independently. The difference was not primarily how far passengers lived from a stop, but what happened when they tried to board and make a transfer.\n\nReliability matters as much as design. A lift listed as accessible offers little benefit when it is frequently out of service and no alternative route is communicated. Likewise, real-time information is helpful only if it can be understood by people using screen readers or other assistive technologies.\n\nImproving accessibility therefore involves more than buying new vehicles. Agencies must observe journeys from origin to destination, including sidewalks, ticket machines, transfers, and the final approach to a building. Consultation with disabled passengers can reveal barriers that routine engineering inspections miss. A well-designed policy evaluates completed journeys and user independence rather than simply reporting how many stops have a ramp.","readingClozePassage":"A city transit map showed that two neighborhoods had similar access to bus stops. During a fie__ study, obser____ accompanied passe_____ with diffe____ mobility nee__ along comp____ journeys. Th__ discovered th__ some sto__ had work___ ramps, while others required difficult transfers or long detours. The map's distance measure had overlooked these practical obstacles. The planning team added information about lifts, sidewalks, and service disruptions to its evaluation. What seemed equally accessible on paper turned out to be very different when tested in everyday travel.","cloze":[{"partial":"fie__","answer":"field","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"obser____","answer":"observers","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"passe_____","answer":"passengers","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"diffe____","answer":"different","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"nee__","answer":"needs","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"comp____","answer":"complete","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"Th__","answer":"they","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"th__","answer":"that","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"sto__","answer":"stops","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"work___","answer":"working","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"}],"questions":{"rd":[{"q":"Which part of Central Station is affected by the repair work?","options":["The entire rail line through the city.","The lift at the west entrance.","The timetable for Bus Route 18.","The east entrance lift and all bus platforms."],"answer":1,"why":"실생활 공지의 해당 조건을 찾아 확인하세요. The lift at the west entrance."},{"q":"What should a passenger requesting personal assistance do?","options":["Call the support line at least thirty minutes before arrival.","Purchase a separate accessible boarding ticket.","Wait at the closed west lift without contacting staff.","Use a staircase because the east lift is unavailable."],"answer":0,"why":"공지의 별도 요건 또는 예외 조항에 명시된 행동은 Call the support line at least thirty minutes before arrival.입니다."},{"q":"What service remains unchanged during the Central Station lift repair?","options":["The availability of the west entrance lift.","The number of station staff on overnight duty.","The length of the temporary step-free detour.","Rail service and the Bus Route 18 stopping pattern."],"answer":3,"why":"공지의 예외 조항과 구체적인 적용 범위를 비교해야 합니다. 정답 근거: Rail service and the Bus Route 18 stopping pattern."}],"ra":[{"q":"In the comparison, which conclusion does the author defend most carefully in the passage on Accessible Public Transport and Urban Inclusion?","options":["Purchase of new vehicles is sufficient without checking sidewalks and transfers.","Nearby stops guarantee that every resident can use the route independently.","Transport accessibility should be assessed across complete journeys rather than by geographic proximity or equipment counts alone.","A ramp shown on a network map never becomes unavailable."],"answer":2,"why":"중심 논지는 세부 사례에서 도출되는 가장 신중한 결론입니다. Transport accessibility should be assessed across complete journeys rather than by geographic proximity or equipment counts alone."},{"q":"What specific observation in the accessible public transport and urban inclusion case motivates the discussion?","options":["A ramp shown on a network map never becomes unavailable.","Similar numbers of stops produced unequal usability because ramps, low-floor buses and transfer reliability differed.","Nearby stops guarantee that every resident can use the route independently.","Purchase of new vehicles is sufficient without checking sidewalks and transfers."],"answer":1,"why":"지문의 사례·대조 정보를 직접 확인해야 합니다. Similar numbers of stops produced unequal usability because ramps, low-floor buses and transfer reliability differed."},{"q":"Which qualification prevents the evidence about transport accessibility from supporting an unconditional claim?","options":["A nominally accessible lift or travel app is inadequate when unavailable or inaccessible in practice.","Purchase of new vehicles is sufficient without checking sidewalks and transfers.","Nearby stops guarantee that every resident can use the route independently.","A ramp shown on a network map never becomes unavailable."],"answer":0,"why":"한계 조건은 곧바로 틀린 결론이라는 뜻이 아니라 적용 범위를 제한합니다. A nominally accessible lift or travel app is inadequate when unavailable or inaccessible in practice."},{"q":"How does the example in the passage refine the broad claim about transport accessibility?","options":["The example eliminates the need to compare evidence about transport accessibility with alternative explanations.","It lists the sequence of transport accessibility observations without contributing to the author’s main point.","The example proves that the implications of transport accessibility hold in every possible location.","It illustrates a specific relationship involving transport accessibility while establishing the boundaries of the wider argument."],"answer":3,"why":"사례는 범위가 제한된 관찰 또는 비교를 통해 주장을 구체화하고 무조건적 일반화를 피하도록 돕습니다."},{"q":"Which investigation or action would best extend the reasoning about accessible public transport and urban inclusion?","options":["Nearby stops guarantee that every resident can use the route independently.","A ramp shown on a network map never becomes unavailable.","Audit origin-to-destination journeys with users and publish accessible real-time alternatives.","Purchase of new vehicles is sufficient without checking sidewalks and transfers."],"answer":2,"why":"추가 검증은 근거의 결함을 직접 보완하거나 대안 설명을 시험해야 합니다. Audit origin-to-destination journeys with users and publish accessible real-time alternatives."}],"rp":[{"q":"In the accessible public transport and urban inclusion passage, what does “geographic” most nearly mean in context?","options":["concerning only money and budgets","relating to place and location","depending solely on the time of day","guaranteed in every environment"],"answer":1,"why":"단어의 문맥상 의미를 판단해야 하며 직역만으로 결정하지 않습니다. geographic ≈ relating to place and location"},{"q":"A station has an accessible lift that is frequently out of service. Which evaluation is most informative?","options":["Whether passengers can complete real journeys reliably using alternatives.","The paint color used on the lift doors.","Only the distance from nearby buildings to the station.","The number of lifts listed as accessible on paper."],"answer":0,"why":"새 상황에 지문 원리를 적용하는 고난도 추론 문항입니다. Whether passengers can complete real journeys reliably using alternatives."}],"lq":[{"q":"Which response best addresses the speaker’s question about transport accessibility?","options":["Bus Route 18 runs every half hour.","The rail timetable has not changed.","No, all station entrances are closed.","Yes, use the temporary route to the east entrance’s working lift."],"answer":3,"why":"화자는 전제를 확인하고 있으므로 직접적인 정정과 관련 조건 설명이 적절합니다."}],"lc":[{"q":"What brings the first speaker to the conversation concerning transport accessibility?","options":["An invitation to deliver a formal lecture explaining accessible public transport and urban inclusion.","A plan to evaluate unrelated applicants for a different university program.","whether a closed west entrance forces a passenger to use stairs","A request for the institution to change the academic field under discussion."],"answer":2,"why":"대화의 도입부에서 상대가 확인하려는 문제를 파악합니다. whether a closed west entrance forces a passenger to use stairs"},{"q":"What does the second speaker clarify about the issue raised in the accessible public transport and urban inclusion dialogue?","options":["A ramp shown on a network map never becomes unavailable.","a step-free route remains available through the east entrance","Nearby stops guarantee that every resident can use the route independently.","Purchase of new vehicles is sufficient without checking sidewalks and transfers."],"answer":1,"why":"Not necessarily, No, Exactly와 같은 정정 이후의 내용을 확인합니다. a step-free route remains available through the east entrance"},{"q":"What will the first speaker most likely do after the discussion about transport accessibility?","options":["use the temporary route and report outdated app information","Disregard the advice and continue on the original assumption.","Withdraw permanently from all activities discussed.","Replace the entire project with an unrelated topic without consulting anyone."],"answer":0,"why":"마지막 발화에서 다음 행동을 추론합니다. use the temporary route and report outdated app information"}],"la":[{"q":"What practical change or instruction is listeners expected to notice in the announcement about transport accessibility?","options":["The east entrance lift and all bus platforms.","The entire rail line through the city.","The timetable for Bus Route 18.","The lift at the west entrance."],"answer":3,"why":"공지의 장소·시간·적용 조건을 듣고 핵심 변경사항을 선택합니다. The lift at the west entrance."},{"q":"Which additional requirement applies to listeners in the accessible public transport and urban inclusion announcement?","options":["Purchase a separate accessible boarding ticket.","Use a staircase because the east lift is unavailable.","Call the support line at least thirty minutes before arrival.","Wait at the closed west lift without contacting staff."],"answer":2,"why":"보편적인 안내와 특정 조건에 해당하는 행동을 구별해야 합니다. Call the support line at least thirty minutes before arrival."}],"lt":[{"q":"Which statement best summarizes the lecturer’s explanation of accessible public transport and urban inclusion?","options":["A ramp shown on a network map never becomes unavailable.","Transport accessibility should be assessed across complete journeys rather than by geographic proximity or equipment counts alone.","Nearby stops guarantee that every resident can use the route independently.","Purchase of new vehicles is sufficient without checking sidewalks and transfers."],"answer":1,"why":"강의 중심 개념과 화자의 제한된 결론을 종합합니다. Transport accessibility should be assessed across complete journeys rather than by geographic proximity or equipment counts alone."},{"q":"What role does the lecturer’s example of transport accessibility play in the explanation?","options":["Similar numbers of stops produced unequal usability because ramps, low-floor buses and transfer reliability differed.","A ramp shown on a network map never becomes unavailable.","Nearby stops guarantee that every resident can use the route independently.","Purchase of new vehicles is sufficient without checking sidewalks and transfers."],"answer":0,"why":"강의 사례는 개념을 구체화하는 관측 자료 또는 비교입니다. Similar numbers of stops produced unequal usability because ramps, low-floor buses and transfer reliability differed."},{"q":"What caution does the lecturer introduce after describing evidence related to transport accessibility?","options":["Purchase of new vehicles is sufficient without checking sidewalks and transfers.","Nearby stops guarantee that every resident can use the route independently.","A ramp shown on a network map never becomes unavailable.","A nominally accessible lift or travel app is inadequate when unavailable or inaccessible in practice."],"answer":3,"why":"화자가 However, but 등으로 도입하는 예외를 듣는 것이 핵심입니다. A nominally accessible lift or travel app is inadequate when unavailable or inaccessible in practice."},{"q":"How would the lecturer most likely advise someone evaluating transport accessibility in a new setting?","options":["Purchase of new vehicles is sufficient without checking sidewalks and transfers.","Nearby stops guarantee that every resident can use the route independently.","Audit origin-to-destination journeys with users and publish accessible real-time alternatives.","A ramp shown on a network map never becomes unavailable."],"answer":2,"why":"강의의 마무리에서 제안하는 연구·실행 원칙을 응용합니다. Audit origin-to-destination journeys with users and publish accessible real-time alternatives."}]},"audio":{"lq":"The west lift is closed; is there still a step-free way to reach the platform?","lc":"Passenger: The route planner says Central Station is accessible, but the lift at the west entrance is closed. Am I supposed to use the stairs?\nTransit Agent: No. The east entrance still has a working lift, though you'll need to follow a temporary route from the bus platforms.\nPassenger: The sign on my app doesn't mention that route.\nTransit Agent: I'm sorry. The website was updated first, and the app may still be showing older information.\nPassenger: Could someone help me with the transfer if I call ahead?\nTransit Agent: Yes, the support team asks for about thirty minutes' notice so someone can meet you.\nPassenger: Then I'll use the east entrance and report the outdated app notice.\nTransit Agent: Thank you. That information needs to be consistent for everyone.","la":"Passengers using Central Station, please note that the west entrance lift is temporarily out of service for repairs. For step-free access, follow the signs from the bus platforms to the east entrance, where the lift remains operational. Rail and bus schedules have not changed. Passengers requesting personal assistance should contact the transit support line at least thirty minutes before arrival. We apologize for the additional walking distance.","lt":"Transport maps are useful, but they can hide barriers. Imagine living just two hundred meters from a station. If reaching the platform requires a staircase, the station may not be usable for you at all.\n\nIn one city comparison, two districts had nearly the same number of bus stops. Yet the district with reliable low-floor buses and working ramps allowed more people to travel independently. The difference became clear only when researchers followed entire journeys, including transfers.\n\nInformation is another part of accessibility. An accessible lift that is out of service needs an alternative route, and passengers must be able to learn about it through different formats.\n\nWhen planners measure success, counting accessible vehicles is only a starting point. The stronger question is whether passengers can complete everyday trips predictably, safely and without unnecessary dependence on others."},"speaking":{"repeat":["Welcome to the workshop on transport accessibility.","The lift at Central Station's west entrance will be closed from Monday through Thursday for repairs.","The instructor asked us to compare the evidence about transport accessibility before drawing conclusions.","Similar numbers of stops produced unequal usability because ramps, low-floor buses and transfer reliability differed.","A nominally accessible lift or travel app is inadequate when unavailable or inaccessible in practice.","Audit origin-to-destination journeys with users and publish accessible real-time alternatives.","Although it might initially seem that nearby stops guarantee that every resident can use the route independently, the evidence instead suggests that transport accessibility should be assessed across complete journeys rather than by geographic proximity or equipment counts alone."],"interviews":["What first interested you in urban mobility / social policy, and how would you explain that interest to a friend?","Tell me about a time when a practical decision involving transport accessibility was more complicated than you expected.","Do you think universities should give more attention to transport accessibility in introductory courses? Explain your reasoning.","Imagine a classmate disagrees with your interpretation of transport accessibility. How would you respond respectfully and precisely?"],"sample":"Accessibility is something I have become more aware of when using public transportation. A station can look convenient on a map, yet a broken lift or unclear temporary route may make it difficult for someone to complete a trip. If I were working in city planning, I would ask passengers with different mobility needs to test entire journeys, including transfers and the final walk to their destination. I would also prioritize accurate real-time information because a feature that exists only on paper is not very useful. To me, good accessibility means people can travel independently and predictably, not merely that equipment has been installed."},"writing":{"build":[{"fragments":"Could you tell me / session has been rescheduled / whether the transport accessibility","answer":"Could you tell me whether the transport accessibility session has been rescheduled?","why":"간접 의문문 어순의 문장 구조와 주어-동사 관계를 확인하세요."},{"fragments":"the low-floor bus records / The student who reviewed / noticed an important discrepancy","answer":"The student who reviewed the low-floor bus records noticed an important discrepancy.","why":"관계절로 설명 추가의 문장 구조와 주어-동사 관계를 확인하세요."},{"fragments":"different conclusion / the boarding ramp evidence earlier, / If the team had checked / it might have reached a","answer":"If the team had checked the boarding ramp evidence earlier, it might have reached a different conclusion.","why":"조건절로 가능성 제시의 문장 구조와 주어-동사 관계를 확인하세요."},{"fragments":"to transport accessibility had been / Only after the records related / examined did the committee approve / the report","answer":"Only after the records related to transport accessibility had been examined did the committee approve the report.","why":"Only after 도치의 문장 구조와 주어-동사 관계를 확인하세요."},{"fragments":"but also a clear account / requires not only reliable evidence / A project involving transport accessibility / of its limitations","answer":"A project involving transport accessibility requires not only reliable evidence but also a clear account of its limitations.","why":"Not only A but also B 병렬의 문장 구조와 주어-동사 관계를 확인하세요."}],"emailTask":"You depend on a step-free route through Central Station but discovered that the transit app did not show a temporary lift closure. Email the transit accessibility team to describe the problem, explain its effect on your journey, and request that alternative routes be published in accessible formats.","emailSample":"Dear Transit Accessibility Team,\n\nI encountered a problem at Central Station yesterday. The route-planning app still directed me to the west entrance lift, although that lift was closed for repairs. I was able to find the east entrance eventually, but the unexpected detour made me late and would have been difficult without assistance.\n\nCould the app and station notices be updated to identify the temporary step-free route clearly? Please also advise whether this information is available in a format compatible with screen readers. Accurate advance notice would help passengers plan journeys independently.\n\nThank you for considering this improvement.\n\nKind regards,\nAlex","discussionTask":"Professor: Should cities prioritize upgrading more stations or ensuring reliable accessibility at stations already equipped?\n\nStudent A — Emily: Expanding accessibility to previously excluded neighborhoods would help more residents reach services.\n\nStudent B — Daniel: Maintaining lifts, ramps and accurate real-time notices is essential because unreliable access can make a route unusable.","discussionSample":"Reliable accessibility should come before an ambitious count of stations labeled accessible on a map. A working lift, a clear alternative route and accurate information can determine whether a passenger completes a journey independently. If a city installs ramps at additional stations while existing ones are frequently unusable, its reported progress may not translate into real mobility. That said, network expansion still matters for neighborhoods with no accessible stations nearby. I would recommend funding basic maintenance and real-time reporting as mandatory safeguards while planning upgrades according to the number of people currently excluded. Success should be measured through complete journeys, including transfers and the final approach to a destination, rather than through equipment inventories alone."},"vocabulary":[{"term":"step-free access","meaning":"계단 없는 접근","collocation":"provide step-free access","example":"The instructor proposed that transport planners should first provide step-free access and then compare outcomes.","synonym":"access without stairs","nuance":"","group":"core"},{"term":"low-floor bus","meaning":"저상버스","collocation":"operate a low-floor bus","example":"When the initial explanation failed, transport planners returned to the data to operate a low-floor bus.","synonym":"bus with a lowered floor","nuance":"","group":"core"},{"term":"boarding ramp","meaning":"승차 경사로","collocation":"deploy a boarding ramp","example":"The group discovered that it was possible to deploy a boarding ramp without assuming a single cause.","synonym":"equipment bridging the curb and vehicle","nuance":"","group":"core"},{"term":"transfer reliability","meaning":"환승 신뢰성","collocation":"improve transfer reliability","example":"A second research team challenged transport planners to improve transfer reliability with different assumptions.","synonym":"dependability of transfers","nuance":"","group":"core"},{"term":"audible signal","meaning":"음성 신호","collocation":"install an audible signal","example":"The revised protocol gave transport planners a systematic way to install an audible signal.","synonym":"sound-based alert","nuance":"","group":"core"},{"term":"accessible route","meaning":"무장애 이동경로","collocation":"map an accessible route","example":"To address a practical difficulty, transport planners chose to map an accessible route under controlled conditions.","synonym":"route usable with accessibility needs","nuance":"","group":"core"},{"term":"journey audit","meaning":"이동 전과정 점검","collocation":"conduct a journey audit","example":"It proved especially important for transport planners to conduct a journey audit during the second assessment.","synonym":"inspection of a complete journey","nuance":"","group":"core"},{"term":"lift outage","meaning":"엘리베이터 고장","collocation":"report a lift outage","example":"In response to the reviewers, transport planners agreed to report a lift outage using an explicit procedure.","synonym":"out-of-service elevator","nuance":"","group":"core"},{"term":"travel-time penalty","meaning":"추가 소요시간 부담","collocation":"estimate a travel-time penalty","example":"A single unexpected result persuaded transport planners to estimate a travel-time penalty more carefully.","synonym":"additional time spent traveling","nuance":"","group":"core"},{"term":"mobility impairment","meaning":"이동 장애","collocation":"accommodate a mobility impairment","example":"When the instruments returned inconsistent readings, transport planners attempted to accommodate a mobility impairment.","synonym":"difficulty moving independently","nuance":"","group":"core"},{"term":"last-mile access","meaning":"마지막 구간 접근성","collocation":"improve last-mile access","example":"The supervising committee asked transport planners to improve last-mile access and explain the criteria.","synonym":"connection to the final destination","nuance":"","group":"core"},{"term":"real-time notice","meaning":"실시간 안내","collocation":"issue a real-time notice","example":"Only after a careful review could transport planners begin to issue a real-time notice.","synonym":"current notice about service","nuance":"","group":"core"},{"term":"independent travel","meaning":"독립적 이동","collocation":"enable independent travel","example":"Under the new conditions, transport planners were asked to enable independent travel at an earlier stage.","synonym":"ability to travel without help","nuance":"","group":"core"},{"term":"accessibility standard","meaning":"접근성 기준","collocation":"meet an accessibility standard","example":"The long-term monitoring plan required transport planners to meet an accessibility standard at regular intervals.","synonym":"minimum accessibility requirement","nuance":"","group":"core"},{"term":"alternative entrance","meaning":"대체 출입구","collocation":"identify an alternative entrance","example":"At the discussion session, transport planners explained their decision to identify an alternative entrance.","synonym":"different usable entry point","nuance":"","group":"core"},{"term":"universal access","meaning":"보편적 접근","collocation":"promote universal access","example":"The available resources enabled transport planners to promote universal access during the pilot study.","synonym":"access for all users","nuance":"","group":"advanced"},{"term":"service reliability","meaning":"서비스 신뢰성","collocation":"improve service reliability","example":"Although the preliminary results seemed convincing, transport planners still needed to improve service reliability.","synonym":"consistency of service","nuance":"","group":"advanced"},{"term":"barrier-free design","meaning":"무장애 설계","collocation":"implement barrier-free design","example":"Because the evidence was incomplete, transport planners agreed to implement barrier-free design again before deciding.","synonym":"design without avoidable obstacles","nuance":"","group":"advanced"},{"term":"route continuity","meaning":"이동경로 연속성","collocation":"assess route continuity","example":"The report identified an overlooked opportunity for transport planners to assess route continuity.","synonym":"uninterrupted accessible pathway","nuance":"","group":"advanced"},{"term":"inclusive mobility","meaning":"포용적 이동성","collocation":"support inclusive mobility","example":"After examining competing accounts, transport planners were prepared to support inclusive mobility.","synonym":"travel options suitable for different needs","nuance":"","group":"advanced"},{"term":"transport disadvantage","meaning":"교통 소외","collocation":"reduce transport disadvantage","example":"One limitation of the project was that transport planners could not yet reduce transport disadvantage reliably.","synonym":"disadvantage caused by transport gaps","nuance":"","group":"advanced"},{"term":"accessible information","meaning":"접근 가능한 정보","collocation":"publish accessible information","example":"A later review prompted transport planners to publish accessible information, rather than accept the initial explanation.","synonym":"guidance in accessible formats","nuance":"","group":"advanced"},{"term":"physical obstacle","meaning":"물리적 장애물","collocation":"remove a physical obstacle","example":"Over a semester of fieldwork, transport planners learned how to remove a physical obstacle.","synonym":"material obstruction","nuance":"","group":"advanced"},{"term":"journey completion","meaning":"이동과정 완수","collocation":"track journey completion","example":"In their final presentation, transport planners described what it meant to track journey completion.","synonym":"successfully finishing a journey","nuance":"","group":"advanced"},{"term":"user independence","meaning":"이용자 독립성","collocation":"preserve user independence","example":"Careful documentation enabled transport planners to preserve user independence without repeating the same mistake.","synonym":"freedom to move on one's own","nuance":"","group":"advanced"},{"term":"service disruption","meaning":"서비스 중단","collocation":"report service disruptions","example":"In a subsequent case, transport planners had to report service disruptions under rather different conditions.","synonym":"interruption to normal service","nuance":"","group":"advanced"},{"term":"alternative passage","meaning":"대체 통로","collocation":"mark an alternative passage","example":"The final recommendation urged transport planners to mark an alternative passage before proceeding.","synonym":"different route through a station","nuance":"","group":"advanced"},{"term":"mobility equity","meaning":"이동 형평성","collocation":"evaluate mobility equity","example":"In the first trial, transport planners were not yet able to evaluate mobility equity consistently.","synonym":"fairness in transport access","nuance":"","group":"advanced"},{"term":"multimodal access","meaning":"다수단 접근","collocation":"coordinate multimodal access","example":"The absence of reliable records made it difficult for transport planners to coordinate multimodal access.","synonym":"use of several travel modes","nuance":"","group":"advanced"},{"term":"on-the-ground audit","meaning":"현장 점검","collocation":"conduct an on-the-ground audit","example":"The project team provided a checklist to help transport planners conduct an on-the-ground audit.","synonym":"inspection in real-world conditions","nuance":"","group":"advanced"}],"meta":{"sourceType":"original practice content","etsOfficial":false,"benchmark":"TOEFL iBT January 2026 task-type descriptions / ETS sample 1","studyMinutes":120,"revision":"2026-11-23-diversity-v3","discipline":"Urban Mobility / Social Policy","genre":"comparison"}};</script>
