<script>window.TOEFL_LESSON={"day":3,"week":1,"theme":"Peer Review and Replication","focus":"유형 전환과 진단","claim":"Independent replication can reveal limitations that conventional peer review overlooks.","evidence":"Researchers who reproduce results across laboratories can distinguish robust findings from fragile ones.","caveat":"Replication attempts may fail because methods were insufficiently documented rather than because the original conclusion was false.","response":"Institutions should reward careful replication and detailed methodological reporting.","storageKey":"toefl110day3-fourweek-v1","notice":"NOTICE — Peer Review and Replication Workshop\n\nThe Graduate Research Office confirms that the peer review and replication workshop will begin at 2:00 p.m. on Friday in Science Library Room 103. The original reservation in the Main Library has changed because the room's audiovisual equipment is undergoing maintenance. Previously confirmed registrations remain valid.\n\nParticipants planning to join the practical demonstration must finish the online safety orientation and submit their confirmation by Thursday at 3 p.m.. Visitors who miss this deadline may attend the introductory lecture, but they cannot enter the restricted demonstration room. Please bring a laptop and check your university email for any final updates.","academicPassage":"Peer Review and Replication poses a broader question about how researchers should interpret evidence before adopting a confident public position. Independent replication can reveal limitations that conventional peer review overlooks. This position is attractive because it identifies a practical opportunity, but an attractive explanation is not the same as a well-tested one. Researchers must specify exactly what is being measured and what result would count as meaningful support for the hypothesis.\n\nA growing body of case-based inquiry highlights this distinction. Researchers who reproduce results across laboratories can distinguish robust findings from fragile ones. The observation is relevant because it suggests a concrete pattern that a systematic investigation could examine. However, an association reported in one setting does not automatically establish that the same relationship will hold elsewhere. The sampling frame, the measurement method, and the conditions under which data were collected all influence the interpretation.\n\nA further complication concerns alternative explanations. Replication attempts may fail because methods were insufficiently documented rather than because the original conclusion was false. This limitation does not make the evidence worthless, but it changes the strength of the conclusion that a responsible analyst can draw. For example, a pattern that appears persuasive in an initial comparison might weaken once investigators account for selection effects, missing records, or a different baseline. The problem is not merely whether a result is statistically detectable; it is whether competing accounts have been evaluated fairly.\n\nBetter inquiry therefore combines careful measurement with transparent reasoning. Institutions should reward careful replication and detailed methodological reporting. Researchers can strengthen such an approach by comparing independent sources, documenting assumptions, and identifying the conditions under which an apparent effect might disappear. It is especially valuable to explain not only the preferred interpretation but also what evidence would lead one to revise that interpretation.\n\nThe central lesson is that high-quality reasoning is proportional: the strength of the claim must reflect the scope and reliability of the evidence. An informed decision can still be made under uncertainty, provided that relevant limitations and trade-offs remain visible.","readingClozePassage":"In a review of peer review and replication, scholars emphasized the value of robus_____ (1) before interpreting their results. They acknowledged that syste_____ (2) may be affected by unseen assumptions. The paper proposed a indep_____ (3) through which evidence could be examined. Reviewers asked whether inter_____ (4) justified the conclusions. They also distinguished a central compa_____ (5) from peripheral observations. Finally, they offered a subst_____ (6) rather than presenting one interpretation as certain.","cloze":[{"partial":"robus_____","answer":"robust assessment","meaning":"강건한 평가"},{"partial":"syste_____","answer":"systematic inference","meaning":"체계적 추론"},{"partial":"indep_____","answer":"independent framework","meaning":"독립적 체계"},{"partial":"inter_____","answer":"interdisciplinary evidence","meaning":"학제 간 근거"},{"partial":"compa_____","answer":"comparative claim","meaning":"비교적 주장"},{"partial":"subst_____","answer":"substantive interpretation","meaning":"실질적 해석"}],"questions":{"rd":[{"q":"What has changed about the workshop?","options":["The workshop has been canceled.","The venue has changed, but the time remains the same.","Participants must register again.","Only the online segment will take place."],"answer":1,"why":"공지에 장소가 변경되었지만 이전 등록은 유효하고 오후 2시 시작임이 명시됩니다."},{"q":"Who may enter the practical demonstration?","options":["Any person who brings a laptop.","Only participants who have completed the required orientation and submitted confirmation by the deadline.","Participants who arrive during the lecture.","Visitors who have not received a university email."],"answer":1,"why":"실습 참여에는 안전교육과 기한 내 확인서 제출이 모두 필요합니다."},{"q":"What can a participant without clearance still do?","options":["Lead the demonstration.","Operate restricted equipment.","Attend the introductory lecture.","Use the demonstration room after hours."],"answer":2,"why":"안전 승인이 없어도 소개 강의에는 참석할 수 있다는 예외가 있습니다."}],"ra":[{"q":"Which statement best expresses the passage's central claim?","options":["All new methods should be rejected until every uncertainty is eliminated.","Useful evidence requires carefully qualified conclusions and attention to limitations.","The same research findings apply to every population.","Practical decisions should rely on initial impressions."],"answer":1,"why":"중심 논지는 활용 가능한 증거의 가치와 주장 강도의 균형입니다."},{"q":"Why is the evidence described in the second paragraph relevant?","options":["It proves every proposed mechanism.","It removes the need for a comparison group.","It identifies an observable pattern that researchers can investigate systematically.","It demonstrates that alternative explanations are impossible."],"answer":2,"why":"관측은 체계적으로 검증할 수 있는 패턴을 제시하지만 단독으로 인과를 입증하지는 않습니다."},{"q":"What qualification does the author emphasize?","options":["Unmeasured factors and contextual differences can change the interpretation.","All observed associations are meaningless.","A larger sample always establishes causality.","Statistical significance guarantees practical importance."],"answer":0,"why":"측정 방식과 표본, 경쟁 설명을 검토해야 한다는 한계를 강조합니다."},{"q":"What would most strengthen an investigator's conclusion?","options":["Removing all critical comments from the report.","Repeating the original claim more confidently.","Avoiding alternative interpretations.","Documenting assumptions and testing the interpretation against independent evidence."],"answer":3,"why":"독립적 근거 검증과 가정 공개가 결론의 신뢰도를 높입니다."},{"q":"What can be inferred from the final paragraph?","options":["Uncertainty always prevents action.","A confident statement is preferable to an accurate statement.","Decision-making can be responsible even when evidence is incomplete.","Only experimental evidence has any value."],"answer":2,"why":"불확실성 자체가 판단의 금지는 아니며 한계를 명확히 밝혀야 합니다."}],"rp":[{"q":"Which revision would most improve the statement 'This method is definitely effective'?","options":["Every method is ineffective.","The available evidence suggests a possible benefit, although relevant limitations remain.","There is no reason to analyze the results.","The study proves that contextual factors never matter."],"answer":1,"why":"강한 단정을 조건부 주장으로 수정하는 것이 적절합니다."},{"q":"Which additional investigation best addresses an alternative explanation?","options":["Collect additional evidence in a comparable setting and report competing interpretations.","Repeat the original explanation without new measurements.","Exclude contradictory observations without explanation.","Replace all numerical results with opinions."],"answer":0,"why":"경쟁 설명을 직접 검증해야 해석의 정밀도가 높아집니다."}],"lq":[{"q":"What is the most appropriate response to the speaker?","options":["It begins in the main auditorium.","Not quite. The room changed, and the orientation still needs confirmation.","The workshop covers several research areas.","I prefer taking courses online."],"answer":1,"why":"Not quite로 상대의 오해를 완곡하게 바로잡으면서 현재 조건을 설명합니다."}],"lc":[{"q":"What does the student want to confirm?","options":["Whether the university will cancel the term.","Whether the coordinator can grade the final exam.","Whether the group can attend the practical component of a workshop.","Whether the speaker's article will be published."],"answer":2,"why":"대화는 실습 참가 가능 여부 확인에 관한 것입니다."},{"q":"Why is the reservation still conditional?","options":["The student lacks a library card.","One team member has not submitted the required orientation confirmation.","The meeting room is permanently closed.","The coordinator has not read the email."],"answer":1,"why":"완료 확인이 아직 제출되지 않았으므로 조건부 상태입니다."},{"q":"What should the student do next?","options":["Send the completed orientation record before the deadline.","Restart the application from the beginning.","Cancel the project.","Wait without contacting anyone."],"answer":0,"why":"코디네이터가 새로운 신청 대신 확인서 전달을 요청합니다."}],"la":[{"q":"What is the announcement primarily intended to do?","options":["Clarify a room change and access conditions.","Introduce a new university major.","Report on final examination scores.","Announce the closing of the research office."],"answer":0,"why":"공지 방송은 장소와 접근 조건을 명확히 하기 위한 것입니다."},{"q":"What does the speaker imply about participants without clearance?","options":["They can enter the lab without restrictions.","Their registration has been canceled.","They must pay an additional fee.","They can attend the lecture, but not the practical demonstration."],"answer":3,"why":"소개 강의는 참여 가능하지만 실습 구역은 제한됩니다."}],"lt":[{"q":"What is the lecturer's main point?","options":["Researchers must reject every uncertain finding.","One method can solve all problems in the field.","Claims should reflect the quality of evidence and the alternatives considered.","Historical evidence is always unreliable."],"answer":2,"why":"강의는 근거에 비례한 주장과 대안 검토를 강조합니다."},{"q":"Why does the lecturer mention a possible alternative explanation?","options":["To prove that all investigations are biased.","To show why an observed relationship may not establish causation.","To argue against all forms of measurement.","To announce that the original data have disappeared."],"answer":1,"why":"관측된 관계가 유일한 원인을 입증하지 않는다는 사실을 설명합니다."},{"q":"Which point is supported by the lecture?","options":["A single observation is always sufficient.","Strong assumptions need not be reported.","Uncertainty cannot be measured or discussed.","Documenting assumptions makes an interpretation easier to evaluate."],"answer":3,"why":"가정과 제한조건을 투명하게 공개하면 평가 가능성이 높아집니다."},{"q":"What approach would the lecturer most likely recommend?","options":["Compare independent evidence and revisit conclusions when necessary.","Strengthen claims regardless of the data.","Exclude counterexamples from a final report.","Apply all findings universally."],"answer":0,"why":"새 근거가 나오면 결론을 수정할 수 있도록 하는 신중한 접근입니다."}]},"audio":{"lq":"Student: I was under the impression that the practical workshop had already been approved. Is that right?","lc":"Student: Hi, I'm preparing for the peer review and replication workshop. Could you confirm whether our group can attend the practical session?\nCoordinator: I can see your registration, but the practical component is still conditional.\nStudent: Was there a problem with our application?\nCoordinator: Not exactly. One team member still needs to provide confirmation of the online orientation. The procedure protects the equipment and makes sure participants understand the rules.\nStudent: She attended a similar training session at another university. Would that count?\nCoordinator: I'm afraid not. Our laboratory has different local requirements. If she completes the online module and sends us the confirmation before Thursday at 3 p.m., we can finalize the reservation.\nStudent: Should I submit the entire application again?\nCoordinator: No, that won't be necessary. Just forward the orientation record and we will update the existing booking.","la":"Attention, participants registered for the peer review and replication workshop. The event will now take place in Science Library Room 103, beginning at 2 p.m. on Friday. This is a venue change, not a change in schedule. Please note that attendance at the hands-on demonstration requires completed safety orientation and confirmation submitted by Thursday at 3 p.m.. Those without clearance are welcome at the introductory lecture but cannot enter the restricted demonstration room. Thank you for your cooperation.","lt":"Today we're examining peer review and replication, and I want to begin with a common misunderstanding. People sometimes assume that a persuasive initial observation is equivalent to a demonstrated explanation. In research, those are very different things.\n\nIndependent replication can reveal limitations that conventional peer review overlooks. What makes this idea worth investigating is the possibility of identifying a useful pattern. Researchers who reproduce results across laboratories can distinguish robust findings from fragile ones. Notice, however, that this result is not proof that one factor caused another. If the sample differs in an important way, the apparent result might change.\n\nA second concern is how we interpret limitations. Replication attempts may fail because methods were insufficiently documented rather than because the original conclusion was false. An alternative explanation is not automatically the correct explanation, but ignoring it would make our conclusion less credible. In fact, strong research often becomes more convincing when investigators openly describe what the data cannot establish.\n\nSo how should an institution respond? Institutions should reward careful replication and detailed methodological reporting. The aim is to compare evidence from different sources, state assumptions clearly, and decide whether a claim is strong enough for the practical decision being made. In other words, uncertainty should lead to better reasoning, not to either blind confidence or complete inaction."},"speaking":{"repeat":["The seminar on peer review and replication begins at two o'clock, although the venue has changed.","The available evidence suggests a meaningful pattern, but it does not establish a definitive explanation.","Independent replication can reveal limitations that conventional peer review overlooks.","Researchers who reproduce results across laboratories can distinguish robust findings from fragile ones.","Replication attempts may fail because methods were insufficiently documented rather than because the original conclusion was false.","Institutions should reward careful replication and detailed methodological reporting."],"interviews":["What is the most important lesson that university students can learn from studying peer review and replication?","Describe a time when you had to reconsider a confident opinion after receiving new evidence.","Should universities require more interdisciplinary courses related to peer review and replication? Why or why not?","How would you explain the main limitation of a study to someone with little background in the field?"],"sample":"I think the most important lesson from peer review and replication is the need to distinguish promising evidence from a conclusion that has been tested rigorously. For example, researchers who reproduce results across laboratories can distinguish robust findings from fragile ones. However, this observation alone cannot resolve every relevant question. Replication attempts may fail because methods were insufficiently documented rather than because the original conclusion was false. In my view, a responsible student should summarize both the benefit and the remaining uncertainty before recommending action. This approach not only improves academic reasoning, but also makes communication more trustworthy."},"writing":{"build":[{"answer":"Only after reviewing the evidence did the committee approve the seminar on peer review and replication.","why":"Only after가 문두에 오면 주절에 도치가 필요합니다.","fragments":"approve the seminar on / Only after reviewing the / peer review and replication / evidence did the committee"},{"answer":"Had the researchers considered alternative explanations, their conclusions might have been more cautious.","why":"Had + 주어 + p.p. 형태의 가정법 과거완료 도치입니다.","fragments":"might have been more / Had the researchers considered / cautious / alternative explanations their conclusions"},{"answer":"The professor whose proposal was selected will explain the limitations of the study.","why":"whose는 소유 관계를 표현하는 관계대명사입니다.","fragments":"the limitations of the / The professor whose proposal / study / was selected will explain"},{"answer":"What the investigators needed to determine was whether the evidence justified a stronger claim.","why":"What절이 주어로 쓰이는 문장입니다.","fragments":"the evidence justified a / What the investigators needed / stronger claim / to determine was whether"},{"answer":"The more carefully researchers document their assumptions, the easier it becomes to evaluate their findings.","why":"The more A, the more B 상관 비교급 구문입니다.","fragments":"easier it becomes to / The more carefully researchers / evaluate their findings / document their assumptions the"}],"emailTask":"You are organizing a university workshop related to peer review and replication. The venue listed on the reservation has become unavailable. Write an email to Student Services that:\n• explains the original plan and the scheduling conflict;\n• requests an accessible room for approximately 18 attendees, with video-conferencing facilities;\n• asks when the new booking can be confirmed.","emailSample":"Dear Student Services Team,\n\nI am writing on behalf of our graduate research group regarding a workshop on peer review and replication scheduled for next Tuesday, from 2:00 to 4:00 p.m.\n\nUnfortunately, the room we originally reserved is no longer available because of an unexpected scheduling conflict. We are expecting approximately 18 participants, including several who will join remotely, so we would appreciate an accessible room with reliable video-conferencing equipment. Ideally, the space should also allow participants to discuss research findings in small groups.\n\nCould you please let us know whether a suitable room is available and when we might expect confirmation? We need to finalize the arrangements with our guest speaker and circulate updated instructions.\n\nThank you for considering our request. I would be grateful for any alternatives you can suggest.\n\nBest regards,\nAlex Kim","discussionTask":"Professor: Our next seminar focuses on peer review and replication. Some instructors argue that universities should make this topic compulsory for all students because it strengthens critical thinking. Others believe students should be free to pursue specialized electives. Which approach do you support?\n\nStudent A — Emily: I favor a required introductory course. Even students in unrelated fields benefit from learning to evaluate evidence and recognize uncertainty.\n\nStudent B — Daniel: I prefer elective courses. A universal requirement could limit students' time for subjects directly relevant to their degrees.","discussionSample":"I largely agree with Emily that universities should introduce every student to the fundamental reasoning skills involved in peer review and replication, although Daniel raises a legitimate concern about rigid degree requirements. Independent replication can reveal limitations that conventional peer review overlooks. Students who examine such claims learn to differentiate a plausible hypothesis from a conclusion supported by adequate evidence. For example, researchers who reproduce results across laboratories can distinguish robust findings from fragile ones. At the same time, replication attempts may fail because methods were insufficiently documented rather than because the original conclusion was false. This reminds us that academic education should emphasize how to question an interpretation, not merely how to remember facts. Rather than imposing one identical course, I would recommend a short common foundation followed by discipline-specific exercises. That approach would preserve flexibility while ensuring that graduates can identify assumptions, address uncertainty, and explain why a decision is reasonable."},"vocabulary":[{"term":"replication protocol","meaning":"재현 연구 절차","collocation":"evaluate replication protocol","example":"The peer review and replication seminar identified replication protocol as an important consideration in interpreting its evidence."},{"term":"registered report","meaning":"사전등록 보고서","collocation":"document registered report","example":"The peer review and replication seminar identified registered report as an important consideration in interpreting its evidence."},{"term":"methodological appendix","meaning":"방법론 부록","collocation":"consider methodological appendix","example":"The peer review and replication seminar identified methodological appendix as an important consideration in interpreting its evidence."},{"term":"independent laboratory","meaning":"독립 연구실","collocation":"evaluate independent laboratory","example":"The peer review and replication seminar identified independent laboratory as an important consideration in interpreting its evidence."},{"term":"analytical workflow","meaning":"분석 작업 흐름","collocation":"document analytical workflow","example":"The peer review and replication seminar identified analytical workflow as an important consideration in interpreting its evidence."},{"term":"reproducible result","meaning":"재현 가능한 결과","collocation":"consider reproducible result","example":"The peer review and replication seminar identified reproducible result as an important consideration in interpreting its evidence."},{"term":"negative finding","meaning":"부정적 연구 결과","collocation":"evaluate negative finding","example":"The peer review and replication seminar identified negative finding as an important consideration in interpreting its evidence."},{"term":"selective reporting","meaning":"선별적 보고","collocation":"document selective reporting","example":"The peer review and replication seminar identified selective reporting as an important consideration in interpreting its evidence."},{"term":"publication incentive","meaning":"출판 유인","collocation":"consider publication incentive","example":"The peer review and replication seminar identified publication incentive as an important consideration in interpreting its evidence."},{"term":"research registry","meaning":"연구 등록부","collocation":"evaluate research registry","example":"The peer review and replication seminar identified research registry as an important consideration in interpreting its evidence."},{"term":"robustness check","meaning":"강건성 점검","collocation":"document robustness check","example":"The peer review and replication seminar identified robustness check as an important consideration in interpreting its evidence."},{"term":"external reviewer","meaning":"외부 심사자","collocation":"consider external reviewer","example":"The peer review and replication seminar identified external reviewer as an important consideration in interpreting its evidence."},{"term":"robust assessment","meaning":"강건한 평가","collocation":"evaluate robust assessment","example":"The research team carefully examined robust assessment when discussing the implications of peer review and replication."},{"term":"systematic inference","meaning":"체계적 추론","collocation":"document systematic inference","example":"The research team carefully examined systematic inference when discussing the implications of peer review and replication."},{"term":"independent framework","meaning":"독립적 체계","collocation":"consider independent framework","example":"The research team carefully examined independent framework when discussing the implications of peer review and replication."},{"term":"interdisciplinary evidence","meaning":"학제 간 근거","collocation":"evaluate interdisciplinary evidence","example":"The research team carefully examined interdisciplinary evidence when discussing the implications of peer review and replication."},{"term":"comparative claim","meaning":"비교적 주장","collocation":"document comparative claim","example":"The research team carefully examined comparative claim when discussing the implications of peer review and replication."},{"term":"substantive interpretation","meaning":"실질적 해석","collocation":"consider substantive interpretation","example":"The research team carefully examined substantive interpretation when discussing the implications of peer review and replication."},{"term":"qualitative assumption","meaning":"정성적 가정","collocation":"evaluate qualitative assumption","example":"The research team carefully examined qualitative assumption when discussing the implications of peer review and replication."},{"term":"competing benchmark","meaning":"경쟁하는 기준","collocation":"document competing benchmark","example":"The research team carefully examined competing benchmark when discussing the implications of peer review and replication."},{"term":"methodological approach","meaning":"방법론적 접근법","collocation":"consider methodological approach","example":"The research team carefully examined methodological approach when discussing the implications of peer review and replication."},{"term":"transparent analysis","meaning":"투명한 분석","collocation":"evaluate transparent analysis","example":"The research team carefully examined transparent analysis when discussing the implications of peer review and replication."},{"term":"conditional observation","meaning":"조건부 관측","collocation":"document conditional observation","example":"The research team carefully examined conditional observation when discussing the implications of peer review and replication."},{"term":"empirical limitation","meaning":"실증적 한계","collocation":"consider empirical limitation","example":"The research team carefully examined empirical limitation when discussing the implications of peer review and replication."},{"term":"provisional implication","meaning":"잠정적 함의","collocation":"evaluate provisional implication","example":"The research team carefully examined provisional implication when discussing the implications of peer review and replication."},{"term":"quantitative outcome","meaning":"정량적 결과","collocation":"document quantitative outcome","example":"The research team carefully examined quantitative outcome when discussing the implications of peer review and replication."},{"term":"convergent criterion","meaning":"수렴하는 판단 기준","collocation":"consider convergent criterion","example":"The research team carefully examined convergent criterion when discussing the implications of peer review and replication."},{"term":"contextual hypothesis","meaning":"맥락적 가설","collocation":"evaluate contextual hypothesis","example":"The research team carefully examined contextual hypothesis when discussing the implications of peer review and replication."},{"term":"longitudinal policy","meaning":"종단적 정책","collocation":"document longitudinal policy","example":"The research team carefully examined longitudinal policy when discussing the implications of peer review and replication."},{"term":"structural perspective","meaning":"구조적 관점","collocation":"consider structural perspective","example":"The research team carefully examined structural perspective when discussing the implications of peer review and replication."}]};</script>
