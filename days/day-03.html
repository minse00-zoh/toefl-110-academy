<script>window.TOEFL_LESSON={"day":3,"week":1,"theme":"Coral Reefs and Symbiotic Adaptation","focus":"Type awareness and diagnostics","claim":"Heat tolerance depends partly on coral–algae interactions, but recovery requires broader ecological evidence.","evidence":"Some corals with heat-tolerant symbionts survived warm laboratory conditions better than comparison colonies.","caveat":"Laboratory survival may trade off with normal-temperature growth and may not generalize to different reefs.","response":"Track seasonal growth, reproduction, and ecosystem interactions in addition to bleaching color.","storageKey":"toefl110day3-diversity-v3","notice":"COASTAL FIELD STATION — SNORKEL SURVEY UPDATE\n\nThe reef-monitoring team will meet at the north dock at 7:15 a.m. on Friday, thirty minutes earlier than originally planned. Forecast winds are expected to increase late in the morning. Students must complete the online equipment checklist before Thursday at 6 p.m.\n\nParticipants who have not passed the shallow-water swim assessment may assist with sample labeling on shore but cannot join the boat survey. Bring sun protection and a reusable water bottle. The field station will supply snorkels and flotation vests.","academicPassage":"Corals appear to be single organisms, but much of their energy comes from microscopic algae living inside their tissues. These symbionts use sunlight to produce compounds that help sustain the coral host. When seawater becomes unusually warm, the relationship may break down: the coral expels some algae or the algae lose their normal function, leaving the animal pale in an event known as bleaching.\n\nBleaching is not identical to death. A coral that experiences mild stress may recover if temperatures fall before its energy reserves are exhausted. Species also differ in their tolerance, and the identity of their algal partners can influence the response. Some experimental colonies associated with heat-tolerant symbionts survive warm periods better than colonies harboring less tolerant strains.\n\nThis result has encouraged proposals to introduce heat-tolerant partnerships onto vulnerable reefs. However, an association that performs well in a laboratory may grow more slowly under normal temperatures, and a successful transplant at one site may not persist where nutrients, currents, or light conditions differ. Reefs also depend on fish, grazing organisms, and water quality; changing a symbiont cannot address all those pressures.\n\nMarine biologists therefore distinguish short-term physiological survival from long-term ecosystem recovery. The most useful monitoring programs assess growth, reproduction, and interactions across seasons, rather than recording whether corals regain their color after a single heat event.","readingClozePassage":"A marine biologist returned to a reef after a period of unusually warm water. Several cor__ colonies ha_ become pa__, but the__ tissues we__ still int___. Instead o_ labeling th_ entire ar__ dead, th_ team recorded bleaching separately and revisited the site a month later. Some colonies had regained their color, whereas others remained weak. The biologists then measured growth and reproductive activity to determine whether the visible improvement reflected a broader recovery process. A photograph alone could not answer that question.","cloze":[{"partial":"cor__","answer":"coral","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"ha_","answer":"had","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"pa__","answer":"pale","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"the__","answer":"their","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"we__","answer":"were","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"int___","answer":"intact","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"o_","answer":"of","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"th_","answer":"the","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"ar__","answer":"area","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"th_","answer":"the","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"}],"questions":{"rd":[{"q":"Why did the survey team move Friday’s departure earlier?","options":["The school boat has been sold.","The north dock will close for construction.","Winds are expected to strengthen later in the morning.","A teacher requested a longer lunch break."],"answer":2,"why":"실생활 공지의 해당 조건을 찾아 확인하세요. Winds are expected to strengthen later in the morning."},{"q":"What may students without a swim assessment do?","options":["Replace the field team leader.","Assist with sample labeling on shore.","Conduct underwater surveys alone.","Join the boat if they bring their own vest."],"answer":1,"why":"공지의 별도 요건 또는 예외 조항에 명시된 행동은 Assist with sample labeling on shore.입니다."},{"q":"What is true about equipment supplied for the reef survey?","options":["The station supplies snorkels and flotation vests.","The boat provides no equipment to registered surveyors.","Every participant must purchase a new flotation vest.","A swimming assessment is replaced by bringing a snorkel."],"answer":0,"why":"공지의 예외 조항과 구체적인 적용 범위를 비교해야 합니다. 정답 근거: The station supplies snorkels and flotation vests."}],"ra":[{"q":"What central explanation organizes the scientific process discussed in the passage on Coral Reefs and Symbiotic Adaptation?","options":["Reef restoration succeeds as soon as bleached colonies regain their color.","Bleaching is proof that the coral animal has already died.","The algal partner has no effect on the coral’s response to heat.","Heat tolerance depends partly on coral–algae interactions, but recovery requires broader ecological evidence."],"answer":3,"why":"중심 논지는 세부 사례에서 도출되는 가장 신중한 결론입니다. Heat tolerance depends partly on coral–algae interactions, but recovery requires broader ecological evidence."},{"q":"What specific observation in the coral reefs and symbiotic adaptation case motivates the discussion?","options":["Reef restoration succeeds as soon as bleached colonies regain their color.","Bleaching is proof that the coral animal has already died.","Some corals with heat-tolerant symbionts survived warm laboratory conditions better than comparison colonies.","The algal partner has no effect on the coral’s response to heat."],"answer":2,"why":"지문의 사례·대조 정보를 직접 확인해야 합니다. Some corals with heat-tolerant symbionts survived warm laboratory conditions better than comparison colonies."},{"q":"Which qualification prevents the evidence about coral monitoring from supporting an unconditional claim?","options":["The algal partner has no effect on the coral’s response to heat.","Laboratory survival may trade off with normal-temperature growth and may not generalize to different reefs.","Bleaching is proof that the coral animal has already died.","Reef restoration succeeds as soon as bleached colonies regain their color."],"answer":1,"why":"한계 조건은 곧바로 틀린 결론이라는 뜻이 아니라 적용 범위를 제한합니다. Laboratory survival may trade off with normal-temperature growth and may not generalize to different reefs."},{"q":"How does the example in the passage refine the broad claim about coral monitoring?","options":["It illustrates a specific relationship involving coral monitoring while establishing the boundaries of the wider argument.","It lists the sequence of coral monitoring observations without contributing to the author’s main point.","The example proves that the implications of coral monitoring hold in every possible location.","The example eliminates the need to compare evidence about coral monitoring with alternative explanations."],"answer":0,"why":"사례는 범위가 제한된 관찰 또는 비교를 통해 주장을 구체화하고 무조건적 일반화를 피하도록 돕습니다."},{"q":"Which investigation or action would best extend the reasoning about coral reefs and symbiotic adaptation?","options":["The algal partner has no effect on the coral’s response to heat.","Reef restoration succeeds as soon as bleached colonies regain their color.","Bleaching is proof that the coral animal has already died.","Track seasonal growth, reproduction, and ecosystem interactions in addition to bleaching color."],"answer":3,"why":"추가 검증은 근거의 결함을 직접 보완하거나 대안 설명을 시험해야 합니다. Track seasonal growth, reproduction, and ecosystem interactions in addition to bleaching color."}],"rp":[{"q":"In the coral reefs and symbiotic adaptation passage, what does “exhausted” most nearly mean in context?","options":["redistributed","carefully measured","used up","strengthened"],"answer":2,"why":"단어의 문맥상 의미를 판단해야 하며 직역만으로 결정하지 않습니다. exhausted ≈ used up"},{"q":"A coral colony survives a short heatwave but produces fewer offspring the next year. Which interpretation is justified?","options":["Heat tolerance cannot be influenced by symbiotic algae.","Short-term survival and long-term recovery are distinct outcomes.","The colony must have died during the initial warm period.","Its color alone proves the ecosystem has fully recovered."],"answer":1,"why":"새 상황에 지문 원리를 적용하는 고난도 추론 문항입니다. Short-term survival and long-term recovery are distinct outcomes."}],"lq":[{"q":"Which response best addresses the speaker’s question about coral monitoring?","options":["No, bleaching and mortality should be recorded separately.","The survey starts at seven fifteen.","Yes, every bleached colony is dead.","The field station is near the harbor."],"answer":0,"why":"화자는 전제를 확인하고 있으므로 직접적인 정정과 관련 조건 설명이 적절합니다."}],"lc":[{"q":"What brings the first speaker to the conversation concerning coral monitoring?","options":["A request for the institution to change the academic field under discussion.","A plan to evaluate unrelated applicants for a different university program.","An invitation to deliver a formal lecture explaining coral reefs and symbiotic adaptation.","whether a pale coral colony should be called dead"],"answer":3,"why":"대화의 도입부에서 상대가 확인하려는 문제를 파악합니다. whether a pale coral colony should be called dead"},{"q":"What does the second speaker clarify about the issue raised in the coral reefs and symbiotic adaptation dialogue?","options":["Bleaching is proof that the coral animal has already died.","The algal partner has no effect on the coral’s response to heat.","bleaching does not by itself show mortality","Reef restoration succeeds as soon as bleached colonies regain their color."],"answer":2,"why":"Not necessarily, No, Exactly와 같은 정정 이후의 내용을 확인합니다. bleaching does not by itself show mortality"},{"q":"What will the first speaker most likely do after the discussion about coral monitoring?","options":["Replace the entire project with an unrelated topic without consulting anyone.","record bleaching separately and join shore labeling until swim clearance","Disregard the advice and continue on the original assumption.","Withdraw permanently from all activities discussed."],"answer":1,"why":"마지막 발화에서 다음 행동을 추론합니다. record bleaching separately and join shore labeling until swim clearance"}],"la":[{"q":"What practical change or instruction is listeners expected to notice in the announcement about coral monitoring?","options":["Winds are expected to strengthen later in the morning.","The north dock will close for construction.","The school boat has been sold.","A teacher requested a longer lunch break."],"answer":0,"why":"공지의 장소·시간·적용 조건을 듣고 핵심 변경사항을 선택합니다. Winds are expected to strengthen later in the morning."},{"q":"Which additional requirement applies to listeners in the coral reefs and symbiotic adaptation announcement?","options":["Conduct underwater surveys alone.","Replace the field team leader.","Join the boat if they bring their own vest.","Assist with sample labeling on shore."],"answer":3,"why":"보편적인 안내와 특정 조건에 해당하는 행동을 구별해야 합니다. Assist with sample labeling on shore."}],"lt":[{"q":"Which statement best summarizes the lecturer’s explanation of coral reefs and symbiotic adaptation?","options":["Reef restoration succeeds as soon as bleached colonies regain their color.","The algal partner has no effect on the coral’s response to heat.","Heat tolerance depends partly on coral–algae interactions, but recovery requires broader ecological evidence.","Bleaching is proof that the coral animal has already died."],"answer":2,"why":"강의 중심 개념과 화자의 제한된 결론을 종합합니다. Heat tolerance depends partly on coral–algae interactions, but recovery requires broader ecological evidence."},{"q":"What role does the lecturer’s example of coral monitoring play in the explanation?","options":["Reef restoration succeeds as soon as bleached colonies regain their color.","Some corals with heat-tolerant symbionts survived warm laboratory conditions better than comparison colonies.","The algal partner has no effect on the coral’s response to heat.","Bleaching is proof that the coral animal has already died."],"answer":1,"why":"강의 사례는 개념을 구체화하는 관측 자료 또는 비교입니다. Some corals with heat-tolerant symbionts survived warm laboratory conditions better than comparison colonies."},{"q":"What caution does the lecturer introduce after describing evidence related to coral monitoring?","options":["Laboratory survival may trade off with normal-temperature growth and may not generalize to different reefs.","Bleaching is proof that the coral animal has already died.","Reef restoration succeeds as soon as bleached colonies regain their color.","The algal partner has no effect on the coral’s response to heat."],"answer":0,"why":"화자가 However, but 등으로 도입하는 예외를 듣는 것이 핵심입니다. Laboratory survival may trade off with normal-temperature growth and may not generalize to different reefs."},{"q":"How would the lecturer most likely advise someone evaluating coral monitoring in a new setting?","options":["The algal partner has no effect on the coral’s response to heat.","Bleaching is proof that the coral animal has already died.","Reef restoration succeeds as soon as bleached colonies regain their color.","Track seasonal growth, reproduction, and ecosystem interactions in addition to bleaching color."],"answer":3,"why":"강의의 마무리에서 제안하는 연구·실행 원칙을 응용합니다. Track seasonal growth, reproduction, and ecosystem interactions in addition to bleaching color."}]},"audio":{"lq":"Since the coral in the photograph is pale, should we record it as dead?","lc":"Student: I saw a pale patch on the reef photograph. Is that enough to classify the colony as dead?\nTeaching Assistant: Not necessarily. Bleaching means the coral has lost much of its symbiotic algae, but the animal may still be alive.\nStudent: So should I classify every pale colony as recovered when it turns brown again?\nTeaching Assistant: Color is one indicator, not a complete measure of health. We also track growth and signs of reproduction over time.\nStudent: I was assigned to the boat survey, but I haven't completed the shallow-water swim assessment.\nTeaching Assistant: Then you should help the shore team label samples this week. Once you pass the assessment, you can request a boat assignment.\nStudent: Understood. I'll update my field sheet so bleaching and mortality are recorded separately.","la":"Attention, reef-survey volunteers. Friday's departure has been moved to seven fifteen in the morning because stronger winds are forecast for late morning. Meet at the north dock rather than at the teaching laboratory. Complete the equipment checklist by six o'clock Thursday evening. Students without a valid swim assessment will work with the sample-labeling team on shore. The station will provide snorkels and flotation vests.","lt":"Let's follow what happens when a coral reef experiences a marine heatwave. Many corals host algae that supply energy through photosynthesis. Under heat stress this partnership becomes unstable, and the coral may lose the algae, producing the pale appearance we call bleaching.\n\nBut here is a distinction I want you to remember: a bleached coral is not necessarily dead. If conditions improve quickly enough, some colonies regain their symbionts. Others survive the immediate heat event but grow poorly afterward.\n\nResearchers have experimented with algal partners that tolerate higher temperatures. The results are promising for some colonies, yet a laboratory advantage may come with a trade-off, such as slower growth under ordinary conditions. Moreover, the reef's health depends on water quality and ecological interactions beyond the coral itself.\n\nThat is why long-term surveys measure survival, growth and reproduction. A single photograph showing the return of color cannot tell us whether an ecosystem has fully recovered."},"speaking":{"repeat":["Welcome to the workshop on coral monitoring.","The reef-monitoring team will meet at the north dock at 7:15 a.","The instructor asked us to compare the evidence about coral monitoring before drawing conclusions.","Some corals with heat-tolerant symbionts survived warm laboratory conditions better than comparison colonies.","Laboratory survival may trade off with normal-temperature growth and may not generalize to different reefs.","Track seasonal growth, reproduction, and ecosystem interactions in addition to bleaching color.","Although it might initially seem that bleaching is proof that the coral animal has already died, the evidence instead suggests that heat tolerance depends partly on coral–algae interactions, but recovery requires broader ecological evidence."],"interviews":["What first interested you in marine biology, and how would you explain that interest to a friend?","Tell me about a time when a practical decision involving coral monitoring was more complicated than you expected.","Do you think universities should give more attention to coral monitoring in introductory courses? Explain your reasoning.","Imagine a classmate disagrees with your interpretation of coral monitoring. How would you respond respectfully and precisely?"],"sample":"One environmental topic I would like to understand better is coral-reef recovery. I was surprised to learn that a coral can survive bleaching without fully returning to health. Before studying this subject, I would have judged recovery mainly from photographs showing whether the coral had regained its color. Now I would want to know whether the colony was growing and reproducing normally over several seasons. I think that illustrates a broader research principle: the easiest outcome to observe is not always the most meaningful one. Good environmental decisions require patient monitoring as well as promising short-term results."},"writing":{"build":[{"fragments":"Could you tell me / session has been rescheduled / whether the coral monitoring","answer":"Could you tell me whether the coral monitoring session has been rescheduled?","why":"간접 의문문 어순의 문장 구조와 주어-동사 관계를 확인하세요."},{"fragments":"the coral bleaching records / noticed an important discrepancy / The student who reviewed","answer":"The student who reviewed the coral bleaching records noticed an important discrepancy.","why":"관계절로 설명 추가의 문장 구조와 주어-동사 관계를 확인하세요."},{"fragments":"the photosynthetic energy evidence earlier, / different conclusion / If the team had checked / it might have reached a","answer":"If the team had checked the photosynthetic energy evidence earlier, it might have reached a different conclusion.","why":"조건절로 가능성 제시의 문장 구조와 주어-동사 관계를 확인하세요."},{"fragments":"the report / to coral monitoring had been / examined did the committee approve / Only after the records related","answer":"Only after the records related to coral monitoring had been examined did the committee approve the report.","why":"Only after 도치의 문장 구조와 주어-동사 관계를 확인하세요."},{"fragments":"but also a clear account / requires not only reliable evidence / of its limitations / A project involving coral monitoring","answer":"A project involving coral monitoring requires not only reliable evidence but also a clear account of its limitations.","why":"Not only A but also B 병렬의 문장 구조와 주어-동사 관계를 확인하세요."}],"emailTask":"You are scheduled to participate in a reef survey, but you have not completed the swimming assessment. Email the field coordinator to explain the problem, request a shore-based role for this survey, and ask how to qualify for the next boat survey.","emailSample":"Dear Field Coordinator,\n\nI am scheduled for Friday's reef survey but have not yet passed the shallow-water swimming assessment. Rather than delay the rest of the team, I would be grateful if I could help with sample labeling and documentation on shore.\n\nCould you tell me when the next assessment will be offered and whether passing it would make me eligible for a later boat survey? I have already completed the online equipment checklist and can arrive at the north dock at the revised meeting time.\n\nThank you for considering an alternative role. I look forward to contributing to the monitoring program safely.\n\nBest regards,\nAlex","discussionTask":"Professor: Should marine restoration programs prioritize heat-tolerant coral strains or improving water quality?\n\nStudent A — Emily: Heat-tolerant partnerships could help corals withstand increasingly frequent marine heatwaves.\n\nStudent B — Daniel: Reducing pollution and sedimentation addresses several threats without introducing uncertain biological changes.","discussionSample":"I agree with the argument that heat-tolerant coral partnerships deserve research funding, but I would not make them the sole restoration strategy. Some experimental colonies survive elevated temperatures better when they host particular algal strains. That finding is promising because marine heatwaves threaten reefs more frequently. Yet higher short-term survival does not automatically imply healthy reproduction, nor can a different symbiont correct poor water quality or habitat damage. The most responsible program would test heat-tolerant partnerships in carefully monitored pilot sites while also limiting local pollution and protecting grazing species. Long-term measures of growth and reproduction should determine whether the intervention merits expansion. In other words, biological innovation and conventional conservation are complements, not mutually exclusive choices."},"vocabulary":[{"term":"algal symbiont","meaning":"공생 조류","collocation":"identify an algal symbiont","example":"To address a practical difficulty, marine biologists chose to identify an algal symbiont under controlled conditions.","synonym":"algal partner","nuance":"","group":"core"},{"term":"coral bleaching","meaning":"산호 백화","collocation":"monitor coral bleaching","example":"Coral bleaching may be reversible after a short warm period, yet it can still reduce long-term colony growth.","synonym":"loss of coral symbionts","nuance":"","group":"core"},{"term":"photosynthetic energy","meaning":"광합성 에너지","collocation":"supply photosynthetic energy","example":"Symbiotic algae supply photosynthetic energy to their coral hosts under favorable conditions.","synonym":"energy from photosynthesis","nuance":"","group":"core"},{"term":"heat-tolerant strain","meaning":"내열성 계통","collocation":"cultivate a heat-tolerant strain","example":"A single unexpected result persuaded marine biologists to cultivate a heat-tolerant strain more carefully.","synonym":"heat-resistant lineage","nuance":"","group":"core"},{"term":"host tissue","meaning":"숙주 조직","collocation":"sample host tissue","example":"When the instruments returned inconsistent readings, marine biologists attempted to sample host tissue.","synonym":"coral host cells","nuance":"","group":"core"},{"term":"energy reserve","meaning":"에너지 비축량","collocation":"deplete an energy reserve","example":"The supervising committee asked marine biologists to deplete an energy reserve and explain the criteria.","synonym":"stored energy","nuance":"","group":"core"},{"term":"reef recovery","meaning":"산호초 회복","collocation":"measure reef recovery","example":"Only after a careful review could marine biologists begin to measure reef recovery.","synonym":"reef restoration","nuance":"","group":"core"},{"term":"seasonal reproduction","meaning":"계절적 번식","collocation":"track seasonal reproduction","example":"Under the new conditions, marine biologists were asked to track seasonal reproduction at an earlier stage.","synonym":"breeding at different times","nuance":"","group":"core"},{"term":"thermal stress","meaning":"열 스트레스","collocation":"quantify thermal stress","example":"The long-term monitoring plan required marine biologists to quantify thermal stress at regular intervals.","synonym":"heat-related stress","nuance":"","group":"core"},{"term":"colony growth","meaning":"군체 성장","collocation":"assess colony growth","example":"At the discussion session, marine biologists explained their decision to assess colony growth.","synonym":"development of a colony","nuance":"","group":"core"},{"term":"shallow-water survey","meaning":"천해 조사","collocation":"conduct a shallow-water survey","example":"The available resources enabled marine biologists to conduct a shallow-water survey during the pilot study.","synonym":"survey of shallow reefs","nuance":"","group":"core"},{"term":"grazing organism","meaning":"초식성 생물","collocation":"count grazing organisms","example":"Although the preliminary results seemed convincing, marine biologists still needed to count grazing organisms.","synonym":"organism that feeds by grazing","nuance":"","group":"core"},{"term":"symbiotic relationship","meaning":"공생 관계","collocation":"maintain a symbiotic relationship","example":"Because the evidence was incomplete, marine biologists agreed to maintain a symbiotic relationship again before deciding.","synonym":"mutually beneficial association","nuance":"","group":"core"},{"term":"marine heatwave","meaning":"해양 폭염","collocation":"experience a marine heatwave","example":"Some corals experience a marine heatwave without immediately dying, particularly when temperatures decline quickly.","synonym":"extended sea-temperature anomaly","nuance":"","group":"core"},{"term":"site-specific response","meaning":"지역별 반응","collocation":"compare site-specific responses","example":"After examining competing accounts, marine biologists were prepared to compare site-specific responses.","synonym":"response dependent on location","nuance":"","group":"core"},{"term":"acclimatization","meaning":"환경 적응","collocation":"investigate acclimatization","example":"One limitation of the project was that marine biologists could not yet investigate acclimatization reliably.","synonym":"adjustment to environmental conditions","nuance":"","group":"advanced"},{"term":"physiological strain","meaning":"생리적 부담","collocation":"measure physiological strain","example":"Corals experience physiological strain during unusually warm periods, even before visible bleaching begins.","synonym":"biological stress","nuance":"","group":"advanced"},{"term":"ecological contingency","meaning":"생태학적 조건 의존성","collocation":"assess ecological contingency","example":"Ecological contingency matters because a successful response in one reef may fail under a different nutrient regime.","synonym":"dependence on ecological context","nuance":"","group":"advanced"},{"term":"adaptive capacity","meaning":"적응 능력","collocation":"estimate adaptive capacity","example":"In their final presentation, marine biologists described what it meant to estimate adaptive capacity.","synonym":"capacity to adjust","nuance":"","group":"advanced"},{"term":"habitat degradation","meaning":"서식지 악화","collocation":"document habitat degradation","example":"Careful documentation enabled marine biologists to document habitat degradation without repeating the same mistake.","synonym":"decline in habitat quality","nuance":"","group":"advanced"},{"term":"species interaction","meaning":"종 간 상호작용","collocation":"model species interactions","example":"In a subsequent case, marine biologists had to model species interactions under rather different conditions.","synonym":"relationship among species","nuance":"","group":"advanced"},{"term":"thermal tolerance","meaning":"열 내성","collocation":"compare thermal tolerance","example":"The final recommendation urged marine biologists to compare thermal tolerance before proceeding.","synonym":"resistance to heat","nuance":"","group":"advanced"},{"term":"restoration priority","meaning":"복원 우선순위","collocation":"set restoration priorities","example":"The conservation team ranked reef recovery as a restoration priority before allocating the budget.","synonym":"conservation priority","nuance":"","group":"advanced"},{"term":"environmental gradient","meaning":"환경 구배","collocation":"sample an environmental gradient","example":"The absence of reliable records made it difficult for marine biologists to sample an environmental gradient.","synonym":"change across an environment","nuance":"","group":"advanced"},{"term":"biological trade-off","meaning":"생물학적 상충관계","collocation":"evaluate a biological trade-off","example":"The project team provided a checklist to help marine biologists evaluate a biological trade-off.","synonym":"cost-benefit compromise in biology","nuance":"","group":"advanced"},{"term":"recovery trajectory","meaning":"회복 경로","collocation":"track a recovery trajectory","example":"Students observed how marine biologists attempted to track a recovery trajectory despite incomplete information.","synonym":"course of recovery","nuance":"","group":"advanced"},{"term":"ecosystem function","meaning":"생태계 기능","collocation":"restore ecosystem function","example":"A meaningful comparison would require marine biologists to restore ecosystem function independently.","synonym":"ecological role","nuance":"","group":"advanced"},{"term":"survival probability","meaning":"생존 확률","collocation":"estimate survival probability","example":"A cautious interpretation allowed marine biologists to estimate survival probability while acknowledging uncertainty.","synonym":"chance of persistence","nuance":"","group":"advanced"},{"term":"field validation","meaning":"현장 검증","collocation":"perform field validation","example":"Several independent observations led marine biologists to perform field validation before publication.","synonym":"verification in natural settings","nuance":"","group":"advanced"},{"term":"longitudinal monitoring","meaning":"장기 모니터링","collocation":"conduct longitudinal monitoring","example":"A request from the university encouraged marine biologists to conduct longitudinal monitoring more transparently.","synonym":"monitoring across time","nuance":"","group":"advanced"}],"meta":{"sourceType":"original practice content","etsOfficial":false,"benchmark":"TOEFL iBT January 2026 task-type descriptions / ETS sample 1","studyMinutes":120,"revision":"2026-11-23-diversity-v3","discipline":"Marine Biology","genre":"process"}};</script>
