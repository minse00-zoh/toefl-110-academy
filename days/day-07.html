<script>window.TOEFL_LESSON={"day":7,"week":2,"theme":"Earthquake Early Warning and Seismic Waves","focus":"Reading: inference and text structure","claim":"Early warning detects an ongoing earthquake and exploits differences between signal transmission and seismic-wave travel.","evidence":"People farther from the epicenter can receive warning seconds before damaging waves arrive.","caveat":"Near-source communities may have no usable lead time, and alert thresholds create false-alarm tradeoffs.","response":"Evaluate alert latency, false positives and geographic differences with actual and simulated events.","storageKey":"toefl110day7-diversity-v3","notice":"CITY SCIENCE CENTER — EARTHQUAKE DRILL\n\nThe building's public earthquake drill will occur Wednesday at 10:20 a.m. An audible demonstration alarm will sound for approximately 30 seconds. Visitors should practice “Drop, Cover, and Hold On” but must not use the elevators during the drill.\n\nPeople taking part in the geology exhibition on the third floor may remain with their guide. The wheelchair refuge point is beside Stairwell B, and trained staff will provide assistance. The science center is not conducting a real evacuation unless a separate instruction is announced.","academicPassage":"Earthquake prediction and earthquake early warning are often confused, although they address different problems. Prediction would involve reliably announcing when and where a future earthquake will occur. An early-warning system instead detects a quake that has already begun and tries to alert people before the strongest shaking reaches them.\n\nThe difference is possible because seismic waves travel at different speeds. Fast primary waves, or P waves, generally cause less damaging ground motion than the slower shear and surface waves that may follow. Sensors near the epicenter can register the initial motion and transmit an estimate of location and magnitude through a communication network. A region farther away might receive a few seconds of notice before severe shaking.\n\nThose seconds can matter. Trains may be slowed, medical procedures paused, and occupants prompted to take protective action. Yet the available warning time depends on distance from the rupture, the speed of data processing, and network delays. Communities close to the epicenter may experience strong shaking before a message can reach them.\n\nAn algorithm must also trade false alarms against missed events. If the threshold is too low, alerts may be issued for signals that do not develop into dangerous shaking; if too high, useful warnings may arrive late. Engineers therefore evaluate systems through simulated earthquakes and actual records, reporting not only average response speed but also the geographic distribution of missed or delayed alerts.","readingClozePassage":"Engineers tested a warning system by simulating earthquake signals at sensors across a region. The mess____ reached seve___ distant commun_____ before th_ modeled str___ shaking arri___. Locations clos___ to th_ source rece____ little o_ no lead time. The result surprised students who had assumed every alert would provide the same number of seconds. By mapping the simulated arrival times, they discovered that geography and processing delays jointly determine the warning available to people in different areas. A useful evaluation cannot rely only on one regional average.","cloze":[{"partial":"mess____","answer":"messages","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"seve___","answer":"several","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"commun_____","answer":"communities","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"th_","answer":"the","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"str___","answer":"strong","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"arri___","answer":"arrived","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"clos___","answer":"closest","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"th_","answer":"the","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"rece____","answer":"received","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"o_","answer":"or","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"}],"questions":{"rd":[{"q":"Which behavior is requested during the science center drill?","options":["Leave the site before the alarm starts without speaking to staff.","Exit the building through every available elevator.","Practice “Drop, Cover, and Hold On” without using elevators.","Continue the exhibition and ignore the alarm entirely."],"answer":2,"why":"실생활 공지의 해당 조건을 찾아 확인하세요. Practice “Drop, Cover, and Hold On” without using elevators."},{"q":"What does the announcement say about evacuation?","options":["Visitors on the third floor must leave their guides immediately.","No general evacuation occurs unless separate instructions are issued.","The drill is cancelled if anyone needs mobility assistance.","Everyone must evacuate during the short demonstration alarm."],"answer":1,"why":"공지의 별도 요건 또는 예외 조항에 명시된 행동은 No general evacuation occurs unless separate instructions are issued.입니다."},{"q":"Which statement distinguishes the demonstration alarm from an actual emergency instruction?","options":["The drill is not a building evacuation unless a separate order is issued.","Visitors may ignore staff instructions if the sound lasts thirty seconds.","Any test alarm means all visitors must use the elevators.","The geology gallery is closed until the end of the term."],"answer":0,"why":"공지의 예외 조항과 구체적인 적용 범위를 비교해야 합니다. 정답 근거: The drill is not a building evacuation unless a separate order is issued."}],"ra":[{"q":"Which mechanism best explains the phenomenon as described in the passage on Earthquake Early Warning and Seismic Waves?","options":["The system can accurately predict earthquakes several days in advance.","P waves always cause the strongest shaking and arrive last.","An average alert time accurately represents the experience of every neighborhood.","Early warning detects an ongoing earthquake and exploits differences between signal transmission and seismic-wave travel."],"answer":3,"why":"중심 논지는 세부 사례에서 도출되는 가장 신중한 결론입니다. Early warning detects an ongoing earthquake and exploits differences between signal transmission and seismic-wave travel."},{"q":"What specific observation in the earthquake early warning and seismic waves case motivates the discussion?","options":["P waves always cause the strongest shaking and arrive last.","The system can accurately predict earthquakes several days in advance.","People farther from the epicenter can receive warning seconds before damaging waves arrive.","An average alert time accurately represents the experience of every neighborhood."],"answer":2,"why":"지문의 사례·대조 정보를 직접 확인해야 합니다. People farther from the epicenter can receive warning seconds before damaging waves arrive."},{"q":"Which qualification prevents the evidence about earthquake alerts from supporting an unconditional claim?","options":["An average alert time accurately represents the experience of every neighborhood.","Near-source communities may have no usable lead time, and alert thresholds create false-alarm tradeoffs.","P waves always cause the strongest shaking and arrive last.","The system can accurately predict earthquakes several days in advance."],"answer":1,"why":"한계 조건은 곧바로 틀린 결론이라는 뜻이 아니라 적용 범위를 제한합니다. Near-source communities may have no usable lead time, and alert thresholds create false-alarm tradeoffs."},{"q":"Why are the contrasting conditions introduced in the account of earthquake alerts?","options":["It illustrates a specific relationship involving earthquake alerts while establishing the boundaries of the wider argument.","The example eliminates the need to compare evidence about earthquake alerts with alternative explanations.","The example proves that the implications of earthquake alerts hold in every possible location.","It lists the sequence of earthquake alerts observations without contributing to the author’s main point."],"answer":0,"why":"사례는 범위가 제한된 관찰 또는 비교를 통해 주장을 구체화하고 무조건적 일반화를 피하도록 돕습니다."},{"q":"Which investigation or action would best extend the reasoning about earthquake early warning and seismic waves?","options":["An average alert time accurately represents the experience of every neighborhood.","The system can accurately predict earthquakes several days in advance.","P waves always cause the strongest shaking and arrive last.","Evaluate alert latency, false positives and geographic differences with actual and simulated events."],"answer":3,"why":"추가 검증은 근거의 결함을 직접 보완하거나 대안 설명을 시험해야 합니다. Evaluate alert latency, false positives and geographic differences with actual and simulated events."}],"rp":[{"q":"In the earthquake early warning and seismic waves passage, what does “epicenter” most nearly mean in context?","options":["direction a warning signal travels","last place to experience any shaking","point on the surface above the earthquake source","sensor located at the highest elevation"],"answer":2,"why":"단어의 문맥상 의미를 판단해야 하며 직역만으로 결정하지 않습니다. epicenter ≈ point on the surface above the earthquake source"},{"q":"An alert arrives before shaking in a distant town but not near the rupture. What does that imply?","options":["Primary waves always cause more damage than later waves.","Lead time can differ markedly with location even within one system.","The system could predict the event several days earlier.","The distant town necessarily has more sensitive geology."],"answer":1,"why":"새 상황에 지문 원리를 적용하는 고난도 추론 문항입니다. Lead time can differ markedly with location even within one system."}],"lq":[{"q":"Which response best addresses the speaker’s question about earthquake alerts?","options":["She may have been farther from the rupture, giving the alert more time to arrive.","Both phones must have received identical signals.","The science center closes on Wednesdays.","P waves always take longer than electronic messages."],"answer":0,"why":"화자는 전제를 확인하고 있으므로 직접적인 정정과 관련 조건 설명이 적절합니다."}],"lc":[{"q":"What brings the first speaker to the conversation concerning earthquake alerts?","options":["A request for the institution to change the academic field under discussion.","An invitation to deliver a formal lecture explaining earthquake early warning and seismic waves.","A plan to evaluate unrelated applicants for a different university program.","why the student received no useful earthquake warning near the epicenter"],"answer":3,"why":"대화의 도입부에서 상대가 확인하려는 문제를 파악합니다. why the student received no useful earthquake warning near the epicenter"},{"q":"What does the second speaker clarify about the issue raised in the earthquake early warning and seismic waves dialogue?","options":["The system can accurately predict earthquakes several days in advance.","P waves always cause the strongest shaking and arrive last.","distance from the rupture limits warning time","An average alert time accurately represents the experience of every neighborhood."],"answer":2,"why":"Not necessarily, No, Exactly와 같은 정정 이후의 내용을 확인합니다. distance from the rupture limits warning time"},{"q":"What will the first speaker most likely do after the discussion about earthquake alerts?","options":["Withdraw permanently from all activities discussed.","report alert times separately by geographic location","Disregard the advice and continue on the original assumption.","Replace the entire project with an unrelated topic without consulting anyone."],"answer":1,"why":"마지막 발화에서 다음 행동을 추론합니다. report alert times separately by geographic location"}],"la":[{"q":"What practical change or instruction is listeners expected to notice in the announcement about earthquake alerts?","options":["Practice “Drop, Cover, and Hold On” without using elevators.","Leave the site before the alarm starts without speaking to staff.","Exit the building through every available elevator.","Continue the exhibition and ignore the alarm entirely."],"answer":0,"why":"공지의 장소·시간·적용 조건을 듣고 핵심 변경사항을 선택합니다. Practice “Drop, Cover, and Hold On” without using elevators."},{"q":"Which additional requirement applies to listeners in the earthquake early warning and seismic waves announcement?","options":["The drill is cancelled if anyone needs mobility assistance.","Everyone must evacuate during the short demonstration alarm.","Visitors on the third floor must leave their guides immediately.","No general evacuation occurs unless separate instructions are issued."],"answer":3,"why":"보편적인 안내와 특정 조건에 해당하는 행동을 구별해야 합니다. No general evacuation occurs unless separate instructions are issued."}],"lt":[{"q":"Which statement best summarizes the lecturer’s explanation of earthquake early warning and seismic waves?","options":["An average alert time accurately represents the experience of every neighborhood.","The system can accurately predict earthquakes several days in advance.","Early warning detects an ongoing earthquake and exploits differences between signal transmission and seismic-wave travel.","P waves always cause the strongest shaking and arrive last."],"answer":2,"why":"강의 중심 개념과 화자의 제한된 결론을 종합합니다. Early warning detects an ongoing earthquake and exploits differences between signal transmission and seismic-wave travel."},{"q":"What role does the lecturer’s example of earthquake alerts play in the explanation?","options":["An average alert time accurately represents the experience of every neighborhood.","People farther from the epicenter can receive warning seconds before damaging waves arrive.","The system can accurately predict earthquakes several days in advance.","P waves always cause the strongest shaking and arrive last."],"answer":1,"why":"강의 사례는 개념을 구체화하는 관측 자료 또는 비교입니다. People farther from the epicenter can receive warning seconds before damaging waves arrive."},{"q":"What caution does the lecturer introduce after describing evidence related to earthquake alerts?","options":["Near-source communities may have no usable lead time, and alert thresholds create false-alarm tradeoffs.","P waves always cause the strongest shaking and arrive last.","The system can accurately predict earthquakes several days in advance.","An average alert time accurately represents the experience of every neighborhood."],"answer":0,"why":"화자가 However, but 등으로 도입하는 예외를 듣는 것이 핵심입니다. Near-source communities may have no usable lead time, and alert thresholds create false-alarm tradeoffs."},{"q":"How would the lecturer most likely advise someone evaluating earthquake alerts in a new setting?","options":["An average alert time accurately represents the experience of every neighborhood.","P waves always cause the strongest shaking and arrive last.","The system can accurately predict earthquakes several days in advance.","Evaluate alert latency, false positives and geographic differences with actual and simulated events."],"answer":3,"why":"강의의 마무리에서 제안하는 연구·실행 원칙을 응용합니다. Evaluate alert latency, false positives and geographic differences with actual and simulated events."}]},"audio":{"lq":"Why did my friend receive several seconds of warning when I got almost none?","lc":"Student: The test alert reached my phone after I felt the first shaking. Does that mean the warning network failed?\nSeismologist: Not necessarily. How far were you from the event's epicenter?\nStudent: Only about fifteen kilometers.\nSeismologist: That matters. Near the source, the strongest waves may arrive too quickly for a warning to get ahead of them.\nStudent: Then why did my friend in the next city get five seconds of warning?\nSeismologist: She was farther from the rupture. The signal could travel electronically much faster than the damaging seismic waves.\nStudent: Should I average our warning times in the report?\nSeismologist: Report them separately first. A single mean can hide important differences between locations.","la":"This is a scheduled earthquake drill, not an emergency. In a moment you will hear a short demonstration alarm. Please drop, take cover and hold on until staff indicate that the exercise is complete. Do not use elevators. Visitors on the third floor can stay with their exhibition guide. Guests who need mobility assistance should follow staff instructions near Stairwell B. A separate evacuation message will be given only if one is required.","lt":"What makes an earthquake early-warning system possible? It does not forecast next week's earthquake. It detects an earthquake after rupture has started, then sends a message that may reach some locations before the most damaging waves.\n\nPrimary seismic waves usually travel faster than the waves associated with stronger shaking. Sensors pick up the initial signal and communicate the estimate to an alert network. For people far enough away, even a few seconds can be useful.\n\nBut geography is crucial. Right above the rupture, damaging shaking may already be occurring when sensors begin to process the information. The same system can offer substantial notice in a distant city and almost none near the epicenter.\n\nFinally, engineers face a threshold problem. Set a trigger too low and you create unnecessary alarms; set it too high and warnings arrive too late. Evaluating the system therefore requires attention to both timing and false alerts, not simply whether the software sent a message."},"speaking":{"repeat":["Welcome to the workshop on earthquake alerts.","The building's public earthquake drill will occur Wednesday at 10:20 a.","The instructor asked us to compare the evidence about earthquake alerts before drawing conclusions.","People farther from the epicenter can receive warning seconds before damaging waves arrive.","Near-source communities may have no usable lead time, and alert thresholds create false-alarm tradeoffs.","Evaluate alert latency, false positives and geographic differences with actual and simulated events.","Although it might initially seem that the system can accurately predict earthquakes several days in advance, the evidence instead suggests that early warning detects an ongoing earthquake and exploits differences between signal transmission and seismic-wave travel."],"interviews":["What first interested you in geology / geophysics, and how would you explain that interest to a friend?","Tell me about a time when a practical decision involving earthquake alerts was more complicated than you expected.","Do you think universities should give more attention to earthquake alerts in introductory courses? Explain your reasoning.","Imagine a classmate disagrees with your interpretation of earthquake alerts. How would you respond respectfully and precisely?"],"sample":"If I were helping a community prepare for earthquakes, I would emphasize protective behavior and realistic expectations of warning systems. Some people might assume that an alert can always arrive before strong shaking. But residents close to the earthquake source may receive almost no notice, whereas people farther away could have several seconds. I would therefore support regular drills and safer buildings alongside electronic warnings. In my view, communication should explain both what the technology can do and where its limitations are. That makes people more prepared than simply promising that a phone alert will keep everyone safe."},"writing":{"build":[{"fragments":"session has been rescheduled / Could you tell me / whether the earthquake alerts","answer":"Could you tell me whether the earthquake alerts session has been rescheduled?","why":"간접 의문문 어순의 문장 구조와 주어-동사 관계를 확인하세요."},{"fragments":"the primary wave records / The student who reviewed / noticed an important discrepancy","answer":"The student who reviewed the primary wave records noticed an important discrepancy.","why":"관계절로 설명 추가의 문장 구조와 주어-동사 관계를 확인하세요."},{"fragments":"the shear wave evidence earlier, / it might have reached a / different conclusion / If the team had checked","answer":"If the team had checked the shear wave evidence earlier, it might have reached a different conclusion.","why":"조건절로 가능성 제시의 문장 구조와 주어-동사 관계를 확인하세요."},{"fragments":"examined did the committee approve / Only after the records related / to earthquake alerts had been / the report","answer":"Only after the records related to earthquake alerts had been examined did the committee approve the report.","why":"Only after 도치의 문장 구조와 주어-동사 관계를 확인하세요."},{"fragments":"requires not only reliable evidence / but also a clear account / A project involving earthquake alerts / of its limitations","answer":"A project involving earthquake alerts requires not only reliable evidence but also a clear account of its limitations.","why":"Not only A but also B 병렬의 문장 구조와 주어-동사 관계를 확인하세요."}],"emailTask":"You attended an earthquake drill and noticed that one accessible refuge area was difficult to find. Email the science center coordinator to describe the navigation problem, request clearer signage before the next drill, and ask how visitors with mobility needs can provide feedback.","emailSample":"Dear Science Center Coordinator,\n\nThank you for organizing Wednesday's earthquake-safety drill. I participated in the third-floor exhibition and noticed that the sign directing visitors with mobility needs toward Stairwell B was difficult to see from the main gallery.\n\nWould it be possible to add a more prominent sign or a floor-level route map before the next exercise? I would also appreciate information about the procedure for providing accessibility feedback, particularly whether visitors can comment without sharing personal medical details.\n\nThe staff were helpful, and I hope this suggestion will make the drill easier for everyone to follow.\n\nKind regards,\nAlex","discussionTask":"Professor: Should cities prioritize building reinforcement or earthquake warning apps when resources are limited?\n\nStudent A — Emily: Structural safety measures protect people even where an electronic alert arrives too late.\n\nStudent B — Daniel: Early warnings can trigger valuable protective actions at relatively low cost across large regions.","discussionSample":"If a city must choose one initial investment, I would prioritize reinforcing buildings that pose immediate safety risks, while continuing to develop warning systems. Structural safety measures protect people near the earthquake source, where there may be little or no time for an electronic alert to arrive. That does not make early warnings unimportant. Several seconds of notice can allow trains to slow or students to take cover in places farther from the epicenter. The two interventions therefore reduce different types of risk. City officials should compare local building vulnerabilities, population distribution and realistic warning times instead of assuming that an average alert delay represents every district. A staged plan can address urgent structural weaknesses first while expanding an accessible alert network over time."},"vocabulary":[{"term":"seismic rupture","meaning":"지진 파열","collocation":"locate a seismic rupture","example":"When the initial explanation failed, seismologists returned to the data to locate a seismic rupture.","synonym":"rupture during an earthquake","nuance":"","group":"core"},{"term":"primary wave","meaning":"P파·종파","collocation":"detect a primary wave","example":"The group discovered that it was possible to detect a primary wave without assuming a single cause.","synonym":"first-arriving compressional wave","nuance":"","group":"core"},{"term":"shear wave","meaning":"전단파·S파","collocation":"measure a shear wave","example":"A second research team challenged seismologists to measure a shear wave with different assumptions.","synonym":"side-to-side seismic wave","nuance":"","group":"core"},{"term":"epicentral distance","meaning":"진앙 거리","collocation":"calculate epicentral distance","example":"The revised protocol gave seismologists a systematic way to calculate epicentral distance.","synonym":"distance from epicenter","nuance":"","group":"core"},{"term":"alert latency","meaning":"경보 지연시간","collocation":"reduce alert latency","example":"To address a practical difficulty, seismologists chose to reduce alert latency under controlled conditions.","synonym":"delay before warning","nuance":"","group":"core"},{"term":"false alarm","meaning":"오경보","collocation":"limit false alarms","example":"It proved especially important for seismologists to limit false alarms during the second assessment.","synonym":"incorrect warning signal","nuance":"","group":"core"},{"term":"ground motion","meaning":"지반 운동","collocation":"estimate ground motion","example":"In response to the reviewers, seismologists agreed to estimate ground motion using an explicit procedure.","synonym":"movement of the ground","nuance":"","group":"core"},{"term":"sensor network","meaning":"감지기망","collocation":"maintain a sensor network","example":"A single unexpected result persuaded seismologists to maintain a sensor network more carefully.","synonym":"linked detection instruments","nuance":"","group":"core"},{"term":"magnitude estimate","meaning":"규모 추정값","collocation":"update a magnitude estimate","example":"When the instruments returned inconsistent readings, seismologists attempted to update a magnitude estimate.","synonym":"estimated earthquake strength","nuance":"","group":"core"},{"term":"lead time","meaning":"사전 경보 가능 시간","collocation":"gain a few seconds of lead time","example":"The supervising committee asked seismologists to gain a few seconds of lead time and explain the criteria.","synonym":"available warning interval","nuance":"","group":"core"},{"term":"rupture propagation","meaning":"파열 전파","collocation":"model rupture propagation","example":"Only after a careful review could seismologists begin to model rupture propagation.","synonym":"spread of a rupture","nuance":"","group":"core"},{"term":"signal threshold","meaning":"신호 임계값","collocation":"adjust a signal threshold","example":"Under the new conditions, seismologists were asked to adjust a signal threshold at an earlier stage.","synonym":"minimum trigger level","nuance":"","group":"core"},{"term":"protective action","meaning":"보호 행동","collocation":"initiate protective action","example":"The long-term monitoring plan required seismologists to initiate protective action at regular intervals.","synonym":"action taken for safety","nuance":"","group":"core"},{"term":"network delay","meaning":"통신망 지연","collocation":"quantify network delay","example":"At the discussion session, seismologists explained their decision to quantify network delay.","synonym":"delay in communications","nuance":"","group":"core"},{"term":"geographic coverage","meaning":"지리적 서비스 범위","collocation":"map geographic coverage","example":"The available resources enabled seismologists to map geographic coverage during the pilot study.","synonym":"area served by sensors","nuance":"","group":"core"},{"term":"seismic hazard","meaning":"지진 위험","collocation":"map seismic hazards","example":"Although the preliminary results seemed convincing, seismologists still needed to map seismic hazards.","synonym":"earthquake danger","nuance":"","group":"advanced"},{"term":"response threshold","meaning":"대응 임계값","collocation":"adjust a response threshold","example":"Because the evidence was incomplete, seismologists agreed to adjust a response threshold again before deciding.","synonym":"threshold for response","nuance":"","group":"advanced"},{"term":"alert reliability","meaning":"경보 신뢰도","collocation":"improve alert reliability","example":"The report identified an overlooked opportunity for seismologists to improve alert reliability.","synonym":"dependability of warnings","nuance":"","group":"advanced"},{"term":"wave propagation","meaning":"파동 전파","collocation":"simulate wave propagation","example":"After examining competing accounts, seismologists were prepared to simulate wave propagation.","synonym":"travel of seismic waves","nuance":"","group":"advanced"},{"term":"protective protocol","meaning":"보호 절차","collocation":"implement a protective protocol","example":"One limitation of the project was that seismologists could not yet implement a protective protocol reliably.","synonym":"safety response procedure","nuance":"","group":"advanced"},{"term":"event detection","meaning":"이벤트 탐지","collocation":"accelerate event detection","example":"A later review prompted seismologists to accelerate event detection, rather than accept the initial explanation.","synonym":"detection of a seismic event","nuance":"","group":"advanced"},{"term":"geological rupture","meaning":"지질학적 파열","collocation":"locate a geological rupture","example":"Over a semester of fieldwork, seismologists learned how to locate a geological rupture.","synonym":"break in geological material","nuance":"","group":"advanced"},{"term":"infrastructure vulnerability","meaning":"기반시설 취약성","collocation":"assess infrastructure vulnerability","example":"In their final presentation, seismologists described what it meant to assess infrastructure vulnerability.","synonym":"fragility of public structures","nuance":"","group":"advanced"},{"term":"delay distribution","meaning":"지연의 분포","collocation":"analyze delay distributions","example":"Careful documentation enabled seismologists to analyze delay distributions without repeating the same mistake.","synonym":"spread of communication delays","nuance":"","group":"advanced"},{"term":"geographic disparity","meaning":"지리적 격차","collocation":"report geographic disparity","example":"In a subsequent case, seismologists had to report geographic disparity under rather different conditions.","synonym":"unequal geographic coverage","nuance":"","group":"advanced"},{"term":"operational readiness","meaning":"운용 준비도","collocation":"maintain operational readiness","example":"The final recommendation urged seismologists to maintain operational readiness before proceeding.","synonym":"preparedness for operation","nuance":"","group":"advanced"},{"term":"fail-safe mechanism","meaning":"고장 안전 장치","collocation":"test a fail-safe mechanism","example":"In the first trial, seismologists were not yet able to test a fail-safe mechanism consistently.","synonym":"built-in safety response","nuance":"","group":"advanced"},{"term":"early intervention","meaning":"조기 대응","collocation":"enable early intervention","example":"The absence of reliable records made it difficult for seismologists to enable early intervention.","synonym":"early protective action","nuance":"","group":"advanced"},{"term":"evacuation guidance","meaning":"대피 안내","collocation":"issue evacuation guidance","example":"The project team provided a checklist to help seismologists issue evacuation guidance.","synonym":"directions for safe movement","nuance":"","group":"advanced"},{"term":"regional variation","meaning":"지역별 변이","collocation":"explain regional variation","example":"Students observed how seismologists attempted to explain regional variation despite incomplete information.","synonym":"differences between regions","nuance":"","group":"advanced"}],"meta":{"sourceType":"original practice content","etsOfficial":false,"benchmark":"TOEFL iBT January 2026 task-type descriptions / ETS sample 1","studyMinutes":120,"revision":"2026-11-23-diversity-v3","discipline":"Geology / Geophysics","genre":"mechanism"}};</script>
