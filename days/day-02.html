<script>window.TOEFL_LESSON={"day":2,"week":1,"theme":"The Evolution of Public Libraries","focus":"Type awareness and diagnostics","claim":"Rules governing entry and borrowing shaped the public library as much as changes in collections or technology.","evidence":"Borrowing-register patterns shifted more strongly after policy changes than after additions to the catalogue.","caveat":"A digital catalogue does not ensure access for residents without devices or reliable internet.","response":"Compare membership rules, borrowing records, and infrastructure across different periods.","storageKey":"toefl110day2-diversity-v3","notice":"CITY LIBRARY — ARCHIVE VISIT INFORMATION\n\nThe local-history reading room is open this Saturday from 10 a.m. to 2 p.m. Visitors may consult digitized newspapers without an appointment. Original membership registers are available only to readers who reserve a supervised desk by Thursday at 4 p.m. Photography is permitted without flash, but personal document scanners must remain in lockers.\n\nThe entrance on King Street will be closed for repairs. Please use the garden entrance on the east side of the building. The main lending library will operate as usual.","academicPassage":"Public libraries are often described as institutions created to distribute books. That description is correct but incomplete: the meaning of public access has changed considerably over time. In nineteenth-century industrial cities, some reading rooms were funded through private subscriptions and intended primarily for particular occupational groups. Their collections could be extensive without being accessible to the wider population.\n\nMunicipal libraries gradually introduced different funding arrangements. Taxes and philanthropic contributions supported buildings that offered free admission, although opening hours and borrowing policies still favored some residents over others. In the early twentieth century, children's rooms, outreach services, and multilingual collections challenged the assumption that a library served only adult readers with formal education.\n\nThe arrival of electronic catalogues and digital materials produced another change. A collection no longer had to be physically located in the same building as its users. Nevertheless, access remained uneven. Residents without stable internet connections or devices could find a digital subscription less useful than the shelves it supposedly replaced.\n\nA local-history project comparing library registers across three decades found that changes in borrowing rules altered who used the institution more sharply than changes in the number of titles. The evidence complicates the idea that technological innovation alone explains the library's development. Decisions about membership, staffing, language, and infrastructure have repeatedly defined what public access means in practice.","readingClozePassage":"An apprentice librarian was cataloguing account books from a small industrial town. The reco___ included borro____ fees an_ handwritten lis__ of memb___. At fir__, the appre_____ assumed th_ library ha_ always be__ open to the public. A later municipal order revealed that free access began decades after the first reading room opened. Comparing these documents helped the student distinguish the creation of a collection from the expansion of who could use it. Historical change was visible in administrative rules as much as in books.","cloze":[{"partial":"reco___","answer":"records","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"borro____","answer":"borrowing","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"an_","answer":"and","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"lis__","answer":"lists","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"memb___","answer":"members","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"fir__","answer":"first","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"appre_____","answer":"apprentice","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"th_","answer":"the","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"ha_","answer":"had","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"be__","answer":"been","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"}],"questions":{"rd":[{"q":"Which entrance should archive visitors use on Saturday?","options":["the staff loading entrance","the east garden entrance","the west parking garage","the King Street main doors"],"answer":1,"why":"실생활 공지의 해당 조건을 찾아 확인하세요. the east garden entrance"},{"q":"What must a researcher do to consult the original membership registers?","options":["Reserve a supervised desk by Thursday at 4 p.m.","Bring a personal scanner to copy the whole collection.","Ask for the newspapers to be taken out of storage.","Purchase an annual library membership."],"answer":0,"why":"공지의 별도 요건 또는 예외 조항에 명시된 행동은 Reserve a supervised desk by Thursday at 4 p.m.입니다."},{"q":"Which archive resource can Saturday visitors use without a supervised-desk reservation?","options":["Original membership registers taken home for the weekend.","The restricted registers scanned with a personal device.","Photographs taken using flash without staff permission.","Digitized newspapers available in the reading room."],"answer":3,"why":"공지의 예외 조항과 구체적인 적용 범위를 비교해야 합니다. 정답 근거: Digitized newspapers available in the reading room."}],"ra":[{"q":"What overarching historical development does this account emphasize in the passage on The Evolution of Public Libraries?","options":["Digital services eliminated inequality in library participation.","Library use has always depended almost entirely on the total number of books.","Rules governing entry and borrowing shaped the public library as much as changes in collections or technology.","Nineteenth-century subscription rooms were uniformly open to all residents."],"answer":2,"why":"중심 논지는 세부 사례에서 도출되는 가장 신중한 결론입니다. Rules governing entry and borrowing shaped the public library as much as changes in collections or technology."},{"q":"What specific observation in the the evolution of public libraries case motivates the discussion?","options":["Library use has always depended almost entirely on the total number of books.","Borrowing-register patterns shifted more strongly after policy changes than after additions to the catalogue.","Nineteenth-century subscription rooms were uniformly open to all residents.","Digital services eliminated inequality in library participation."],"answer":1,"why":"지문의 사례·대조 정보를 직접 확인해야 합니다. Borrowing-register patterns shifted more strongly after policy changes than after additions to the catalogue."},{"q":"Which qualification prevents the evidence about historical library policy from supporting an unconditional claim?","options":["A digital catalogue does not ensure access for residents without devices or reliable internet.","Digital services eliminated inequality in library participation.","Library use has always depended almost entirely on the total number of books.","Nineteenth-century subscription rooms were uniformly open to all residents."],"answer":0,"why":"한계 조건은 곧바로 틀린 결론이라는 뜻이 아니라 적용 범위를 제한합니다. A digital catalogue does not ensure access for residents without devices or reliable internet."},{"q":"Why are the contrasting conditions introduced in the account of historical library policy?","options":["The example proves that the implications of historical library policy hold in every possible location.","The example eliminates the need to compare evidence about historical library policy with alternative explanations.","It lists the sequence of historical library policy observations without contributing to the author’s main point.","It illustrates a specific relationship involving historical library policy while establishing the boundaries of the wider argument."],"answer":3,"why":"사례는 범위가 제한된 관찰 또는 비교를 통해 주장을 구체화하고 무조건적 일반화를 피하도록 돕습니다."},{"q":"Which investigation or action would best extend the reasoning about the evolution of public libraries?","options":["Library use has always depended almost entirely on the total number of books.","Digital services eliminated inequality in library participation.","Compare membership rules, borrowing records, and infrastructure across different periods.","Nineteenth-century subscription rooms were uniformly open to all residents."],"answer":2,"why":"추가 검증은 근거의 결함을 직접 보완하거나 대안 설명을 시험해야 합니다. Compare membership rules, borrowing records, and infrastructure across different periods."}],"rp":[{"q":"In the the evolution of public libraries passage, what does “philanthropic” most nearly mean in context?","options":["temporary","charitable","commercial","compulsory"],"answer":1,"why":"단어의 문맥상 의미를 판단해야 하며 직역만으로 결정하지 않습니다. philanthropic ≈ charitable"},{"q":"A town offers thousands of e-books but only one public internet terminal. What does the library history suggest?","options":["Access depends on infrastructure and policy, not catalogue size alone.","The number of titles proves that all residents participate equally.","Digital collections necessarily eliminate all barriers to borrowing.","An online catalogue makes opening hours irrelevant for every service."],"answer":0,"why":"새 상황에 지문 원리를 적용하는 고난도 추론 문항입니다. Access depends on infrastructure and policy, not catalogue size alone."}],"lq":[{"q":"Which response best addresses the speaker’s question about historical library policy?","options":["Yes, the borrowing period is a week.","The catalogue lists several hundred titles.","I am not sure whether the library has a café.","No, those records can only be consulted under supervision."],"answer":3,"why":"화자는 전제를 확인하고 있으므로 직접적인 정정과 관련 조건 설명이 적절합니다."}],"lc":[{"q":"What brings the first speaker to the conversation concerning historical library policy?","options":["A request for the institution to change the academic field under discussion.","A plan to evaluate unrelated applicants for a different university program.","whether original membership records can be borrowed","An invitation to deliver a formal lecture explaining the evolution of public libraries."],"answer":2,"why":"대화의 도입부에서 상대가 확인하려는 문제를 파악합니다. whether original membership records can be borrowed"},{"q":"What does the second speaker clarify about the issue raised in the the evolution of public libraries dialogue?","options":["Library use has always depended almost entirely on the total number of books.","fragile registers require supervised on-site consultation","Digital services eliminated inequality in library participation.","Nineteenth-century subscription rooms were uniformly open to all residents."],"answer":1,"why":"Not necessarily, No, Exactly와 같은 정정 이후의 내용을 확인합니다. fragile registers require supervised on-site consultation"},{"q":"What will the first speaker most likely do after the discussion about historical library policy?","options":["reserve a desk and use the garden entrance","Disregard the advice and continue on the original assumption.","Replace the entire project with an unrelated topic without consulting anyone.","Withdraw permanently from all activities discussed."],"answer":0,"why":"마지막 발화에서 다음 행동을 추론합니다. reserve a desk and use the garden entrance"}],"la":[{"q":"What practical change or instruction is listeners expected to notice in the announcement about historical library policy?","options":["the west parking garage","the staff loading entrance","the King Street main doors","the east garden entrance"],"answer":3,"why":"공지의 장소·시간·적용 조건을 듣고 핵심 변경사항을 선택합니다. the east garden entrance"},{"q":"Which additional requirement applies to listeners in the the evolution of public libraries announcement?","options":["Purchase an annual library membership.","Ask for the newspapers to be taken out of storage.","Reserve a supervised desk by Thursday at 4 p.m.","Bring a personal scanner to copy the whole collection."],"answer":2,"why":"보편적인 안내와 특정 조건에 해당하는 행동을 구별해야 합니다. Reserve a supervised desk by Thursday at 4 p.m."}],"lt":[{"q":"Which statement best summarizes the lecturer’s explanation of the evolution of public libraries?","options":["Library use has always depended almost entirely on the total number of books.","Rules governing entry and borrowing shaped the public library as much as changes in collections or technology.","Nineteenth-century subscription rooms were uniformly open to all residents.","Digital services eliminated inequality in library participation."],"answer":1,"why":"강의 중심 개념과 화자의 제한된 결론을 종합합니다. Rules governing entry and borrowing shaped the public library as much as changes in collections or technology."},{"q":"What role does the lecturer’s example of historical library policy play in the explanation?","options":["Borrowing-register patterns shifted more strongly after policy changes than after additions to the catalogue.","Digital services eliminated inequality in library participation.","Library use has always depended almost entirely on the total number of books.","Nineteenth-century subscription rooms were uniformly open to all residents."],"answer":0,"why":"강의 사례는 개념을 구체화하는 관측 자료 또는 비교입니다. Borrowing-register patterns shifted more strongly after policy changes than after additions to the catalogue."},{"q":"What caution does the lecturer introduce after describing evidence related to historical library policy?","options":["Digital services eliminated inequality in library participation.","Nineteenth-century subscription rooms were uniformly open to all residents.","Library use has always depended almost entirely on the total number of books.","A digital catalogue does not ensure access for residents without devices or reliable internet."],"answer":3,"why":"화자가 However, but 등으로 도입하는 예외를 듣는 것이 핵심입니다. A digital catalogue does not ensure access for residents without devices or reliable internet."},{"q":"How would the lecturer most likely advise someone evaluating historical library policy in a new setting?","options":["Digital services eliminated inequality in library participation.","Nineteenth-century subscription rooms were uniformly open to all residents.","Compare membership rules, borrowing records, and infrastructure across different periods.","Library use has always depended almost entirely on the total number of books."],"answer":2,"why":"강의의 마무리에서 제안하는 연구·실행 원칙을 응용합니다. Compare membership rules, borrowing records, and infrastructure across different periods."}]},"audio":{"lq":"Can I bring the original membership register home once I have reserved a desk?","lc":"Visitor: I'm writing about the history of our neighborhood library. Can I just take the old membership registers home for the weekend?\nArchivist: I'm afraid those particular records are for supervised consultation only. They're quite fragile.\nVisitor: I noticed that some newspapers are available online. Could the registers be scanned as well?\nArchivist: Parts of them are being digitized, but there are privacy restrictions on later entries. For now, you can reserve a desk and examine the originals here.\nVisitor: Is the reservation necessary for the whole archive?\nArchivist: No, only the membership registers and a few other restricted collections. The digitized newspapers are available to walk-in visitors.\nVisitor: I can come Saturday morning. Is the front entrance open?\nArchivist: Use the garden entrance. The King Street doors are being repaired.","la":"Good morning, visitors. The local-history room will close at two o'clock today. If you reserved a supervised desk for the membership registers, please return the material to the archivist before leaving. Digitized newspapers remain accessible at the public computers. Flash photography is prohibited throughout the archive, and the King Street entrance is closed for repairs. When departing, use the east garden entrance.","lt":"Historians looking at libraries often start by counting books, but that can obscure who could actually use them. Imagine two nineteenth-century reading rooms with identical collections. One charges a subscription fee, while the other is funded by the town and allows free entry. Their social significance would not be the same.\n\nOver time, libraries changed more than their finances. Children's rooms and multilingual services expanded the notion of the reading public. Later, online catalogues and electronic books appeared to remove the need to visit a physical building.\n\nYet digitization did not end inequality. A borrower who lacks reliable broadband may have less access to a digital collection than to a printed book in a neighborhood branch. When examining library history, then, we should follow the rules governing use—membership, lending, opening times—rather than treating each new technology as an automatic step toward inclusion."},"speaking":{"repeat":["Welcome to the workshop on historical library policy.","The local-history reading room is open this Saturday from 10 a.","The instructor asked us to compare the evidence about historical library policy before drawing conclusions.","Borrowing-register patterns shifted more strongly after policy changes than after additions to the catalogue.","A digital catalogue does not ensure access for residents without devices or reliable internet.","Compare membership rules, borrowing records, and infrastructure across different periods.","Although it might initially seem that library use has always depended almost entirely on the total number of books, the evidence instead suggests that rules governing entry and borrowing shaped the public library as much as changes in collections or technology."],"interviews":["What first interested you in history / civic institutions, and how would you explain that interest to a friend?","Tell me about a time when a practical decision involving historical library policy was more complicated than you expected.","Do you think universities should give more attention to historical library policy in introductory courses? Explain your reasoning.","Imagine a classmate disagrees with your interpretation of historical library policy. How would you respond respectfully and precisely?"],"sample":"I used to assume that digital collections would eventually replace local libraries. During a community project, however, I met residents who depended on branch computers for job applications and school assignments. Some had smartphones but no reliable broadband connection at home. That experience showed me that access is about more than the number of books available online. If I were advising a university, I would support both digital resources and staffed physical spaces. The goal should be to identify who is still excluded and then remove the barriers they face, rather than to favor one technology automatically."},"writing":{"build":[{"fragments":"the historical library policy session / Could you tell me whether / has been rescheduled","answer":"Could you tell me whether the historical library policy session has been rescheduled?","why":"간접 의문문 어순의 문장 구조와 주어-동사 관계를 확인하세요."},{"fragments":"noticed an important discrepancy / The student who reviewed / the municipal charter records","answer":"The student who reviewed the municipal charter records noticed an important discrepancy.","why":"관계절로 설명 추가의 문장 구조와 주어-동사 관계를 확인하세요."},{"fragments":"different conclusion / the philanthropic endowment evidence earlier, / If the team had checked / it might have reached a","answer":"If the team had checked the philanthropic endowment evidence earlier, it might have reached a different conclusion.","why":"조건절로 가능성 제시의 문장 구조와 주어-동사 관계를 확인하세요."},{"fragments":"been examined did the committee / Only after the records related / approve the report / to historical library policy had","answer":"Only after the records related to historical library policy had been examined did the committee approve the report.","why":"Only after 도치의 문장 구조와 주어-동사 관계를 확인하세요."},{"fragments":"evidence but also a clear / policy requires not only reliable / A project involving historical library / account of its limitations","answer":"A project involving historical library policy requires not only reliable evidence but also a clear account of its limitations.","why":"Not only A but also B 병렬의 문장 구조와 주어-동사 관계를 확인하세요."}],"emailTask":"You reserved a supervised reading desk to examine historic library membership registers, but the archive changed its entrance and you will arrive thirty minutes late. Write to the archivist to explain the delay, confirm that the desk will still be available, and ask about the photography restrictions.","emailSample":"Dear Archives Team,\n\nI am writing about my reserved consultation desk for Saturday's local-history session. Unfortunately, my train has been rescheduled, and I expect to arrive at approximately 10:30 a.m. rather than 10:00. Would it be possible to keep the desk available for me?\n\nI understand that the King Street entrance will be closed, so I plan to enter through the east garden gate. Could you also clarify whether photographs of the membership registers are permitted without flash, or whether I must request separate approval?\n\nI apologize for the inconvenience and appreciate your help with this research visit.\n\nSincerely,\nAlex","discussionTask":"Professor: Should public libraries devote more funding to digital collections or to neighborhood branches?\n\nStudent A — Emily: Digital collections are reachable at any time and reduce geographic barriers.\n\nStudent B — Daniel: Physical branches provide internet access, learning space, and personal support to underserved residents.","discussionSample":"The strongest policy would strengthen neighborhood library branches while maintaining a substantial digital collection. Digital books can remove distance barriers for readers with reliable internet access. However, those benefits are uneven if residents lack a device, broadband connection, or quiet place to work. A branch offers resources that an online catalogue cannot: staff assistance, public computers, and spaces for children and adults to learn together. Library history also suggests that rules and infrastructure, not simply the number of titles, determine who can participate. I would direct new funding toward improving access in underserved districts while expanding online borrowing where demand is clear. This mixed approach responds to practical differences among residents rather than assuming that one format can serve everyone equally well."},"vocabulary":[{"term":"subscription reading room","meaning":"유료 회원제 열람실","collocation":"operate a subscription reading room","example":"Although the preliminary results seemed convincing, archivists still needed to operate a subscription reading room.","synonym":"fee-based reading facility","nuance":"","group":"core"},{"term":"municipal charter","meaning":"지방자치단체 설립인가","collocation":"adopt a municipal charter","example":"Because the evidence was incomplete, archivists agreed to adopt a municipal charter again before deciding.","synonym":"city-authorized charter","nuance":"","group":"core"},{"term":"philanthropic endowment","meaning":"자선 기부 기금","collocation":"receive a philanthropic endowment","example":"The report identified an overlooked opportunity for archivists to receive a philanthropic endowment.","synonym":"donated permanent fund","nuance":"","group":"core"},{"term":"circulation register","meaning":"대출 기록부","collocation":"examine a circulation register","example":"After examining competing accounts, archivists were prepared to examine a circulation register.","synonym":"book-loan record","nuance":"","group":"core"},{"term":"outreach service","meaning":"찾아가는 도서관 서비스","collocation":"expand an outreach service","example":"One limitation of the project was that archivists could not yet expand an outreach service reliably.","synonym":"community engagement program","nuance":"","group":"core"},{"term":"multilingual holdings","meaning":"다국어 소장자료","collocation":"develop multilingual holdings","example":"A later review prompted archivists to develop multilingual holdings, rather than accept the initial explanation.","synonym":"materials in several languages","nuance":"","group":"core"},{"term":"supervised consultation","meaning":"감독하의 열람","collocation":"arrange supervised consultation","example":"Over a semester of fieldwork, archivists learned how to arrange supervised consultation.","synonym":"restricted in-person viewing","nuance":"","group":"core"},{"term":"archival fragility","meaning":"기록물의 취약성","collocation":"assess archival fragility","example":"In their final presentation, archivists described what it meant to assess archival fragility.","synonym":"delicate archival condition","nuance":"","group":"core"},{"term":"digitized newspaper","meaning":"디지털화된 신문","collocation":"search a digitized newspaper","example":"Careful documentation enabled archivists to search a digitized newspaper without repeating the same mistake.","synonym":"digitally scanned newspaper","nuance":"","group":"core"},{"term":"membership restriction","meaning":"회원 자격 제한","collocation":"remove a membership restriction","example":"In a subsequent case, archivists had to remove a membership restriction under rather different conditions.","synonym":"limits on membership","nuance":"","group":"core"},{"term":"borrowing privilege","meaning":"대출 권한","collocation":"extend borrowing privileges","example":"The final recommendation urged archivists to extend borrowing privileges before proceeding.","synonym":"right to borrow","nuance":"","group":"core"},{"term":"reading public","meaning":"독서 공중","collocation":"broaden the reading public","example":"In the first trial, archivists were not yet able to broaden the reading public consistently.","synonym":"general reading population","nuance":"","group":"core"},{"term":"historical register","meaning":"역사적 등록부","collocation":"consult a historical register","example":"The absence of reliable records made it difficult for archivists to consult a historical register.","synonym":"document from the past","nuance":"","group":"core"},{"term":"digital divide","meaning":"디지털 격차","collocation":"address the digital divide","example":"The project team provided a checklist to help archivists address the digital divide.","synonym":"unequal digital access","nuance":"","group":"core"},{"term":"library infrastructure","meaning":"도서관 기반시설","collocation":"invest in library infrastructure","example":"Students observed how archivists attempted to invest in library infrastructure despite incomplete information.","synonym":"library facilities and systems","nuance":"","group":"core"},{"term":"civic provision","meaning":"시민 대상 공공 서비스 제공","collocation":"expand civic provision","example":"A meaningful comparison would require archivists to expand civic provision independently.","synonym":"service provided for public benefit","nuance":"","group":"advanced"},{"term":"public patronage","meaning":"공공 후원","collocation":"secure public patronage","example":"A cautious interpretation allowed archivists to secure public patronage while acknowledging uncertainty.","synonym":"community funding support","nuance":"","group":"advanced"},{"term":"literacy campaign","meaning":"문해 교육 운동","collocation":"launch a literacy campaign","example":"Several independent observations led archivists to launch a literacy campaign before publication.","synonym":"reading-education initiative","nuance":"","group":"advanced"},{"term":"institutional reform","meaning":"제도 개혁","collocation":"introduce institutional reform","example":"A request from the university encouraged archivists to introduce institutional reform more transparently.","synonym":"organizational change","nuance":"","group":"advanced"},{"term":"historical continuity","meaning":"역사적 연속성","collocation":"trace historical continuity","example":"Rather than generalizing from one case, archivists sought to trace historical continuity in several settings.","synonym":"continuity across eras","nuance":"","group":"advanced"},{"term":"demographic shift","meaning":"인구 구성 변화","collocation":"document demographic shifts","example":"The investigation would be less credible if archivists neglected to document demographic shifts.","synonym":"population change","nuance":"","group":"advanced"},{"term":"subscription model","meaning":"구독형 운영 모델","collocation":"replace a subscription model","example":"The procedures were revised so that archivists could replace a subscription model consistently.","synonym":"member-funded system","nuance":"","group":"advanced"},{"term":"administrative mandate","meaning":"행정적 의무","collocation":"revise an administrative mandate","example":"Before finalizing the interpretation, archivists decided to revise an administrative mandate.","synonym":"official administrative requirement","nuance":"","group":"advanced"},{"term":"social inclusion","meaning":"사회적 포용","collocation":"promote social inclusion","example":"The students challenged archivists to promote social inclusion without overlooking contrary evidence.","synonym":"equal social participation","nuance":"","group":"advanced"},{"term":"infrastructural barrier","meaning":"기반시설 접근 장벽","collocation":"remove an infrastructural barrier","example":"The instructor proposed that archivists should first remove an infrastructural barrier and then compare outcomes.","synonym":"physical or digital obstacle","nuance":"","group":"advanced"},{"term":"reading culture","meaning":"독서 문화","collocation":"cultivate a reading culture","example":"When the initial explanation failed, archivists returned to the data to cultivate a reading culture.","synonym":"customs surrounding reading","nuance":"","group":"advanced"},{"term":"publicly funded service","meaning":"공적 재원 서비스","collocation":"maintain a publicly funded service","example":"The group discovered that it was possible to maintain a publicly funded service without assuming a single cause.","synonym":"tax-supported service","nuance":"","group":"advanced"},{"term":"intergenerational access","meaning":"세대 간 접근성","collocation":"improve intergenerational access","example":"A second research team challenged archivists to improve intergenerational access with different assumptions.","synonym":"access across age groups","nuance":"","group":"advanced"},{"term":"policy reversal","meaning":"정책의 번복","collocation":"examine a policy reversal","example":"The revised protocol gave archivists a systematic way to examine a policy reversal.","synonym":"reversal of a rule","nuance":"","group":"advanced"},{"term":"institutional legacy","meaning":"제도적 유산","collocation":"reassess an institutional legacy","example":"To address a practical difficulty, archivists chose to reassess an institutional legacy under controlled conditions.","synonym":"lasting institutional effect","nuance":"","group":"advanced"}],"meta":{"sourceType":"original practice content","etsOfficial":false,"benchmark":"TOEFL iBT January 2026 task-type descriptions / ETS sample 1","studyMinutes":120,"revision":"2026-11-23-diversity-v3","discipline":"History / Civic Institutions","genre":"chronology"}};</script>
