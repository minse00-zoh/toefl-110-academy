<script>window.TOEFL_LESSON={"day":13,"week":3,"theme":"Circadian Rhythms and Human Performance","focus":"Listening: intention, emphasis and discourse","claim":"Alertness reflects both accumulated sleep pressure and the timing of the circadian system.","evidence":"Shift workers may remain fatigued despite nominally sufficient sleep because light and biological timing affect recovery.","caveat":"Light timing, chronotype and daily routines vary, and laboratory reaction times do not fully predict safety outcomes.","response":"Assess sleep timing, exposure to light, recovery periods and task-specific vigilance across several days.","storageKey":"toefl110day13-diversity-v3","notice":"UNIVERSITY SLEEP LAB — PARTICIPANT BRIEFING\n\nThe circadian timing study requires three mornings of light-exposure monitoring. Participants will collect wearable sensors from the health center on Monday between 8 and 10 a.m. and return them by Thursday noon. Do not deliberately change your usual bedtime during the monitoring period.\n\nThe lab asks participants to record caffeine use and shift-work hours in a mobile diary. Anyone working an overnight shift during the study should notify the coordinator rather than omit the information. Participation is voluntary, and students can withdraw without academic penalty.","academicPassage":"Human alertness changes throughout the day, even when people try to maintain a constant level of effort. Part of this fluctuation reflects the circadian system, an internal network of biological clocks synchronized partly by light exposure. The system influences sleep timing, body temperature and certain hormone signals. It is related to, but not identical with, the pressure to sleep that accumulates during waking hours.\n\nThe distinction matters for shift workers. A person may feel intensely tired after a long night shift because sleep pressure is high, yet find it difficult to sleep during the bright morning when the circadian system promotes wakefulness. Conversely, an afternoon worker may be well rested but experience a temporary decline in vigilance during a low-alertness phase.\n\nStudies of light exposure show that timing is crucial. Bright light in the evening can shift the body's internal schedule later, while appropriately timed morning exposure may encourage an earlier rhythm. Such effects are neither instantaneous nor identical across individuals. Age, habitual sleep timing and the brightness of the environment can modify the response.\n\nThis evidence has implications for hospitals, transportation and workplaces where lapses of attention have consequences. A useful schedule cannot be designed merely by counting hours on duty. It should consider biological timing, opportunities for recovery and the specific tasks demanding vigilance. Researchers also distinguish short laboratory reaction-time changes from sustained changes in real-world safety outcomes.","readingClozePassage":"A hospital researcher asked volunteers to complete a reaction-time task after different sleep schedules. Some partic______ had sle__ for simi___ durations bu_ showed notic_____ differences i_ alertness. Revie____ the diar___ revealed th__ several ha_ worked overnight or encountered bright light in the early morning. The researcher explained that accumulated sleep pressure and the circadian clock influence performance through related but separate processes. A useful analysis would therefore consider when sleep occurred, not only how many hours the volunteers spent in bed.","cloze":[{"partial":"partic______","answer":"participants","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"sle__","answer":"slept","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"simi___","answer":"similar","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"bu_","answer":"but","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"notic_____","answer":"noticeable","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"i_","answer":"in","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"Revie____","answer":"reviewing","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"diar___","answer":"diaries","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"th__","answer":"that","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"ha_","answer":"had","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"}],"questions":{"rd":[{"q":"When must students return the wearable sleep monitors?","options":["By Thursday at noon.","Before the first overnight shift occurs.","By Friday evening after the final lecture.","Immediately after the Monday collection window."],"answer":0,"why":"실생활 공지의 해당 조건을 찾아 확인하세요. By Thursday at noon."},{"q":"What should participants who work an overnight shift do?","options":["Change their bedtime to an earlier hour without informing anyone.","Withdraw automatically because shift workers are not permitted.","Delete their caffeine records to simplify the diary.","Record their shift hours and inform the coordinator."],"answer":3,"why":"공지의 별도 요건 또는 예외 조항에 명시된 행동은 Record their shift hours and inform the coordinator.입니다."},{"q":"What does the sleep laboratory request during the monitoring period?","options":["Stop reporting overnight shifts because they complicate analysis.","Change the sensors each night without telling staff.","Keep usual bedtime and record caffeine and work hours.","Adopt an earlier bedtime to improve the study results."],"answer":2,"why":"공지의 예외 조항과 구체적인 적용 범위를 비교해야 합니다. 정답 근거: Keep usual bedtime and record caffeine and work hours."}],"ra":[{"q":"Which relationship among the system’s components does the passage stress in the passage on Circadian Rhythms and Human Performance?","options":["The circadian system and sleep pressure are exactly the same process.","Alertness reflects both accumulated sleep pressure and the timing of the circadian system.","Sleep duration alone guarantees identical alertness for every shift schedule.","Bright light shifts sleep timing in the same direction regardless of when it occurs."],"answer":1,"why":"중심 논지는 세부 사례에서 도출되는 가장 신중한 결론입니다. Alertness reflects both accumulated sleep pressure and the timing of the circadian system."},{"q":"What specific observation in the circadian rhythms and human performance case motivates the discussion?","options":["Shift workers may remain fatigued despite nominally sufficient sleep because light and biological timing affect recovery.","Bright light shifts sleep timing in the same direction regardless of when it occurs.","Sleep duration alone guarantees identical alertness for every shift schedule.","The circadian system and sleep pressure are exactly the same process."],"answer":0,"why":"지문의 사례·대조 정보를 직접 확인해야 합니다. Shift workers may remain fatigued despite nominally sufficient sleep because light and biological timing affect recovery."},{"q":"Which qualification prevents the evidence about sleep timing from supporting an unconditional claim?","options":["Bright light shifts sleep timing in the same direction regardless of when it occurs.","The circadian system and sleep pressure are exactly the same process.","Sleep duration alone guarantees identical alertness for every shift schedule.","Light timing, chronotype and daily routines vary, and laboratory reaction times do not fully predict safety outcomes."],"answer":3,"why":"한계 조건은 곧바로 틀린 결론이라는 뜻이 아니라 적용 범위를 제한합니다. Light timing, chronotype and daily routines vary, and laboratory reaction times do not fully predict safety outcomes."},{"q":"How does the example in the passage refine the broad claim about sleep timing?","options":["The example eliminates the need to compare evidence about sleep timing with alternative explanations.","It lists the sequence of sleep timing observations without contributing to the author’s main point.","It illustrates a specific relationship involving sleep timing while establishing the boundaries of the wider argument.","The example proves that the implications of sleep timing hold in every possible location."],"answer":2,"why":"사례는 범위가 제한된 관찰 또는 비교를 통해 주장을 구체화하고 무조건적 일반화를 피하도록 돕습니다."},{"q":"Which investigation or action would best extend the reasoning about circadian rhythms and human performance?","options":["Sleep duration alone guarantees identical alertness for every shift schedule.","Assess sleep timing, exposure to light, recovery periods and task-specific vigilance across several days.","The circadian system and sleep pressure are exactly the same process.","Bright light shifts sleep timing in the same direction regardless of when it occurs."],"answer":1,"why":"추가 검증은 근거의 결함을 직접 보완하거나 대안 설명을 시험해야 합니다. Assess sleep timing, exposure to light, recovery periods and task-specific vigilance across several days."}],"rp":[{"q":"In the circadian rhythms and human performance passage, what does “vigilance” most nearly mean in context?","options":["sustained attention","memory of distant events","ability to estimate costs","physical muscular strength"],"answer":0,"why":"단어의 문맥상 의미를 판단해야 하며 직역만으로 결정하지 않습니다. vigilance ≈ sustained attention"},{"q":"A night-shift worker sleeps eight hours but remains sluggish. What should researchers examine?","options":["The assumption that light exposure never affects recovery.","Whether the worker stopped having a biological clock.","Only the number of minutes spent in the workplace.","Circadian phase, light exposure and sleep timing."],"answer":3,"why":"새 상황에 지문 원리를 적용하는 고난도 추론 문항입니다. Circadian phase, light exposure and sleep timing."}],"lq":[{"q":"Which response best addresses the speaker’s question about sleep timing?","options":["The health center opens at eight.","Yes, the biological clock stops during sleep.","Not necessarily; circadian timing can affect recovery even when sleep duration is adequate.","Wearable sensors measure only room temperature."],"answer":2,"why":"화자는 전제를 확인하고 있으므로 직접적인 정정과 관련 조건 설명이 적절합니다."}],"lc":[{"q":"What brings the first speaker to the conversation concerning sleep timing?","options":["A plan to evaluate unrelated applicants for a different university program.","why reaction times slowed despite unchanged bedtime","A request for the institution to change the academic field under discussion.","An invitation to deliver a formal lecture explaining circadian rhythms and human performance."],"answer":1,"why":"대화의 도입부에서 상대가 확인하려는 문제를 파악합니다. why reaction times slowed despite unchanged bedtime"},{"q":"What does the second speaker clarify about the issue raised in the circadian rhythms and human performance dialogue?","options":["sleep pressure and circadian timing can both affect alertness","The circadian system and sleep pressure are exactly the same process.","Bright light shifts sleep timing in the same direction regardless of when it occurs.","Sleep duration alone guarantees identical alertness for every shift schedule."],"answer":0,"why":"Not necessarily, No, Exactly와 같은 정정 이후의 내용을 확인합니다. sleep pressure and circadian timing can both affect alertness"},{"q":"What will the first speaker most likely do after the discussion about sleep timing?","options":["Replace the entire project with an unrelated topic without consulting anyone.","Withdraw permanently from all activities discussed.","Disregard the advice and continue on the original assumption.","include shift hours and caffeine in the diary"],"answer":3,"why":"마지막 발화에서 다음 행동을 추론합니다. include shift hours and caffeine in the diary"}],"la":[{"q":"What practical change or instruction is listeners expected to notice in the announcement about sleep timing?","options":["Before the first overnight shift occurs.","By Friday evening after the final lecture.","By Thursday at noon.","Immediately after the Monday collection window."],"answer":2,"why":"공지의 장소·시간·적용 조건을 듣고 핵심 변경사항을 선택합니다. By Thursday at noon."},{"q":"Which additional requirement applies to listeners in the circadian rhythms and human performance announcement?","options":["Change their bedtime to an earlier hour without informing anyone.","Record their shift hours and inform the coordinator.","Withdraw automatically because shift workers are not permitted.","Delete their caffeine records to simplify the diary."],"answer":1,"why":"보편적인 안내와 특정 조건에 해당하는 행동을 구별해야 합니다. Record their shift hours and inform the coordinator."}],"lt":[{"q":"Which statement best summarizes the lecturer’s explanation of circadian rhythms and human performance?","options":["Alertness reflects both accumulated sleep pressure and the timing of the circadian system.","The circadian system and sleep pressure are exactly the same process.","Sleep duration alone guarantees identical alertness for every shift schedule.","Bright light shifts sleep timing in the same direction regardless of when it occurs."],"answer":0,"why":"강의 중심 개념과 화자의 제한된 결론을 종합합니다. Alertness reflects both accumulated sleep pressure and the timing of the circadian system."},{"q":"What role does the lecturer’s example of sleep timing play in the explanation?","options":["Sleep duration alone guarantees identical alertness for every shift schedule.","Bright light shifts sleep timing in the same direction regardless of when it occurs.","The circadian system and sleep pressure are exactly the same process.","Shift workers may remain fatigued despite nominally sufficient sleep because light and biological timing affect recovery."],"answer":3,"why":"강의 사례는 개념을 구체화하는 관측 자료 또는 비교입니다. Shift workers may remain fatigued despite nominally sufficient sleep because light and biological timing affect recovery."},{"q":"What caution does the lecturer introduce after describing evidence related to sleep timing?","options":["The circadian system and sleep pressure are exactly the same process.","Sleep duration alone guarantees identical alertness for every shift schedule.","Light timing, chronotype and daily routines vary, and laboratory reaction times do not fully predict safety outcomes.","Bright light shifts sleep timing in the same direction regardless of when it occurs."],"answer":2,"why":"화자가 However, but 등으로 도입하는 예외를 듣는 것이 핵심입니다. Light timing, chronotype and daily routines vary, and laboratory reaction times do not fully predict safety outcomes."},{"q":"How would the lecturer most likely advise someone evaluating sleep timing in a new setting?","options":["The circadian system and sleep pressure are exactly the same process.","Assess sleep timing, exposure to light, recovery periods and task-specific vigilance across several days.","Sleep duration alone guarantees identical alertness for every shift schedule.","Bright light shifts sleep timing in the same direction regardless of when it occurs."],"answer":1,"why":"강의의 마무리에서 제안하는 연구·실행 원칙을 응용합니다. Assess sleep timing, exposure to light, recovery periods and task-specific vigilance across several days."}]},"audio":{"lq":"If I sleep eight hours after a night shift, will my alertness always be normal?","lc":"Student: My sleep diary shows I went to bed at the same time, but my reaction times were slower after two night shifts. Did the sensor malfunction?\nResearcher: Not necessarily. Reaction time reflects several things, including sleep pressure and circadian timing.\nStudent: I thought eight hours of rest would always cancel the effect of a shift.\nResearcher: The timing of sleep matters, not just the number of hours. Daytime light and social schedules can also make recovery harder.\nStudent: Should I remove my caffeine entries? They seem unrelated.\nResearcher: Please keep them. Caffeine may affect alertness, so we need those records to interpret the changes.\nStudent: All right. I'll submit the diary with the shift times included.","la":"Participants in the circadian study may collect their wearable monitors at the university health center between eight and ten on Monday morning. Please follow your usual sleep schedule rather than adjusting it for the experiment. Record caffeine consumption and any overnight shifts in the mobile diary. Return the monitors by noon on Thursday, and contact the coordinator if your schedule changes unexpectedly.","lt":"We often speak of tiredness as though it came from only one source. In reality, sleep pressure grows the longer we remain awake, while a circadian clock changes when our bodies are most prepared to sleep or stay alert.\n\nConsider someone leaving a night shift. They may be exhausted, yet the bright morning environment can make daytime sleep difficult. This is why getting the same number of hours does not necessarily have the same effect at every time of day.\n\nLight can shift internal timing, but the direction depends on when it is experienced. Exposure late in the evening can push the schedule later, while morning light may promote an earlier rhythm. Individual differences are important too.\n\nWhen researchers design fatigue-management programs, they measure vigilance and recovery across several days. A single reaction-time test is useful, but it cannot by itself prove that a schedule will reduce errors in a hospital or on the road."},"speaking":{"repeat":["Welcome to the workshop on sleep timing.","The circadian timing study requires three mornings of light-exposure monitoring.","The instructor asked us to compare the evidence about sleep timing before drawing conclusions.","Shift workers may remain fatigued despite nominally sufficient sleep because light and biological timing affect recovery.","Light timing, chronotype and daily routines vary, and laboratory reaction times do not fully predict safety outcomes.","Assess sleep timing, exposure to light, recovery periods and task-specific vigilance across several days.","Although it might initially seem that the circadian system and sleep pressure are exactly the same process, the evidence instead suggests that alertness reflects both accumulated sleep pressure and the timing of the circadian system."],"interviews":["What first interested you in human physiology, and how would you explain that interest to a friend?","Tell me about a time when a practical decision involving sleep timing was more complicated than you expected.","Do you think universities should give more attention to sleep timing in introductory courses? Explain your reasoning.","Imagine a classmate disagrees with your interpretation of sleep timing. How would you respond respectfully and precisely?"],"sample":"I think students should take sleep timing seriously rather than treating sleep as a fixed number of hours. I once studied late for several days and then wondered why I felt exhausted despite sleeping longer on the weekend. Learning about circadian rhythms helped me understand that consistency and exposure to light can influence alertness. If I were planning a difficult study schedule now, I would spread the work across several days and keep a more regular bedtime. Of course, individual circumstances differ, especially for people working shifts. My main point is that effective preparation should account for recovery, not only the time spent studying."},"writing":{"build":[{"fragments":"session has been rescheduled / whether the sleep timing / Could you tell me","answer":"Could you tell me whether the sleep timing session has been rescheduled?","why":"간접 의문문 어순의 문장 구조와 주어-동사 관계를 확인하세요."},{"fragments":"The student who reviewed / noticed an important discrepancy / the sleep pressure records","answer":"The student who reviewed the sleep pressure records noticed an important discrepancy.","why":"관계절로 설명 추가의 문장 구조와 주어-동사 관계를 확인하세요."},{"fragments":"the internal clock evidence earlier, / it might have reached a / If the team had checked / different conclusion","answer":"If the team had checked the internal clock evidence earlier, it might have reached a different conclusion.","why":"조건절로 가능성 제시의 문장 구조와 주어-동사 관계를 확인하세요."},{"fragments":"Only after the records related / examined did the committee approve / to sleep timing had been / the report","answer":"Only after the records related to sleep timing had been examined did the committee approve the report.","why":"Only after 도치의 문장 구조와 주어-동사 관계를 확인하세요."},{"fragments":"requires not only reliable evidence / A project involving sleep timing / but also a clear account / of its limitations","answer":"A project involving sleep timing requires not only reliable evidence but also a clear account of its limitations.","why":"Not only A but also B 병렬의 문장 구조와 주어-동사 관계를 확인하세요."}],"emailTask":"You agreed to participate in a sleep-timing study, but an unexpected overnight work shift overlaps with the monitoring period. Email the study coordinator to report the schedule change, ask whether your data can still be used, and confirm whether you should maintain your normal routine.","emailSample":"Dear Study Coordinator,\n\nI agreed to participate in the three-day circadian monitoring study, but my employer has unexpectedly assigned me an overnight shift during the observation period. This may affect both my sleep timing and my reaction-time measurements.\n\nWould you prefer that I continue with my usual routine and record the shift in the mobile diary, or should the monitoring dates be changed? I will also document caffeine use as requested and will not alter the records to make my schedule appear more regular.\n\nPlease let me know whether the collected data would still be useful. Thank you for your guidance.\n\nBest regards,\nAlex","discussionTask":"Professor: Should universities offer flexible class times for students with different sleep schedules?\n\nStudent A — Emily: Yes, flexibility may improve attention and wellbeing for students with varying chronotypes.\n\nStudent B — Daniel: Common schedules support collaboration and fairness, and individual preferences are difficult to accommodate completely.","discussionSample":"Universities should offer some scheduling flexibility because students' alertness is affected by more than their willingness to concentrate. The circadian system influences when a person is biologically prepared to sleep or stay awake. Students who work night shifts may find an early class particularly demanding even if they set aside enough hours for rest. Nevertheless, fully individualized timetables could make group projects and laboratory sessions difficult to organize. I would therefore support multiple sections of high-demand courses and recorded alternatives for selected lectures, while retaining common meeting times for collaboration. This arrangement acknowledges physiological variation without treating every personal preference as an entitlement to a unique schedule. Academic performance should be evaluated by learning outcomes, not by attendance at one preferred hour."},"vocabulary":[{"term":"circadian timing","meaning":"일주기 타이밍","collocation":"measure circadian timing","example":"The available resources enabled sleep researchers to measure circadian timing during the pilot study.","synonym":"timing of the body clock","nuance":"","group":"core"},{"term":"sleep pressure","meaning":"수면 압력","collocation":"accumulate sleep pressure","example":"Although the preliminary results seemed convincing, sleep researchers still needed to accumulate sleep pressure.","synonym":"pressure to sleep","nuance":"","group":"core"},{"term":"internal clock","meaning":"생체시계","collocation":"synchronize an internal clock","example":"Because the evidence was incomplete, sleep researchers agreed to synchronize an internal clock again before deciding.","synonym":"internal timing system","nuance":"","group":"core"},{"term":"light exposure","meaning":"광 노출","collocation":"control light exposure","example":"The report identified an overlooked opportunity for sleep researchers to control light exposure.","synonym":"exposure to illumination","nuance":"","group":"core"},{"term":"chronotype","meaning":"아침형·저녁형 성향","collocation":"assess chronotype","example":"After examining competing accounts, sleep researchers were prepared to assess chronotype.","synonym":"personal sleep timing preference","nuance":"","group":"core"},{"term":"vigilance lapse","meaning":"주의력 저하","collocation":"detect a vigilance lapse","example":"One limitation of the project was that sleep researchers could not yet detect a vigilance lapse reliably.","synonym":"brief drop in alertness","nuance":"","group":"core"},{"term":"reaction time","meaning":"반응시간","collocation":"measure reaction time","example":"A later review prompted sleep researchers to measure reaction time, rather than accept the initial explanation.","synonym":"speed of response","nuance":"","group":"core"},{"term":"shift-work schedule","meaning":"교대근무 일정","collocation":"adapt a shift-work schedule","example":"Over a semester of fieldwork, sleep researchers learned how to adapt a shift-work schedule.","synonym":"rotating work hours","nuance":"","group":"core"},{"term":"biological entrainment","meaning":"생체 리듬 동조","collocation":"promote biological entrainment","example":"In their final presentation, sleep researchers described what it meant to promote biological entrainment.","synonym":"alignment of biological rhythms","nuance":"","group":"core"},{"term":"hormonal signal","meaning":"호르몬 신호","collocation":"monitor hormonal signals","example":"Careful documentation enabled sleep researchers to monitor hormonal signals without repeating the same mistake.","synonym":"hormone-related message","nuance":"","group":"core"},{"term":"sleep recovery","meaning":"수면 회복","collocation":"support sleep recovery","example":"In a subsequent case, sleep researchers had to support sleep recovery under rather different conditions.","synonym":"restoration after sleep","nuance":"","group":"core"},{"term":"wearable monitor","meaning":"착용형 모니터","collocation":"use a wearable monitor","example":"The final recommendation urged sleep researchers to use a wearable monitor before proceeding.","synonym":"body-worn tracking device","nuance":"","group":"core"},{"term":"habitual bedtime","meaning":"평소 취침시각","collocation":"record habitual bedtime","example":"In the first trial, sleep researchers were not yet able to record habitual bedtime consistently.","synonym":"usual time of sleep","nuance":"","group":"core"},{"term":"phase shift","meaning":"위상 이동","collocation":"induce a phase shift","example":"The absence of reliable records made it difficult for sleep researchers to induce a phase shift.","synonym":"change in the clock's phase","nuance":"","group":"core"},{"term":"fatigue management","meaning":"피로 관리","collocation":"implement fatigue management","example":"The project team provided a checklist to help sleep researchers implement fatigue management.","synonym":"control of tiredness","nuance":"","group":"core"},{"term":"biological clock","meaning":"생체시계","collocation":"synchronize a biological clock","example":"Students observed how sleep researchers attempted to synchronize a biological clock despite incomplete information.","synonym":"the body's daily timer","nuance":"","group":"advanced"},{"term":"homeostatic drive","meaning":"항상성 구동력","collocation":"measure homeostatic drive","example":"A meaningful comparison would require sleep researchers to measure homeostatic drive independently.","synonym":"drive that increases while awake","nuance":"","group":"advanced"},{"term":"sleep-wake cycle","meaning":"수면-각성 주기","collocation":"regulate a sleep-wake cycle","example":"A cautious interpretation allowed sleep researchers to regulate a sleep-wake cycle while acknowledging uncertainty.","synonym":"daily pattern of sleep","nuance":"","group":"advanced"},{"term":"temporal misalignment","meaning":"시간적 불일치","collocation":"correct temporal misalignment","example":"Several independent observations led sleep researchers to correct temporal misalignment before publication.","synonym":"misalignment between schedules","nuance":"","group":"advanced"},{"term":"vigilance performance","meaning":"주의 유지 수행","collocation":"monitor vigilance performance","example":"A request from the university encouraged sleep researchers to monitor vigilance performance more transparently.","synonym":"ability to maintain alertness","nuance":"","group":"advanced"},{"term":"light sensitivity","meaning":"빛 민감도","collocation":"measure light sensitivity","example":"Rather than generalizing from one case, sleep researchers sought to measure light sensitivity in several settings.","synonym":"sensitivity to illumination","nuance":"","group":"advanced"},{"term":"recovery interval","meaning":"회복 간격","collocation":"schedule recovery intervals","example":"The investigation would be less credible if sleep researchers neglected to schedule recovery intervals.","synonym":"time needed to recover","nuance":"","group":"advanced"},{"term":"behavioral adaptation","meaning":"행동적 적응","collocation":"encourage behavioral adaptation","example":"The procedures were revised so that sleep researchers could encourage behavioral adaptation consistently.","synonym":"adjustment of behavior","nuance":"","group":"advanced"},{"term":"occupational fatigue","meaning":"직업성 피로","collocation":"mitigate occupational fatigue","example":"Before finalizing the interpretation, sleep researchers decided to mitigate occupational fatigue.","synonym":"fatigue from work demands","nuance":"","group":"advanced"},{"term":"performance variability","meaning":"수행 변동성","collocation":"quantify performance variability","example":"The students challenged sleep researchers to quantify performance variability without overlooking contrary evidence.","synonym":"differences in performance","nuance":"","group":"advanced"},{"term":"physiological marker","meaning":"생리학적 지표","collocation":"track a physiological marker","example":"The instructor proposed that sleep researchers should first track a physiological marker and then compare outcomes.","synonym":"measurable body indicator","nuance":"","group":"advanced"},{"term":"environmental brightness","meaning":"환경 밝기","collocation":"control environmental brightness","example":"When the initial explanation failed, sleep researchers returned to the data to control environmental brightness.","synonym":"amount of light in surroundings","nuance":"","group":"advanced"},{"term":"shift rotation","meaning":"교대 순환","collocation":"modify shift rotation","example":"The group discovered that it was possible to modify shift rotation without assuming a single cause.","synonym":"pattern of changing shifts","nuance":"","group":"advanced"},{"term":"daytime sleep","meaning":"주간 수면","collocation":"protect daytime sleep","example":"A second research team challenged sleep researchers to protect daytime sleep with different assumptions.","synonym":"sleep during daylight hours","nuance":"","group":"advanced"},{"term":"individual chronobiology","meaning":"개인별 시간생물학 특성","collocation":"consider individual chronobiology","example":"The revised protocol gave sleep researchers a systematic way to consider individual chronobiology.","synonym":"personal biological timing","nuance":"","group":"advanced"}],"meta":{"sourceType":"original practice content","etsOfficial":false,"benchmark":"TOEFL iBT January 2026 task-type descriptions / ETS sample 1","studyMinutes":120,"revision":"2026-11-23-diversity-v3","discipline":"Human Physiology","genre":"systems"}};</script>
