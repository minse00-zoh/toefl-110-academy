<script>window.TOEFL_LESSON={"day":1,"week":1,"theme":"Open Science and University Life","focus":"Type awareness and diagnostics","claim":"Practical reproducibility depends on interpretable documentation, not file access alone.","evidence":"The smaller documented collection was easier for students to reproduce than the larger undocumented one.","caveat":"Some interview records cannot be released openly because details could identify participants.","response":"Provide a data dictionary, analysis instructions, and controlled access for sensitive records.","storageKey":"toefl110day1-diversity-v3","notice":"LIBRARY RESEARCH SUPPORT DESK — DATA REPOSITORY CLINIC\n\nThe Tuesday clinic has moved from the Digital Commons to the library's second-floor consultation suite because the computers in the original room are being replaced. The session still begins at 3:30 p.m. Students may bring a laptop or use one of the computers in the new room.\n\nAnyone seeking advice on restricted human-subject data must request a confidential appointment through the library portal by Monday at noon. The general session is open to all registered students, but individual files containing personal information must not be emailed to the instructor.","academicPassage":"When scientists make their findings publicly accessible, readers sometimes assume that the underlying research is fully reproducible. Yet access to a journal article and access to the information needed to check its conclusions are different things. A paper may describe a statistical result while omitting the software version, data-cleaning decisions, or instructions required to reproduce a figure.\n\nA university library recently evaluated two ways of improving research transparency. One department deposited raw measurements without explanatory documentation; another published smaller datasets accompanied by a data dictionary and an annotated analysis script. External students reported fewer difficulties with the second collection, despite its smaller size. The comparison suggests that usable documentation can matter more than the quantity of material released.\n\nThere are limits to unrestricted openness. Researchers who collect interviews about sensitive experiences cannot always post the original recordings. Even anonymized files may contain combinations of details that indirectly identify participants. In such cases, carefully governed access may permit independent verification without making every record public.\n\nThe goal, therefore, is not maximum disclosure regardless of consequences. It is to make research claims checkable through an appropriate combination of accessible methods, meaningful metadata, and protection of participants. Institutions that reward the mere number of uploaded files risk encouraging compliance without producing genuine transparency.","readingClozePassage":"A research assistant inherited a spreadsheet without the codebook used by its creator. The fir__ inspection see___ straightforward, bu_ several colu___ contained unexpl_____ abbreviations. Wh__ another stud___ attempted t_ reproduce th_ published cha__, the values did not match. The group consulted the original notebooks and discovered that a missing-value code had been treated as an ordinary measurement. After documenting that convention, they obtained a much closer reconstruction. The experience showed why the context of a dataset can be as important as access to the numbers.","cloze":[{"partial":"fir__","answer":"first","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"see___","answer":"seemed","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"bu_","answer":"but","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"colu___","answer":"columns","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"unexpl_____","answer":"unexplained","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"Wh__","answer":"when","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"stud___","answer":"student","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"t_","answer":"to","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"th_","answer":"the","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"cha__","answer":"chart","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"}],"questions":{"rd":[{"q":"Where should students go for the Tuesday clinic?","options":["the second-floor consultation suite","the Digital Commons","the graduate admissions desk","the research laboratory"],"answer":0,"why":"실생활 공지의 해당 조건을 찾아 확인하세요. the second-floor consultation suite"},{"q":"How should a student request advice about restricted interview data?","options":["Wait for the general session and share personal files there.","Send interview recordings directly to the instructor.","Upload identifiable interviews to the public folder.","Book a confidential appointment by Monday at noon."],"answer":3,"why":"공지의 별도 요건 또는 예외 조항에 명시된 행동은 Book a confidential appointment by Monday at noon.입니다."},{"q":"A student has a confidential interview file. Which action is consistent with the clinic notice?","options":["Share the original interview during the open group session.","Assume that the general appointment removes privacy restrictions.","Arrange private advice instead of emailing the file to the instructor.","Attach the recording to a public clinic registration email."],"answer":2,"why":"공지의 예외 조항과 구체적인 적용 범위를 비교해야 합니다. 정답 근거: Arrange private advice instead of emailing the file to the instructor."}],"ra":[{"q":"In the comparison, which conclusion does the author defend most carefully in the passage on Open Science and University Life?","options":["A paper is fully transparent once its abstract is freely available.","Practical reproducibility depends on interpretable documentation, not file access alone.","Reproducibility requires publishing the identity of every participant.","The number of deposited files reliably measures research quality."],"answer":1,"why":"중심 논지는 세부 사례에서 도출되는 가장 신중한 결론입니다. Practical reproducibility depends on interpretable documentation, not file access alone."},{"q":"What specific observation in the open science and university life case motivates the discussion?","options":["The smaller documented collection was easier for students to reproduce than the larger undocumented one.","A paper is fully transparent once its abstract is freely available.","Reproducibility requires publishing the identity of every participant.","The number of deposited files reliably measures research quality."],"answer":0,"why":"지문의 사례·대조 정보를 직접 확인해야 합니다. The smaller documented collection was easier for students to reproduce than the larger undocumented one."},{"q":"Which qualification prevents the evidence about research documentation from supporting an unconditional claim?","options":["The number of deposited files reliably measures research quality.","Reproducibility requires publishing the identity of every participant.","A paper is fully transparent once its abstract is freely available.","Some interview records cannot be released openly because details could identify participants."],"answer":3,"why":"한계 조건은 곧바로 틀린 결론이라는 뜻이 아니라 적용 범위를 제한합니다. Some interview records cannot be released openly because details could identify participants."},{"q":"What is the rhetorical function of the particular case discussed in the middle of the open science and university life text?","options":["The example proves that the implications of research documentation hold in every possible location.","It lists the sequence of research documentation observations without contributing to the author’s main point.","It illustrates a specific relationship involving research documentation while establishing the boundaries of the wider argument.","The example eliminates the need to compare evidence about research documentation with alternative explanations."],"answer":2,"why":"사례는 범위가 제한된 관찰 또는 비교를 통해 주장을 구체화하고 무조건적 일반화를 피하도록 돕습니다."},{"q":"Which investigation or action would best extend the reasoning about open science and university life?","options":["Reproducibility requires publishing the identity of every participant.","Provide a data dictionary, analysis instructions, and controlled access for sensitive records.","A paper is fully transparent once its abstract is freely available.","The number of deposited files reliably measures research quality."],"answer":1,"why":"추가 검증은 근거의 결함을 직접 보완하거나 대안 설명을 시험해야 합니다. Provide a data dictionary, analysis instructions, and controlled access for sensitive records."}],"rp":[{"q":"In the open science and university life passage, what does “governed” most nearly mean in context?","options":["regulated","celebrated","freely distributed","repeated"],"answer":0,"why":"단어의 문맥상 의미를 판단해야 하며 직역만으로 결정하지 않습니다. governed ≈ regulated"},{"q":"A biology group uploads hundreds of unlabeled microscope images. What improvement follows the repository argument?","options":["Release participant names to demonstrate that the project is transparent.","Delete the original measurement settings to simplify the repository.","Upload more images with the same missing labels.","Add an image legend and processing record so others can interpret them."],"answer":3,"why":"새 상황에 지문 원리를 적용하는 고난도 추론 문항입니다. Add an image legend and processing record so others can interpret them."}],"lq":[{"q":"Which response best addresses the speaker’s question about research documentation?","options":["The clinic takes place on Thursday evening.","Only if the files are compressed first.","No. Sensitive records require a confidential consultation, not ordinary email.","You can find the thesis guidelines in the science building."],"answer":2,"why":"화자는 전제를 확인하고 있으므로 직접적인 정정과 관련 조건 설명이 적절합니다."}],"lc":[{"q":"What brings the first speaker to the conversation concerning research documentation?","options":["A request for the institution to change the academic field under discussion.","why the upload was held","An invitation to deliver a formal lecture explaining open science and university life.","A plan to evaluate unrelated applicants for a different university program."],"answer":1,"why":"대화의 도입부에서 상대가 확인하려는 문제를 파악합니다. why the upload was held"},{"q":"What does the second speaker clarify about the issue raised in the open science and university life dialogue?","options":["the submitted files lack a data dictionary, not new measurements","Reproducibility requires publishing the identity of every participant.","A paper is fully transparent once its abstract is freely available.","The number of deposited files reliably measures research quality."],"answer":0,"why":"Not necessarily, No, Exactly와 같은 정정 이후의 내용을 확인합니다. the submitted files lack a data dictionary, not new measurements"},{"q":"What will the first speaker most likely do after the discussion about research documentation?","options":["Replace the entire project with an unrelated topic without consulting anyone.","Disregard the advice and continue on the original assumption.","Withdraw permanently from all activities discussed.","update the variable definitions and check for identifiers"],"answer":3,"why":"마지막 발화에서 다음 행동을 추론합니다. update the variable definitions and check for identifiers"}],"la":[{"q":"What practical change or instruction is listeners expected to notice in the announcement about research documentation?","options":["the Digital Commons","the graduate admissions desk","the second-floor consultation suite","the research laboratory"],"answer":2,"why":"공지의 장소·시간·적용 조건을 듣고 핵심 변경사항을 선택합니다. the second-floor consultation suite"},{"q":"Which additional requirement applies to listeners in the open science and university life announcement?","options":["Send interview recordings directly to the instructor.","Book a confidential appointment by Monday at noon.","Wait for the general session and share personal files there.","Upload identifiable interviews to the public folder."],"answer":1,"why":"보편적인 안내와 특정 조건에 해당하는 행동을 구별해야 합니다. Book a confidential appointment by Monday at noon."}],"lt":[{"q":"Which statement best summarizes the lecturer’s explanation of open science and university life?","options":["Practical reproducibility depends on interpretable documentation, not file access alone.","The number of deposited files reliably measures research quality.","Reproducibility requires publishing the identity of every participant.","A paper is fully transparent once its abstract is freely available."],"answer":0,"why":"강의 중심 개념과 화자의 제한된 결론을 종합합니다. Practical reproducibility depends on interpretable documentation, not file access alone."},{"q":"What role does the lecturer’s example of research documentation play in the explanation?","options":["Reproducibility requires publishing the identity of every participant.","A paper is fully transparent once its abstract is freely available.","The number of deposited files reliably measures research quality.","The smaller documented collection was easier for students to reproduce than the larger undocumented one."],"answer":3,"why":"강의 사례는 개념을 구체화하는 관측 자료 또는 비교입니다. The smaller documented collection was easier for students to reproduce than the larger undocumented one."},{"q":"What caution does the lecturer introduce after describing evidence related to research documentation?","options":["A paper is fully transparent once its abstract is freely available.","The number of deposited files reliably measures research quality.","Some interview records cannot be released openly because details could identify participants.","Reproducibility requires publishing the identity of every participant."],"answer":2,"why":"화자가 However, but 등으로 도입하는 예외를 듣는 것이 핵심입니다. Some interview records cannot be released openly because details could identify participants."},{"q":"How would the lecturer most likely advise someone evaluating research documentation in a new setting?","options":["The number of deposited files reliably measures research quality.","Provide a data dictionary, analysis instructions, and controlled access for sensitive records.","A paper is fully transparent once its abstract is freely available.","Reproducibility requires publishing the identity of every participant."],"answer":1,"why":"강의의 마무리에서 제안하는 연구·실행 원칙을 응용합니다. Provide a data dictionary, analysis instructions, and controlled access for sensitive records."}]},"audio":{"lq":"I thought everyone could email their interview files before the clinic. Is that right?","lc":"Student: I have to deposit the data for my thesis, but the repository rejected the upload. Does that mean I need to collect the measurements again?\nLibrarian: Not at all. The repository accepts the files themselves, but your submission is missing the data dictionary.\nStudent: I included a paragraph in the thesis explaining the experiment. Isn't that enough?\nLibrarian: It explains the project, but someone opening a spreadsheet still needs to know what each column means and which values indicate missing observations.\nStudent: Could I upload the dictionary later?\nLibrarian: Yes, although the dataset will remain private until the documentation is checked. You should also confirm that none of the files contain participant identifiers.\nStudent: Then I'll revise the documentation rather than the measurements.\nLibrarian: Exactly. Bring the revised package to tomorrow's clinic if you'd like us to review it.","la":"The library's research-data clinic is scheduled for Tuesday at three thirty in the second-floor consultation suite. Please note that it is not meeting in the Digital Commons, as the computers there are being replaced. General questions about file formats and documentation can be discussed during the session. If your dataset includes restricted information about participants, book a confidential consultation through the portal by Monday at noon. Do not send identifiable files by ordinary email.","lt":"Consider a repository containing thousands of research files. Is it necessarily more transparent than a smaller collection? Not if the reader cannot determine what those files mean. This distinction is sometimes lost in discussions about open science.\n\nIn one campus review, a collection of raw measurements attracted many downloads, but students struggled to reconstruct the published diagrams. A second collection contained fewer files, yet each variable was defined and an annotated script showed the order of analysis. Independent users could check the main result with much less guesswork.\n\nNotice that transparency is not simply a question of publicity. Sensitive interview records may need to remain in a secure environment. Independent reviewers could still confirm a result if the institution provides a controlled procedure for checking it.\n\nThe lesson is that research becomes more trustworthy when its reasoning can be inspected. Releasing additional files is useful only when readers also receive enough context to understand them."},"speaking":{"repeat":["Welcome to the workshop on research documentation.","The Tuesday clinic has moved from the Digital Commons to the library's second-floor consultation suite because the computers in the original room are being replaced.","The instructor asked us to compare the evidence about research documentation before drawing conclusions.","The smaller documented collection was easier for students to reproduce than the larger undocumented one.","Some interview records cannot be released openly because details could identify participants.","Provide a data dictionary, analysis instructions, and controlled access for sensitive records.","Although it might initially seem that the number of deposited files reliably measures research quality, the evidence instead suggests that practical reproducibility depends on interpretable documentation, not file access alone."],"interviews":["What first interested you in university research / information literacy, and how would you explain that interest to a friend?","Tell me about a time when a practical decision involving research documentation was more complicated than you expected.","Do you think universities should give more attention to research documentation in introductory courses? Explain your reasoning.","Imagine a classmate disagrees with your interpretation of research documentation. How would you respond respectfully and precisely?"],"sample":"One practical skill I would encourage new graduate students to develop is documenting their work as they go. On a class project, I once inherited a spreadsheet with no explanation of the variable names. Even though the numerical analysis looked impressive, it took our team hours to discover which entries represented missing measurements. I eventually wrote a short data dictionary and a step-by-step guide to the analysis. That experience changed how I think about transparency. Making research available is not enough if the next person cannot interpret it. Since then, I have treated clear documentation as part of the research itself."},"writing":{"build":[{"fragments":"session has been rescheduled / whether the research documentation / Could you tell me","answer":"Could you tell me whether the research documentation session has been rescheduled?","why":"간접 의문문 어순의 문장 구조와 주어-동사 관계를 확인하세요."},{"fragments":"the annotated script records / The student who reviewed / noticed an important discrepancy","answer":"The student who reviewed the annotated script records noticed an important discrepancy.","why":"관계절로 설명 추가의 문장 구조와 주어-동사 관계를 확인하세요."},{"fragments":"If the team had checked / might have reached a different / conclusion / the de-identification evidence earlier, it","answer":"If the team had checked the de-identification evidence earlier, it might have reached a different conclusion.","why":"조건절로 가능성 제시의 문장 구조와 주어-동사 관계를 확인하세요."},{"fragments":"examined did the committee approve / to research documentation had been / Only after the records related / the report","answer":"Only after the records related to research documentation had been examined did the committee approve the report.","why":"Only after 도치의 문장 구조와 주어-동사 관계를 확인하세요."},{"fragments":"A project involving research documentation / requires not only reliable evidence / but also a clear account / of its limitations","answer":"A project involving research documentation requires not only reliable evidence but also a clear account of its limitations.","why":"Not only A but also B 병렬의 문장 구조와 주어-동사 관계를 확인하세요."}],"emailTask":"You submitted a thesis dataset to the university repository, but the files were returned because the data dictionary was incomplete. Email the research-data librarian. Explain what you have corrected, ask whether the analysis script needs further annotation, and request confirmation before the thesis submission deadline.","emailSample":"Dear Research Data Team,\n\nThank you for reviewing my thesis dataset. I have revised the data dictionary to define each variable, explain the units and identify the codes used for missing observations. The numerical measurements have not changed.\n\nBefore I resubmit the package, could you confirm whether the analysis script also needs line-by-line annotations? I want to ensure that another researcher can reproduce the main figure without guessing which filters were applied. My thesis submission deadline is next Friday, so an indication of the expected review time would be especially helpful.\n\nI appreciate your guidance and will keep the files private until the documentation is approved.\n\nBest regards,\nAlex","discussionTask":"Professor: Should universities require researchers to share detailed analysis methods even when they cannot release the underlying data?\n\nStudent A — Emily: Yes. Transparent methods allow independent scrutiny without exposing confidential records.\n\nStudent B — Daniel: No. Detailed reporting adds substantial work and does not guarantee that others can reproduce the results.","discussionSample":"I would support a requirement to share detailed analytical methods, even when a dataset cannot be made public. The crucial distinction is between disclosing sensitive information and enabling another person to evaluate a scientific claim. A data dictionary and a documented analysis script can clarify how a reported pattern was produced without exposing participants' identities. Consider a study using confidential interviews: releasing recordings might violate consent, whereas allowing qualified reviewers to examine the analysis inside a secure environment could still support independent scrutiny. I understand the concern that documentation takes time. Nevertheless, the additional effort is justified when it prevents avoidable misunderstandings and increases confidence in published conclusions. Universities should therefore fund documentation support and adopt safeguards rather than treating full public disclosure as the only form of transparency."},"vocabulary":[{"term":"data dictionary","meaning":"데이터 항목 정의서","collocation":"compile a data dictionary","example":"In the first trial, library researchers were not yet able to compile a data dictionary consistently.","synonym":"variable glossary","nuance":"","group":"core"},{"term":"annotated script","meaning":"주석이 달린 분석 스크립트","collocation":"publish an annotated script","example":"The absence of reliable records made it difficult for library researchers to publish an annotated script.","synonym":"commented analysis code","nuance":"","group":"core"},{"term":"de-identification","meaning":"비식별화","collocation":"verify de-identification","example":"The project team provided a checklist to help library researchers verify de-identification.","synonym":"removal of identifying details","nuance":"","group":"core"},{"term":"restricted access","meaning":"제한적 접근","collocation":"grant restricted access","example":"Students observed how library researchers attempted to grant restricted access despite incomplete information.","synonym":"permission-limited access","nuance":"","group":"core"},{"term":"research repository","meaning":"연구자료 저장소","collocation":"maintain a research repository","example":"A meaningful comparison would require library researchers to maintain a research repository independently.","synonym":"research data archive","nuance":"","group":"core"},{"term":"metadata schema","meaning":"메타데이터 구조","collocation":"standardize a metadata schema","example":"A cautious interpretation allowed library researchers to standardize a metadata schema while acknowledging uncertainty.","synonym":"metadata structure","nuance":"","group":"core"},{"term":"missing-value code","meaning":"결측치 코드","collocation":"document a missing-value code","example":"Several independent observations led library researchers to document a missing-value code before publication.","synonym":"missing-data marker","nuance":"","group":"core"},{"term":"independent verification","meaning":"독립 검증","collocation":"enable independent verification","example":"A request from the university encouraged library researchers to enable independent verification more transparently.","synonym":"third-party confirmation","nuance":"","group":"core"},{"term":"reproducible workflow","meaning":"재현 가능한 작업 절차","collocation":"establish a reproducible workflow","example":"Rather than generalizing from one case, library researchers sought to establish a reproducible workflow in several settings.","synonym":"repeatable analysis process","nuance":"","group":"core"},{"term":"participant confidentiality","meaning":"연구 참여자 기밀성","collocation":"protect participant confidentiality","example":"The investigation would be less credible if library researchers neglected to protect participant confidentiality.","synonym":"protection of research identities","nuance":"","group":"core"},{"term":"methodological disclosure","meaning":"연구방법 공개","collocation":"require methodological disclosure","example":"The procedures were revised so that library researchers could require methodological disclosure consistently.","synonym":"publication of methods","nuance":"","group":"core"},{"term":"data provenance","meaning":"자료 출처 이력","collocation":"trace data provenance","example":"Before finalizing the interpretation, library researchers decided to trace data provenance.","synonym":"data lineage","nuance":"","group":"core"},{"term":"version control","meaning":"버전 관리","collocation":"implement version control","example":"The students challenged library researchers to implement version control without overlooking contrary evidence.","synonym":"revision tracking","nuance":"","group":"core"},{"term":"variable definition","meaning":"변수 정의","collocation":"clarify a variable definition","example":"The instructor proposed that library researchers should first clarify a variable definition and then compare outcomes.","synonym":"explanation of a variable","nuance":"","group":"core"},{"term":"controlled analysis environment","meaning":"통제된 분석 환경","collocation":"use a controlled analysis environment","example":"When the initial explanation failed, library researchers returned to the data to use a controlled analysis environment.","synonym":"secure analysis workspace","nuance":"","group":"core"},{"term":"scrutinize","meaning":"면밀히 검토하다","collocation":"scrutinize an analytical assumption","example":"The group discovered that it was possible to scrutinize an analytical assumption without assuming a single cause.","synonym":"examine closely","nuance":"","group":"advanced"},{"term":"substantiate","meaning":"입증하다","collocation":"substantiate a scientific claim","example":"A second research team challenged library researchers to substantiate a scientific claim with different assumptions.","synonym":"support with evidence","nuance":"","group":"advanced"},{"term":"corroborate","meaning":"독립 근거로 뒷받침하다","collocation":"corroborate a published result","example":"The revised protocol gave library researchers a systematic way to corroborate a published result.","synonym":"confirm independently","nuance":"","group":"advanced"},{"term":"qualify a claim","meaning":"주장의 범위를 제한하다","collocation":"qualify a claim with caveats","example":"To address a practical difficulty, library researchers chose to qualify a claim with caveats under controlled conditions.","synonym":"state a qualification","nuance":"","group":"advanced"},{"term":"methodological rigor","meaning":"방법론적 엄밀성","collocation":"maintain methodological rigor","example":"It proved especially important for library researchers to maintain methodological rigor during the second assessment.","synonym":"rigorous research methods","nuance":"","group":"advanced"},{"term":"empirical basis","meaning":"실증적 근거","collocation":"establish an empirical basis","example":"In response to the reviewers, library researchers agreed to establish an empirical basis using an explicit procedure.","synonym":"observational support","nuance":"","group":"advanced"},{"term":"interpretive ambiguity","meaning":"해석의 모호성","collocation":"resolve interpretive ambiguity","example":"A single unexpected result persuaded library researchers to resolve interpretive ambiguity more carefully.","synonym":"uncertainty in meaning","nuance":"","group":"advanced"},{"term":"counterexample","meaning":"반례","collocation":"test a counterexample","example":"When the instruments returned inconsistent readings, library researchers attempted to test a counterexample.","synonym":"contradictory instance","nuance":"","group":"advanced"},{"term":"procedural integrity","meaning":"절차적 무결성","collocation":"preserve procedural integrity","example":"The supervising committee asked library researchers to preserve procedural integrity and explain the criteria.","synonym":"adherence to procedure","nuance":"","group":"advanced"},{"term":"replication gap","meaning":"재현 과정의 공백","collocation":"identify a replication gap","example":"Only after a careful review could library researchers begin to identify a replication gap.","synonym":"failure to replicate","nuance":"","group":"advanced"},{"term":"analytical transparency","meaning":"분석 투명성","collocation":"improve analytical transparency","example":"Under the new conditions, library researchers were asked to improve analytical transparency at an earlier stage.","synonym":"openness about analyses","nuance":"","group":"advanced"},{"term":"scholarly scrutiny","meaning":"학술적 검토","collocation":"invite scholarly scrutiny","example":"The long-term monitoring plan required library researchers to invite scholarly scrutiny at regular intervals.","synonym":"expert examination","nuance":"","group":"advanced"},{"term":"traceability","meaning":"추적 가능성","collocation":"ensure traceability","example":"At the discussion session, library researchers explained their decision to ensure traceability.","synonym":"ability to trace a result","nuance":"","group":"advanced"},{"term":"inadvertent disclosure","meaning":"의도치 않은 정보 공개","collocation":"prevent inadvertent disclosure","example":"The available resources enabled library researchers to prevent inadvertent disclosure during the pilot study.","synonym":"accidental disclosure","nuance":"","group":"advanced"},{"term":"evidentiary threshold","meaning":"증거 기준","collocation":"set an evidentiary threshold","example":"Although the preliminary results seemed convincing, library researchers still needed to set an evidentiary threshold.","synonym":"minimum standard of evidence","nuance":"","group":"advanced"}],"meta":{"sourceType":"original practice content","etsOfficial":false,"benchmark":"TOEFL iBT January 2026 task-type descriptions / ETS sample 1","studyMinutes":120,"revision":"2026-11-23-diversity-v3","discipline":"University Research / Information Literacy","genre":"comparison"}};</script>
