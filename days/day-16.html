<script>window.TOEFL_LESSON={"day":16,"week":4,"theme":"Peer Feedback and the Learning Process","focus":"Speaking: fluency and elaboration","claim":"Peer feedback is most educational when comments are specific and writers evaluate and respond to them.","evidence":"A structured rubric prompted more actionable feedback than unrestricted draft comments.","caveat":"Peer comments can be socially constrained or inaccurate, and improved comment quality does not benefit every writer equally.","response":"Train reviewers to cite evidence and require writers to explain their revision decisions.","storageKey":"toefl110day16-diversity-v3","notice":"WRITING CENTER — PEER REVIEW WORKSHOP\n\nThe thesis-draft workshop meets in Seminar Room B on Tuesday at 4 p.m. Participants should upload a two-page excerpt to the writing center portal by Monday at 6 p.m. The excerpt will be shared only with assigned peer reviewers, not posted publicly.\n\nStudents who cannot attend may request written feedback instead, but they must make the request before the upload deadline. Bring one specific question about your argument rather than asking reviewers to check every sentence for grammar.","academicPassage":"Students frequently learn from comments written by classmates, yet the quality of peer feedback varies greatly. A note such as “Your argument is unclear” identifies a problem without explaining what the writer should do. A more useful comment points to a particular claim, identifies the missing connection, and suggests a concrete way to revise it.\n\nOne writing seminar compared two feedback arrangements. In the first, students exchanged drafts and wrote comments freely. In the second, reviewers used a short rubric that asked them to identify the writer's main claim, the evidence supplied, and a possible counterargument. Students in the structured group produced more actionable comments, although the final essays did not improve equally for every participant.\n\nGiving feedback is also a learning activity. Reviewers must interpret someone else's reasoning and decide how it could be strengthened. However, students may hesitate to criticize friends or may trust confident-sounding advice that is inaccurate. Peer review is therefore not a substitute for guidance from an instructor. It requires training in tone, evidence, and disagreement.\n\nThe most valuable feedback process includes a response stage. Writers explain which suggestions they accepted or rejected and why. Without that reflection, a detailed set of comments can become another task completed for a grade rather than an opportunity to learn. Educators should assess both the quality of the comments and how thoughtfully writers use them.","readingClozePassage":"Two students exchanged drafts during a writing workshop. One reviewer simply wrote that a paragraph wa_ confusing. Th_ other ident_____ a sent____ where th_ author ma__ a cla__ without prese_____ adequate supp___. The sec___ comment was more useful because it pointed toward a revision. After discussing the feedback, the writer chose to add evidence but rejected a suggested change in tone. The instructor praised the decision because the writer had explained it carefully. Productive peer review requires judgment from both the person giving comments and the person receiving them.","cloze":[{"partial":"wa_","answer":"was","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"Th_","answer":"the","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"ident_____","answer":"identified","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"sent____","answer":"sentence","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"th_","answer":"the","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"ma__","answer":"made","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"cla__","answer":"claim","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"prese_____","answer":"presenting","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"supp___","answer":"support","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"sec___","answer":"second","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"}],"questions":{"rd":[{"q":"What should participants upload before Tuesday’s workshop?","options":["Their full dissertation as an email attachment to the class.","A list of every grammar error found by a peer.","A final presentation video.","A two-page thesis excerpt through the writing center portal."],"answer":3,"why":"실생활 공지의 해당 조건을 찾아 확인하세요. A two-page thesis excerpt through the writing center portal."},{"q":"What should students who cannot attend do?","options":["Wait until Tuesday evening to share the excerpt publicly.","Submit their drafts directly to every workshop participant.","Request written feedback before the Monday upload deadline.","Ask for a refund after the workshop concludes."],"answer":2,"why":"공지의 별도 요건 또는 예외 조항에 명시된 행동은 Request written feedback before the Monday upload deadline.입니다."},{"q":"Who will receive the thesis excerpt uploaded for peer review?","options":["Everyone browsing the writing center website.","Only assigned peer reviewers.","All students enrolled at the university.","Members of the public who request a copy."],"answer":1,"why":"공지의 예외 조항과 구체적인 적용 범위를 비교해야 합니다. 정답 근거: Only assigned peer reviewers."}],"ra":[{"q":"In the comparison, which conclusion does the author defend most carefully in the passage on Peer Feedback and the Learning Process?","options":["Peer feedback is most educational when comments are specific and writers evaluate and respond to them.","Every peer suggestion should be adopted without question.","A vague comment is sufficient because the writer knows how to interpret it.","Peer review makes any instructor feedback unnecessary."],"answer":0,"why":"중심 논지는 세부 사례에서 도출되는 가장 신중한 결론입니다. Peer feedback is most educational when comments are specific and writers evaluate and respond to them."},{"q":"What specific observation in the peer feedback and the learning process case motivates the discussion?","options":["Peer review makes any instructor feedback unnecessary.","A vague comment is sufficient because the writer knows how to interpret it.","Every peer suggestion should be adopted without question.","A structured rubric prompted more actionable feedback than unrestricted draft comments."],"answer":3,"why":"지문의 사례·대조 정보를 직접 확인해야 합니다. A structured rubric prompted more actionable feedback than unrestricted draft comments."},{"q":"Which qualification prevents the evidence about peer review from supporting an unconditional claim?","options":["A vague comment is sufficient because the writer knows how to interpret it.","Every peer suggestion should be adopted without question.","Peer comments can be socially constrained or inaccurate, and improved comment quality does not benefit every writer equally.","Peer review makes any instructor feedback unnecessary."],"answer":2,"why":"한계 조건은 곧바로 틀린 결론이라는 뜻이 아니라 적용 범위를 제한합니다. Peer comments can be socially constrained or inaccurate, and improved comment quality does not benefit every writer equally."},{"q":"What is the rhetorical function of the particular case discussed in the middle of the peer feedback and the learning process text?","options":["It lists the sequence of peer review observations without contributing to the author’s main point.","It illustrates a specific relationship involving peer review while establishing the boundaries of the wider argument.","The example proves that the implications of peer review hold in every possible location.","The example eliminates the need to compare evidence about peer review with alternative explanations."],"answer":1,"why":"사례는 범위가 제한된 관찰 또는 비교를 통해 주장을 구체화하고 무조건적 일반화를 피하도록 돕습니다."},{"q":"Which investigation or action would best extend the reasoning about peer feedback and the learning process?","options":["Train reviewers to cite evidence and require writers to explain their revision decisions.","A vague comment is sufficient because the writer knows how to interpret it.","Every peer suggestion should be adopted without question.","Peer review makes any instructor feedback unnecessary."],"answer":0,"why":"추가 검증은 근거의 결함을 직접 보완하거나 대안 설명을 시험해야 합니다. Train reviewers to cite evidence and require writers to explain their revision decisions."}],"rp":[{"q":"In the peer feedback and the learning process passage, what does “actionable” most nearly mean in context?","options":["written in an informal tone","designed mainly to attract attention","limited to pointing out grammar errors","specific enough to guide a change"],"answer":3,"why":"단어의 문맥상 의미를 판단해야 하며 직역만으로 결정하지 않습니다. actionable ≈ specific enough to guide a change"},{"q":"A writer receives a detailed peer suggestion that conflicts with their evidence. How should they respond?","options":["Accept the suggestion because it is specific.","Delete the conflicting evidence without documentation.","Evaluate the reasoning and explain why they reject or modify it.","Treat every critical comment as a personal attack."],"answer":2,"why":"새 상황에 지문 원리를 적용하는 고난도 추론 문항입니다. Evaluate the reasoning and explain why they reject or modify it."}],"lq":[{"q":"Which response best addresses the speaker’s question about peer review?","options":["The center is in Seminar Room B.","Not automatically. Evaluate the advice and explain why you accept or reject it.","Yes, peer reviewers are always more accurate than authors.","Please upload the excerpt by Monday."],"answer":1,"why":"화자는 전제를 확인하고 있으므로 직접적인 정정과 관련 조건 설명이 적절합니다."}],"lc":[{"q":"What brings the first speaker to the conversation concerning peer review?","options":["how to interpret vague peer feedback","A request for the institution to change the academic field under discussion.","A plan to evaluate unrelated applicants for a different university program.","An invitation to deliver a formal lecture explaining peer feedback and the learning process."],"answer":0,"why":"대화의 도입부에서 상대가 확인하려는 문제를 파악합니다. how to interpret vague peer feedback"},{"q":"What does the second speaker clarify about the issue raised in the peer feedback and the learning process dialogue?","options":["Peer review makes any instructor feedback unnecessary.","A vague comment is sufficient because the writer knows how to interpret it.","Every peer suggestion should be adopted without question.","the critique may concern reasoning rather than grammar"],"answer":3,"why":"Not necessarily, No, Exactly와 같은 정정 이후의 내용을 확인합니다. the critique may concern reasoning rather than grammar"},{"q":"What will the first speaker most likely do after the discussion about peer review?","options":["Replace the entire project with an unrelated topic without consulting anyone.","Withdraw permanently from all activities discussed.","request a specific example and document revision choices","Disregard the advice and continue on the original assumption."],"answer":2,"why":"마지막 발화에서 다음 행동을 추론합니다. request a specific example and document revision choices"}],"la":[{"q":"What practical change or instruction is listeners expected to notice in the announcement about peer review?","options":["A list of every grammar error found by a peer.","A two-page thesis excerpt through the writing center portal.","Their full dissertation as an email attachment to the class.","A final presentation video."],"answer":1,"why":"공지의 장소·시간·적용 조건을 듣고 핵심 변경사항을 선택합니다. A two-page thesis excerpt through the writing center portal."},{"q":"Which additional requirement applies to listeners in the peer feedback and the learning process announcement?","options":["Request written feedback before the Monday upload deadline.","Wait until Tuesday evening to share the excerpt publicly.","Ask for a refund after the workshop concludes.","Submit their drafts directly to every workshop participant."],"answer":0,"why":"보편적인 안내와 특정 조건에 해당하는 행동을 구별해야 합니다. Request written feedback before the Monday upload deadline."}],"lt":[{"q":"Which statement best summarizes the lecturer’s explanation of peer feedback and the learning process?","options":["A vague comment is sufficient because the writer knows how to interpret it.","Every peer suggestion should be adopted without question.","Peer review makes any instructor feedback unnecessary.","Peer feedback is most educational when comments are specific and writers evaluate and respond to them."],"answer":3,"why":"강의 중심 개념과 화자의 제한된 결론을 종합합니다. Peer feedback is most educational when comments are specific and writers evaluate and respond to them."},{"q":"What role does the lecturer’s example of peer review play in the explanation?","options":["Every peer suggestion should be adopted without question.","A vague comment is sufficient because the writer knows how to interpret it.","A structured rubric prompted more actionable feedback than unrestricted draft comments.","Peer review makes any instructor feedback unnecessary."],"answer":2,"why":"강의 사례는 개념을 구체화하는 관측 자료 또는 비교입니다. A structured rubric prompted more actionable feedback than unrestricted draft comments."},{"q":"What caution does the lecturer introduce after describing evidence related to peer review?","options":["Every peer suggestion should be adopted without question.","Peer comments can be socially constrained or inaccurate, and improved comment quality does not benefit every writer equally.","Peer review makes any instructor feedback unnecessary.","A vague comment is sufficient because the writer knows how to interpret it."],"answer":1,"why":"화자가 However, but 등으로 도입하는 예외를 듣는 것이 핵심입니다. Peer comments can be socially constrained or inaccurate, and improved comment quality does not benefit every writer equally."},{"q":"How would the lecturer most likely advise someone evaluating peer review in a new setting?","options":["Train reviewers to cite evidence and require writers to explain their revision decisions.","Peer review makes any instructor feedback unnecessary.","Every peer suggestion should be adopted without question.","A vague comment is sufficient because the writer knows how to interpret it."],"answer":0,"why":"강의의 마무리에서 제안하는 연구·실행 원칙을 응용합니다. Train reviewers to cite evidence and require writers to explain their revision decisions."}]},"audio":{"lq":"Should I change every sentence my reviewer criticized, even if I disagree?","lc":"Student: My classmate wrote “This paragraph is confusing” on my draft. I don't know what to change.\nTutor: Have you asked which part confused them?\nStudent: Not yet. I assumed they meant all of my grammar was wrong.\nTutor: That could be a mistaken assumption. The argument may be missing a link between the evidence and the claim.\nStudent: Should I accept every suggestion from my peer reviewer?\nTutor: No. Treat comments as information to evaluate. If you reject one, explain your reason rather than ignoring it.\nStudent: So I should ask for a specific example and document how I revised the argument.\nTutor: Exactly. That makes feedback a dialogue, not just a list of corrections.","la":"Students attending Tuesday's peer-review workshop should upload a two-page excerpt before six on Monday evening. The center will share drafts with assigned reviewers only. If you need written feedback because you cannot attend, request it before the same deadline. Please arrive with one question about your argument, such as whether a key piece of evidence supports your claim. Reviewers are not expected to proofread every sentence.","lt":"A useful peer-review comment does more than say something is wrong. Imagine reading “This argument is weak.” You still don't know whether the problem is the evidence, the logic or the wording.\n\nNow compare that with a comment identifying the precise sentence where the writer moves from a small sample to a sweeping conclusion. That suggestion gives the author a revision target.\n\nRubrics can help reviewers notice such issues, but they don't guarantee that feedback is correct. Students sometimes avoid disagreeing with friends, and confident comments may be inaccurate. The writer must still evaluate the advice.\n\nIn our writing center, we ask students to submit a short response explaining what they changed and what they chose not to change. The goal is to develop judgment in both participants, not merely to exchange marked-up drafts."},"speaking":{"repeat":["Welcome to the workshop on peer review.","The thesis-draft workshop meets in Seminar Room B on Tuesday at 4 p.","The instructor asked us to compare the evidence about peer review before drawing conclusions.","A structured rubric prompted more actionable feedback than unrestricted draft comments.","Peer comments can be socially constrained or inaccurate, and improved comment quality does not benefit every writer equally.","Train reviewers to cite evidence and require writers to explain their revision decisions.","Although it might initially seem that every peer suggestion should be adopted without question, the evidence instead suggests that peer feedback is most educational when comments are specific and writers evaluate and respond to them."],"interviews":["What first interested you in education / learning design, and how would you explain that interest to a friend?","Tell me about a time when a practical decision involving peer review was more complicated than you expected.","Do you think universities should give more attention to peer review in introductory courses? Explain your reasoning.","Imagine a classmate disagrees with your interpretation of peer review. How would you respond respectfully and precisely?"],"sample":"The best feedback I have received was specific enough to help me revise an argument. A classmate once told me that my conclusion seemed too strong for the evidence I had presented. Instead of simply calling the paragraph weak, she identified the exact sentence and suggested another interpretation of the data. I did not accept every word of her suggestion, but I reconsidered my reasoning and clarified the limitation. That experience taught me that criticism can be constructive when it focuses on evidence rather than on the person. I would encourage classmates to ask precise questions and explain their decisions after revising."},"writing":{"build":[{"fragments":"Could you tell me / whether the peer review / session has been rescheduled","answer":"Could you tell me whether the peer review session has been rescheduled?","why":"간접 의문문 어순의 문장 구조와 주어-동사 관계를 확인하세요."},{"fragments":"noticed an important discrepancy / The student who reviewed / the revision target records","answer":"The student who reviewed the revision target records noticed an important discrepancy.","why":"관계절로 설명 추가의 문장 구조와 주어-동사 관계를 확인하세요."},{"fragments":"If the team had checked / the feedback rubric evidence earlier, / different conclusion / it might have reached a","answer":"If the team had checked the feedback rubric evidence earlier, it might have reached a different conclusion.","why":"조건절로 가능성 제시의 문장 구조와 주어-동사 관계를 확인하세요."},{"fragments":"the report / Only after the records related / examined did the committee approve / to peer review had been","answer":"Only after the records related to peer review had been examined did the committee approve the report.","why":"Only after 도치의 문장 구조와 주어-동사 관계를 확인하세요."},{"fragments":"of its limitations / requires not only reliable evidence / A project involving peer review / but also a clear account","answer":"A project involving peer review requires not only reliable evidence but also a clear account of its limitations.","why":"Not only A but also B 병렬의 문장 구조와 주어-동사 관계를 확인하세요."}],"emailTask":"You will miss your scheduled peer-review workshop because of a timetable conflict. Email the writing center to request written feedback instead, provide your draft title and a specific concern about your argument, and ask when feedback will be returned.","emailSample":"Dear Writing Center Team,\n\nI will be unable to attend Tuesday's thesis peer-review workshop because an examination has been moved to the same afternoon. I would still value feedback on my draft, particularly whether the evidence in the second section adequately supports my main claim.\n\nCould I receive written feedback instead of participating in person? My excerpt is titled “Community Participation and Local Services,” and I can upload it before Monday's deadline. I would also appreciate an estimate of when comments might be returned, as I want time to revise before meeting my supervisor.\n\nThank you for accommodating students with timetable conflicts.\n\nBest regards,\nAlex","discussionTask":"Professor: Should peer feedback contribute substantially to university writing grades?\n\nStudent A — Emily: Yes, assessing students as reviewers encourages careful reading and engagement with reasoning.\n\nStudent B — Daniel: Peer assessment may be affected by friendships and uneven expertise, so instructor judgment should dominate.","discussionSample":"Peer feedback should contribute to writing grades, but I would limit its weight and evaluate the quality of the reviewing process rather than classmates' popularity judgments. When a student identifies a weak connection between evidence and a conclusion and explains how to strengthen it, the reviewer demonstrates valuable analytical skills. That activity can deepen the reviewer's own understanding of argument structure. However, students may hesitate to criticize friends, and some confident suggestions may be wrong. A structured rubric and a brief reflection explaining which comments the writer accepted would make the process fairer. The instructor should remain responsible for assessing the final essay. This balance rewards serious participation without letting uneven peer expertise determine academic results."},"vocabulary":[{"term":"actionable feedback","meaning":"실행 가능한 피드백","collocation":"provide actionable feedback","example":"Over a semester of fieldwork, writing tutors learned how to provide actionable feedback.","synonym":"feedback indicating practical next steps","nuance":"","group":"core"},{"term":"revision target","meaning":"수정 대상","collocation":"identify a revision target","example":"In their final presentation, writing tutors described what it meant to identify a revision target.","synonym":"specific item to change","nuance":"","group":"core"},{"term":"feedback rubric","meaning":"피드백 평가 기준표","collocation":"use a feedback rubric","example":"Careful documentation enabled writing tutors to use a feedback rubric without repeating the same mistake.","synonym":"criteria for reviewing writing","nuance":"","group":"core"},{"term":"peer reviewer","meaning":"동료 검토자","collocation":"train a peer reviewer","example":"In a subsequent case, writing tutors had to train a peer reviewer under rather different conditions.","synonym":"student reviewing a classmate's work","nuance":"","group":"core"},{"term":"argument clarity","meaning":"논증의 명료성","collocation":"improve argument clarity","example":"The final recommendation urged writing tutors to improve argument clarity before proceeding.","synonym":"understandability of an argument","nuance":"","group":"core"},{"term":"supporting evidence","meaning":"뒷받침 근거","collocation":"evaluate supporting evidence","example":"In the first trial, writing tutors were not yet able to evaluate supporting evidence consistently.","synonym":"facts or reasons that support a claim","nuance":"","group":"core"},{"term":"counterargument","meaning":"반론","collocation":"address a counterargument","example":"The absence of reliable records made it difficult for writing tutors to address a counterargument.","synonym":"opposing line of reasoning","nuance":"","group":"core"},{"term":"draft excerpt","meaning":"초안 발췌문","collocation":"submit a draft excerpt","example":"The project team provided a checklist to help writing tutors submit a draft excerpt.","synonym":"selected section of a draft","nuance":"","group":"core"},{"term":"constructive criticism","meaning":"건설적 비판","collocation":"offer constructive criticism","example":"Students observed how writing tutors attempted to offer constructive criticism despite incomplete information.","synonym":"criticism intended to help","nuance":"","group":"core"},{"term":"revision rationale","meaning":"수정 근거","collocation":"explain a revision rationale","example":"A meaningful comparison would require writing tutors to explain a revision rationale independently.","synonym":"writer's decision-making independence","nuance":"","group":"core"},{"term":"writer autonomy","meaning":"작성자의 자율성","collocation":"preserve writer autonomy","example":"A cautious interpretation allowed writing tutors to preserve writer autonomy while acknowledging uncertainty.","synonym":"precise nature of a comment","nuance":"","group":"core"},{"term":"comment specificity","meaning":"피드백의 구체성","collocation":"increase comment specificity","example":"Several independent observations led writing tutors to increase comment specificity before publication.","synonym":"incorporation of suggestions","nuance":"","group":"core"},{"term":"feedback uptake","meaning":"피드백 반영","collocation":"measure feedback uptake","example":"A request from the university encouraged writing tutors to measure feedback uptake more transparently.","synonym":"explanation for a revision","nuance":"","group":"core"},{"term":"response memo","meaning":"검토 의견에 대한 회신 메모","collocation":"write a response memo","example":"Rather than generalizing from one case, writing tutors sought to write a response memo in several settings.","synonym":"document responding to comments","nuance":"","group":"core"},{"term":"collaborative revision","meaning":"협업 수정","collocation":"support collaborative revision","example":"The investigation would be less credible if writing tutors neglected to support collaborative revision.","synonym":"writing improvements through cooperation","nuance":"","group":"core"},{"term":"evaluative judgment","meaning":"평가적 판단","collocation":"exercise evaluative judgment","example":"The procedures were revised so that writing tutors could exercise evaluative judgment consistently.","synonym":"skill in evaluating quality","nuance":"","group":"advanced"},{"term":"revision strategy","meaning":"수정 전략","collocation":"adopt a revision strategy","example":"Before finalizing the interpretation, writing tutors decided to adopt a revision strategy.","synonym":"plan for revising","nuance":"","group":"advanced"},{"term":"argument coherence","meaning":"논증 일관성","collocation":"improve argument coherence","example":"The students challenged writing tutors to improve argument coherence without overlooking contrary evidence.","synonym":"logical connection between claims","nuance":"","group":"advanced"},{"term":"reasoned disagreement","meaning":"근거 있는 이견","collocation":"express reasoned disagreement","example":"The instructor proposed that writing tutors should first express reasoned disagreement and then compare outcomes.","synonym":"respectful evidence-based disagreement","nuance":"","group":"advanced"},{"term":"writing proficiency","meaning":"작문 숙련도","collocation":"develop writing proficiency","example":"When the initial explanation failed, writing tutors returned to the data to develop writing proficiency.","synonym":"ability to write effectively","nuance":"","group":"advanced"},{"term":"instructional guidance","meaning":"교수 지침","collocation":"provide instructional guidance","example":"The group discovered that it was possible to provide instructional guidance without assuming a single cause.","synonym":"support from a teacher","nuance":"","group":"advanced"},{"term":"specific criterion","meaning":"구체적 평가 기준","collocation":"apply a specific criterion","example":"A second research team challenged writing tutors to apply a specific criterion with different assumptions.","synonym":"clear evaluation standard","nuance":"","group":"advanced"},{"term":"productive dialogue","meaning":"생산적 대화","collocation":"encourage productive dialogue","example":"The revised protocol gave writing tutors a systematic way to encourage productive dialogue.","synonym":"constructive two-way exchange","nuance":"","group":"advanced"},{"term":"reflective revision","meaning":"성찰적 수정","collocation":"practice reflective revision","example":"To address a practical difficulty, writing tutors chose to practice reflective revision under controlled conditions.","synonym":"deliberate reflection while rewriting","nuance":"","group":"advanced"},{"term":"peer interaction","meaning":"동료 상호작용","collocation":"structure peer interaction","example":"It proved especially important for writing tutors to structure peer interaction during the second assessment.","synonym":"interaction among learners","nuance":"","group":"advanced"},{"term":"assessment fairness","meaning":"평가 공정성","collocation":"protect assessment fairness","example":"In response to the reviewers, writing tutors agreed to protect assessment fairness using an explicit procedure.","synonym":"fairness in judging work","nuance":"","group":"advanced"},{"term":"formative assessment","meaning":"형성평가","collocation":"conduct formative assessment","example":"A single unexpected result persuaded writing tutors to conduct formative assessment more carefully.","synonym":"evaluation used during learning","nuance":"","group":"advanced"},{"term":"critical engagement","meaning":"비판적 참여","collocation":"demonstrate critical engagement","example":"When the instruments returned inconsistent readings, writing tutors attempted to demonstrate critical engagement.","synonym":"thoughtful engagement with ideas","nuance":"","group":"advanced"},{"term":"feedback reliability","meaning":"피드백 신뢰도","collocation":"evaluate feedback reliability","example":"The supervising committee asked writing tutors to evaluate feedback reliability and explain the criteria.","synonym":"dependability of feedback","nuance":"","group":"advanced"},{"term":"learner responsibility","meaning":"학습자 책임","collocation":"promote learner responsibility","example":"Only after a careful review could writing tutors begin to promote learner responsibility.","synonym":"responsibility of the learner","nuance":"","group":"advanced"}],"meta":{"sourceType":"original practice content","etsOfficial":false,"benchmark":"TOEFL iBT January 2026 task-type descriptions / ETS sample 1","studyMinutes":120,"revision":"2026-11-23-diversity-v3","discipline":"Education / Learning Design","genre":"comparison"}};</script>
