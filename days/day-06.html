<script>window.TOEFL_LESSON={"day":6,"week":2,"theme":"Renewable Energy and Storage","focus":"Reading: qualification and inference","claim":"A coastal island installed solar panels but continued to depend on diesel generation after sunset.","evidence":"A four-hour battery covered evening demand on sunny days but failed during a week of storms.","caveat":"A technology that addresses daily fluctuations may not address multi-day shortages.","response":"Planners modeled hourly loads across seasons and examined storage plus flexible demand.","storageKey":"toefl110day6-quality-v2","notice":"CAMPUS PORTAL NOTIFICATION — Microgrid Demonstration\n\nDear participants,\n\nWe are updating the arrangements for the renewable energy and storage activity next Tuesday. An issue has been identified: the public poster lists energy capacity without discharge duration. Please note the following requirement: the session requires a chart showing peak hours and available storage duration. The practical next step is clear: the student should request an hourly demand chart. Please send any questions or corrected documents by Tuesday at 4 p.m.. Participants who cannot meet the condition should contact the course office rather than assuming that an existing registration resolves the issue.\n\nKind regards,\nStudent Research Services","academicPassage":"Renewable Energy and Storage\n\nA coastal island installed solar panels but continued to depend on diesel generation after sunset. In this fictional university case, the investigators were not simply looking for a statistically detectable difference. They needed to decide what the evidence could justify, for whom the result might be relevant, and which assumptions would have to remain valid. That distinction is important because a pattern that seems clear in one set of observations may change when the procedure or comparison group changes.\n\nThe initial comparison was informative. A four-hour battery covered evening demand on sunny days but failed during a week of storms. This was a useful result, but it raised a further question: was the observed pattern produced by the factor of interest, or could some aspect of the method have influenced it? One particularly revealing detail was a week of stormy weather. Its significance lay not in providing an immediate answer but in showing which part of the research design needed closer attention.\n\nThe main methodological difficulty was the following: A technology that addresses daily fluctuations may not address multi-day shortages. This qualification does not render the original observation irrelevant. Rather, it changes the degree of confidence that readers should place in a broad interpretation. An analyst who reports only the encouraging result risks confusing a possible explanation with an established mechanism. By contrast, an analyst who discloses the limitation enables readers to assess the evidence on its own terms.\n\nThe proposed next step addressed that problem directly. Planners modeled hourly loads across seasons and examined storage plus flexible demand. Further investigation would be especially valuable if it could distinguish the favored interpretation from a plausible competing account. Consequently, the most defensible conclusion is neither unconditional acceptance nor automatic rejection. It is a claim whose strength is proportional to the quality and scope of the evidence.","readingClozePassage":"Researchers studying renewable energy and storage initially proposed a straightforward interpretation. A coastal island installed solar panels but continued to depend on diesel generation after sunset. They then compared their observations with additional evidence. A four-hour battery covered evening demand on sun__ days bu_ failed dur___ a week of sto___. The prelim_____ results we__ informative, bu_ a careful anal___ still nee___ to identify altern_____ accounts, document the relevant assumptions, and consider whether the observed pattern would remain stable under different conditions. Planners modeled hourly loads across seasons and examined storage plus flexible demand. A balanced report should distinguish the available evidence from conclusions that extend beyond it.","cloze":[{"partial":"sun__","answer":"sunny","meaning":"문맥과 문법에 따른 철자 복원"},{"partial":"bu_","answer":"but","meaning":"문맥과 문법에 따른 철자 복원"},{"partial":"dur___","answer":"during","meaning":"문맥과 문법에 따른 철자 복원"},{"partial":"sto___","answer":"storms","meaning":"문맥과 문법에 따른 철자 복원"},{"partial":"prelim_____","answer":"preliminary","meaning":"문맥과 문법에 따른 철자 복원"},{"partial":"we__","answer":"were","meaning":"문맥과 문법에 따른 철자 복원"},{"partial":"bu_","answer":"but","meaning":"문맥과 문법에 따른 철자 복원"},{"partial":"anal___","answer":"analyst","meaning":"문맥과 문법에 따른 철자 복원"},{"partial":"nee___","answer":"needed","meaning":"문맥과 문법에 따른 철자 복원"},{"partial":"altern_____","answer":"alternative","meaning":"문맥과 문법에 따른 철자 복원"}],"questions":{"rd":[{"q":"What is the main purpose of the message?","options":["To announce that all registrations have been canceled","To summarize the historical development of the field","To invite readers to submit unrelated research proposals","To clarify a problem, a requirement and an appropriate next step"],"answer":3,"why":"공지에는 문제·필수 조건·구체적인 후속 조치가 명시되어 있습니다."},{"q":"Which response would comply with the stated requirement?","options":["Ignore the issue because the registration already exists","Submit only the same incomplete document without any change","The student should request an hourly demand chart.","Wait until after the deadline without notifying the office"],"answer":2,"why":"정답은 공지에 제시된 후속 조치의 바꿔 말하기입니다."},{"q":"What does the writer imply about the participant’s previous assumption?","options":["It has already been accepted as university policy.","It is incomplete and should not determine the next action.","It makes further verification unnecessary.","It requires every participant to withdraw immediately."],"answer":1,"why":"기존 오해를 바로잡기 위해 새로운 조건과 조치를 안내하고 있습니다."}],"ra":[{"q":"Which statement best captures the central idea of the passage?","options":["An observation is useful only when its interpretation accounts for relevant limitations and alternatives.","A positive initial outcome makes follow-up investigation unnecessary.","Methodological uncertainty prevents any responsible decision.","A result obtained in one setting automatically applies elsewhere."],"answer":0,"why":"지문은 관측과 확정적 인과 해석을 구분하고 주장 강도를 근거에 비례시키라고 설명합니다."},{"q":"What did the investigators observe in the fictional case?","options":["Planners modeled hourly loads across seasons and examined storage plus flexible demand.","The researchers had no preliminary result to examine.","Every competing explanation was eliminated before the first comparison.","A four-hour battery covered evening demand on sunny days but failed during a week of storms."],"answer":3,"why":"두 번째 단락의 관찰 결과에 직접 근거한 선택지입니다. 제안된 후속 조치와 실제 관측을 구분하세요."},{"q":"Why does the author specifically mention a week of stormy weather?","options":["To prove that the entire study should be discarded.","To show that every alternative explanation has been disproved.","To identify a detail whose interpretation requires methodological scrutiny.","To suggest that a single technical detail is more important than all other evidence."],"answer":2,"why":"해당 세부사항은 연구 설계에서 추가 검토가 필요한 부분의 예시로 제시됩니다."},{"q":"Which limitation most directly weakens an unconditional conclusion?","options":["The topic attracted interest from several academic departments.","A technology that addresses daily fluctuations may not address multi-day shortages.","The authors included a title and organized their paragraphs.","The case concerns a practical problem rather than a purely abstract theory."],"answer":1,"why":"세 번째 단락은 경쟁 설명을 고려해야 하는 구체적인 방법론적 한계를 밝힙니다."},{"q":"Which conclusion would the author most likely support?","options":["The results justify further inquiry, but their implications must remain appropriately qualified.","A result deserves confidence whenever it seems intuitively plausible.","Any unresolved question makes the findings wholly worthless.","The investigation should avoid discussing alternative interpretations."],"answer":0,"why":"마지막 단락은 전면적 수용과 전면적 거부를 모두 경계합니다."}],"rp":[{"q":"Which follow-up would most directly address the issue raised in the passage?","options":["Repeat the original conclusion more strongly without new evidence.","Remove the methodological qualification from the public summary.","Replace the observations with expert opinion alone.","Planners modeled hourly loads across seasons and examined storage plus flexible demand."],"answer":3,"why":"후속 연구 제안은 한계가 드러난 부분을 직접 다룹니다."},{"q":"Which wording would be the most defensible for a summary?","options":["The initial observations definitively prove the mechanism in every context.","The remaining uncertainty means that the data contain no information.","The evidence is consistent with a promising interpretation, although competing explanations remain possible.","No reader needs to know which assumptions the researchers made."],"answer":2,"why":"가능성을 인정하되 인과·일반화의 범위를 신중하게 제한해야 합니다."}],"lq":[{"q":"Which response best fits the speaker’s intention?","options":["Yes, the earlier draft is final, so no further checks are needed.","Not quite. The session requires a chart showing peak hours and available storage duration, so we need to resolve that point before proceeding.","Not until the next semester; the office has stopped all current activities.","Yes, the initial application automatically overrides every later condition."],"answer":1,"why":"화자는 승인 여부를 재확인합니다. 단정적 동의가 아니라 남아 있는 조건을 완곡하게 알려야 합니다."}],"lc":[{"q":"Why does the student contact the coordinator?","options":["To resolve an outstanding requirement before the activity.","To withdraw permanently from the program.","To request an unrelated transcript of grades.","To replace the activity with an independent examination."],"answer":0,"why":"문의 목적은 미해결 조건과 필요한 후속 조치를 확인하는 데 있습니다."},{"q":"What was the student’s mistaken assumption?","options":["All applications had been canceled without notification.","The office had already completed every required check.","The activity was scheduled for the previous semester.","Battery capacity and storage duration are identical."],"answer":3,"why":"학생은 이전 정보만으로 충분하다고 생각했고 담당자가 그 오해를 수정합니다."},{"q":"What will the student probably do next?","options":["Ask the class to disregard the announcement.","Submit unrelated paperwork without reading the revised rule.","The student should request an hourly demand chart.","Wait until the deadline has passed before responding."],"answer":2,"why":"담당자는 구체적인 다음 조치를 제시했고 학생이 이를 실행하겠다고 말합니다."}],"la":[{"q":"What is the announcement mainly about?","options":["The cancellation of all campus activities.","A remaining procedural condition and how participants can address it.","A new application deadline for an unrelated program.","An invitation to an off-campus social event."],"answer":1,"why":"핵심은 기존 활동의 조건을 재안내하고 필요한 조치를 요청하는 것입니다."},{"q":"What are participants advised to do if they cannot meet the condition?","options":["Contact the coordinator to discuss an appropriate arrangement.","Assume previous registration overrides the rule.","Post personal records on a public social network.","Enter the restricted session without permission."],"answer":0,"why":"공지에 조건을 충족하지 못하면 담당자에게 문의하도록 명시되어 있습니다."}],"lt":[{"q":"What is the principal point of the lecture?","options":["An initial pattern is sufficient proof of its own cause.","All practical decisions should be postponed indefinitely.","A researcher should always choose the most complicated explanation.","Evidence should be interpreted in light of assumptions and competing explanations."],"answer":3,"why":"강의는 관측과 그 관측에 대한 설명을 분리하고, 근거에 맞는 주장만 제시하라고 강조합니다."},{"q":"Why does the professor contrast two groups reviewing the same figures?","options":["To show that the second group collected completely different data.","To argue that research committees should avoid independent review.","To illustrate why testing assumptions can change the strength of an interpretation.","To imply that more confident reviewers are necessarily more accurate."],"answer":2,"why":"동일한 자료라도 가정에 대한 태도 때문에 결론의 신뢰성이 달라질 수 있음을 설명합니다."},{"q":"How does the lecturer use the example of a week of stormy weather?","options":["As proof that the entire research program has failed.","As a concrete point at which additional scrutiny may be necessary.","As a detail that is explicitly irrelevant to the interpretation.","As an example of a result obtained through a randomized experiment in every case."],"answer":1,"why":"세부사항은 논증의 취약 지점을 구체적으로 보여주는 역할입니다."},{"q":"What would the lecturer most likely advise researchers to do?","options":["Planners modeled hourly loads across seasons and examined storage plus flexible demand.","Remove uncertain information from the published summary.","Treat the initial explanation as the only possible interpretation.","Replace empirical observations with the most persuasive opinion."],"answer":0,"why":"끝부분에서 제시된 후속 연구가 직접적인 개선 방향입니다."}]},"audio":{"lq":"The project team doesn't need to change anything, does it?","lc":"Ethan: I was about to send out the final instructions, but I may have misunderstood the requirements.\nCoordinator: Thanks for checking. The current concern is that the public poster lists energy capacity without discharge duration.\nEthan: I see. I assumed that battery capacity and storage duration are identical. So the existing materials aren't sufficient?\nCoordinator: Not quite. The session requires a chart showing peak hours and available storage duration. We can still work with the current booking, but that condition matters.\nEthan: Do I have to submit a new application, or is there something more specific I should do?\nCoordinator: You don't need to start over. Please request an hourly demand chart, and make sure the office receives the update by Tuesday at 4 p.m..\nEthan: That helps. I'll explain the change to the team so no one relies on the earlier assumption.\nCoordinator: Great. Let me know if the requirement creates a practical problem; there may be an alternative arrangement.","la":"This is a notice from the microgrid demonstration team. Students preparing for the renewable energy and storage activity should review the updated instructions in their campus accounts. An important issue remains: the public poster lists energy capacity without discharge duration. The requirement has not been waived: the session requires a chart showing peak hours and available storage duration. To avoid delays, please request an hourly demand chart before Tuesday at 4 p.m.. If you cannot complete the required step, contact the coordinator instead of assuming your earlier registration will be accepted. Updates will be sent through the official student portal, not through personal social media accounts.","lt":"In today's lecture on renewable energy and storage, consider a hypothetical research team facing a very practical decision. A coastal island installed solar panels but continued to depend on diesel generation after sunset. At first, the investigation appeared straightforward, since the team had a concrete pattern to examine. A four-hour battery covered evening demand on sunny days but failed during a week of storms.\n\nNow, why isn't that the end of the story? A technology that addresses daily fluctuations may not address multi-day shortages. That matters because the observation and its explanation are not interchangeable. A useful way to think about this is to imagine two groups of investigators reviewing the same figures. One group treats the first interpretation as settled; the other asks which assumption, if changed, would produce a different conclusion. The second approach may be slower, but it is much less likely to confuse a plausible account with a demonstrated one.\n\nThe team therefore proposed a specific follow-up: Planners modeled hourly loads across seasons and examined storage plus flexible demand. Notice the function of a week of stormy weather: it identifies a particular point at which the argument needs closer examination. The lesson is not that researchers must postpone every decision until they know everything. Rather, they should describe the limits of their evidence and explain which further result would change their minds."},"speaking":{"repeat":["Our team will review the findings during the meeting.","The team examined a week of stormy weather before presenting its preliminary findings.","Although the early results seemed promising, the investigators had not eliminated every alternative explanation.","A coastal island installed solar panels but continued to depend on diesel generation after sunset.","A four-hour battery covered evening demand on sunny days but failed during a week of storms.","A technology that addresses daily fluctuations may not address multi-day shortages.","Had the researchers ignored the uncertainty surrounding a week of stormy weather, the final recommendation might have sounded more decisive than the available evidence could justify."],"interviews":["What course or research activity have you enjoyed most at university, and why?","Have you ever had to revise an assumption after learning about renewable energy and storage or a related subject? Describe the experience.","Should university instructors give students more opportunities to question the conclusions of published research? Support your view with an example.","A group wants to implement a policy based on the evidence in this case. What safeguards would you recommend, and how would you address potential objections?"],"sample":"I think students should be encouraged to challenge a conclusion respectfully, even when the initial result appears convincing. The case of renewable energy and storage illustrates why. A four-hour battery covered evening demand on sunny days but failed during a week of storms. However, a technology that addresses daily fluctuations may not address multi-day shortages. If I were responsible for advising the group, I would ask the team to compare at least one competing explanation and identify what evidence might change its recommendation. That would not mean dismissing the existing research. Rather, it would help us communicate uncertainty clearly and make a decision that other people could evaluate. In my experience, that kind of transparency improves both the credibility of a project and cooperation among the people involved."},"writing":{"build":[{"answer":"Only after the committee reviewed the evidence did it recommend a limited pilot.","fragments":"committee reviewed the / recommend a limited pilot / Only after the / evidence did it","why":"Only after의 문두 배치에 따른 주절 도치"},{"answer":"Had the investigators ignored the competing explanation, their conclusion would have been less credible.","fragments":"their conclusion would / ignored the competing explanation, / have been less credible / Had the investigators","why":"If를 생략한 과거완료 가정법 도치"},{"answer":"The researcher whose proposal was selected explained the methodological limitations.","fragments":"selected explained / The researcher / the methodological limitations / whose proposal was","why":"whose를 사용한 소유관계 절"},{"answer":"What the panel wanted to establish was whether the outcome could be replicated.","fragments":"outcome could be replicated / wanted to establish / What the panel / was whether the","why":"What 주어절과 whether 보어절"},{"answer":"The more carefully the team documents its assumptions, the easier the findings become to evaluate.","fragments":"the team documents its / findings become to evaluate / The more carefully / assumptions, the easier the","why":"The more A, the more B 상관 비교급"}],"emailTask":"You are helping with a university activity on renewable energy and storage. A problem has arisen: the public poster lists energy capacity without discharge duration.\n\nWrite a polite email to the campus coordinator. In your message:\n• explain the situation and why it matters;\n• request a realistic remedy consistent with this rule: the session requires a chart showing peak hours and available storage duration;\n• ask for confirmation before the announced deadline.","emailSample":"Dear Course Administration Team,\n\nI am writing about our upcoming university activity on renewable energy and storage. We have encountered a difficulty that could affect the preparation: the public poster lists energy capacity without discharge duration. I understand that the procedure is intended to protect the quality and reliability of the activity, and I would like to resolve the issue before it affects other participants.\n\nAs I understand the current requirement, the session requires a chart showing peak hours and available storage duration. Would it be possible for our team to request an hourly demand chart? If a different form or supporting record is needed, please let me know so that we can provide the correct information rather than repeating the original submission.\n\nCould you confirm the appropriate next step by Tuesday at 4 p.m.? Thank you for your assistance and for helping us keep the arrangements clear for everyone involved.\n\nKind regards,\nEthan Park","discussionTask":"Professor: We are considering how universities should respond to evidence about renewable energy and storage. Should a university act on promising preliminary findings, or wait for stronger evidence before changing its practices?\n\nStudent A — Elena: I favor cautious early action. A four-hour battery covered evening demand on sunny days but failed during a week of storms. If an initiative can be monitored and reversed, refusing to try it may also have costs.\n\nStudent B — Marcus: I would insist on stronger evidence first. A technology that addresses daily fluctuations may not address multi-day shortages. Otherwise, we might spend resources responding to a misleading pattern.","discussionSample":"I would take a position between Elena's willingness to act and Marcus's concern about premature conclusions. In the case of renewable energy and storage, a four-hour battery covered evening demand on sunny days but failed during a week of storms. This is a meaningful observation, and it would be unreasonable to ignore it entirely. Nevertheless, a technology that addresses daily fluctuations may not address multi-day shortages. The critical distinction, in my view, is whether a decision can be monitored, evaluated and revised. I would therefore recommend a limited pilot that could test competing interpretations. A practical first step would follow this suggestion: Planners modeled hourly loads across seasons and examined storage plus flexible demand. Participants should be told which benefits are expected, which uncertainties remain and what outcome would justify changing course. That approach responds to the promising evidence without treating a tentative interpretation as a settled fact."},"vocabulary":[{"term":"grid flexibility","meaning":"전력망 유연성","collocation":"examine grid flexibility","example":"The panel considered whether grid flexibility had been overlooked in the preliminary assessment.","synonym":"","nuance":"주제 핵심 표현 · Renewable Energy and Storage","group":"core"},{"term":"storage dispatch","meaning":"저장 에너지 급전","collocation":"examine storage dispatch","example":"A new section on storage dispatch allowed independent readers to evaluate the evidence more carefully.","synonym":"","nuance":"주제 핵심 표현 · Renewable Energy and Storage","group":"core"},{"term":"peak demand","meaning":"최대 수요","collocation":"examine peak demand","example":"The project could not proceed responsibly without an agreed definition of peak demand.","synonym":"","nuance":"주제 핵심 표현 · Renewable Energy and Storage","group":"core"},{"term":"renewable surplus","meaning":"재생전력 잉여","collocation":"examine renewable surplus","example":"The investigators distinguished renewable surplus from the more direct outcome reported in the summary.","synonym":"","nuance":"주제 핵심 표현 · Renewable Energy and Storage","group":"core"},{"term":"battery degradation","meaning":"배터리 열화","collocation":"assess battery degradation","example":"The research team reconsidered battery degradation after discussing a limitation of the first dataset.","synonym":"","nuance":"주제 핵심 표현 · Renewable Energy and Storage","group":"core"},{"term":"lifecycle cost","meaning":"수명주기 비용","collocation":"examine lifecycle cost","example":"The concluding report explained how lifecycle cost might influence the next stage of the inquiry.","synonym":"","nuance":"주제 핵심 표현 · Renewable Energy and Storage","group":"core"},{"term":"demand response","meaning":"수요 반응","collocation":"examine demand response","example":"The seminar on renewable energy and storage began by clarifying what demand response means in this particular setting.","synonym":"","nuance":"주제 핵심 표현 · Renewable Energy and Storage","group":"core"},{"term":"capacity market","meaning":"용량 시장","collocation":"measure capacity market","example":"Reviewers asked for a detailed account of capacity market before accepting the proposed interpretation.","synonym":"","nuance":"주제 핵심 표현 · Renewable Energy and Storage","group":"core"},{"term":"reserve margin","meaning":"예비력 여유","collocation":"examine reserve margin","example":"The field notes addressed reserve margin as a possible source of variation across sites.","synonym":"","nuance":"주제 핵심 표현 · Renewable Energy and Storage","group":"core"},{"term":"resource adequacy","meaning":"자원 적정성","collocation":"examine resource adequacy","example":"An explanation of resource adequacy was included because it affected the scope of the research claim.","synonym":"","nuance":"주제 핵심 표현 · Renewable Energy and Storage","group":"core"},{"term":"transmission constraint","meaning":"송전 제약","collocation":"assess transmission constraint","example":"The revised procedure made transmission constraint explicit rather than leaving it to individual judgment.","synonym":"","nuance":"주제 핵심 표현 · Renewable Energy and Storage","group":"core"},{"term":"storage duration","meaning":"저장 지속시간","collocation":"measure storage duration","example":"Students compared the role of storage duration in the initial and follow-up investigations.","synonym":"","nuance":"주제 핵심 표현 · Renewable Energy and Storage","group":"core"},{"term":"rather than","meaning":"~하기보다는","collocation":"rather than assuming success","example":"Rather than assuming success, the team compared several competing explanations.","synonym":"instead of","nuance":"기존 선택과 대조되는 대안","group":"advanced"},{"term":"give rise to","meaning":"~을 발생시키다","collocation":"give rise to uncertainty","example":"Unreported exclusions can give rise to uncertainty about the original analysis.","synonym":"produce","nuance":"원인·결과 연결에 자주 쓰임","group":"advanced"},{"term":"be consistent with","meaning":"~와 양립하다","collocation":"be consistent with several accounts","example":"The observed pattern may be consistent with several competing explanations.","synonym":"not contradict","nuance":"일치해도 유일 원인을 뜻하진 않음","group":"advanced"},{"term":"be susceptible to","meaning":"~에 취약하다","collocation":"be susceptible to bias","example":"Retrospective accounts may be susceptible to bias when details are forgotten.","synonym":"be vulnerable to","nuance":"영향을 받기 쉬움","group":"advanced"},{"term":"be transparent about","meaning":"~을 투명하게 밝히다","collocation":"be transparent about uncertainty","example":"Researchers should be transparent about uncertainty in early findings.","synonym":"disclose openly","nuance":"한계를 공개적으로 명시","group":"advanced"},{"term":"provisionally","meaning":"잠정적으로","collocation":"provisionally accept the result","example":"Reviewers agreed to provisionally accept the result until a replication study was completed.","synonym":"tentatively","nuance":"최종 확정 전 승인","group":"advanced"},{"term":"nuanced","meaning":"미묘한 차이를 반영한","collocation":"a nuanced interpretation","example":"The revised article offered a nuanced interpretation rather than declaring the intervention a complete success.","synonym":"subtle","nuance":"흑백논리가 아닌 세밀한 구분","group":"advanced"},{"term":"feasible","meaning":"실행 가능한","collocation":"a feasible alternative","example":"A smaller pilot offered a feasible alternative to a costly university-wide rollout.","synonym":"practicable","nuance":"현실 제약을 고려한 실행 가능성","group":"advanced"},{"term":"qualify","meaning":"주장에 조건·범위를 달다","collocation":"qualify a claim","example":"The author needed to qualify a claim that originally sounded universal.","synonym":"limit","nuance":"정확성을 위해 주장 강도를 제한","group":"advanced"},{"term":"undermine","meaning":"약화시키다","collocation":"undermine confidence","example":"Missing records can undermine confidence in an otherwise carefully designed study.","synonym":"weaken","nuance":"신뢰·주장·효과 등을 약화","group":"advanced"},{"term":"prioritize","meaning":"우선순위를 부여하다","collocation":"prioritize urgent needs","example":"The team chose to prioritize urgent needs without ignoring longer-term goals.","synonym":"rank first","nuance":"제약 속 우선순위 선택","group":"advanced"},{"term":"exacerbate","meaning":"악화시키다","collocation":"exacerbate existing inequalities","example":"Poorly targeted funding can exacerbate existing inequalities between districts.","synonym":"aggravate","nuance":"부정적 상황을 더욱 심각하게 함","group":"advanced"},{"term":"characterize","meaning":"특성을 규명하다","collocation":"characterize the variation","example":"The pilot was designed to characterize the variation across student cohorts.","synonym":"describe systematically","nuance":"특징을 체계적으로 밝힘","group":"advanced"},{"term":"synthesize","meaning":"종합하다","collocation":"synthesize multiple findings","example":"A review can synthesize multiple findings without treating all studies as equally reliable.","synonym":"integrate","nuance":"다른 근거를 통합해 정리","group":"advanced"},{"term":"pervasive","meaning":"광범위하게 퍼진","collocation":"a pervasive problem","example":"Th
