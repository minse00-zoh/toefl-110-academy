<script>window.TOEFL_LESSON={"day":6,"week":2,"theme":"Finding Planets by the Transit Method","focus":"Reading: inference and text structure","claim":"Repeated stellar dimming can reveal an exoplanet, but the method depends on geometry and careful exclusion of false signals.","evidence":"Transit depth constrains relative planet size, while the spacing of dips indicates orbital period.","caveat":"Binary eclipses, neighboring light and unfavorable orbital alignment complicate detections.","response":"Confirm periodicity, estimate the star’s size and check independent observations and contamination.","storageKey":"toefl110day6-diversity-v3","notice":"UNIVERSITY OBSERVATORY — PUBLIC VIEWING NIGHT\n\nFriday's public observing session will start at 8:15 p.m., thirty minutes later than listed in the printed brochure, to allow a recently installed telescope camera to be calibrated. The introductory lecture will still begin at 7:30 p.m. in the Planetarium Hall.\n\nRegistered visitors may join the telescope queue without another ticket. Guests requiring step-free access should notify the reception team by Thursday noon, as the rooftop lift has a limited capacity. In heavy cloud cover, the rooftop demonstration will be replaced by a digital observing workshop.","academicPassage":"A planet orbiting a distant star is usually too dim to photograph directly. Astronomers therefore use indirect methods to infer its presence. One technique, called transit photometry, measures tiny decreases in a star's brightness when a planet crosses in front of it from Earth's perspective. Repeated dips at regular intervals may indicate an orbiting body.\n\nThe shape of the brightness curve provides more information than the existence of a dip alone. A deeper transit can suggest a larger planet relative to its star, while the interval between transits constrains the orbital period. Researchers must know the star's size, however, before they can estimate a planet's actual dimensions. A similar-looking signal could also arise if two stars in a binary system eclipse each other.\n\nTo separate these explanations, observers combine several measurements. They look for repeated transits with consistent timing, examine neighboring stars that might contaminate the light measurement, and sometimes obtain radial-velocity data showing how the star moves in response to an orbiting object. An observation campaign that misses part of a transit can introduce additional uncertainty about the event's duration.\n\nThe transit method has discovered many planets, but it is selective. Only systems whose orbital planes are aligned favorably with our line of sight produce observable transits. Consequently, the discovered sample cannot be treated as a straightforward census of all planetary systems. Astronomers model this detection bias when estimating how common different kinds of planets may be.","readingClozePassage":"An astronomy class collected brightness measurements from a distant star over several nights. A shallow di_ appeared i_ the gra__, and th_ students bec___ excited abo__ a poss____ planet. The__ instructor remi____ them th__ a single event could have other causes. The team scheduled more observations and checked nearby sources of light. A recurring pattern would strengthen the hypothesis, but even then the planet's actual size would depend on estimates of the host star's radius. The class learned to distinguish a candidate from a confirmed discovery.","cloze":[{"partial":"di_","answer":"dip","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"i_","answer":"in","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"gra__","answer":"graph","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"th_","answer":"the","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"bec___","answer":"became","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"abo__","answer":"about","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"poss____","answer":"possible","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"The__","answer":"their","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"remi____","answer":"reminded","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"th__","answer":"that","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"}],"questions":{"rd":[{"q":"What part of Friday’s observatory program keeps its original start time?","options":["The replacement digital workshop at 7:00 p.m.","The introductory planetarium lecture at 7:30 p.m.","The telescope viewing at 7:45 p.m.","The rooftop calibration at 8:15 p.m."],"answer":1,"why":"실생활 공지의 해당 조건을 찾아 확인하세요. The introductory planetarium lecture at 7:30 p.m."},{"q":"What should a visitor needing step-free rooftop access do?","options":["Notify the reception team by Thursday noon.","Wait until the lecture ends to contact staff.","Purchase a second ticket at the rooftop gate.","Bring their own lifting equipment."],"answer":0,"why":"공지의 별도 요건 또는 예외 조항에 명시된 행동은 Notify the reception team by Thursday noon.입니다."},{"q":"What will the observatory offer if clouds prevent rooftop viewing?","options":["An automatic refund for every visitor at the lecture.","A replacement telescope session before the introductory talk.","An unaccompanied trip onto the closed rooftop.","A digital observing workshop."],"answer":3,"why":"공지의 예외 조항과 구체적인 적용 범위를 비교해야 합니다. 정답 근거: A digital observing workshop."}],"ra":[{"q":"What central explanation organizes the scientific process discussed in the passage on Finding Planets by the Transit Method?","options":["A single dimming event conclusively establishes a new planet.","Every planet is equally likely to pass across its star from Earth’s viewpoint.","Repeated stellar dimming can reveal an exoplanet, but the method depends on geometry and careful exclusion of false signals.","Transit depth alone determines the exact radius in kilometers."],"answer":2,"why":"중심 논지는 세부 사례에서 도출되는 가장 신중한 결론입니다. Repeated stellar dimming can reveal an exoplanet, but the method depends on geometry and careful exclusion of false signals."},{"q":"What specific observation in the finding planets by the transit method case motivates the discussion?","options":["Every planet is equally likely to pass across its star from Earth’s viewpoint.","Transit depth constrains relative planet size, while the spacing of dips indicates orbital period.","Transit depth alone determines the exact radius in kilometers.","A single dimming event conclusively establishes a new planet."],"answer":1,"why":"지문의 사례·대조 정보를 직접 확인해야 합니다. Transit depth constrains relative planet size, while the spacing of dips indicates orbital period."},{"q":"Which qualification prevents the evidence about transit observations from supporting an unconditional claim?","options":["Binary eclipses, neighboring light and unfavorable orbital alignment complicate detections.","Transit depth alone determines the exact radius in kilometers.","Every planet is equally likely to pass across its star from Earth’s viewpoint.","A single dimming event conclusively establishes a new planet."],"answer":0,"why":"한계 조건은 곧바로 틀린 결론이라는 뜻이 아니라 적용 범위를 제한합니다. Binary eclipses, neighboring light and unfavorable orbital alignment complicate detections."},{"q":"What is the rhetorical function of the particular case discussed in the middle of the finding planets by the transit method text?","options":["It lists the sequence of transit observations observations without contributing to the author’s main point.","The example eliminates the need to compare evidence about transit observations with alternative explanations.","The example proves that the implications of transit observations hold in every possible location.","It illustrates a specific relationship involving transit observations while establishing the boundaries of the wider argument."],"answer":3,"why":"사례는 범위가 제한된 관찰 또는 비교를 통해 주장을 구체화하고 무조건적 일반화를 피하도록 돕습니다."},{"q":"Which investigation or action would best extend the reasoning about finding planets by the transit method?","options":["A single dimming event conclusively establishes a new planet.","Transit depth alone determines the exact radius in kilometers.","Confirm periodicity, estimate the star’s size and check independent observations and contamination.","Every planet is equally likely to pass across its star from Earth’s viewpoint."],"answer":2,"why":"추가 검증은 근거의 결함을 직접 보완하거나 대안 설명을 시험해야 합니다. Confirm periodicity, estimate the star’s size and check independent observations and contamination."}],"rp":[{"q":"In the finding planets by the transit method passage, what does “constrains” most nearly mean in context?","options":["guarantees an exact answer with no uncertainty","limits the range of possible values","prevents the planet from completing an orbit","increases the brightness of a star"],"answer":1,"why":"단어의 문맥상 의미를 판단해야 하며 직역만으로 결정하지 않습니다. constrains ≈ limits the range of possible values"},{"q":"A periodic dimming signal appears in data from a crowded star field. What is the sensible next step?","options":["Check neighboring light sources and obtain confirming observations.","Assign a definite planetary radius from the dip alone.","Assume every periodic dip is an orbiting planet.","Disregard the star’s size because only timing matters."],"answer":0,"why":"새 상황에 지문 원리를 적용하는 고난도 추론 문항입니다. Check neighboring light sources and obtain confirming observations."}],"lq":[{"q":"Which response best addresses the speaker’s question about transit observations?","options":["The planetarium sells posters at the entrance.","Yes, the orbit is certainly circular.","The observatory opens at eight fifteen.","Not yet—we also need the star’s size and confirmation that the event is a transit."],"answer":3,"why":"화자는 전제를 확인하고 있으므로 직접적인 정정과 관련 조건 설명이 적절합니다."}],"lc":[{"q":"What brings the first speaker to the conversation concerning transit observations?","options":["An invitation to deliver a formal lecture explaining finding planets by the transit method.","A plan to evaluate unrelated applicants for a different university program.","whether a single brightness dip confirms an exoplanet","A request for the institution to change the academic field under discussion."],"answer":2,"why":"대화의 도입부에서 상대가 확인하려는 문제를 파악합니다. whether a single brightness dip confirms an exoplanet"},{"q":"What does the second speaker clarify about the issue raised in the finding planets by the transit method dialogue?","options":["Every planet is equally likely to pass across its star from Earth’s viewpoint.","the dip must repeat and could be affected by a nearby star","Transit depth alone determines the exact radius in kilometers.","A single dimming event conclusively establishes a new planet."],"answer":1,"why":"Not necessarily, No, Exactly와 같은 정정 이후의 내용을 확인합니다. the dip must repeat and could be affected by a nearby star"},{"q":"What will the first speaker most likely do after the discussion about transit observations?","options":["describe a candidate and collect more observations","Withdraw permanently from all activities discussed.","Replace the entire project with an unrelated topic without consulting anyone.","Disregard the advice and continue on the original assumption."],"answer":0,"why":"마지막 발화에서 다음 행동을 추론합니다. describe a candidate and collect more observations"}],"la":[{"q":"What practical change or instruction is listeners expected to notice in the announcement about transit observations?","options":["The rooftop calibration at 8:15 p.m.","The replacement digital workshop at 7:00 p.m.","The telescope viewing at 7:45 p.m.","The introductory planetarium lecture at 7:30 p.m."],"answer":3,"why":"공지의 장소·시간·적용 조건을 듣고 핵심 변경사항을 선택합니다. The introductory planetarium lecture at 7:30 p.m."},{"q":"Which additional requirement applies to listeners in the finding planets by the transit method announcement?","options":["Wait until the lecture ends to contact staff.","Bring their own lifting equipment.","Notify the reception team by Thursday noon.","Purchase a second ticket at the rooftop gate."],"answer":2,"why":"보편적인 안내와 특정 조건에 해당하는 행동을 구별해야 합니다. Notify the reception team by Thursday noon."}],"lt":[{"q":"Which statement best summarizes the lecturer’s explanation of finding planets by the transit method?","options":["A single dimming event conclusively establishes a new planet.","Repeated stellar dimming can reveal an exoplanet, but the method depends on geometry and careful exclusion of false signals.","Transit depth alone determines the exact radius in kilometers.","Every planet is equally likely to pass across its star from Earth’s viewpoint."],"answer":1,"why":"강의 중심 개념과 화자의 제한된 결론을 종합합니다. Repeated stellar dimming can reveal an exoplanet, but the method depends on geometry and careful exclusion of false signals."},{"q":"What role does the lecturer’s example of transit observations play in the explanation?","options":["Transit depth constrains relative planet size, while the spacing of dips indicates orbital period.","Every planet is equally likely to pass across its star from Earth’s viewpoint.","A single dimming event conclusively establishes a new planet.","Transit depth alone determines the exact radius in kilometers."],"answer":0,"why":"강의 사례는 개념을 구체화하는 관측 자료 또는 비교입니다. Transit depth constrains relative planet size, while the spacing of dips indicates orbital period."},{"q":"What caution does the lecturer introduce after describing evidence related to transit observations?","options":["Every planet is equally likely to pass across its star from Earth’s viewpoint.","A single dimming event conclusively establishes a new planet.","Transit depth alone determines the exact radius in kilometers.","Binary eclipses, neighboring light and unfavorable orbital alignment complicate detections."],"answer":3,"why":"화자가 However, but 등으로 도입하는 예외를 듣는 것이 핵심입니다. Binary eclipses, neighboring light and unfavorable orbital alignment complicate detections."},{"q":"How would the lecturer most likely advise someone evaluating transit observations in a new setting?","options":["A single dimming event conclusively establishes a new planet.","Every planet is equally likely to pass across its star from Earth’s viewpoint.","Confirm periodicity, estimate the star’s size and check independent observations and contamination.","Transit depth alone determines the exact radius in kilometers."],"answer":2,"why":"강의의 마무리에서 제안하는 연구·실행 원칙을 응용합니다. Confirm periodicity, estimate the star’s size and check independent observations and contamination."}]},"audio":{"lq":"Do we know the planet’s exact size from the depth of this single dip?","lc":"Student: I downloaded the light curve from last night's observation. There's a small dip, so have we found a planet?\nAstronomer: It's an interesting candidate, but one dip isn't enough. We need to see whether it recurs at a consistent interval.\nStudent: Could we use its depth to determine how big the planet is?\nAstronomer: Only after estimating the star's radius. A dip gives a ratio, not the planet's absolute size.\nStudent: I also noticed a neighboring star in the image.\nAstronomer: Good observation. Its light may dilute the signal, so we must check the image before publishing a size estimate.\nStudent: Then my report should call it a transit candidate rather than a confirmed planet.\nAstronomer: Exactly. Keep both the uncertainty and the next observations in your report.","la":"Attention, observatory visitors. Tonight's telescope viewing begins at eight fifteen, rather than seven forty-five, while the new camera is calibrated. The introductory planetarium lecture still begins at seven thirty. If clouds prevent safe rooftop observations, staff will offer a digital observing workshop instead. Registered visitors do not need an additional ticket. Guests who require the rooftop lift should speak to the reception desk before joining the queue.","lt":"Here is a puzzle for you: how can we discover a planet that we cannot see? One answer is to watch its star. When a planet passes in front of the star, the total light drops by a very small amount. If that dip repeats, we may have found a transit.\n\nNotice what the data do and do not tell us. The dip's depth gives us the planet's size relative to the star, not its size in kilometers. For that estimate, we need information about the star itself. The timing of repeated dips helps estimate the orbital period.\n\nBut a binary star system can mimic some transit patterns, and a nearby bright star can dilute the signal. Astronomers check for these false positives and often seek another kind of measurement before confirming a discovery.\n\nFinally, remember that we mostly detect planets whose orbits line up with our viewpoint. So a catalogue of transiting planets is not a neutral picture of every planet in the galaxy."},"speaking":{"repeat":["Welcome to the workshop on transit observations.","Friday's public observing session will start at 8:15 p.","The instructor asked us to compare the evidence about transit observations before drawing conclusions.","Transit depth constrains relative planet size, while the spacing of dips indicates orbital period.","Binary eclipses, neighboring light and unfavorable orbital alignment complicate detections.","Confirm periodicity, estimate the star’s size and check independent observations and contamination.","Although it might initially seem that a single dimming event conclusively establishes a new planet, the evidence instead suggests that repeated stellar dimming can reveal an exoplanet, but the method depends on geometry and careful exclusion of false signals."],"interviews":["What first interested you in astronomy / planetary science, and how would you explain that interest to a friend?","Tell me about a time when a practical decision involving transit observations was more complicated than you expected.","Do you think universities should give more attention to transit observations in introductory courses? Explain your reasoning.","Imagine a classmate disagrees with your interpretation of transit observations. How would you respond respectfully and precisely?"],"sample":"I would like to participate in a genuine astronomical observation project, even if the data were noisy. A clean textbook graph can make discovering a planet seem straightforward. In reality, a small dip in starlight could have several causes, and a researcher needs repeated observations before drawing conclusions. I think this uncertainty would make the project more educational rather than less. I would enjoy learning how to distinguish a promising candidate from a confirmed discovery. The experience would teach me to communicate what the evidence shows while being precise about what remains unknown."},"writing":{"build":[{"fragments":"Could you tell me / session has been rescheduled / whether the transit observations","answer":"Could you tell me whether the transit observations session has been rescheduled?","why":"간접 의문문 어순의 문장 구조와 주어-동사 관계를 확인하세요."},{"fragments":"the light curve records / The student who reviewed / noticed an important discrepancy","answer":"The student who reviewed the light curve records noticed an important discrepancy.","why":"관계절로 설명 추가의 문장 구조와 주어-동사 관계를 확인하세요."},{"fragments":"the orbital period evidence earlier, / If the team had checked / different conclusion / it might have reached a","answer":"If the team had checked the orbital period evidence earlier, it might have reached a different conclusion.","why":"조건절로 가능성 제시의 문장 구조와 주어-동사 관계를 확인하세요."},{"fragments":"to transit observations had been / Only after the records related / the report / examined did the committee approve","answer":"Only after the records related to transit observations had been examined did the committee approve the report.","why":"Only after 도치의 문장 구조와 주어-동사 관계를 확인하세요."},{"fragments":"but also a clear account / A project involving transit observations / of its limitations / requires not only reliable evidence","answer":"A project involving transit observations requires not only reliable evidence but also a clear account of its limitations.","why":"Not only A but also B 병렬의 문장 구조와 주어-동사 관계를 확인하세요."}],"emailTask":"Your observatory class reserved equipment for a transit observation, but the camera calibration is running late. Email the laboratory supervisor to request a revised time slot, explain which measurements cannot be repeated later, and ask whether archived comparison data are available.","emailSample":"Dear Observatory Supervisor,\n\nOur group was planning to use the new camera during Friday's transit observation, but I understand that its calibration has taken longer than expected. The delay may prevent us from recording the predicted beginning of the event, which cannot simply be repeated later that evening.\n\nCould we move our equipment reservation to the earliest available slot? If the timing remains impractical, would the observatory permit us to compare our partial light curve with archived observations of the same star?\n\nWe will clearly identify any measurements we did not make ourselves. Thank you for helping us adjust the project responsibly.\n\nBest regards,\nAlex","discussionTask":"Professor: Should universities give undergraduates access to research-grade astronomical data before they complete advanced statistics courses?\n\nStudent A — Emily: Yes. Authentic observations can motivate students and teach them to recognize uncertainty.\n\nStudent B — Daniel: Not immediately. Students may misinterpret faint signals without sufficient statistical preparation.","discussionSample":"Undergraduates should be allowed to explore research-grade astronomical data, provided the course teaches the limitations of the methods used to interpret them. Working with a genuine light curve can make abstract statistics meaningful: students learn that a dip in brightness is an observation, not immediate proof of an exoplanet. They can compare repeated events, identify noise, and discuss why a nearby star might affect the signal. I agree that students without advanced preparation could draw overconfident conclusions. The solution is a structured introduction with clear validation steps, not a blanket prohibition on authentic datasets. Instructors should assess whether students can distinguish candidates from confirmed detections. That reasoning skill is useful even for students who do not ultimately specialize in astronomy."},"vocabulary":[{"term":"transit photometry","meaning":"통과 광도측정","collocation":"conduct transit photometry","example":"Under the new conditions, astronomers were asked to conduct transit photometry at an earlier stage.","synonym":"brightness monitoring of transits","nuance":"","group":"core"},{"term":"light curve","meaning":"광도 곡선","collocation":"plot a light curve","example":"The long-term monitoring plan required astronomers to plot a light curve at regular intervals.","synonym":"time series of luminosity","nuance":"","group":"core"},{"term":"orbital period","meaning":"공전 주기","collocation":"estimate an orbital period","example":"At the discussion session, astronomers explained their decision to estimate an orbital period.","synonym":"time of one revolution","nuance":"","group":"core"},{"term":"stellar radius","meaning":"항성 반지름","collocation":"constrain a stellar radius","example":"The available resources enabled astronomers to constrain a stellar radius during the pilot study.","synonym":"star size","nuance":"","group":"core"},{"term":"binary eclipse","meaning":"쌍성 식 현상","collocation":"identify a binary eclipse","example":"Although the preliminary results seemed convincing, astronomers still needed to identify a binary eclipse.","synonym":"mutual eclipse of two stars","nuance":"","group":"core"},{"term":"radial velocity","meaning":"시선속도","collocation":"measure radial velocity","example":"Because the evidence was incomplete, astronomers agreed to measure radial velocity again before deciding.","synonym":"line-of-sight speed","nuance":"","group":"core"},{"term":"false positive","meaning":"거짓 양성 신호","collocation":"exclude a false positive","example":"The report identified an overlooked opportunity for astronomers to exclude a false positive.","synonym":"misleading positive result","nuance":"","group":"core"},{"term":"detection bias","meaning":"검출 편향","collocation":"correct for detection bias","example":"After examining competing accounts, astronomers were prepared to correct for detection bias.","synonym":"biased observation probability","nuance":"","group":"core"},{"term":"planetary candidate","meaning":"행성 후보","collocation":"validate a planetary candidate","example":"One limitation of the project was that astronomers could not yet validate a planetary candidate reliably.","synonym":"unconfirmed potential planet","nuance":"","group":"core"},{"term":"photometric noise","meaning":"광도 측정 잡음","collocation":"reduce photometric noise","example":"A later review prompted astronomers to reduce photometric noise, rather than accept the initial explanation.","synonym":"random brightness variation","nuance":"","group":"core"},{"term":"orbital alignment","meaning":"궤도 정렬 상태","collocation":"assess orbital alignment","example":"Over a semester of fieldwork, astronomers learned how to assess orbital alignment.","synonym":"relative orientation of an orbit","nuance":"","group":"core"},{"term":"signal dilution","meaning":"신호 희석","collocation":"model signal dilution","example":"In their final presentation, astronomers described what it meant to model signal dilution.","synonym":"weakening of a measured signal","nuance":"","group":"core"},{"term":"stellar contamination","meaning":"항성빛 오염","collocation":"account for stellar contamination","example":"Careful documentation enabled astronomers to account for stellar contamination without repeating the same mistake.","synonym":"light from nearby stars","nuance":"","group":"core"},{"term":"transit depth","meaning":"통과 깊이","collocation":"calculate transit depth","example":"In a subsequent case, astronomers had to calculate transit depth under rather different conditions.","synonym":"size of the brightness drop","nuance":"","group":"core"},{"term":"observation window","meaning":"관측 시간창","collocation":"extend an observation window","example":"The final recommendation urged astronomers to extend an observation window before proceeding.","synonym":"period available for observing","nuance":"","group":"core"},{"term":"periodic signal","meaning":"주기적 신호","collocation":"detect a periodic signal","example":"In the first trial, astronomers were not yet able to detect a periodic signal consistently.","synonym":"regularly recurring signal","nuance":"","group":"advanced"},{"term":"photometric precision","meaning":"광도 측정 정밀도","collocation":"improve photometric precision","example":"The absence of reliable records made it difficult for astronomers to improve photometric precision.","synonym":"accuracy of light measurement","nuance":"","group":"advanced"},{"term":"gravitational influence","meaning":"중력의 영향","collocation":"infer gravitational influence","example":"The project team provided a checklist to help astronomers infer gravitational influence.","synonym":"effect of gravitational force","nuance":"","group":"advanced"},{"term":"observation bias","meaning":"관측 편향","collocation":"correct for observation bias","example":"Students observed how astronomers attempted to correct for observation bias despite incomplete information.","synonym":"sampling-related visibility bias","nuance":"","group":"advanced"},{"term":"measurement uncertainty","meaning":"측정 불확실성","collocation":"quantify measurement uncertainty","example":"A meaningful comparison would require astronomers to quantify measurement uncertainty independently.","synonym":"uncertainty in readings","nuance":"","group":"advanced"},{"term":"stellar luminosity","meaning":"항성 광도","collocation":"estimate stellar luminosity","example":"A cautious interpretation allowed astronomers to estimate stellar luminosity while acknowledging uncertainty.","synonym":"brightness of a star","nuance":"","group":"advanced"},{"term":"planetary radius","meaning":"행성 반지름","collocation":"derive a planetary radius","example":"Several independent observations led astronomers to derive a planetary radius before publication.","synonym":"physical size of a planet","nuance":"","group":"advanced"},{"term":"orbital inclination","meaning":"궤도 경사각","collocation":"constrain orbital inclination","example":"A request from the university encouraged astronomers to constrain orbital inclination more transparently.","synonym":"tilt of an orbit","nuance":"","group":"advanced"},{"term":"signal-to-noise ratio","meaning":"신호대잡음비","collocation":"calculate a signal-to-noise ratio","example":"Rather than generalizing from one case, astronomers sought to calculate a signal-to-noise ratio in several settings.","synonym":"signal relative to background noise","nuance":"","group":"advanced"},{"term":"astronomical survey","meaning":"천문 탐사","collocation":"conduct an astronomical survey","example":"The investigation would be less credible if astronomers neglected to conduct an astronomical survey.","synonym":"systematic study of the sky","nuance":"","group":"advanced"},{"term":"indirect detection","meaning":"간접 검출","collocation":"validate indirect detection","example":"The procedures were revised so that astronomers could validate indirect detection consistently.","synonym":"detection by indirect evidence","nuance":"","group":"advanced"},{"term":"repeat observation","meaning":"반복 관측","collocation":"schedule repeat observations","example":"Before finalizing the interpretation, astronomers decided to schedule repeat observations.","synonym":"additional observation","nuance":"","group":"advanced"},{"term":"instrument drift","meaning":"장비 드리프트","collocation":"measure instrument drift","example":"The students challenged astronomers to measure instrument drift without overlooking contrary evidence.","synonym":"slow change in instrument performance","nuance":"","group":"advanced"},{"term":"candidate verification","meaning":"후보 검증","collocation":"complete candidate verification","example":"The instructor proposed that astronomers should first complete candidate verification and then compare outcomes.","synonym":"confirmation of a suspected object","nuance":"","group":"advanced"},{"term":"population estimate","meaning":"모집단 추정값","collocation":"revise a population estimate","example":"When the initial explanation failed, astronomers returned to the data to revise a population estimate.","synonym":"estimate across a population","nuance":"","group":"advanced"}],"meta":{"sourceType":"original practice content","etsOfficial":false,"benchmark":"TOEFL iBT January 2026 task-type descriptions / ETS sample 1","studyMinutes":120,"revision":"2026-11-23-diversity-v3","discipline":"Astronomy / Planetary Science","genre":"process"}};</script>
