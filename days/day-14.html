<script>window.TOEFL_LESSON={"day":14,"week":3,"theme":"Packet Switching and the Early Internet","focus":"Listening: intention, emphasis and discourse","claim":"Packet switching improved flexible sharing of data links but required protocols to handle irregular delivery.","evidence":"Independent packets could take different routes and arrive out of order, unlike reserved telephone circuits.","caveat":"Shared networks face congestion, packet loss and reordering that must be handled by communication protocols.","response":"Use packet identifiers and common protocols that support reconstruction across heterogeneous networks.","storageKey":"toefl110day14-diversity-v3","notice":"COMPUTING HISTORY EXHIBITION — NETWORK DEMONSTRATION\n\nVisitors can join an interactive packet-routing demonstration every hour from 1 p.m. to 4 p.m. on Saturday. The first session will begin at 1:15 p.m. because a software update is being installed. No registration is needed for the gallery, but the hands-on terminal workshop has just twelve seats and requires an online booking by Friday evening.\n\nVisitors should not plug personal devices into the historical equipment. The museum provides safe replicas and a simulation terminal for demonstrations.","academicPassage":"Early telephone networks were designed mainly around circuits: a continuous connection was reserved between two parties for the duration of a call. In the mid-twentieth century, researchers began exploring an alternative for computers that exchanged short bursts of information. Rather than dedicate a single path to a session, a message could be divided into smaller units that traveled independently through shared links.\n\nThis approach became known as packet switching. Each packet carried information that allowed intermediate devices to forward it toward a destination. If one link was congested, the network might route later packets differently. Sharing capacity among many users could make data communication more efficient when transmissions were intermittent.\n\nThe system also introduced new requirements. Packets might arrive out of order, be duplicated or fail to arrive at all. Communication protocols had to identify them and specify how a receiving computer could reconstruct the original message. Reliability shifted from an assumption about a continuous circuit toward mechanisms operating across variable network paths.\n\nThe early development of internetworking involved technical decisions and institutional cooperation. Universities, research laboratories and public agencies supported experiments that made different networks communicate through common rules. The resulting architecture did not eliminate congestion or failures, but it allowed a flexible system to grow without requiring every participating network to use identical physical equipment. History shows how standards and coordination can be as consequential as the invention of a single device.","readingClozePassage":"A computer-history class sent numbered messages between groups of students representing network nodes. Instead o_ using on_ permanent rou__, each gro__ forwarded th_ messages thro___ any avail____ connection. Th_ notes reac___ their destin_____ in an unexpected order. Students initially thought the communication had failed, but the receiver rearranged the pieces using their numbers. The activity illustrated how packet networks can share links efficiently while requiring mechanisms for reconstruction. It also showed why communication standards matter when different devices exchange information.","cloze":[{"partial":"o_","answer":"of","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"on_","answer":"one","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"rou__","answer":"route","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"gro__","answer":"group","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"th_","answer":"the","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"thro___","answer":"through","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"avail____","answer":"available","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"Th_","answer":"the","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"reac___","answer":"reached","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"destin_____","answer":"destination","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"}],"questions":{"rd":[{"q":"Why is the first Saturday packet-routing demonstration starting later?","options":["The museum has cancelled all sessions until Sunday.","A simulation software update is being installed.","Visitors must complete a paid computer course.","The historical terminal equipment was permanently removed."],"answer":1,"why":"실생활 공지의 해당 조건을 찾아 확인하세요. A simulation software update is being installed."},{"q":"Which activity requires an advance booking?","options":["The twelve-seat hands-on terminal workshop.","Watching a simulated packet take a route.","Entering the general computer history gallery.","Reading the exhibition information panels."],"answer":0,"why":"공지의 별도 요건 또는 예외 조항에 명시된 행동은 The twelve-seat hands-on terminal workshop.입니다."},{"q":"Which equipment may visitors use in the computing museum demonstrations?","options":["Unsupervised devices from the permanent collection.","Their own laptops plugged into historical ports.","Prototype network switches stored in the archive.","Museum-provided simulations and replicas."],"answer":3,"why":"공지의 예외 조항과 구체적인 적용 범위를 비교해야 합니다. 정답 근거: Museum-provided simulations and replicas."}],"ra":[{"q":"What technological or institutional shift does the passage explain in the passage on Packet Switching and the Early Internet?","options":["All connected institutions must use identical physical equipment to exchange data.","Every packet must follow a permanent circuit for the entire session.","Packet switching improved flexible sharing of data links but required protocols to handle irregular delivery.","Packet switching eliminates the possibility of dropped or reordered information."],"answer":2,"why":"중심 논지는 세부 사 하도록 돕습니다."},{"q":"Which investigation or action would best extend the reasoning about packet switching and the early internet?","options":["Every packet must follow a permanent circuit for the entire session.","Packet switching eliminates the possibility of dropped or reordered information.","Use packet identifiers and common protocols that support reconstruction across heterogeneous networks.","All connected institutions must use identical physical equipment to exchange data."],"answer":2,"why":"추가 검증은 근거의 결함을 직접 보완하거나 대안 설명을 시험해야 합니다. Use packet identifiers and common protocols that support reconstruction across heterogeneous networks."}],"rp":[{"q":"In the packet switching and the early internet passage, what does “intermittent” most nearly mean in context?","options":["always following the same path","occurring in separate bursts","continuously without a break","produced exclusively by a telephone"],"answer":1,"why":"단어의 문맥상 의미를 판단해야 하며 직역만으로 결정하지 않습니다. intermittent ≈ occurring in separate bursts"},{"q":"Several packets reach a server in a different order than they were sent. What feature is required?","options":["A protocol that identifies and reassembles the pieces.","A guarantee that every packet travels through one reserved circuit.","Identical hardware in every participating institution.","Elimination of all shared network links."],"answer":0,"why":"새 상황에 지문 원리를 적용하는 고난도 추론 문항입니다. A protocol that identifies and reassembles the pieces."}],"lq":[{"q":"Which response best addresses the speaker’s question about network routing?","options":["The museum provides safe replicas.","The first demonstration begins at one fifteen.","Yes, packet switching requires one permanent path.","Not necessarily; protocols can reassemble packets even if they arrive out of order."],"answer":3,"why":"화자는 전제를 확인하고 있으므로 직접적인 정정과 관련 조건 설명이 적절합니다."}],"lc":[{"q":"What brings the first speaker to the conversation concerning network routing?","options":["A request for the institution to change the academic field under discussion.","An invitation to deliver a formal lecture explaining packet switching and the early internet.","why network packets take different paths","A plan to evaluate unrelated applicants for a different university program."],"answer":2,"why":"대화의 도입부에서 상대가 확인하려는 문제를 파악합니다. why network packets take different paths"},{"q":"What does the second speaker clarify about the issue raised in the packet switching and the early internet dialogue?","options":["Packet switching eliminates the possibility of dropped or reordered information.","shared links permit flexible routing and protocols restore message order","All connected institutions must use identical physical equipment to exchange data.","Every packet must follow a permanent circuit for the entire session."],"answer":1,"why":"Not necessarily, No, Exactly와 같은 정정 이후의 내용을 확인합니다. shared links permit flexible routing and protocols restore message order"},{"q":"What will the first speaker most likely do after the discussion about network routing?","options":["reserve the terminal workshop if hands-on access is needed","Replace the entire project with an unrelated topic without consulting anyone.","Disregard the advice and continue on the original assumption.","Withdraw permanently from all activities discussed."],"answer":0,"why":"마지막 발화에서 다음 행동을 추론합니다. reserve the terminal workshop if hands-on access is needed"}],"la":[{"q":"What practical change or instruction is listeners expected to notice in the announcement about network routing?","options":["Visitors must complete a paid computer course.","The historical terminal equipment was permanently removed.","The museum has cancelled all sessions until Sunday.","A simulation software update is being installed."],"answer":3,"why":"공지의 장소·시간·적용 조건을 듣고 핵심 변경사항을 선택합니다. A simulation software update is being installed."},{"q":"Which additional requirement applies to listeners in the packet switching and the early internet announcement?","options":["Entering the general computer history gallery.","Watching a simulated packet take a route.","The twelve-seat hands-on terminal workshop.","Reading the exhibition information panels."],"answer":2,"why":"보편적인 안내와 특정 조건에 해당하는 행동을 구별해야 합니다. The twelve-seat hands-on terminal workshop."}],"lt":[{"q":"Which statement best summarizes the lecturer’s explanation of packet switching and the early internet?","options":["Packet switching eliminates the possibility of dropped or reordered information.","Packet switching improved flexible sharing of data links but required protocols to handle irregular delivery.","Every packet must follow a permanent circuit for the entire session.","All connected institutions must use identical physical equipment to exchange data."],"answer":1,"why":"강의 중심 개념과 화자의 제한된 결론을 종합합니다. Packet switching improved flexible sharing of data links but required protocols to handle irregular delivery."},{"q":"What role does the lecturer’s example of network routing play in the explanation?","options":["Independent packets could take different routes and arrive out of order, unlike reserved telephone circuits.","All connected institutions must use identical physical equipment to exchange data.","Every packet must follow a permanent circuit for the entire session.","Packet switching eliminates the possibility of dropped or reordered information."],"answer":0,"why":"강의 사례는 개념을 구체화하는 관측 자료 또는 비교입니다. Independent packets could take different routes and arrive out of order, unlike reserved telephone circuits."},{"q":"What caution does the lecturer introduce after describing evidence related to network routing?","options":["Packet switching eliminates the possibility of dropped or reordered information.","Every packet must follow a permanent circuit for the entire session.","All connected institutions must use identical physical equipment to exchange data.","Shared networks face congestion, packet loss and reordering that must be handled by communication protocols."],"answer":3,"why":"화자가 However, but 등으로 도입하는 예외를 듣는 것이 핵심입니다. Shared networks face congestion, packet loss and reordering that must be handled by communication protocols."},{"q":"How would the lecturer most likely advise someone evaluating network routing in a new setting?","options":["Every packet must follow a permanent circuit for the entire session.","Packet switching eliminates the possibility of dropped or reordered information.","Use packet identifiers and common protocols that support reconstruction across heterogeneous networks.","All connected institutions must use identical physical equipment to exchange data."],"answer":2,"why":"강의의 마무리에서 제안하는 연구·실행 원칙을 응용합니다. Use packet identifiers and common protocols that support reconstruction across heterogeneous networks."}]},"audio":{"lq":"If packets take different routes, will the receiving computer be unable to read the message?","lc":"Student: I expected every packet in a message to follow the same route. Why are the paths different in this simulation?\nCurator: Because the links are shared. If one route is congested, a router can send a packet along another path.\nStudent: Wouldn't that scramble the message?\nCurator: The packets may arrive out of order, yes. The receiving system uses information in the packets and the protocol to reconstruct the message.\nStudent: So this is different from reserving a telephone circuit for the whole conversation.\nCurator: That's the central contrast. A circuit is a dedicated path for a period of time; packet switching allows more flexible sharing.\nStudent: Can I try the historical terminal myself?\nCurator: The public simulation is open, but the terminal workshop needs a reservation.","la":"The Computing History Museum welcomes visitors to its packet-switching exhibition. Today's first routing demonstration has been delayed to one fifteen while a simulation update is installed; later sessions will begin on the hour. The public gallery is free to enter without registration, but the twelve-seat terminal workshop requires a booking. Please do not connect personal equipment to the historical devices. Use only the museum's demonstration terminals.","lt":"Imagine sending a short message through a telephone-style circuit. A connection may be reserved even during moments when neither side is transmitting. Early computer researchers realized that data communication often occurred in bursts.\n\nPacket switching divides a message into smaller pieces that share network links. Different packets may take different routes, especially if a link is busy. That flexibility improves how capacity is used, but it creates a new problem: pieces may arrive in the wrong order or go missing.\n\nProtocols deal with these problems by identifying packets and allowing systems to reconstruct messages. The important historical achievement was not only faster equipment. It was also an agreement on communication rules that allowed machines built by different institutions to work together.\n\nThe network became useful because it could tolerate varied paths and hardware, though congestion and failures remained possible."},"speaking":{"repeat":["Welcome to the workshop on network routing.","Visitors can join an interactive packet-routing demonstration every hour from 1 p.","The instructor asked us to compare the evidence about network routing before drawing conclusions.","Independent packets could take different routes and arrive out of order, unlike reserved telephone circuits.","Shared networks face congestion, packet loss and reordering that must be handled by communication protocols.","Use packet identifiers and common protocols that support reconstruction across heterogeneous networks.","Although it might initially seem that every packet must follow a permanent circuit for the entire session, the evidence instead suggests that packet switching improved flexible sharing of data links but required protocols to handle irregular delivery."],"interviews":["What first interested you in history of technology / computer networks, and how would you explain that interest to a friend?","Tell me about a time when a practical decision involving network routing was more complicated than you expected.","Do you think universities should give more attention to network routing in introductory courses? Explain your reasoning.","Imagine a classmate disagrees with your interpretation of network routing. How would you respond respectfully and precisely?"],"sample":"One technical topic I would like to explain to a non-specialist is packet switching. Instead of reserving a single connection for a whole session, the network divides information into packets that can travel along different paths. This is efficient, but it means the pieces may arrive out of order. Protocols help the receiver reconstruct the original message. I find the idea interesting because it shows how a design choice can solve one problem and create another. If I were teaching this concept, I would use a simple classroom activity where students deliver numbered notes by different routes and then reassemble them."},"writing":{"build":[{"fragments":"session has been rescheduled / Could you tell me / whether the network routing","answer":"Could you tell me whether the network routing session has been rescheduled?","why":"간접 의문문 어순의 문장 구조와 주어-동사 관계를 확인하세요."},{"fragments":"The student who reviewed / the dedicated circuit records / noticed an important discrepancy","answer":"The student who reviewed the dedicated circuit records noticed an important discrepancy.","why":"관계절로 설명 추가의 문장 구조와 주어-동사 관계를 확인하세요."},{"fragments":"If the team had checked / it might have reached a / the network congestion evidence earlier, / different conclusion","answer":"If the team had checked the network congestion evidence earlier, it might have reached a different conclusion.","why":"조건절로 가능성 제시의 문장 구조와 주어-동사 관계를 확인하세요."},{"fragments":"Only after the records related / the report / to network routing had been / examined did the committee approve","answer":"Only after the records related to network routing had been examined did the committee approve the report.","why":"Only after 도치의 문장 구조와 주어-동사 관계를 확인하세요."},{"fragments":"requires not only reliable evidence / of its limitations / A project involving network routing / but also a clear account","answer":"A project involving network routing requires not only reliable evidence but also a clear account of its limitations.","why":"Not only A but also B 병렬의 문장 구조와 주어-동사 관계를 확인하세요."}],"emailTask":"You booked the historical networking workshop but your group cannot attend after the first demonstration was delayed. Email the museum education coordinator to explain the scheduling problem, request a later workshop slot, and ask whether the public simulation covers the same core concepts.","emailSample":"Dear Education Coordinator,\n\nMy study group reserved places for Saturday's historical networking workshop. Because the first packet-routing demonstration has been delayed, two members can no longer attend at our original time.\n\nCould you tell us whether a later hands-on workshop has space for our group? We are particularly interested in observing how packets may arrive out of order and how the receiving system reconstructs a message. If no workshop places remain, would the public simulation cover these essential concepts well enough for our assignment?\n\nI apologize for the scheduling change and appreciate any alternative you can suggest.\n\nKind regards,\nAlex","discussionTask":"Professor: Should introductory computer science classes spend time on the history of internet standards?\n\nStudent A — Emily: Yes, understanding design tradeoffs makes present-day technologies easier to evaluate.\n\nStudent B — Daniel: Students benefit more from current programming tools than from detailed historical case studies.","discussionSample":"The history of internet standards deserves a place in an introductory computer science course because it explains why current systems function as they do. Packet switching was developed to share communication links efficiently among computers exchanging intermittent bursts of data. That decision created new difficulties, including missing or out-of-order packets, which protocols had to address. Understanding the trade-off makes today's networking concepts easier to grasp. I agree that students also need programming practice, so the history should not dominate the course. A short case study paired with a routing simulation could connect past design choices to modern engineering. This kind of historical perspective helps students see standards as solutions to specific problems rather than as arbitrary collections of rules."},"vocabulary":[{"term":"packet switching","meaning":"패킷 교환","collocation":"implement packet switching","example":"The revised protocol gave network engineers a systematic way to implement packet switching.","synonym":"data sent as separate packets","nuance":"","group":"core"},{"term":"dedicated circuit","meaning":"전용 회선","collocation":"reserve a dedicated circuit","example":"To address a practical difficulty, network engineers chose to reserve a dedicated circuit under controlled conditions.","synonym":"reserved continuous connection","nuance":"","group":"core"},{"term":"network congestion","meaning":"네트워크 혼잡","collocation":"manage network congestion","example":"It proved especially important for network engineers to manage network congestion during the second assessment.","synonym":"overloaded network traffic","nuance":"","group":"core"},{"term":"packet loss","meaning":"패킷 손실","collocation":"detect packet loss","example":"In response to the reviewers, network engineers agreed to detect packet loss using an explicit procedure.","synonym":"missing data packet","nuance":"","group":"core"},{"term":"out-of-order arrival","meaning":"순서가 바뀐 도착","collocation":"handle out-of-order arrival","example":"A single unexpected result persuaded network engineers to  study.","synonym":"brief burst of transmission","nuance":"","group":"core"},{"term":"network standard","meaning":"네트워크 표준","collocation":"adopt a network standard","example":"Although the preliminary results seemed convincing, network engineers still needed to adopt a network standard.","synonym":"agreed network specification","nuance":"","group":"core"},{"term":"interoperability","meaning":"상호운용성","collocation":"ensure interoperability","example":"Because the evidence was incomplete, network engineers agreed to ensure interoperability again before deciding.","synonym":"ability of systems to cooperate","nuance":"","group":"core"},{"term":"error recovery","meaning":"오류 복구","collocation":"support error recovery","example":"The report identified an overlooked opportunity for network engineers to support error recovery.","synonym":"correction after a failed transmission","nuance":"","group":"core"},{"term":"distributed architecture","meaning":"분산 아키텍처","collocation":"design a distributed architecture","example":"After examining competing accounts, network engineers were prepared to design a distributed architecture.","synonym":"network with no single control point","nuance":"","group":"advanced"},{"term":"message fragmentation","meaning":"메시지 분할","collocation":"perform message fragmentation","example":"One limitation of the project was that network engineers could not yet perform message fragmentation reliably.","synonym":"division of a message into pieces","nuance":"","group":"advanced"},{"term":"data throughput","meaning":"데이터 처리량","collocation":"increase data throughput","example":"A later review prompted network engineers to increase data throughput, rather than accept the initial explanation.","synonym":"amount of data delivered","nuance":"","group":"advanced"},{"term":"network resilience","meaning":"네트워크 복원력","collocation":"improve network resilience","example":"Flexible routes can improve network resilience when one link becomes congested.","synonym":"ability to ity","nuance":"","group":"advanced"},{"term":"retransmission mechanism","meaning":"재전송 메커니즘","collocation":"implement a retransmission mechanism","example":"Students observed how network engineers attempted to implement a retransmission mechanism despite incomplete information.","synonym":"resending a missing packet","nuance":"","group":"advanced"},{"term":"header information","meaning":"헤더 정보","collocation":"inspect header information","example":"A meaningful comparison would require network engineers to inspect header information independently.","synonym":"information in a packet header","nuance":"","group":"advanced"},{"term":"routing flexibility","meaning":"경로설정 유연성","collocation":"improve routing flexibility","example":"A cautious interpretation allowed network engineers to improve routing flexibility while acknowledging uncertainty.","synonym":"choice among possible network paths","nuance":"","group":"advanced"},{"term":"technical standardization","meaning":"기술 표준화","collocation":"promote technical standardization","example":"Several independent observations led network engineers to promote technical standardization before publication.","synonym":"adoption of shared technical rules","nuance":"","group":"advanced"}],"meta":{"sourceType":"original practice content","etsOfficial":false,"benchmark":"TOEFL iBT January 2026 task-type descriptions / ETS sample 1","studyMinutes":120,"revision":"2026-11-23-diversity-v3","discipline":"History of Technology / Computer Networks","genre":"historical"}};</script>
