<script>window.TOEFL_LESSON={"day":4,"week":1,"theme":"Price Anchors and Consumer Choice","focus":"Type awareness and diagnostics","claim":"The reference price shown first can change perceived value without changing the underlying product.","evidence":"Participants exposed to a higher reference price reported a higher average willingness to pay for identical headphones.","caveat":"Familiarity, implausibly large anchors, and additional costs can limit the effect.","response":"Compare total costs and independent product information rather than relying on crossed-out prices.","storageKey":"toefl110day4-diversity-v3","notice":"CAMPUS TECHNOLOGY SHOP — RETURN POLICY\n\nHeadphones and accessories bought during the autumn promotion may be returned within 14 days with proof of purchase. Opened headphones are eligible for exchange only if a manufacturing defect is confirmed by staff. Promotional prices shown beside crossed-out list prices do not include optional extended warranties.\n\nFor purchases made online, return requests must be registered through the shop portal before the 14-day period expires. Please do not send products to the campus mailroom without an approved return label.","academicPassage":"In a conventional model of consumer choice, shoppers compare prices with the value they expect to receive. Real decisions also depend on the order in which information appears. A restaurant, for example, may list an expensive dish near moderately priced items. The expensive option can make the others appear relatively affordable even when nothing about their quality has changed.\n\nPsychologists call this an anchoring effect: an initial number influences later judgments. In one experiment, participants evaluated the same headphones after viewing either a high or low reference price. Those shown the higher number were willing to pay more on average. The result does not imply that everyone was deceived; some participants recognized the irrelevant reference and adjusted their judgments.\n\nThe evidence also does not establish that a higher listed price always increases sales. People can interpret an implausibly high price as manipulation, and product familiarity may reduce the influence of an arbitrary anchor. Furthermore, a purchasing decision includes shipping fees, warranty terms, and financial constraints that a laboratory task may not capture.\n\nThe practical lesson is that the format of a choice can alter perceived value. An informed consumer should compare total costs and product features against independent benchmarks, rather than accepting a displayed reference price as an objective measure of quality. Regulators considering price transparency face a related challenge: disclosure is most useful when the information is interpretable.","readingClozePassage":"A student compared headphones advertised by two competing retailers. The first price tag displayed a dramatic disc____ beside a_ unusually hi__ reference pri__. The sec___ store offe___ a smal___ discount, bu_ the warr____ and deli____ fees were included. When the student calculated the final amount, the second purchase was less expensive. The difference did not prove that discounts were inherently misleading. It demonstrated the importance of understanding which costs a price comparison includes and whether the original reference is credible.","cloze":[{"partial":"disc____","answer":"discount","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"a_","answer":"an","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"hi__","answer":"high","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"pri__","answer":"price","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"sec___","answer":"second","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"offe___","answer":"offered","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"smal___","answer":"smaller","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"bu_","answer":"but","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"warr____","answer":"warranty","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"deli____","answer":"delivery","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"}],"questions":{"rd":[{"q":"Which item is excluded from the advertised promotional price?","options":["The protective packaging.","The basic headphone cable.","The required sales tax.","An optional extended warranty."],"answer":3,"why":"실생활 공지의 해당 조건을 찾아 확인하세요. An optional extended warranty."},{"q":"What should an online buyer do before returning an item?","options":["Ask a friend to deliver it to an instructor.","Wait until fourteen days after purchase to apply.","Register a return request through the shop portal.","Send the product directly to the campus mailroom."],"answer":2,"why":"공지의 별도 요건 또는 예외 조항에 명시된 행동은 Register a return request through the shop portal.입니다."},{"q":"A buyer has opened a headphone package. Under what condition can the item be exchanged?","options":["Whenever the buyer dislikes the color after using it.","If shop staff confirm a manufacturing defect.","If the customer has paid for a warranty without examining the item.","Whenever the online return form is submitted after the deadline."],"answer":1,"why":"공지의 예외 조항과 구체적인 적용 범위를 비교해야 합니다. 정답 근거: If shop staff confirm a manufacturing defect."}],"ra":[{"q":"Which interpretation best reflects the author’s position in the debate in the passage on Price Anchors and Consumer Choice?","options":["The reference price shown first can change perceived value without changing the underlying product.","A displayed discount includes warranties and shipping automatically.","All consumers calculate value without being influenced by presentation.","A higher list price always produces higher sales."],"answer":0,"why":"중심 논지는 세부 사례에서 도출되는 가장 신중한 결론입니다. The reference price shown first can change perceived value without changing the underlying product."},{"q":"What specific observation in the price anchors and consumer choice case motivates the discussion?","options":["All consumers calculate value without being influenced by presentation.","A displayed discount includes warranties and shipping automatically.","A higher list price always produces higher sales.","Participants exposed to a higher reference price reported a higher average willingness to pay for identical headphones."],"answer":3,"why":"지문의 사례·대조 정보를 직접 확인해야 합니다. Participants exposed to a higher reference price reported a higher average willingness to pay for identical headphones."},{"q":"Which qualification prevents the evidence about consumer pricing from supporting an unconditional claim?","options":["A higher list price always produces higher sales.","A displayed discount includes warranties and shipping automatically.","Familiarity, implausibly large anchors, and additional costs can limit the effect.","All consumers calculate value without being influenced by presentation."],"answer":2,"why":"한계 조건은 곧바로 틀린 결론이라는 뜻이 아니라 적용 범위를 제한합니다. Familiarity, implausibly large anchors, and additional costs can limit the effect."},{"q":"What purpose does the author’s case study serve in evaluating consumer pricing?","options":["The example eliminates the need to compare evidence about consumer pricing with alternative explanations.","It illustrates a specific relationship involving consumer pricing while establishing the boundaries of the wider argument.","The example proves that the implications of consumer pricing hold in every possible location.","It lists the sequence of consumer pricing observations without contributing to the author’s main point."],"answer":1,"why":"사례는 범위가 제한된 관찰 또는 비교를 통해 주장을 구체화하고 무조건적 일반화를 피하도록 돕습니다."},{"q":"Which investigation or action would best extend the reasoning about price anchors and consumer choice?","options":["Compare total costs and independent product information rather than relying on crossed-out prices.","A displayed discount includes warranties and shipping automatically.","A higher list price always produces higher sales.","All consumers calculate value without being influenced by presentation."],"answer":0,"why":"추가 검증은 근거의 결함을 직접 보완하거나 대안 설명을 시험해야 합니다. Compare total costs and independent product information rather than relying on crossed-out prices."}],"rp":[{"q":"In the price anchors and consumer choice passage, what does “arbitrary” most nearly mean in context?","options":["widely accepted","precisely measured","legally binding","not inherently justified"],"answer":3,"why":"단어의 문맥상 의미를 판단해야 하며 직역만으로 결정하지 않습니다. arbitrary ≈ not inherently justified"},{"q":"Two laptops show the same advertised discount but different final fees. How should a buyer compare them?","options":["Choose the product with the most prominent price tag.","Assume the advertised percentage includes every optional service.","Compare the total payable amounts and the relevant terms.","Rely on whichever crossed-out list price is higher."],"answer":2,"why":"새 상황에 지문 원리를 적용하는 고난도 추론 문항입니다. Compare the total payable amounts and the relevant terms."}],"lq":[{"q":"Which response best addresses the speaker’s question about consumer pricing?","options":["Yes, all accessories can be returned at any time.","No, the warranty is an optional additional charge.","The shop closes at six on Fridays.","The headphones are available in several colors."],"answer":1,"why":"화자는 전제를 확인하고 있으므로 직접적인 정정과 관련 조건 설명이 적절합니다."}],"lc":[{"q":"What brings the first speaker to the conversation concerning consumer pricing?","options":["why the amount charged for headphones exceeds the advertised price","An invitation to deliver a formal lecture explaining price anchors and consumer choice.","A request for the institution to change the academic field under discussion.","A plan to evaluate unrelated applicants for a different university program."],"answer":0,"why":"대화의 도입부에서 상대가 확인하려는 문제를 파악합니다. why the amount charged for headphones exceeds the advertised price"},{"q":"What does the second speaker clarify about the issue raised in the price anchors and consumer choice dialogue?","options":["All consumers calculate value without being influenced by presentation.","A displayed discount includes warranties and shipping automatically.","A higher list price always produces higher sales.","an optional warranty was charged separately"],"answer":3,"why":"Not necessarily, No, Exactly와 같은 정정 이후의 내용을 확인합니다. an optional warranty was charged separately"},{"q":"What will the first speaker most likely do after the discussion about consumer pricing?","options":["Disregard the advice and continue on the original assumption.","Withdraw permanently from all activities discussed.","review the receipt and request cancellation of the optional warranty","Replace the entire project with an unrelated topic without consulting anyone."],"answer":2,"why":"마지막 발화에서 다음 행동을 추론합니다. review the receipt and request cancellation of the optional warranty"}],"la":[{"q":"What practical change or instruction is listeners expected to notice in the announcement about consumer pricing?","options":["The basic headphone cable.","An optional extended warranty.","The required sales tax.","The protective packaging."],"answer":1,"why":"공지의 장소·시간·적용 조건을 듣고 핵심 변경사항을 선택합니다. An optional extended warranty."},{"q":"Which additional requirement applies to listeners in the price anchors and consumer choice announcement?","options":["Register a return request through the shop portal.","Ask a friend to deliver it to an instructor.","Send the product directly to the campus mailroom.","Wait until fourteen days after purchase to apply."],"answer":0,"why":"보편적인 안내와 특정 조건에 해당하는 행동을 구별해야 합니다. Register a return request through the shop portal."}],"lt":[{"q":"Which statement best summarizes the lecturer’s explanation of price anchors and consumer choice?","options":["All consumers calculate value without being influenced by presentation.","A displayed discount includes warranties and shipping automatically.","A higher list price always produces higher sales.","The reference price shown first can change perceived value without changing the underlying product."],"answer":3,"why":"강의 중심 개념과 화자의 제한된 결론을 종합합니다. The reference price shown first can change perceived value without changing the underlying product."},{"q":"What role does the lecturer’s example of consumer pricing play in the explanation?","options":["A displayed discount includes warranties and shipping automatically.","A higher list price always produces higher sales.","Participants exposed to a higher reference price reported a higher average willingness to pay for identical headphones.","All consumers calculate value without being influenced by presentation."],"answer":2,"why":"강의 사례는 개념을 구체화하는 관측 자료 또는 비교입니다. Participants exposed to a higher reference price reported a higher average willingness to pay for identical headphones."},{"q":"What caution does the lecturer introduce after describing evidence related to consumer pricing?","options":["A higher list price always produces higher sales.","Familiarity, implausibly large anchors, and additional costs can limit the effect.","A displayed discount includes warranties and shipping automatically.","All consumers calculate value without being influenced by presentation."],"answer":1,"why":"화자가 However, but 등으로 도입하는 예외를 듣는 것이 핵심입니다. Familiarity, implausibly large anchors, and additional costs can limit the effect."},{"q":"How would the lecturer most likely advise someone evaluating consumer pricing in a new setting?","options":["Compare total costs and independent product information rather than relying on crossed-out prices.","All consumers calculate value without being influenced by presentation.","A displayed discount includes warranties and shipping automatically.","A higher list price always produces higher sales."],"answer":0,"why":"강의의 마무리에서 제안하는 연구·실행 원칙을 응용합니다. Compare total costs and independent product information rather than relying on crossed-out prices."}]},"audio":{"lq":"Is the extended warranty included in the price on the discount label?","lc":"Customer: I bought these headphones after seeing the fifty-percent-off sign, but the total charged seems higher than I expected.\nClerk: The discount applies to the headphones, but the extended warranty was added separately. Did you select that option at checkout?\nCustomer: I might have. I thought it was included in the advertised price.\nClerk: It isn't. I can show you the receipt and help you cancel the optional warranty if you're within the cancellation period.\nCustomer: What about returning the headphones? I already opened the package.\nClerk: We can exchange an opened pair if there's a confirmed defect. Otherwise, the return policy is different.\nCustomer: Then let me review the warranty first. The comparison with the original price wasn't very clear to me.","la":"This is a reminder from the campus technology shop. Prices displayed during the autumn promotion exclude optional extended warranties. Before completing a purchase, check the final total in your cart. Unopened items may generally be returned within fourteen days with proof of purchase, while opened headphones are accepted for exchange only after staff confirm a manufacturing defect. Online buyers must request a return label through the shop portal.","lt":"Why does a fifty-dollar product sometimes feel inexpensive immediately after we see a two-hundred-dollar product? The second product has not changed. What changed is the reference point used to evaluate it.\n\nThis is a classic anchoring effect. In price experiments, participants who encounter a high starting number sometimes report higher willingness to pay for an identical item. However, don't treat this as a universal law. A customer familiar with the product's ordinary price may ignore an unrealistic reference, and other costs can outweigh the initial impression.\n\nConsider a pair of headphones advertised with a crossed-out list price. If the discount excludes an optional warranty and shipping, the percentage alone does not reveal the final cost. A careful comparison begins with the total price and relevant product features, not the most prominent number on the label.\n\nWhen studying consumer behavior, we must separate a psychological influence on judgment from the actual value or usefulness of the product."},"speaking":{"repeat":["Welcome to the workshop on consumer pricing.","Headphones and accessories bought during the autumn promotion may be returned within 14 days with proof of purchase.","The instructor asked us to compare the evidence about consumer pricing before drawing conclusions.","Participants exposed to a higher reference price reported a higher average willingness to pay for identical headphones.","Familiarity, implausibly large anchors, and additional costs can limit the effect.","Compare total costs and independent product information rather than relying on crossed-out prices.","Although it might initially seem that all consumers calculate value without being influenced by presentation, the evidence instead suggests that the reference price shown first can change perceived value without changing the underlying product."],"interviews":["What first interested you in behavioral economics, and how would you explain that interest to a friend?","Tell me about a time when a practical decision involving consumer pricing was more complicated than you expected.","Do you think universities should give more attention to consumer pricing in introductory courses? Explain your reasoning.","Imagine a classmate disagrees with your interpretation of consumer pricing. How would you respond respectfully and precisely?"],"sample":"A purchasing decision I reconsidered involved a laptop advertised with a large discount. Initially, I focused on the crossed-out price and assumed I was getting exceptional value. Then I noticed that the warranty and accessories were charged separately, while a competing model included them. I compared the total cost and the features I actually needed, and the second option turned out to be more suitable. The lesson for me was that a reference price can shape my first impression without telling me much about the final value. I now check what is included before trusting a percentage discount."},"writing":{"build":[{"fragments":"session has been rescheduled / Could you tell me / whether the consumer pricing","answer":"Could you tell me whether the consumer pricing session has been rescheduled?","why":"간접 의문문 어순의 문장 구조와 주어-동사 관계를 확인하세요."},{"fragments":"The student who reviewed / the anchoring effect records / noticed an important discrepancy","answer":"The student who reviewed the anchoring effect records noticed an important discrepancy.","why":"관계절로 설명 추가의 문장 구조와 주어-동사 관계를 확인하세요."},{"fragments":"earlier, it might have reached / a different conclusion / If the team had checked / the willingness to pay evidence","answer":"If the team had checked the willingness to pay evidence earlier, it might have reached a different conclusion.","why":"조건절로 가능성 제시의 문장 구조와 주어-동사 관계를 확인하세요."},{"fragments":"to consumer pricing had been / examined did the committee approve / Only after the records related / the report","answer":"Only after the records related to consumer pricing had been examined did the committee approve the report.","why":"Only after 도치의 문장 구조와 주어-동사 관계를 확인하세요."},{"fragments":"of its limitations / requires not only reliable evidence / but also a clear account / A project involving consumer pricing","answer":"A project involving consumer pricing requires not only reliable evidence but also a clear account of its limitations.","why":"Not only A but also B 병렬의 문장 구조와 주어-동사 관계를 확인하세요."}],"emailTask":"You bought headphones from the university technology shop after seeing a promotional price, but an optional warranty was added unexpectedly. Write customer service to describe the discrepancy, ask to remove the warranty, and request an itemized refund confirmation.","emailSample":"Dear Customer Support,\n\nI purchased headphones through the campus shop during the autumn promotion. The amount charged at checkout was higher than the advertised headphone price, and I later noticed that an extended warranty had been added separately. I had understood the warranty to be optional and did not intend to purchase it.\n\nWould you please review my order and advise whether the warranty charge can be removed within the cancellation period? I would also appreciate an itemized confirmation showing the original price, discount and any refund. I can provide the receipt immediately if needed.\n\nThank you for looking into this discrepancy.\n\nKind regards,\nAlex","discussionTask":"Professor: Should retailers be required to display the total price including optional charges before showing a percentage discount?\n\nStudent A — Emily: Yes. Clear totals help consumers compare offers without relying on misleading reference prices.\n\nStudent B — Daniel: A detailed mandatory display could overwhelm customers who simply want to see the basic product price.","discussionSample":"I favor requiring retailers to display the expected total before emphasizing a percentage discount. A crossed-out list price can influence a customer’s perception of value even though it does not change the product itself. If a promoted headphone price excludes a warranty or mandatory fee, a large discount may not help the buyer compare alternatives. Of course, the interface should not bury the basic price under an overwhelming list of optional services. A practical compromise is to show the product cost prominently, clearly identify optional charges, and update the final total as choices are made. Such transparency supports consumer autonomy rather than attempting to eliminate every psychological influence on shopping decisions. The goal should be a comparison that is both understandable and accurate."},"vocabulary":[{"term":"reference price","meaning":"기준 가격","collocation":"display a reference price","example":"A request from the university encouraged consumer researchers to display a reference price more transparently.","synonym":"comparison price","nuance":"","group":"core"},{"term":"anchoring effect","meaning":"기준점 효과","collocation":"test an anchoring effect","example":"Rather than generalizing from one case, consumer researchers sought to test an anchoring effect in several settings.","synonym":"reference-based judgment bias","nuance":"","group":"core"},{"term":"willingness to pay","meaning":"지불 의사","collocation":"estimate willingness to pay","example":"The investigation would be less credible if consumer researchers neglected to estimate willingness to pay.","synonym":"maximum acceptable payment","nuance":"","group":"core"},{"term":"perceived value","meaning":"지각된 가치","collocation":"alter perceived value","example":"The procedures were revised so that consumer researchers could alter perceived value consistently.","synonym":"subjective worth","nuance":"","group":"core"},{"term":"promotional discount","meaning":"판촉 할인","collocation":"advertise a promotional discount","example":"Before finalizing the interpretation, consumer researchers decided to advertise a promotional discount.","synonym":"temporary price reduction","nuance":"","group":"core"},{"term":"itemized receipt","meaning":"항목별 영수증","collocation":"request an itemized receipt","example":"The students challenged consumer researchers to request an itemized receipt without overlooking contrary evidence.","synonym":"receipt with separate charges","nuance":"","group":"core"},{"term":"optional warranty","meaning":"선택형 보증","collocation":"decline an optional warranty","example":"The instructor proposed that consumer researchers should first decline an optional warranty and then compare outcomes.","synonym":"nonmandatory protection plan","nuance":"","group":"core"},{"term":"total cost","meaning":"총비용","collocation":"compare total costs","example":"When the initial explanation failed, consumer researchers returned to the data to compare total costs.","synonym":"all-in price","nuance":"","group":"core"},{"term":"reference point","meaning":"판단 기준점","collocation":"adjust a reference point","example":"The group discovered that it was possible to adjust a reference point without assuming a single cause.","synonym":"comparison standard","nuance":"","group":"core"},{"term":"consumer familiarity","meaning":"소비자 친숙도","collocation":"measure consumer familiarity","example":"A second research team challenged consumer researchers to measure consumer familiarity with different assumptions.","synonym":"buyer prior knowledge","nuance":"","group":"core"},{"term":"choice presentation","meaning":"선택지 제시 방식","collocation":"vary choice presentation","example":"The revised protocol gave consumer researchers a systematic way to vary choice presentation.","synonym":"format of choices","nuance":"","group":"core"},{"term":"listed price","meaning":"표시 가격","collocation":"verify a listed price","example":"To address a practical difficulty, consumer researchers chose to verify a listed price under controlled conditions.","synonym":"advertised amount","nuance":"","group":"core"},{"term":"return window","meaning":"반품 기한","collocation":"meet the return window","example":"It proved especially important for consumer researchers to meet the return window during the second assessment.","synonym":"time allowed for returns","nuance":"","group":"core"},{"term":"price transparency","meaning":"가격 투명성","collocation":"improve price transparency","example":"In response to the reviewers, consumer researchers agreed to improve price transparency using an explicit procedure.","synonym":"openness about charges","nuance":"","group":"core"},{"term":"purchase incentive","meaning":"구매 유인","collocation":"assess a purchase incentive","example":"A single unexpected result persuaded consumer researchers to assess a purchase incentive more carefully.","synonym":"reason to buy","nuance":"","group":"core"},{"term":"cognitive shortcut","meaning":"인지적 지름길","collocation":"rely on a cognitive shortcut","example":"When the instruments returned inconsistent readings, consumer researchers attempted to rely on a cognitive shortcut.","synonym":"mental rule of thumb","nuance":"","group":"advanced"},{"term":"price salience","meaning":"가격의 현저성","collocation":"increase price salience","example":"The supervising committee asked consumer researchers to increase price salience and explain the criteria.","synonym":"noticeability of a price","nuance":"","group":"advanced"},{"term":"reference dependence","meaning":"준거점 의존성","collocation":"illustrate reference dependence","example":"Only after a careful review could consumer researchers begin to illustrate reference dependence.","synonym":"reliance on a reference","nuance":"","group":"advanced"},{"term":"consumer inference","meaning":"소비자 추론","collocation":"test consumer inference","example":"Under the new conditions, consumer researchers were asked to test consumer inference at an earlier stage.","synonym":"buyer interpretation","nuance":"","group":"advanced"},{"term":"implausible anchor","meaning":"비현실적 기준점","collocation":"reject an implausible anchor","example":"The long-term monitoring plan required consumer researchers to reject an implausible anchor at regular intervals.","synonym":"unrealistic comparison price","nuance":"","group":"advanced"},{"term":"transaction cost","meaning":"거래 비용","collocation":"include transaction costs","example":"At the discussion session, consumer researchers explained their decision to include transaction costs.","synonym":"cost of making a transaction","nuance":"","group":"advanced"},{"term":"framing manipulation","meaning":"프레이밍 조작","collocation":"detect framing manipulation","example":"The available resources enabled consumer researchers to detect framing manipulation during the pilot study.","synonym":"manipulative presentation","nuance":"","group":"advanced"},{"term":"subjective valuation","meaning":"주관적 가치평가","collocation":"measure subjective valuation","example":"Although the preliminary results seemed convincing, consumer researchers still needed to measure subjective valuation.","synonym":"personal assessment of worth","nuance":"","group":"advanced"},{"term":"comparison benchmark","meaning":"비교 기준","collocation":"establish a comparison benchmark","example":"Because the evidence was incomplete, consumer researchers agreed to establish a comparison benchmark again before deciding.","synonym":"basis for price comparison","nuance":"","group":"advanced"},{"term":"purchase deliberation","meaning":"구매 숙고","collocation":"support purchase deliberation","example":"The report identified an overlooked opportunity for consumer researchers to support purchase deliberation.","synonym":"consideration before purchase","nuance":"","group":"advanced"},{"term":"judgment distortion","meaning":"판단의 왜곡","collocation":"reduce judgment distortion","example":"After examining competing accounts, consumer researchers were prepared to reduce judgment distortion.","synonym":"biased evaluation","nuance":"","group":"advanced"},{"term":"bounded rationality","meaning":"제한된 합리성","collocation":"account for bounded rationality","example":"One limitation of the project was that consumer researchers could not yet account for bounded rationality reliably.","synonym":"limited rational decision-making","nuance":"","group":"advanced"},{"term":"behavioral response","meaning":"행동 반응","collocation":"observe a behavioral response","example":"Researchers observe a behavioral response when shoppers change their choices after viewing a different reference price.","synonym":"reaction in buying behavior","nuance":"","group":"advanced"},{"term":"pricing disclosure","meaning":"가격 정보 공개","collocation":"improve pricing disclosure","example":"Over a semester of fieldwork, consumer researchers learned how to improve pricing disclosure.","synonym":"clarification of price terms","nuance":"","group":"advanced"},{"term":"unwarranted inference","meaning":"근거 없는 추론","collocation":"avoid unwarranted inference","example":"In their final presentation, consumer researchers described what it meant to avoid unwarranted inference.","synonym":"unsupported conclusion","nuance":"","group":"advanced"}],"meta":{"sourceType":"original practice content","etsOfficial":false,"benchmark":"TOEFL iBT January 2026 task-type descriptions / ETS sample 1","studyMinutes":120,"revision":"2026-11-23-diversity-v3","discipline":"Behavioral Economics","genre":"argument"}};</script>
