<script>window.TOEFL_LESSON={"day":10,"week":2,"theme":"Climate Migration and Adaptation","focus":"Reading: qualification and inference","claim":"Researchers interviewed drought-exposed farm households in adjacent districts with similar weather patterns.","evidence":"Families with greater savings were more likely to relocate, while households with fewer resources often remained.","caveat":"A low migration rate can reflect constrained mobility rather than successful adaptation.","response":"The survey team added questions about land tenure, travel costs and community support.","storageKey":"toefl110day10-quality-v2","notice":"EMAIL FROM THE COURSE OFFICE — Community Fieldwork Grant\n\nDear participants,\n\nWe are updating the arrangements for the climate migration and adaptation activity next Monday. An issue has been identified: a questionnaire asks whether families moved but not why they stayed. Please note the following requirement: the grant requires questions on both relocation and barriers to moving. The practical next step is clear: the researcher should revise the survey to include financial constraints. Please send any questions or corrected documents by Monday at noon. Participants who cannot meet the condition should contact the course office rather than assuming that an existing registration resolves the issue.\n\nKind regards,\nStudent Research Services","academicPassage":"Climate Migration and Adaptation\n\nResearchers interviewed drought-exposed farm households in adjacent districts with similar weather patterns. In this fictional university case, the investigators were not simply looking for a statistically detectable difference. They needed to decide what the evidence could justify, for whom the result might be relevant, and which assumptions would have to remain valid. That distinction is important because a pattern that seems clear in one set of observations may change when the procedure or comparison group changes.\n\nThe initial comparison was informative. Families with greater savings were more likely to relocate, while households with fewer resources often remained. This was a useful result, but it raised a further question: was the observed pattern produced by the factor of interest, or could some aspect of the method have influenced it? One particularly revealing detail was differences in household savings. Its significance lay not in providing an immediate answer but in showing which part of the research design needed closer attention.\n\nThe main methodological difficulty was the following: A low migration rate can reflect constrained mobility rather than successful adaptation. This qualification does not render the original observation irrelevant. Rather, it changes the degree of confidence that readers should place in a broad interpretation. An analyst who reports only the encouraging result risks confusing a possible explanation with an established mechanism. By contrast, an analyst who discloses the limitation enables readers to assess the evidence on its own terms.\n\nThe proposed next step addressed that problem directly. The survey team added questions about land tenure, travel costs and community support. Further investigation would be especially valuable if it could distinguish the favored interpretation from a plausible competing account. Consequently, the most defensible conclusion is neither unconditional acceptance nor automatic rejection. It is a claim whose strength is proportional to the quality and scope of the evidence.","readingClozePassage":"Researchers studying climate migration and adaptation initially proposed a straightforward interpretation. Researchers interviewed drought-exposed farm households in adjacent districts with similar weather patterns. They then compared their observations with additional evidence. Families with greater savings were more likely to relocate, whi__ households wi__ fewer resou____ often rema____. The prelim_____ results we__ informative, bu_ a careful anal___ still nee___ to identify altern_____ accounts, document the relevant assumptions, and consider whether the observed pattern would remain stable under different conditions. The survey team added questions about land tenure, travel costs and community support. A balanced report should distinguish the available evidence from conclusions that extend beyond it.","cloze":[{"partial":"whi__","answer":"while","meaning":"문맥과 문법에 따른 철자 복원"},{"partial":"wi__","answer":"with","meaning":"문맥과 문법에 따른 철자 복원"},{"partial":"resou____","answer":"resources","meaning":"문맥과 문법에 따른 철자 복원"},{"partial":"rema____","answer":"remained","meaning":"문맥과 문법에 따른 철자 복원"},{"partial":"prelim_____","answer":"preliminary","meaning":"문맥과 문법에 따른 철자 복원"},{"partial":"we__","answer":"were","meaning":"문맥과 문법에 따른 철자 복원"},{"partial":"bu_","answer":"but","meaning":"문맥과 문법에 따른 철자 복원"},{"partial":"anal___","answer":"analyst","meaning":"문맥과 문법에 따른 철자 복원"},{"partial":"nee___","answer":"needed","meaning":"문맥과 문법에 따른 철자 복원"},{"partial":"altern_____","answer":"alternative","meaning":"문맥과 문법에 따른 철자 복원"}],"questions":{"rd":[{"q":"What is the main purpose of the message?","options":["To announce that all registrations have been canceled","To summarize the historical development of the field","To invite readers to submit unrelated research proposals","To clarify a problem, a requirement and an appropriate next step"],"answer":3,"why":"공지에는 문제·필수 조건·구체적인 후속 조치가 명시되어 있습니다."},{"q":"Which response would comply with the stated requirement?","options":["Ignore the issue because the registration already exists","Submit only the same incomplete document without any change","The researcher should revise the survey to include financial constraints.","Wait until after the deadline without notifying the office"],"answer":2,"why":"정답은 공지에 제시된 후속 조치의 바꿔 말하기입니다."},{"q":"What does the writer imply about the participant’s previous assumption?","options":["It has already been accepted as university policy.","It is incomplete and should not determine the next action.","It makes further verification unnecessary.","It requires every participant to withdraw immediately."],"answer":1,"why":"기존 오해를 바로잡기 위해 새로운 조건과 조치를 안내하고 있습니다."}],"ra":[{"q":"Which statement best captures the central idea of the passage?","options":["An observation is useful only when its interpretation accounts for relevant limitations and alternatives.","A positive initial outcome makes follow-up investigation unnecessary.","Methodological uncertainty prevents any responsible decision.","A result obtained in one setting automatically applies elsewhere."],"answer":0,"why":"지문은 관측과 확정적 인과 해석을 구분하고 주장 강도를 근거에 비례시키라고 설명합니다."},{"q":"What did the investigators observe in the fictional case?","options":["The survey team added questions about land tenure, travel costs and community support.","The researchers had no preliminary result to examine.","Every competing explanation was eliminated before the first comparison.","Families with greater savings were more likely to relocate, while households with fewer resources often remained."],"answer":3,"why":"두 번째 단락의 관찰 결과에 직접 근거한 선택지입니다. 제안된 후속 조치와 실제 관측을 구분하세요."},{"q":"Why does the author specifically mention differences in household savings?","options":["To prove that the entire study should be discarded.","To show that every alternative explanation has been disproved.","To identify a detail whose interpretation requires methodological scrutiny.","To suggest that a single technical detail is more important than all other evidence."],"answer":2,"why":"해당 세부사항은 연구 설계에서 추가 검토가 필요한 부분의 예시로 제시됩니다."},{"q":"Which limitation most directly weakens an unconditional conclusion?","options":["The topic attracted interest from several academic departments.","A low migration rate can reflect constrained mobility rather than successful adaptation.","The authors included a title and organized their paragraphs.","The case concerns a practical problem rather than a purely abstract theory."],"answer":1,"why":"세 번째 단락은 경쟁 설명을 고려해야 하는 구체적인 방법론적 한계를 밝힙니다."},{"q":"Which conclusion would the author most likely support?","options":["The results justify further inquiry, but their implications must remain appropriately qualified.","A result deserves confidence whenever it seems intuitively plausible.","Any unresolved question makes the findings wholly worthless.","The investigation should avoid discussing alternative interpretations."],"answer":0,"why":"마지막 단락은 전면적 수용과 전면적 거부를 모두 경계합니다."}],"rp":[{"q":"Which follow-up would most directly address the issue raised in the passage?","options":["Repeat the original conclusion more strongly without new evidence.","Remove the methodological qualification from the public summary.","Replace the observations with expert opinion alone.","The survey team added questions about land tenure, travel costs and community support."],"answer":3,"why":"후속 연구 제안은 한계가 드러난 부분을 직접 다룹니다."},{"q":"Which wording would be the most defensible for a summary?","options":["The initial observations definitively prove the mechanism in every context.","The remaining uncertainty means that the data contain no information.","The evidence is consistent with a promising interpretation, although competing explanations remain possible.","No reader needs to know which assumptions the researchers made."],"answer":2,"why":"가능성을 인정하되 인과·일반화의 범위를 신중하게 제한해야 합니다."}],"lq":[{"q":"Which response best fits the speaker’s intention?","options":["Yes, the earlier draft is final, so no further checks are needed.","Not quite. The grant requires questions on both relocation and barriers to moving, so we need to resolve that point before proceeding.","Not until the next semester; the office has stopped all current activities.","Yes, the initial application automatically overrides every later condition."],"answer":1,"why":"화자는 승인 여부를 재확인합니다. 단정적 동의가 아니라 남아 있는 조건을 완곡하게 알려야 합니다."}],"lc":[{"q":"Why does the student contact the coordinator?","options":["To resolve an outstanding requirement before the activity.","To withdraw permanently from the program.","To request an unrelated transcript of grades.","To replace the activity with an independent examination."],"answer":0,"why":"문의 목적은 미해결 조건과 필요한 후속 조치를 확인하는 데 있습니다."},{"q":"What was the student’s mistaken assumption?","options":["All applications had been canceled without notification.","The office had already completed every required check.","The activity was scheduled for the previous semester.","Staying in place always reflects preference."],"answer":3,"why":"학생은 이전 정보만으로 충분하다고 생각했고 담당자가 그 오해를 수정합니다."},{"q":"What will the student probably do next?","options":["Ask the class to disregard the announcement.","Submit unrelated paperwork without reading the revised rule.","The researcher should revise the survey to include financial constraints.","Wait until the deadline has passed before responding."],"answer":2,"why":"담당자는 구체적인 다음 조치를 제시했고 학생이 이를 실행하겠다고 말합니다."}],"la":[{"q":"What is the announcement mainly about?","options":["The cancellation of all campus activities.","A remaining procedural condition and how participants can address it.","A new application deadline for an unrelated program.","An invitation to an off-campus social event."],"answer":1,"why":"핵심은 기존 활동의 조건을 재안내하고 필요한 조치를 요청하는 것입니다."},{"q":"What are participants advised to do if they cannot meet the condition?","options":["Contact the coordinator to discuss an appropriate arrangement.","Assume previous registration overrides the rule.","Post personal records on a public social network.","Enter the restricted session without permission."],"answer":0,"why":"공지에 조건을 충족하지 못하면 담당자에게 문의하도록 명시되어 있습니다."}],"lt":[{"q":"What is the principal point of the lecture?","options":["An initial pattern is sufficient proof of its own cause.","All practical decisions should be postponed indefinitely.","A researcher should always choose the most complicated explanation.","Evidence should be interpreted in light of assumptions and competing explanations."],"answer":3,"why":"강의는 관측과 그 관측에 대한 설명을 분리하고, 근거에 맞는 주장만 제시하라고 강조합니다."},{"q":"Why does the professor contrast two groups reviewing the same figures?","options":["To show that the second group collected completely different data.","To argue that research committees should avoid independent review.","To illustrate why testing assumptions can change the strength of an interpretation.","To imply that more confident reviewers are necessarily more accurate."],"answer":2,"why":"동일한 자료라도 가정에 대한 태도 때문에 결론의 신뢰성이 달라질 수 있음을 설명합니다."},{"q":"How does the lecturer use the example of differences in household savings?","options":["As proof that the entire research program has failed.","As a concrete point at which additional scrutiny may be necessary.","As a detail that is explicitly irrelevant to the interpretation.","As an example of a result obtained through a randomized experiment in every case."],"answer":1,"why":"세부사항은 논증의 취약 지점을 구체적으로 보여주는 역할입니다."},{"q":"What would the lecturer most likely advise researchers to do?","options":["The survey team added questions about land tenure, travel costs and community support.","Remove uncertain information from the published summary.","Treat the initial explanation as the only possible interpretation.","Replace empirical observations with the most persuasive opinion."],"answer":0,"why":"끝부분에서 제시된 후속 연구가 직접적인 개선 방향입니다."}]},"audio":{"lq":"The project team doesn't need to change anything, does it?","lc":"Daniel: I was about to send out the final instructions, but I may have misunderstood the requirements.\nCoordinator: Thanks for checking. The current concern is that a questionnaire asks whether families moved but not why they stayed.\nDaniel: I see. I assumed that staying in place always reflects preference. So the existing materials aren't sufficient?\nCoordinator: Not quite. The grant requires questions on both relocation and barriers to moving. We can still work with the current booking, but that condition matters.\nDaniel: Do I have to submit a new application, or is there something more specific I should do?\nCoordinator: You don't need to start over. Please revise the survey to include financial constraints, and make sure the office receives the update by Monday at noon.\nDaniel: That helps. I'll explain the change to the team so no one relies on the earlier assumption.\nCoordinator: Great. Let me know if the requirement creates a practical problem; there may be an alternative arrangement.","la":"This is a notice from the community fieldwork grant team. Students preparing for the climate migration and adaptation activity should review the updated instructions in their campus accounts. An important issue remains: a questionnaire asks whether families moved but not why they stayed. The requirement has not been waived: the grant requires questions on both relocation and barriers to moving. To avoid delays, please revise the survey to include financial constraints before Monday at noon. If you cannot complete the required step, contact the coordinator instead of assuming your earlier registration will be accepted. Updates will be sent through the official student portal, not through personal social media accounts.","lt":"In today's lecture on climate migration and adaptation, consider a hypothetical research team facing a very practical decision. Researchers interviewed drought-exposed farm households in adjacent districts with similar weather patterns. At first, the investigation appeared straightforward, since the team had a concrete pattern to examine. Families with greater savings were more likely to relocate, while households with fewer resources often remained.\n\nNow, why isn't that the end of the story? A low migration rate can reflect constrained mobility rather than successful adaptation. That matters because the observation and its explanation are not interchangeable. A useful way to think about this is to imagine two groups of investigators reviewing the same figures. One group treats the first interpretation as settled; the other asks which assumption, if changed, would produce a different conclusion. The second approach may be slower, but it is much less likely to confuse a plausible account with a demonstrated one.\n\nThe team therefore proposed a specific follow-up: The survey team added questions about land tenure, travel costs and community support. Notice the function of differences in household savings: it identifies a particular point at which the argument needs closer examination. The lesson is not that researchers must postpone every decision until they know everything. Rather, they should describe the limits of their evidence and explain which further result would change their minds."},"speaking":{"repeat":["Our team will review the findings during the meeting.","The team examined differences in household savings before presenting its preliminary findings.","Although the early results seemed promising, the investigators had not eliminated every alternative explanation.","Researchers interviewed drought-exposed farm households in adjacent districts with similar weather patterns.","Families with greater savings were more likely to relocate, while households with fewer resources often remained.","A low migration rate can reflect constrained mobility rather than successful adaptation.","Had the researchers ignored the uncertainty surrounding differences in household savings, the final recommendation might have sounded more decisive than the available evidence could justify."],"interviews":["What course or research activity have you enjoyed most at university, and why?","Have you ever had to revise an assumption after learning about climate migration and adaptation or a related subject? Describe the experience.","Should university instructors give students more opportunities to question the conclusions of published research? Support your view with an example.","A group wants to implement a policy based on the evidence in this case. What safeguards would you recommend, and how would you address potential objections?"],"sample":"I think students should be encouraged to challenge a conclusion respectfully, even when the initial result appears convincing. The case of climate migration and adaptation illustrates why. Families with greater savings were more likely to relocate, while households with fewer resources often remained. However, a low migration rate can reflect constrained mobility rather than successful adaptation. If I were responsible for advising the group, I would ask the team to compare at least one competing explanation and identify what evidence might change its recommendation. That would not mean dismissing the existing research. Rather, it would help us communicate uncertainty clearly and make a decision that other people could evaluate. In my experience, that kind of transparency improves both the credibility of a project and cooperation among the people involved."},"writing":{"build":[{"answer":"Only after the committee reviewed the evidence did it recommend a limited pilot.","fragments":"committee reviewed the / recommend a limited pilot / Only after the / evidence did it","why":"Only after의 문두 배치에 따른 주절 도치"},{"answer":"Had the investigators ignored the competing explanation, their conclusion would have been less credible.","fragments":"their conclusion would / ignored the competing explanation, / have been less credible / Had the investigators","why":"If를 생략한 과거완료 가정법 도치"},{"answer":"The researcher whose proposal was selected explained the methodological limitations.","fragments":"selected explained / The researcher / the methodological limitations / whose proposal was","why":"whose를 사용한 소유관계 절"},{"answer":"What the panel wanted to establish was whether the outcome could be replicated.","fragments":"outcome could be replicated / wanted to establish / What the panel / was whether the","why":"What 주어절과 whether 보어절"},{"answer":"The more carefully the team documents its assumptions, the easier the findings become to evaluate.","fragments":"the team documents its / findings become to evaluate / The more carefully / assumptions, the easier the","why":"The more A, the more B 상관 비교급"}],"emailTask":"You are helping with a university activity on climate migration and adaptation. A problem has arisen: a questionnaire asks whether families moved but not why they stayed.\n\nWrite a polite email to the campus coordinator. In your message:\n• explain the situation and why it matters;\n• request a realistic remedy consistent with this rule: the grant requires questions on both relocation and barriers to moving;\n• ask for confirmation before the announced deadline.","emailSample":"Dear Course Administration Team,\n\nI am writing about our upcoming university activity on climate migration and adaptation. We have encountered a difficulty that could affect the preparation: a questionnaire asks whether families moved but not why they stayed. I understand that the procedure is intended to protect the quality and reliability of the activity, and I would like to resolve the issue before it affects other participants.\n\nAs I understand the current requirement, the grant requires questions on both relocation and barriers to moving. Would it be possible for our team to revise the survey to include financial constraints? If a different form or supporting record is needed, please let me know so that we can provide the correct information rather than repeating the original submission.\n\nCould you confirm the appropriate next step by Monday at noon? Thank you for your assistance and for helping us keep the arrangements clear for everyone involved.\n\nKind regards,\nDaniel Park","discussionTask":"Professor: We are considering how universities should respond to evidence about climate migration and adaptation. Should a university act on promising preliminary findings, or wait for stronger evidence before changing its practices?\n\nStudent A — Elena: I favor cautious early action. Families with greater savings were more likely to relocate, while households with fewer resources often remained. If an initiative can be monitored and reversed, refusing to try it may also have costs.\n\nStudent B — Marcus: I would insist on stronger evidence first. A low migration rate can reflect constrained mobility rather than successful adaptation. Otherwise, we might spend resources responding to a misleading pattern.","discussionSample":"I would take a position between Elena's willingness to act and Marcus's concern about premature conclusions. In the case of climate migration and adaptation, families with greater savings were more likely to relocate, while households with fewer resources often remained. This is a meaningful observation, and it would be unreasonable to ignore it entirely. Nevertheless, a low migration rate can reflect constrained mobility rather than successful adaptation. The critical distinction, in my view, is whether a decision can be monitored, evaluated and revised. I would therefore recommend a limited pilot that could test competing interpretations. A practical first step would follow this suggestion: The survey team added questions about land tenure, travel costs and community support. Participants should be told which benefits are expected, which uncertainties remain and what outcome would justify changing course. That approach responds to the promising evidence without treating a tentative interpretation as a settled fact."},"vocabulary":[{"term":"planned relocation","meaning":"계획 이주","collocation":"revise the planned relocation","example":"The research team reconsidered planned relocation after discussing a limitation of the first dataset.","synonym":"","nuance":"주제 핵심 표현 · Climate Migration and Adaptation","group":"core"},{"term":"displacement pressure","meaning":"이주 압력","collocation":"assess displacement pressure","example":"The concluding report explained how displacement pressure might influence the next stage of the inquiry.","synonym":"","nuance":"주제 핵심 표현 · Climate Migration and Adaptation","group":"core"},{"term":"adaptive capacity","meaning":"적응 역량","collocation":"measure adaptive capacity","example":"The seminar on climate migration and adaptation began by clarifying what adaptive capacity means in this particular setting.","synonym":"","nuance":"주제 핵심 표현 · Climate Migration and Adaptation","group":"core"},{"term":"livelihood security","meaning":"생계 안정","collocation":"examine livelihood security","example":"Reviewers asked for a detailed account of livelihood security before accepting the proposed interpretation.","synonym":"","nuance":"주제 핵심 표현 · Climate Migration and Adaptation","group":"core"},{"term":"migration corridor","meaning":"이주 경로","collocation":"examine migration corridor","example":"The field notes addressed migration corridor as a possible source of variation across sites.","synonym":"","nuance":"주제 핵심 표현 · Climate Migration and Adaptation","group":"core"},{"term":"remittance network","meaning":"송금 네트워크","collocation":"examine remittance network","example":"An explanation of remittance network was included because it affected the scope of the research claim.","synonym":"","nuance":"주제 핵심 표현 · Climate Migration and Adaptation","group":"core"},{"term":"local adaptation","meaning":"지역 적응","collocation":"examine local adaptation","example":"The revised procedure made local adaptation explicit rather than leaving it to individual judgment.","synonym":"","nuance":"주제 핵심 표현 · Climate Migration and Adaptation","group":"core"},{"term":"exposure gradient","meaning":"노출 구배","collocation":"examine exposure gradient","example":"Students compared the role of exposure gradient in the initial and follow-up investigations.","synonym":"","nuance":"주제 핵심 표현 · Climate Migration and Adaptation","group":"core"},{"term":"mobility constraint","meaning":"이동 제약","collocation":"assess mobility constraint","example":"The panel considered whether mobility constraint had been overlooked in the preliminary assessment.","synonym":"","nuance":"주제 핵심 표현 · Climate Migration and Adaptation","group":"core"},{"term":"host community","meaning":"수용 지역사회","collocation":"examine host community","example":"A new section on host community allowed independent readers to evaluate the evidence more carefully.","synonym":"","nuance":"주제 핵심 표현 · Climate Migration and Adaptation","group":"core"},{"term":"climate hazard","meaning":"기후 위험","collocation":"assess climate hazard","example":"The project could not proceed responsibly without an agreed definition of climate hazard.","synonym":"","nuance":"주제 핵심 표현 · Climate Migration and Adaptation","group":"core"},{"term":"settlement pattern","meaning":"정착 양상","collocation":"examine settlement pattern","example":"The investigators distinguished settlement pattern from the more direct outcome reported in the summary.","synonym":"","nuance":"주제 핵심 표현 · Climate Migration and Adaptation","group":"core"},{"term":"preceding","meaning":"앞선","collocation":"the preceding assumption","example":"The conclusion depended on the preceding assumption about sample comparability.","synonym":"previous","nuance":"이전에 나온 전제나 단계","group":"advanced"},{"term":"arbitrary","meaning":"자의적인","collocation":"an arbitrary threshold","example":"An arbitrary threshold can alter the reported result without a clear scientific rationale.","synonym":"unjustified","nuance":"근거 없는 임의 선택","group":"advanced"},{"term":"explicit","meaning":"명시적인","collocation":"an explicit assumption","example":"The report made an explicit assumption that would otherwise have gone unnoticed.","synonym":"stated clearly","nuance":"숨기지 않고 드러낸","group":"advanced"},{"term":"commensurate","meaning":"상응하는","collocation":"commensurate with the risk","example":"The level of review should be commensurate with the risk of harm.","synonym":"proportional","nuance":"상황의 크기에 걸맞음","group":"advanced"},{"term":"inconsistent","meaning":"일관되지 않은","collocation":"inconsistent findings","example":"Inconsistent findings called for a closer look at the analytical procedures.","synonym":"contradictory","nuance":"맥락에 따라 변동·불일치","group":"advanced"},{"term":"suboptimal","meaning":"최선이 아닌","collocation":"a suboptimal outcome","example":"An apparently efficient procedure produced a suboptimal outcome for several users.","synonym":"less than ideal","nuance":"최적 기준에 못 미침","group":"advanced"},{"term":"recalibrate","meaning":"재보정하다","collocation":"recalibrate the instrument","example":"The technician paused testing to recalibrate the instrument against a reference sample.","synonym":"adjust again","nuance":"기준에 맞춰 장비를 다시 조정","group":"advanced"},{"term":"nevertheless","meaning":"그럼에도 불구하고","collocation":"nevertheless remain uncertain","example":"The estimate improved; nevertheless, the underlying mechanism remained uncertain.","synonym":"even so","nuance":"앞선 사실을 인정하면서 반전","group":"advanced"},{"term":"on balance","meaning":"종합적으로 보면","collocation":"on balance the benefits","example":"On balance, the benefits appear to outweigh the costs, although further review is needed.","synonym":"overall","nuance":"근거를 종합하는 판단","group":"advanced"},{"term":"as a result","meaning":"그 결과","collocation":"as a result of the change","example":"The sensor was recalibrated and, as a result, the repeated measurements became more consistent.","synonym":"consequently","nuance":"앞선 원인에서 결과로 연결","group":"advanced"},{"term":"take into account","meaning":"고려하다","collocation":"take into account prior differences","example":"Researchers must take into account prior differences between participants.","synonym":"consider","nuance":"판단에 영향을 주는 정보를 반영","group":"advanced"},{"term":"be indicative of","meaning":"~의 징후이다","collocation":"be indicative of a broader problem","example":"The repeated errors may be indicative of a broader problem with calibration.","synonym":"suggest","nuance":"확정성보다 시사성을 강조","group":"advanced"},{"term":"be prone to","meaning":"~하기 쉽다","collocation":"be prone to error","example":"Manual data entry can be prone to error when teams work under time pressure.","synonym":"tend toward","nuance":"경향적 취약성","group":"advanced"},{"term":"inadvertently","meaning":"의도치 않게","collocation":"inadvertently exclude participants","example":"The new deadline could inadvertently exclude participants who lacked internet access.","synonym":"unintentionally","nuance":"악의 없이 발생한 결과","group":"advanced"},{"term":"explicitly","meaning":"명시적으로","collocation":"explicitly state an assumption","example":"Authors should explicitly state an assumption that could affect the interpretation.","synonym":"clearly","nuance":"오해 없게 전제를 표시","group":"advanced"},{"term":"salient","meaning":"두드러지는·핵심적인","collocation":"a salient distinction","example":"The most salient distinction was between short-term improvement and lasting change.","synonym":"prominent","nuance":"핵심적 관련성이 있는 두드러짐","group":"advanced"},{"term":"compelling","meaning":"설득력 있는","collocation":"compelling evidence","example":"The researchers found the converging observations compelling but not conclusive.","synonym":"persuasive","nuance":"강한 설득력과 확정성은 별개","group":"advanced"},{"term":"infer","meaning":"추론하다","collocation":"infer a cause","example":"Researchers cannot infer a cause from an association without examining competing explanations.","synonym":"deduce","nuance":"근거에서 논리적으로 도출","group":"advanced"}],"meta":{"sourceType":"original-fictional-content","etsOfficial":false,"benchmark":"ETS 2026 sample task format","studyMinutes":120}};</script>
