<script>window.TOEFL_LESSON={"day":17,"week":4,"theme":"Algorithmic Fairness and Accountability","focus":"Speaking: clarity and elaboration","claim":"A student-aid office evaluated an algorithm that recommended which applications needed additional verification.","evidence":"The model was similarly calibrated across groups, yet one group received more incorrect warning notices.","caveat":"Different fairness metrics may conflict, and historical data can encode unequal treatment.","response":"Auditors compared subgroup error rates and introduced a timely appeal procedure.","storageKey":"toefl110day17-quality-v2","notice":"STUDENT SERVICES ANNOUNCEMENT — Aid-Office Appeals\n\nDear participants,\n\nWe are updating the arrangements for the algorithmic fairness and accountability activity next Wednesday. An issue has been identified: a student received a warning even after submitting all paperwork. Please note the following requirement: a human must review contested automated notices within five working days. The practical next step is clear: the adviser should direct the student to the appeal channel. Please send any questions or corrected documents by Wednesday at 2 p.m.. Participants who cannot meet the condition should contact the course office rather than assuming that an existing registration resolves the issue.\n\nKind regards,\nStudent Research Services","academicPassage":"Algorithmic Fairness and Accountability\n\nA student-aid office evaluated an algorithm that recommended which applications needed additional verification. In this fictional university case, the investigators were not simply looking for a statistically detectable difference. They needed to decide what the evidence could justify, for whom the result might be relevant, and which assumptions would have to remain valid. That distinction is important because a pattern that seems clear in one set of observations may change when the procedure or comparison group changes.\n\nThe initial comparison was informative. The model was similarly calibrated across groups, yet one group received more incorrect warning notices. This was a useful result, but it raised a further question: was the observed pattern produced by the factor of interest, or could some aspect of the method have influenced it? One particularly revealing detail was calibration versus incorrect warnings. Its significance lay not in providing an immediate answer but in showing which part of the research design needed closer attention.\n\nThe main methodological difficulty was the following: Different fairness metrics may conflict, and historical data can encode unequal treatment. This qualification does not render the original observation irrelevant. Rather, it changes the degree of confidence that readers should place in a broad interpretation. An analyst who reports only the encouraging result risks confusing a possible explanation with an established mechanism. By contrast, an analyst who discloses the limitation enables readers to assess the evidence on its own terms.\n\nThe proposed next step addressed that problem directly. Auditors compared subgroup error rates and introduced a timely appeal procedure. Further investigation would be especially valuable if it could distinguish the favored interpretation from a plausible competing account. Consequently, the most defensible conclusion is neither unconditional acceptance nor automatic rejection. It is a claim whose strength is proportional to the quality and scope of the evidence.","readingClozePassage":"Researchers studying algorithmic fairness and accountability initially proposed a straightforward interpretation. A student-aid office evaluated an algorithm that recommended which applications needed additional verification. They then compared their observations with additional evidence. The model was similarly calibrated across gro___, yet on_ group rece____ more incor____ warning noti___. The prelim_____ results we__ informative, bu_ a careful anal___ still nee___ to identify alternative accounts, document the relevant assumptions, and consider whether the observed pattern would remain stable under different conditions. Auditors compared subgroup error rates and introduced a timely appeal procedure. A balanced report should distinguish the available evidence from conclusions that extend beyond it.","cloze":[{"partial":"gro___","answer":"groups","meaning":"문맥과 문법에 따른 철자 복원"},{"partial":"on_","answer":"one","meaning":"문맥과 문법에 따른 철자 복원"},{"partial":"rece____","answer":"received","meaning":"문맥과 문법에 따른 철자 복원"},{"partial":"incor____","answer":"incorrect","meaning":"문맥과 문법에 따른 철자 복원"},{"partial":"noti___","answer":"notices","meaning":"문맥과 문법에 따른 철자 복원"},{"partial":"prelim_____","answer":"preliminary","meaning":"문맥과 문법에 따른 철자 복원"},{"partial":"we__","answer":"were","meaning":"문맥과 문법에 따른 철자 복원"},{"partial":"bu_","answer":"but","meaning":"문맥과 문법에 따른 철자 복원"},{"partial":"anal___","answer":"analyst","meaning":"문맥과 문법에 따른 철자 복원"},{"partial":"nee___","answer":"needed","meaning":"문맥과 문법에 따른 철자 복원"}],"questions":{"rd":[{"q":"What is the main purpose of the message?","options":["To clarify a problem, a requirement and an appropriate next step","To announce that all registrations have been canceled","To summarize the historical development of the field","To invite readers to submit unrelated research proposals"],"answer":0,"why":"공지에는 문제·필수 조건·구체적인 후속 조치가 명시되어 있습니다."},{"q":"Which response would comply with the stated requirement?","options":["Ignore the issue because the registration already exists","Submit only the same incomplete document without any change","Wait until after the deadline without notifying the office","The adviser should direct the student to the appeal channel."],"answer":3,"why":"정답은 공지에 제시된 후속 조치의 바꿔 말하기입니다."},{"q":"What does the writer imply about the participant’s previous assumption?","options":["It has already been accepted as university policy.","It makes further verification unnecessary.","It is incomplete and should not determine the next action.","It requires every participant to withdraw immediately."],"answer":2,"why":"기존 오해를 바로잡기 위해 새로운 조건과 조치를 안내하고 있습니다."}],"ra":[{"q":"Which statement best captures the central idea of the passage?","options":["A positive initial outcome makes follow-up investigation unnecessary.","An observation is useful only when its interpretation accounts for relevant limitations and alternatives.","Methodological uncertainty prevents any responsible decision.","A result obtained in one setting automatically applies elsewhere."],"answer":1,"why":"지문은 관측과 확정적 인과 해석을 구분하고 주장 강도를 근거에 비례시키라고 설명합니다."},{"q":"What did the investigators observe in the fictional case?","options":["The model was similarly calibrated across groups, yet one group received more incorrect warning notices.","Auditors compared subgroup error rates and introduced a timely appeal procedure.","The researchers had no preliminary result to examine.","Every competing explanation was eliminated before the first comparison."],"answer":0,"why":"두 번째 단락의 관찰 결과에 직접 근거한 선택지입니다. 제안된 후속 조치와 실제 관측을 구분하세요."},{"q":"Why does the author specifically mention calibration versus incorrect warnings?","options":["To prove that the entire study should be discarded.","To show that every alternative explanation has been disproved.","To suggest that a single technical detail is more important than all other evidence.","To identify a detail whose interpretation requires methodological scrutiny."],"answer":3,"why":"해당 세부사항은 연구 설계에서 추가 검토가 필요한 부분의 예시로 제시됩니다."},{"q":"Which limitation most directly weakens an unconditional conclusion?","options":["The topic attracted interest from several academic departments.","The authors included a title and organized their paragraphs.","Different fairness metrics may conflict, and historical data can encode unequal treatment.","The case concerns a practical problem rather than a purely abstract theory."],"answer":2,"why":"세 번째 단락은 경쟁 설명을 고려해야 하는 구체적인 방법론적 한계를 밝힙니다."},{"q":"Which conclusion would the author most likely support?","options":["A result deserves confidence whenever it seems intuitively plausible.","The results justify further inquiry, but their implications must remain appropriately qualified.","Any unresolved question makes the findings wholly worthless.","The investigation should avoid discussing alternative interpretations."],"answer":1,"why":"마지막 단락은 전면적 수용과 전면적 거부를 모두 경계합니다."}],"rp":[{"q":"Which follow-up would most directly address the issue raised in the passage?","options":["Auditors compared subgroup error rates and introduced a timely appeal procedure.","Repeat the original conclusion more strongly without new evidence.","Remove the methodological qualification from the public summary.","Replace the observations with expert opinion alone."],"answer":0,"why":"후속 연구 제안은 한계가 드러난 부분을 직접 다룹니다."},{"q":"Which wording would be the most defensible for a summary?","options":["The initial observations definitively prove the mechanism in every context.","The remaining uncertainty means that the data contain no information.","No reader needs to know which assumptions the researchers made.","The evidence is consistent with a promising interpretation, although competing explanations remain possible."],"answer":3,"why":"가능성을 인정하되 인과·일반화의 범위를 신중하게 제한해야 합니다."}],"lq":[{"q":"Which response best fits the speaker’s intention?","options":["Yes, the earlier draft is final, so no further checks are needed.","Not until the next semester; the office has stopped all current activities.","Not quite. A human must review contested automated notices within five working days, so we need to resolve that point before proceeding.","Yes, the initial application automatically overrides every later condition."],"answer":2,"why":"화자는 승인 여부를 재확인합니다. 단정적 동의가 아니라 남아 있는 조건을 완곡하게 알려야 합니다."}],"lc":[{"q":"Why does the student contact the coordinator?","options":["To withdraw permanently from the program.","To resolve an outstanding requirement before the activity.","To request an unrelated transcript of grades.","To replace the activity with an independent examination."],"answer":1,"why":"문의 목적은 미해결 조건과 필요한 후속 조치를 확인하는 데 있습니다."},{"q":"What was the student’s mistaken assumption?","options":["An automated warning is a permanent denial.","All applications had been canceled without notification.","The office had already completed every required check.","The activity was scheduled for the previous semester."],"answer":0,"why":"학생은 이전 정보만으로 충분하다고 생각했고 담당자가 그 오해를 수정합니다."},{"q":"What will the student probably do next?","options":["Ask the class to disregard the announcement.","Submit unrelated paperwork without reading the revised rule.","Wait until the deadline has passed before responding.","The adviser should direct the student to the appeal channel."],"answer":3,"why":"담당자는 구체적인 다음 조치를 제시했고 학생이 이를 실행하겠다고 말합니다."}],"la":[{"q":"What is the announcement mainly about?","options":["The cancellation of all campus activities.","A new application deadline for an unrelated program.","A remaining procedural condition and how participants can address it.","An invitation to an off-campus social event."],"answer":2,"why":"핵심은 기존 활동의 조건을 재안내하고 필요한 조치를 요청하는 것입니다."},{"q":"What are participants advised to do if they cannot meet the condition?","options":["Assume previous registration overrides the rule.","Contact the coordinator to discuss an appropriate arrangement.","Post personal records on a public social network.","Enter the restricted session without permission."],"answer":1,"why":"공지에 조건을 충족하지 못하면 담당자에게 문의하도록 명시되어 있습니다."}],"lt":[{"q":"What is the principal point of the lecture?","options":["Evidence should be interpreted in light of assumptions and competing explanations.","An initial pattern is sufficient proof of its own cause.","All practical decisions should be postponed indefinitely.","A researcher should always choose the most complicated explanation."],"answer":0,"why":"강의는 관측과 그 관측에 대한 설명을 분리하고, 근거에 맞는 주장만 제시하라고 강조합니다."},{"q":"Why does the professor contrast two groups reviewing the same figures?","options":["To show that the second group collected completely different data.","To argue that research committees should avoid independent review.","To imply that more confident reviewers are necessarily more accurate.","To illustrate why testing assumptions can change the strength of an interpretation."],"answer":3,"why":"동일한 자료라도 가정에 대한 태도 때문에 결론의 신뢰성이 달라질 수 있음을 설명합니다."},{"q":"How does the lecturer use the example of calibration versus incorrect warnings?","options":["As proof that the entire research program has failed.","As a detail that is explicitly irrelevant to the interpretation.","As a concrete point at which additional scrutiny may be necessary.","As an example of a result obtained through a randomized experiment in every case."],"answer":2,"why":"세부사항은 논증의 취약 지점을 구체적으로 보여주는 역할입니다."},{"q":"What would the lecturer most likely advise researchers to do?","options":["Remove uncertain information from the published summary.","Auditors compared subgroup error rates and introduced a timely appeal procedure.","Treat the initial explanation as the only possible interpretation.","Replace empirical observations with the most persuasive opinion."],"answer":1,"why":"끝부분에서 제시된 후속 연구가 직접적인 개선 방향입니다."}]},"audio":{"lq":"Has the office confirmed everything for the algorithmic fairness and accountability activity?","lc":"Grace: Sorry to bother you, but I just read the message about the aid-office appeals. Is something still unresolved?\nCoordinator: Thanks for checking. The current concern is that a student received a warning even after submitting all paperwork.\nGrace: I see. I assumed that an automated warning is a permanent denial. So the existing materials aren't sufficient?\nCoordinator: Not quite. A human must review contested automated notices within five working days. We can still work with the current booking, but that condition matters.\nGrace: Do I have to submit a new application, or is there something more specific I should do?\nCoordinator: You don't need to start over. Please direct the student to the appeal channel, and make sure the office receives the update by Wednesday at 2 p.m..\nGrace: That helps. I'll explain the change to the team so no one relies on the earlier assumption.\nCoordinator: Great. Let me know if the requirement creates a practical problem; there may be an alternative arrangement.","la":"This is a notice from the aid-office appeals team. Students preparing for the algorithmic fairness and accountability activity should review the updated instructions in their campus accounts. An important issue remains: a student received a warning even after submitting all paperwork. The requirement has not been waived: a human must review contested automated notices within five working days. To avoid delays, please direct the student to the appeal channel before Wednesday at 2 p.m.. If you cannot complete the required step, contact the coordinator instead of assuming your earlier registration will be accepted. Updates will be sent through the official student portal, not through personal social media accounts.","lt":"In today's lecture on algorithmic fairness and accountability, consider a hypothetical research team facing a very practical decision. A student-aid office evaluated an algorithm that recommended which applications needed additional verification. At first, the investigation appeared straightforward, since the team had a concrete pattern to examine. The model was similarly calibrated across groups, yet one group received more incorrect warning notices.\n\nNow, why isn't that the end of the story? Different fairness metrics may conflict, and historical data can encode unequal treatment. That matters because the observation and its explanation are not interchangeable. A useful way to think about this is to imagine two groups of investigators reviewing the same figures. One group treats the first interpretation as settled; the other asks which assumption, if changed, would produce a different conclusion. The second approach may be slower, but it is much less likely to confuse a plausible account with a demonstrated one.\n\nThe team therefore proposed a specific follow-up: Auditors compared subgroup error rates and introduced a timely appeal procedure. Notice the function of calibration versus incorrect warnings: it identifies a particular point at which the argument needs closer examination. The lesson is not that researchers must postpone every decision until they know everything. Rather, they should describe the limits of their evidence and explain which further result would change their minds."},"speaking":{"repeat":["Please check the updated instructions before the seminar.","The team examined calibration versus incorrect warnings before presenting its preliminary findings.","Although the early results seemed promising, the investigators had not eliminated every alternative explanation.","A student-aid office evaluated an algorithm that recommended which applications needed additional verification.","The model was similarly calibrated across groups, yet one group received more incorrect warning notices.","Different fairness metrics may conflict, and historical data can encode unequal treatment.","Had the researchers ignored the uncertainty surrounding calibration versus incorrect warnings, the final recommendation might have sounded more decisive than the available evidence could justify."],"interviews":["What course or research activity have you enjoyed most at university, and why?","Have you ever had to revise an assumption after learning about algorithmic fairness and accountability or a related subject? Describe the experience.","Should university instructors give students more opportunities to question the conclusions of published research? Support your view with an example.","A group wants to implement a policy based on the evidence in this case. What safeguards would you recommend, and how would you address potential objections?"],"sample":"I think students should be encouraged to challenge a conclusion respectfully, even when the initial result appears convincing. The case of algorithmic fairness and accountability illustrates why. The model was similarly calibrated across groups, yet one group received more incorrect warning notices. However, different fairness metrics may conflict, and historical data can encode unequal treatment. If I were responsible for advising the group, I would ask the team to compare at least one competing explanation and identify what evidence might change its recommendation. That would not mean dismissing the existing research. Rather, it would help us communicate uncertainty clearly and make a decision that other people could evaluate. In my experience, that kind of transparency improves both the credibility of a project and cooperation among the people involved."},"writing":{"build":[{"answer":"Not until the revised results were available did the committee reconsider its original position.","fragments":"reconsider its original position / revised results were available / Not until the / did the committee","why":"Not until 문두에 따른 도치"},{"answer":"Although the sample was relatively small, its observations justified further investigation.","fragments":"sample was relatively / justified further investigation / Although the / small, its observations","why":"양보 절과 핵심 주장 사이의 적절한 관계"},{"answer":"The method that the team initially preferred proved difficult to apply consistently.","fragments":"preferred proved difficult / the team initially / to apply consistently / The method that","why":"관계대명사 that이 수식하는 명사구"},{"answer":"What distinguishes an inference from a fact is the reasoning used to support it.","fragments":"is the reasoning / What distinguishes an / used to support it / inference from a fact","why":"What절을 문장 주어로 사용하는 구조"},{"answer":"Only if independent evidence supports the claim should the conclusion be strengthened.","fragments":"conclusion be strengthened / evidence supports the / Only if independent / claim should the","why":"Only if가 문두에 나오는 조건 도치"}],"emailTask":"You are helping with a university activity on algorithmic fairness and accountability. A problem has arisen: a student received a warning even after submitting all paperwork.\n\nWrite a polite email to the campus coordinator. In your message:\n• explain the situation and why it matters;\n• request a realistic remedy consistent with this rule: a human must review contested automated notices within five working days;\n• ask for confirmation before the announced deadline.","emailSample":"Dear Research Coordinator,\n\nI am writing about our upcoming university activity on algorithmic fairness and accountability. We have encountered a difficulty that could affect the preparation: a student received a warning even after submitting all paperwork. I understand that the procedure is intended to protect the quality and reliability of the activity, and I would like to resolve the issue before it affects other participants.\n\nAs I understand the current requirement, a human must review contested automated notices within five working days. Would it be possible for our team to direct the student to the appeal channel? If a different form or supporting record is needed, please let me know so that we can provide the correct information rather than repeating the original submission.\n\nCould you confirm the appropriate next step by Wednesday at 2 p.m.? Thank you for your assistance and for helping us keep the arrangements clear for everyone involved.\n\nKind regards,\nGrace Park","discussionTask":"Professor: We are considering how universities should respond to evidence about algorithmic fairness and accountability. Should a university act on promising preliminary findings, or wait for stronger evidence before changing its practices?\n\nStudent A — Elena: I favor cautious early action. The model was similarly calibrated across groups, yet one group received more incorrect warning notices. If an initiative can be monitored and reversed, refusing to try it may also have costs.\n\nStudent B — Marcus: I would insist on stronger evidence first. Different fairness metrics may conflict, and historical data can encode unequal treatment. Otherwise, we might spend resources responding to a misleading pattern.","discussionSample":"I would take a position between Elena's willingness to act and Marcus's concern about premature conclusions. In the case of algorithmic fairness and accountability, the model was similarly calibrated across groups, yet one group received more incorrect warning notices. This is a meaningful observation, and it would be unreasonable to ignore it entirely. Nevertheless, different fairness metrics may conflict, and historical data can encode unequal treatment. The critical distinction, in my view, is whether a decision can be monitored, evaluated and revised. I would therefore recommend a limited pilot that could test competing interpretations. A practical first step would follow this suggestion: Auditors compared subgroup error rates and introduced a timely appeal procedure. Participants should be told which benefits are expected, which uncertainties remain and what outcome would justify changing course. That approach responds to the promising evidence without treating a tentative interpretation as a settled fact."},"vocabulary":[{"term":"group parity","meaning":"집단 간 동등성","collocation":"examine group parity","example":"Students compared the role of group parity in the initial and follow-up investigations.","synonym":"","nuance":"주제 핵심 표현 · Algorithmic Fairness and Accountability","group":"core"},{"term":"false positive","meaning":"거짓 양성","collocation":"examine false positive","example":"The panel considered whether false positive had been overlooked in the preliminary assessment.","synonym":"","nuance":"주제 핵심 표현 · Algorithmic Fairness and Accountability","group":"core"},{"term":"base rate","meaning":"기저율","collocation":"measure base rate","example":"A new section on base rate allowed independent readers to evaluate the evidence more carefully.","synonym":"","nuance":"주제 핵심 표현 · Algorithmic Fairness and Accountability","group":"core"},{"term":"disparate impact","meaning":"차별적 영향","collocation":"assess disparate impact","example":"The project could not proceed responsibly without an agreed definition of disparate impact.","synonym":"","nuance":"주제 핵심 표현 · Algorithmic Fairness and Accountability","group":"core"},{"term":"model audit","meaning":"모델 감사","collocation":"conduct model audit","example":"The investigators distinguished model audit from the more direct outcome reported in the summary.","synonym":"","nuance":"주제 핵심 표현 · Algorithmic Fairness and Accountability","group":"core"},{"term":"fairness constraint","meaning":"공정성 제약","collocation":"assess fairness constraint","example":"The research team reconsidered fairness constraint after discussing a limitation of the first dataset.","synonym":"","nuance":"주제 핵심 표현 · Algorithmic Fairness and Accountability","group":"core"},{"term":"representation gap","meaning":"대표성 격차","collocation":"examine representation gap","example":"The concluding report explained how representation gap might influence the next stage of the inquiry.","synonym":"","nuance":"주제 핵심 표현 · Algorithmic Fairness and Accountability","group":"core"},{"term":"impact assessment","meaning":"영향 평가","collocation":"assess impact assessment","example":"The seminar on algorithmic fairness and accountability began by clarifying what impact assessment means in this particular setting.","synonym":"","nuance":"주제 핵심 표현 · Algorithmic Fairness and Accountability","group":"core"},{"term":"recourse mechanism","meaning":"이의제기 절차","collocation":"examine recourse mechanism","example":"Reviewers asked for a detailed account of recourse mechanism before accepting the proposed interpretation.","synonym":"","nuance":"주제 핵심 표현 · Algorithmic Fairness and Accountability","group":"core"},{"term":"threshold setting","meaning":"임계값 설정","collocation":"measure threshold setting","example":"The field notes addressed threshold setting as a possible source of variation across sites.","synonym":"","nuance":"주제 핵심 표현 · Algorithmic Fairness and Accountability","group":"core"},{"term":"measurement bias","meaning":"측정 편향","collocation":"assess measurement bias","example":"An explanation of measurement bias was included because it affected the scope of the research claim.","synonym":"","nuance":"주제 핵심 표현 · Algorithmic Fairness and Accountability","group":"core"},{"term":"stakeholder consultation","meaning":"이해관계자 협의","collocation":"examine stakeholder consultation","example":"The revised procedure made stakeholder consultation explicit rather than leaving it to individual judgment.","synonym":"","nuance":"주제 핵심 표현 · Algorithmic Fairness and Accountability","group":"core"},{"term":"methodical","meaning":"체계적인","collocation":"a methodical review","example":"A methodical review made it easier to detect inconsistent records.","synonym":"systematic","nuance":"순서와 절차가 있는 검토","group":"advanced"},{"term":"inherent","meaning":"내재된","collocation":"an inherent limitation","example":"Every sampling approach has an inherent limitation that should be acknowledged.","synonym":"intrinsic","nuance":"대상 자체에서 발생함","group":"advanced"},{"term":"marginal","meaning":"한계적인·미미한","collocation":"marginal improvement","example":"The new method produced only a marginal improvement after additional controls.","synonym":"slight","nuance":"작지만 측정되는 차이","group":"advanced"},{"term":"preliminary","meaning":"예비적인","collocation":"preliminary evidence","example":"Preliminary evidence justified a pilot study but not immediate expansion.","synonym":"initial","nuance":"검증 전 초기 단계","group":"advanced"},{"term":"redundant","meaning":"중복된·불필요한","collocation":"redundant measurements","example":"The team removed redundant measurements only after confirming they served no validation purpose.","synonym":"unnecessary","nuance":"쓸모없는 중복이지만 맥락에 따라 예비성 의미도 있음","group":"advanced"},{"term":"empirically","meaning":"실증적으로","collocation":"empirically supported","example":"The proposal was plausible but not yet empirically supported by a controlled comparison.","synonym":"with evidence","nuance":"관측·실험 근거로","group":"advanced"},{"term":"albeit","meaning":"비록 ~이지만","collocation":"albeit modest","example":"The project produced benefits, albeit modest ones in the first year.","synonym":"although","nuance":"보통 명사구·형용사구 앞에서 유보","group":"advanced"},{"term":"in principle","meaning":"원칙적으로","collocation":"in principle the approach","example":"In principle, the approach is sound, but implementation requires adequate monitoring.","synonym":"theoretically","nuance":"원칙과 실제의 차이를 시사","group":"advanced"},{"term":"subject to","meaning":"~을 조건으로 하는","collocation":"subject to review","example":"The proposal was approved subject to an independent review of the safety data.","synonym":"conditional on","nuance":"정식 승인·검토 조건을 나타냄","group":"advanced"},{"term":"bear on","meaning":"~에 관련되다","collocation":"bear on the conclusion","example":"The revised data bear on the conclusion but do not settle the dispute.","synonym":"be relevant to","nuance":"핵심 논의에 영향을 미침","group":"advanced"},{"term":"be predicated on","meaning":"~을 전제로 하다","collocation":"be predicated on accurate records","example":"The decision may be predicated on accurate records that later proved incomplete.","synonym":"be based on","nuance":"기저 전제에 근거해 결정됨","group":"advanced"},{"term":"be compatible with","meaning":"~와 양립하다","collocation":"be compatible with the protocol","example":"The revised software must be compatible with the laboratory's existing protocol.","synonym":"work with","nuance":"두 제약의 동시 충족","group":"advanced"},{"term":"consistently","meaning":"일관되게","collocation":"consistently apply a rule","example":"The research team had to consistently apply a rule across all datasets.","sy
