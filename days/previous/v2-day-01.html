<script>window.TOEFL_LESSON={"day":1,"week":1,"theme":"Open Science and University Life","focus":"Academic inquiry and assessment","claim":"A university research repository piloted a policy requiring detailed metadata before student datasets could be shared.","evidence":"Students could find more studies through the portal, but several datasets were unusable because variable definitions were missing.","caveat":"A public download link by itself did not make the data reproducible or appropriate to share.","response":"The librarian proposed a metadata checklist and a controlled-access route for sensitive participant records.","storageKey":"toefl110day1-quality-v2","notice":"CAMPUS PORTAL NOTIFICATION — Library Data Desk\n\nDear participants,\n\nWe are updating the arrangements for the open science and university life activity next Tuesday. An issue has been identified: the course team submitted raw survey files without a codebook. Please note the following requirement: a codebook and clearance review are required before reuse. The practical next step is clear: the student should request a metadata template rather than uploading the same files again. Please send any questions or corrected documents by Tuesday at 4 p.m.. Participants who cannot meet the condition should contact the course office rather than assuming that an existing registration resolves the issue.\n\nKind regards,\nStudent Research Services","academicPassage":"Open Science and University Life\n\nA university research repository piloted a policy requiring detailed metadata before student datasets could be shared. In this fictional university case, the investigators were not simply looking for a statistically detectable difference. They needed to decide what the evidence could justify, for whom the result might be relevant, and which assumptions would have to remain valid. That distinction is important because a pattern that seems clear in one set of observations may change when the procedure or comparison group changes.\n\nThe initial comparison was informative. Students could find more studies through the portal, but several datasets were unusable because variable definitions were missing. This was a useful result, but it raised a further question: was the observed pattern produced by the factor of interest, or could some aspect of the method have influenced it? One particularly revealing detail was missing variable definitions. Its significance lay not in providing an immediate answer but in showing which part of the research design needed closer attention.\n\nThe main methodological difficulty was the following: A public download link by itself did not make the data reproducible or appropriate to share. This qualification does not render the original observation irrelevant. Rather, it changes the degree of confidence that readers should place in a broad interpretation. An analyst who reports only the encouraging result risks confusing a possible explanation with an established mechanism. By contrast, an analyst who discloses the limitation enables readers to assess the evidence on its own terms.\n\nThe proposed next step addressed that problem directly. The librarian proposed a metadata checklist and a controlled-access route for sensitive participant records. Further investigation would be especially valuable if it could distinguish the favored interpretation from a plausible competing account. Consequently, the most defensible conclusion is neither unconditional acceptance nor automatic rejection. It is a claim whose strength is proportional to the quality and scope of the evidence.","readingClozePassage":"Researchers studying open science and university life initially proposed a straightforward interpretation. A university research repository piloted a policy requiring detailed metadata before student datasets could be shared. They then compared their observations with additional evidence. Students could find more studies through the portal, bu_ several data____ were unus____ because vari____ definitions we__ missing. Th_ preliminary resu___ were inform_____, but a care___ analyst sti__ needed to identify alternative accounts, document the relevant assumptions, and consider whether the observed pattern would remain stable under different conditions. The librarian proposed a metadata checklist and a controlled-access route for sensitive participant records. A balanced report should distinguish the available evidence from conclusions that extend beyond it.","cloze":[{"partial":"bu_","answer":"but","meaning":"문맥과 문법에 따른 철자 복원"},{"partial":"data____","answer":"datasets","meaning":"문맥과 문법에 따른 철자 복원"},{"partial":"unus____","answer":"unusable","meaning":"문맥과 문법에 따른 철자 복원"},{"partial":"vari____","answer":"variable","meaning":"문맥과 문법에 따른 철자 복원"},{"partial":"we__","answer":"were","meaning":"문맥과 문법에 따른 철자 복원"},{"partial":"Th_","answer":"The","meaning":"문맥과 문법에 따른 철자 복원"},{"partial":"resu___","answer":"results","meaning":"문맥과 문법에 따른 철자 복원"},{"partial":"inform_____","answer":"informative","meaning":"문맥과 문법에 따른 철자 복원"},{"partial":"care___","answer":"careful","meaning":"문맥과 문법에 따른 철자 복원"},{"partial":"sti__","answer":"still","meaning":"문맥과 문법에 따른 철자 복원"}],"questions":{"rd":[{"q":"What is the main purpose of the message?","options":["To clarify a problem, a requirement and an appropriate next step","To announce that all registrations have been canceled","To summarize the historical development of the field","To invite readers to submit unrelated research proposals"],"answer":0,"why":"공지에는 문제·필수 조건·구체적인 후속 조치가 명시되어 있습니다."},{"q":"Which response would comply with the stated requirement?","options":["Ignore the issue because the registration already exists","Submit only the same incomplete document without any change","Wait until after the deadline without notifying the office","The student should request a metadata template rather than uploading the same files again."],"answer":3,"why":"정답은 공지에 제시된 후속 조치의 바꿔 말하기입니다."},{"q":"What does the writer imply about the participant’s previous assumption?","options":["It has already been accepted as university policy.","It makes further verification unnecessary.","It is incomplete and should not determine the next action.","It requires every participant to withdraw immediately."],"answer":2,"why":"기존 오해를 바로잡기 위해 새로운 조건과 조치를 안내하고 있습니다."}],"ra":[{"q":"Which statement best captures the central idea of the passage?","options":["A positive initial outcome makes follow-up investigation unnecessary.","An observation is useful only when its interpretation accounts for relevant limitations and alternatives.","Methodological uncertainty prevents any responsible decision.","A result obtained in one setting automatically applies elsewhere."],"answer":1,"why":"지문은 관측과 확정적 인과 해석을 구분하고 주장 강도를 근거에 비례시키라고 설명합니다."},{"q":"What did the investigators observe in the fictional case?","options":["Students could find more studies through the portal, but several datasets were unusable because variable definitions were missing.","The librarian proposed a metadata checklist and a controlled-access route for sensitive participant records.","The researchers had no preliminary result to examine.","Every competing explanation was eliminated before the first comparison."],"answer":0,"why":"두 번째 단락의 관찰 결과에 직접 근거한 선택지입니다. 제안된 후속 조치와 실제 관측을 구분하세요."},{"q":"Why does the author specifically mention missing variable definitions?","options":["To prove that the entire study should be discarded.","To show that every alternative explanation has been disproved.","To suggest that a single technical detail is more important than all other evidence.","To identify a detail whose interpretation requires methodological scrutiny."],"answer":3,"why":"해당 세부사항은 연구 설계에서 추가 검토가 필요한 부분의 예시로 제시됩니다."},{"q":"Which limitation most directly weakens an unconditional conclusion?","options":["The topic attracted interest from several academic departments.","The authors included a title and organized their paragraphs.","A public download link by itself did not make the data reproducible or appropriate to share.","The case concerns a practical problem rather than a purely abstract theory."],"answer":2,"why":"세 번째 단락은 경쟁 설명을 고려해야 하는 구체적인 방법론적 한계를 밝힙니다."},{"q":"Which conclusion would the author most likely support?","options":["A result deserves confidence whenever it seems intuitively plausible.","The results justify further inquiry, but their implications must remain appropriately qualified.","Any unresolved question makes the findings wholly worthless.","The investigation should avoid discussing alternative interpretations."],"answer":1,"why":"마지막 단락은 전면적 수용과 전면적 거부를 모두 경계합니다."}],"rp":[{"q":"Which follow-up would most directly address the issue raised in the passage?","options":["The librarian proposed a metadata checklist and a controlled-access route for sensitive participant records.","Repeat the original conclusion more strongly without new evidence.","Remove the methodological qualification from the public summary.","Replace the observations with expert opinion alone."],"answer":0,"why":"후속 연구 제안은 한계가 드러난 부분을 직접 다룹니다."},{"q":"Which wording would be the most defensible for a summary?","options":["The initial observations definitively prove the mechanism in every context.","The remaining uncertainty means that the data contain no information.","No reader needs to know which assumptions the researchers made.","The evidence is consistent with a promising interpretation, although competing explanations remain possible."],"answer":3,"why":"가능성을 인정하되 인과·일반화의 범위를 신중하게 제한해야 합니다."}],"lq":[{"q":"Which response best fits the speaker’s intention?","options":["Yes, the earlier draft is final, so no further checks are needed.","Not until the next semester; the office has stopped all current activities.","Not quite. A codebook and clearance review are required before reuse, so we need to resolve that point before proceeding.","Yes, the initial application automatically overrides every later condition."],"answer":2,"why":"화자는 승인 여부를 재확인합니다. 단정적 동의가 아니라 남아 있는 조건을 완곡하게 알려야 합니다."}],"lc":[{"q":"Why does the student contact the coordinator?","options":["To withdraw permanently from the program.","To resolve an outstanding requirement before the activity.","To request an unrelated transcript of grades.","To replace the activity with an independent examination."],"answer":1,"why":"문의 목적은 미해결 조건과 필요한 후속 조치를 확인하는 데 있습니다."},{"q":"What was the student’s mistaken assumption?","options":["Open science means putting every file online.","All applications had been canceled without notification.","The office had already completed every required check.","The activity was scheduled for the previous semester."],"answer":0,"why":"학생은 이전 정보만으로 충분하다고 생각했고 담당자가 그 오해를 수정합니다."},{"q":"What will the student probably do next?","options":["Ask the class to disregard the announcement.","Submit unrelated paperwork without reading the revised rule.","Wait until the deadline has passed before responding.","The student should request a metadata template rather than uploading the same files again."],"answer":3,"why":"담당자는 구체적인 다음 조치를 제시했고 학생이 이를 실행하겠다고 말합니다."}],"la":[{"q":"What is the announcement mainly about?","options":["The cancellation of all campus activities.","A new application deadline for an unrelated program.","A remaining procedural condition and how participants can address it.","An invitation to an off-campus social event."],"answer":2,"why":"핵심은 기존 활동의 조건을 재안내하고 필요한 조치를 요청하는 것입니다."},{"q":"What are participants advised to do if they cannot meet the condition?","options":["Assume previous registration overrides the rule.","Contact the coordinator to discuss an appropriate arrangement.","Post personal records on a public social network.","Enter the restricted session without permission."],"answer":1,"why":"공지에 조건을 충족하지 못하면 담당자에게 문의하도록 명시되어 있습니다."}],"lt":[{"q":"What is the principal point of the lecture?","options":["Evidence should be interpreted in light of assumptions and competing explanations.","An initial pattern is sufficient proof of its own cause.","All practical decisions should be postponed indefinitely.","A researcher should always choose the most complicated explanation."],"answer":0,"why":"강의는 관측과 그 관측에 대한 설명을 분리하고, 근거에 맞는 주장만 제시하라고 강조합니다."},{"q":"Why does the professor contrast two groups reviewing the same figures?","options":["To show that the second group collected completely different data.","To argue that research committees should avoid independent review.","To imply that more confident reviewers are necessarily more accurate.","To illustrate why testing assumptions can change the strength of an interpretation."],"answer":3,"why":"동일한 자료라도 가정에 대한 태도 때문에 결론의 신뢰성이 달라질 수 있음을 설명합니다."},{"q":"How does the lecturer use the example of missing variable definitions?","options":["As proof that the entire research program has failed.","As a detail that is explicitly irrelevant to the interpretation.","As a concrete point at which additional scrutiny may be necessary.","As an example of a result obtained through a randomized experiment in every case."],"answer":2,"why":"세부사항은 논증의 취약 지점을 구체적으로 보여주는 역할입니다."},{"q":"What would the lecturer most likely advise researchers to do?","options":["Remove uncertain information from the published summary.","The librarian proposed a metadata checklist and a controlled-access route for sensitive participant records.","Treat the initial explanation as the only possible interpretation.","Replace empirical observations with the most persuasive opinion."],"answer":1,"why":"끝부분에서 제시된 후속 연구가 직접적인 개선 방향입니다."}]},"audio":{"lq":"Has the office confirmed everything for the open science and university life activity?","lc":"Mina: Sorry to bother you, but I just read the message about the library data desk. Is something still unresolved?\nCoordinator: Thanks for checking. The current concern is that the course team submitted raw survey files without a codebook.\nMina: I see. I assumed that open science means putting every file online. So the existing materials aren't sufficient?\nCoordinator: Not quite. A codebook and clearance review are required before reuse. We can still work with the current booking, but that condition matters.\nMina: Do I have to submit a new application, or is there something more specific I should do?\nCoordinator: You don't need to start over. Please request a metadata template rather than uploading the same files again, and make sure the office receives the update by Tuesday at 4 p.m..\nMina: That helps. I'll explain the change to the team so no one relies on the earlier assumption.\nCoordinator: Great. Let me know if the requirement creates a practical problem; there may be an alternative arrangement.","la":"This is a notice from the library data desk team. Students preparing for the open science and university life activity should review the updated instructions in their campus accounts. An important issue remains: the course team submitted raw survey files without a codebook. The requirement has not been waived: a codebook and clearance review are required before reuse. To avoid delays, please request a metadata template rather than uploading the same files again before Tuesday at 4 p.m.. If you cannot complete the required step, contact the coordinator instead of assuming your earlier registration will be accepted. Updates will be sent through the official student portal, not through personal social media accounts.","lt":"In today's lecture on open science and university life, consider a hypothetical research team facing a very practical decision. A university research repository piloted a policy requiring detailed metadata before student datasets could be shared. At first, the investigation appeared straightforward, since the team had a concrete pattern to examine. Students could find more studies through the portal, but several datasets were unusable because variable definitions were missing.\n\nNow, why isn't that the end of the story? A public download link by itself did not make the data reproducible or appropriate to share. That matters because the observation and its explanation are not interchangeable. A useful way to think about this is to imagine two groups of investigators reviewing the same figures. One group treats the first interpretation as settled; the other asks which assumption, if changed, would produce a different conclusion. The second approach may be slower, but it is much less likely to confuse a plausible account with a demonstrated one.\n\nThe team therefore proposed a specific follow-up: The librarian proposed a metadata checklist and a controlled-access route for sensitive participant records. Notice the function of missing variable definitions: it identifies a particular point at which the argument needs closer examination. The lesson is not that researchers must postpone every decision until they know everything. Rather, they should describe the limits of their evidence and explain which further result would change their minds."},"speaking":{"repeat":["Please check the updated instructions before the seminar.","The team examined missing variable definitions before presenting its preliminary findings.","Although the early results seemed promising, the investigators had not eliminated every alternative explanation.","A university research repository piloted a policy requiring detailed metadata before student datasets could be shared.","Students could find more studies through the portal, but several datasets were unusable because variable definitions were missing.","A public download link by itself did not make the data reproducible or appropriate to share.","Had the researchers ignored the uncertainty surrounding missing variable definitions, the final recommendation might have sounded more decisive than the available evidence could justify."],"interviews":["What course or research activity have you enjoyed most at university, and why?","Have you ever had to revise an assumption after learning about open science and university life or a related subject? Describe the experience.","Should university instructors give students more opportunities to question the conclusions of published research? Support your view with an example.","A group wants to implement a policy based on the evidence in this case. What safeguards would you recommend, and how would you address potential objections?"],"sample":"I think students should be encouraged to challenge a conclusion respectfully, even when the initial result appears convincing. The case of open science and university life illustrates why. Students could find more studies through the portal, but several datasets were unusable because variable definitions were missing. However, a public download link by itself did not make the data reproducible or appropriate to share. If I were responsible for advising the group, I would ask the team to compare at least one competing explanation and identify what evidence might change its recommendation. That would not mean dismissing the existing research. Rather, it would help us communicate uncertainty clearly and make a decision that other people could evaluate. In my experience, that kind of transparency improves both the credibility of a project and cooperation among the people involved."},"writing":{"build":[{"answer":"Not until the revised results were available did the committee reconsider its original position.","fragments":"reconsider its original position / revised results were available / Not until the / did the committee","why":"Not until 문두에 따른 도치"},{"answer":"Although the sample was relatively small, its observations justified further investigation.","fragments":"sample was relatively / justified further investigation / Although the / small, its observations","why":"양보 절과 핵심 주장 사이의 적절한 관계"},{"answer":"The method that the team initially preferred proved difficult to apply consistently.","fragments":"preferred proved difficult / the team initially / to apply consistently / The method that","why":"관계대명사 that이 수식하는 명사구"},{"answer":"What distinguishes an inference from a fact is the reasoning used to support it.","fragments":"is the reasoning / What distinguishes an / used to support it / inference from a fact","why":"What절을 문장 주어로 사용하는 구조"},{"answer":"Only if independent evidence supports the claim should the conclusion be strengthened.","fragments":"conclusion be strengthened / evidence supports the / Only if independent / claim should the","why":"Only if가 문두에 나오는 조건 도치"}],"emailTask":"You are helping with a university activity on open science and university life. A problem has arisen: the course team submitted raw survey files without a codebook.\n\nWrite a polite email to the campus coordinator. In your message:\n• explain the situation and why it matters;\n• request a realistic remedy consistent with this rule: a codebook and clearance review are required before reuse;\n• ask for confirmation before the announced deadline.","emailSample":"Dear Research Coordinator,\n\nI am writing about our upcoming university activity on open science and university life. We have encountered a difficulty that could affect the preparation: the course team submitted raw survey files without a codebook. I understand that the procedure is intended to protect the quality and reliability of the activity, and I would like to resolve the issue before it affects other participants.\n\nAs I understand the current requirement, a codebook and clearance review are required before reuse. Would it be possible for our team to request a metadata template rather than uploading the same files again? If a different form or supporting record is needed, please let me know so that we can provide the correct information rather than repeating the original submission.\n\nCould you confirm the appropriate next step by Tuesday at 4 p.m.? Thank you for your assistance and for helping us keep the arrangements clear for everyone involved.\n\nKind regards,\nMina Park","discussionTask":"Professor: We are considering how universities should respond to evidence about open science and university life. Should a university act on promising preliminary findings, or wait for stronger evidence before changing its practices?\n\nStudent A — Elena: I favor cautious early action. Students could find more studies through the portal, but several datasets were unusable because variable definitions were missing. If an initiative can be monitored and reversed, refusing to try it may also have costs.\n\nStudent B — Marcus: I would insist on stronger evidence first. A public download link by itself did not make the data reproducible or appropriate to share. Otherwise, we might spend resources responding to a misleading pattern.","discussionSample":"I would take a position between Elena's willingness to act and Marcus's concern about premature conclusions. In the case of open science and university life, students could find more studies through the portal, but several datasets were unusable because variable definitions were missing. This is a meaningful observation, and it would be unreasonable to ignore it entirely. Nevertheless, a public download link by itself did not make the data reproducible or appropriate to share. The critical distinction, in my view, is whether a decision can be monitored, evaluated and revised. I would therefore recommend a limited pilot that could test competing interpretations. A practical first step would follow this suggestion: The librarian proposed a metadata checklist and a controlled-access route for sensitive participant records. Participants should be told which benefits are expected, which uncertainties remain and what outcome would justify changing course. That approach responds to the promising evidence without treating a tentative interpretation as a settled fact."},"vocabulary":[{"term":"open-access repository","meaning":"오픈액세스 저장소","collocation":"examine open-access repository","example":"Reviewers asked for a detailed account of open-access repository before accepting the proposed interpretation.","synonym":"","nuance":"주제 핵심 표현 · Open Science and University Life","group":"core"},{"term":"data dictionary","meaning":"변수 정의표","collocation":"examine data dictionary","example":"The field notes addressed data dictionary as a possible source of variation across sites.","synonym":"","nuance":"주제 핵심 표현 · Open Science and University Life","group":"core"},{"term":"reproducible analysis","meaning":"재현 가능한 분석","collocation":"conduct reproducible analysis","example":"An explanation of reproducible analysis was included because it affected the scope of the research claim.","synonym":"","nuance":"주제 핵심 표현 · Open Science and University Life","group":"core"},{"term":"research metadata","meaning":"연구 메타데이터","collocation":"examine research metadata","example":"The revised procedure made research metadata explicit rather than leaving it to individual judgment.","synonym":"","nuance":"주제 핵심 표현 · Open Science and University Life","group":"core"},{"term":"preprint server","meaning":"사전 공개 논문 서버","collocation":"examine preprint server","example":"Students compared the role of preprint server in the initial and follow-up investigations.","synonym":"","nuance":"주제 핵심 표현 · Open Science and University Life","group":"core"},{"term":"embargo period","meaning":"공개 유예 기간","collocation":"examine embargo period","example":"The panel considered whether embargo period had been overlooked in the preliminary assessment.","synonym":"","nuance":"주제 핵심 표현 · Open Science and University Life","group":"core"},{"term":"ethics clearance","meaning":"연구윤리 승인","collocation":"examine ethics clearance","example":"A new section on ethics clearance allowed independent readers to evaluate the evidence more carefully.","synonym":"","nuance":"주제 핵심 표현 · Open Science and University Life","group":"core"},{"term":"version control","meaning":"버전 관리","collocation":"examine version control","example":"The project could not conclusion as tentative.","synonym":"provisional","nuance":"추가 근거에 따라 바뀔 수 있음","group":"advanced"},{"term":"attribute","meaning":"원인으로 돌리다","collocation":"attribute a change to training","example":"It was premature to attribute the change to training when attendance differed across groups.","synonym":"ascribe","nuance":"근거가 충분한지 함께 검토","group":"advanced"},{"term":"delineate","meaning":"명확히 구분·규정하다","collocation":"delineate the scope","example":"The methods section should delineate the scope of the analysis and its exclusions.","synonym":"define precisely","nuance":"범위·경계를 뚜렷하게 설정","group":"advanced"},{"term":"imply","meaning":"함축하다·시사하다","collocation":"imply a limitation","example":"The revised guidance may imply a limitation that was not explicitly acknowledged.","synonym":"suggest indirectly","nuance":"명시되지 않은 결론을 암시","group":"advanced"},{"term":"validate","meaning":"타당성을 검증하다","collocation":"validate the procedure","example":"A separate laboratory was asked to validate the procedure before routine use.","synonym":"confirm validity","nuance":"정확도·타당성 검증의 과정","group":"advanced"},{"term":"constrain","meaning":"제한하다","collocation":"constrain the interpretation","example":"A small sample can constrain the interpretation of otherwise promising results.","synonym":"restrict","nuance":"가능한 결론의 범위 제한","group":"advanced"},{"term":"subsequent","meaning":"후속의","collocation":"subsequent measurements","example":"Subsequent measurements revealed a discrepancy that the initial audit had missed.","synonym":"later","nuance":"시간상 뒤에 이어짐","group":"advanced"},{"term":"homogeneous","meaning":"동질적인","collocation":"a homogeneous group","example":"Findings from a homogeneous group may not apply to a much wider population.","synonym":"uniform","nuance":"구성요소가 비슷함","group":"advanced"},{"term":"succinct","meaning":"간결한","collocation":"a succinct summary","example":"A succinct summary can preserve essential qualifications without obscuring the message.","synonym":"concise","nuance":"핵심을 유지하며
