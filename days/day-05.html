<script>window.TOEFL_LESSON={"day":5,"week":1,"theme":"Art Conservation and Historical Authenticity","focus":"Type awareness and diagnostics","claim":"Restoring an artwork requires balancing original materials with the historical significance of later interventions.","evidence":"Chemical tests dated the blue repainting to the nineteenth century, while archives showed it had shaped public viewing for generations.","caveat":"Removing later paint could erase historical evidence and risk damaging the underlying original.","response":"Document layers, test treatment on small areas, and choose a reversible or limited intervention where possible.","storageKey":"toefl110day5-diversity-v3","notice":"MUSEUM CONSERVATION LAB — PUBLIC DEMONSTRATION\n\nVisitors may observe the conservators' demonstration on Sunday at 11 a.m. from the viewing gallery. Due to safety rules, solvents and sample preparation will not be handled by visitors. Photography without flash is permitted in the gallery, but tripods and external lighting are not allowed.\n\nThe demonstration has been moved from Gallery 4 to the upstairs conservation window. Wheelchair access is available by the east lift; visitors who need assistance may contact the front desk before arriving.","academicPassage":"A painted wooden panel from the seventeenth century may look like a single object, but its surface records several periods of human intervention. Conservators frequently encounter original pigments beneath later repairs, varnish, and grime. Deciding which layers to remove requires more than identifying the oldest material.\n\nA museum examining a portrait discovered that a brilliant blue detail had been repainted during a nineteenth-century restoration. Chemical analysis showed a pigment unavailable to the original artist. The finding confirmed the later date of the blue layer, yet it did not settle whether the layer should be removed. Archival photographs suggested that audiences had known the portrait in its altered form for more than a century.\n\nTwo approaches emerged. One group favored revealing as much original paint as possible to clarify the artist's technique. Another argued that later modifications could themselves possess historical significance. Removing them might erase evidence of the painting's reception and conservation history. Moreover, a solvent strong enough to dissolve the later coating could damage the layer beneath it.\n\nThe museum ultimately chose targeted cleaning after microscopic tests and published images of the underlying layers. The case illustrates why authenticity is not always synonymous with returning an object to its earliest recoverable state. Ethical conservation requires an explicit judgment about material stability, historical context, and the consequences of irreversible treatment.","readingClozePassage":"During a museum demonstration, visitors watched a conservator examine a tiny sample from an old painting. Under magnification, seve___ layers o_ pigment bec___ visible. Th_ newest bl__ layer conta____ a comp____ that ha_ not be__ available wh__ the artist worked. Some visitors expected the conservator to remove it immediately, but the team first checked archival photographs and tested the paint beneath. The results suggested that an aggressive cleaning treatment could erase valuable evidence of the artwork's later history.","cloze":[{"partial":"seve___","answer":"several","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"o_","answer":"of","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"bec___","answer":"became","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"Th_","answer":"the","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"bl__","answer":"blue","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"conta____","answer":"contained","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"comp____","answer":"compound","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"ha_","answer":"had","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"be__","answer":"been","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"},{"partial":"wh__","answer":"when","meaning":"문맥과 품사에 따라 뒤 절반 철자를 복원"}],"questions":{"rd":[{"q":"Where will visitors observe Sunday’s conservation demonstration?","options":["At the upstairs conservation window.","In Gallery 4 as originally announced.","At the museum loading dock.","Inside the chemical preparation room."],"answer":0,"why":"실생활 공지의 해당 조건을 찾아 확인하세요. At the upstairs conservation window."},{"q":"What restriction applies to visitors taking photographs?","options":["They may take flash photographs if they stay behind glass.","They must bring a tripod for stability.","They may handle cleaning chemicals after the talk.","They may photograph without flash or external lighting."],"answer":3,"why":"공지의 별도 요건 또는 예외 조항에 명시된 행동은 They may photograph without flash or external lighting.입니다."},{"q":"What will visitors be unable to do at the conservation demonstration?","options":["Use the east lift to access the viewing area.","Take a photograph without flash from the gallery.","Handle solvents or prepare samples themselves.","Observe conservators through the upstairs viewing window."],"answer":2,"why":"공지의 예외 조항과 구체적인 적용 범위를 비교해야 합니다. 정답 근거: Handle solvents or prepare samples themselves."}],"ra":[{"q":"What lesson does the specific case lead the author to draw in the passage on Art Conservation and Historical Authenticity?","options":["Chemical dating alone settles all ethical conservation decisions.","Restoring an artwork requires balancing original materials with the historical significance of later interventions.","Any pigment applied after the artist’s death must be removed immediately.","The oldest visible layer is always the most stable one."],"answer":1,"why":"중심 논지는 세부 사례에서 도출되는 가장 신중한 결론입니다. Restoring an artwork requires balancing original materials with the historical significance of later interventions."},{"q":"What specific observation in the art conservation and historical authenticity case motivates the discussion?","options":["Chemical tests dated the blue repainting to the nineteenth century, while archives showed it had shaped public viewing for generations.","Chemical dating alone settles all ethical conservation decisions.","The oldest visible layer is always the most stable one.","Any pigment applied after the artist’s death must be removed immediately."],"answer":0,"why":"지문의 사례·대조 정보를 직접 확인해야 합니다. Chemical tests dated the blue repainting to the nineteenth century, while archives showed it had shaped public viewing for generations."},{"q":"Which qualification prevents the evidence about art conservation from supporting an unconditional claim?","options":["Any pigment applied after the artist’s death must be removed immediately.","Chemical dating alone settles all ethical conservation decisions.","The oldest visible layer is always the most stable one.","Removing later paint could erase historical evidence and risk damaging the underlying original."],"answer":3,"why":"한계 조건은 곧바로 틀린 결론이라는 뜻이 아니라 적용 범위를 제한합니다. Removing later paint could erase historical evidence and risk damaging the underlying original."},{"q":"Why does the author give the concrete example related to art conservation rather than begin with a universal rule?","options":["It lists the sequence of art conservation observations without contributing to the author’s main point.","The example proves that the implications of art conservation hold in every possible location.","It illustrates a specific relationship involving art conservation while establishing the boundaries of the wider argument.","The example eliminates the need to compare evidence about art conservation with alternative explanations."],"answer":2,"why":"사례는 범위가 제한된 관찰 또는 비교를 통해 주장을 구체화하고 무조건적 일반화를 피하도록 돕습니다."},{"q":"Which investigation or action would best extend the reasoning about art conservation and historical authenticity?","options":["Any pigment applied after the artist’s death must be removed immediately.","Document layers, test treatment on small areas, and choose a reversible or limited intervention where possible.","The oldest visible layer is always the most stable one.","Chemical dating alone settles all ethical conservation decisions."],"answer":1,"why":"추가 검증은 근거의 결함을 직접 보완하거나 대안 설명을 시험해야 합니다. Document layers, test treatment on small areas, and choose a reversible or limited intervention where possible."}],"rp":[{"q":"In the art conservation and historical authenticity passage, what does “irreversible” most nearly mean in context?","options":["not easily undone","chemically pure","widely documented","historically accurate"],"answer":0,"why":"단어의 문맥상 의미를 판단해야 하며 직역만으로 결정하지 않습니다. irreversible ≈ not easily undone"},{"q":"A later repair preserves a historically significant alteration on a statue. What should the conservator do?","options":["Use the strongest available solvent without testing.","Treat the presence of a later repair as proof of forgery.","Remove all later material solely because it is not original.","Assess the repair’s significance and treatment risks before removing it."],"answer":3,"why":"새 상황에 지문 원리를 적용하는 고난도 추론 문항입니다. Assess the repair’s significance and treatment risks before removing it."}],"lq":[{"q":"Which response best addresses the speaker’s question about art conservation?","options":["Yes, because modern materials are always unstable.","The public demonstration begins at eleven.","No. Its historical value and the risks of treatment must also be considered.","The museum has three conservation studios."],"answer":2,"why":"화자는 전제를 확인하고 있으므로 직접적인 정정과 관련 조건 설명이 적절합니다."}],"lc":[{"q":"What brings the first speaker to the conversation concerning art conservation?","options":["An invitation to deliver a formal lecture explaining art conservation and historical authenticity.","whether later blue repainting must be removed","A plan to evaluate unrelated applicants for a different university program.","A request for the institution to change the academic field under discussion."],"answer":1,"why":"대화의 도입부에서 상대가 확인하려는 문제를 파악합니다. whether later blue repainting must be removed"},{"q":"What does the second speaker clarify about the issue raised in the art conservation and historical authenticity dialogue?","options":["materials analysis informs but does not settle an ethical treatment choice","The oldest visible layer is always the most stable one.","Any pigment applied after the artist’s death must be removed immediately.","Chemical dating alone settles all ethical conservation decisions."],"answer":0,"why":"Not necessarily, No, Exactly와 같은 정정 이후의 내용을 확인합니다. materials analysis informs but does not settle an ethical treatment choice"},{"q":"What will the first speaker most likely do after the discussion about art conservation?","options":["Replace the entire project with an unrelated topic without consulting anyone.","Disregard the advice and continue on the original assumption.","Withdraw permanently from all activities discussed.","consider the historical role and view the demonstration without flash"],"answer":3,"why":"마지막 발화에서 다음 행동을 추론합니다. consider the historical role and view the demonstration without flash"}],"la":[{"q":"What practical change or instruction is listeners expected to notice in the announcement about art conservation?","options":["At the museum loading dock.","Inside the chemical preparation room.","At the upstairs conservation window.","In Gallery 4 as originally announced."],"answer":2,"why":"공지의 장소·시간·적용 조건을 듣고 핵심 변경사항을 선택합니다. At the upstairs conservation window."},{"q":"Which additional requirement applies to listeners in the art conservation and historical authenticity announcement?","options":["They may take flash photographs if they stay behind glass.","They may photograph without flash or external lighting.","They must bring a tripod for stability.","They may handle cleaning chemicals after the talk."],"answer":1,"why":"보편적인 안내와 특정 조건에 해당하는 행동을 구별해야 합니다. They may photograph without flash or external lighting."}],"lt":[{"q":"Which statement best summarizes the lecturer’s explanation of art conservation and historical authenticity?","options":["Restoring an artwork requires balancing original materials with the historical significance of later interventions.","Any pigment applied after the artist’s death must be removed immediately.","The oldest visible layer is always the most stable one.","Chemical dating alone settles all ethical conservation decisions."],"answer":0,"why":"강의 중심 개념과 화자의 제한된 결론을 종합합니다. Restoring an artwork requires balancing original materials with the historical significance of later interventions."},{"q":"What role does the lecturer’s example of art conservation play in the explanation?","options":["Chemical dating alone settles all ethical conservation decisions.","Any pigment applied after the artist’s death must be removed immediately.","The oldest visible layer is always the most stable one.","Chemical tests dated the blue repainting to the nineteenth century, while archives showed it had shaped public viewing for generations."],"answer":3,"why":"강의 사례는 개념을 구체화하는 관측 자료 또는 비교입니다. Chemical tests dated the blue repainting to the nineteenth century, while archives showed it had shaped public viewing for generations."},{"q":"What caution does the lecturer introduce after describing evidence related to art conservation?","options":["The oldest visible layer is always the most stable one.","Chemical dating alone settles all ethical conservation decisions.","Removing later paint could erase historical evidence and risk damaging the underlying original.","Any pigment applied after the artist’s death must be removed immediately."],"answer":2,"why":"화자가 However, but 등으로 도입하는 예외를 듣는 것이 핵심입니다. Removing later paint could erase historical evidence and risk damaging the underlying original."},{"q":"How would the lecturer most likely advise someone evaluating art conservation in a new setting?","options":["Any pigment applied after the artist’s death must be removed immediately.","Document layers, test treatment on small areas, and choose a reversible or limited intervention where possible.","The oldest visible layer is always the most stable one.","Chemical dating alone settles all ethical conservation decisions."],"answer":1,"why":"강의의 마무리에서 제안하는 연구·실행 원칙을 응용합니다. Document layers, test treatment on small areas, and choose a reversible or limited intervention where possible."}]},"audio":{"lq":"If the blue paint was added later, does the museum have to remove it?","lc":"Visitor: I read that the museum discovered a nineteenth-century blue pigment on the portrait. Are you going to remove the repainting?\nConservator: We haven't decided to remove it completely. Its date is clearer now, but its historical role is still being discussed.\nVisitor: Wouldn't revealing the original paint make the picture more authentic?\nConservator: In one sense, perhaps. Yet a later restoration can be part of an object's history, and removing it could damage the paint underneath.\nVisitor: So the chemical test doesn't tell you what treatment is right?\nConservator: Exactly. It helps establish what materials are present; it doesn't make the ethical decision for us.\nVisitor: Can visitors watch the cleaning?\nConservator: Yes, from the upstairs window on Sunday. Flash photography is prohibited.","la":"Welcome to the museum conservation laboratory. Today's public demonstration will take place at the upstairs conservation window rather than in Gallery Four. You may take photographs from the viewing gallery without flash, but please do not use tripods or external lighting. Visitors cannot handle solvents or samples for safety reasons. Those who require step-free access should use the east lift or ask the front desk for assistance.","lt":"When we say a painting is authentic, what exactly do we mean? We might mean that its materials date to the artist's lifetime, or we might mean that its appearance reflects the history through which the painting has passed. Those meanings are not always compatible.\n\nA seventeenth-century portrait in our collection includes a blue detail applied about two centuries later. Chemical testing established the later pigment's composition, but the analysis didn't determine whether we should remove it. Historical photographs show that the repainting has shaped how visitors understood the image for generations.\n\nRemoving the blue could expose original brushwork, but it might also destroy evidence of the painting's reception. In addition, aggressive solvents pose material risks. Our team therefore conducted tiny tests, documented the layers and chose limited cleaning.\n\nThe point is that science supplies evidence for conservation decisions; it doesn't eliminate the need for ethical judgment about irreversible changes."},"speaking":{"repeat":["Welcome to the workshop on art conservation.","Visitors may observe the conservators' demonstration on Sunday at 11 a.","The instructor asked us to compare the evidence about art conservation before drawing conclusions.","Chemical tests dated the blue repainting to the nineteenth century, while archives showed it had shaped public viewing for generations.","Removing later paint could erase historical evidence and risk damaging the underlying original.","Document layers, test treatment on small areas, and choose a reversible or limited intervention where possible.","Although it might initially seem that any pigment applied after the artist’s death must be removed immediately, the evidence instead suggests that restoring an artwork requires balancing original materials with the historical significance of later interventions."],"interviews":["What first interested you in art history / chemistry, and how would you explain that interest to a friend?","Tell me about a time when a practical decision involving art conservation was more complicated than you expected.","Do you think universities should give more attention to art conservation in introductory courses? Explain your reasoning.","Imagine a classmate disagrees with your interpretation of art conservation. How would you respond respectfully and precisely?"],"sample":"I think museums should make conservation decisions transparent to visitors. During an exhibition, I once saw images of a painting at different stages of restoration. I had assumed the aim was simply to reveal the oldest layer of paint, but the curator explained that later additions could also have historical significance. I found that tension fascinating because it showed that scientific analysis and ethical judgment answer different questions. If I worked on a museum project, I would recommend documenting the treatment and explaining why some layers were preserved. People can appreciate a work more deeply when they understand its complicated history."},"writing":{"build":[{"fragments":"Could you tell me / whether the art conservation / session has been rescheduled","answer":"Could you tell me whether the art conservation session has been rescheduled?","why":"간접 의문문 어순의 문장 구조와 주어-동사 관계를 확인하세요."},{"fragments":"noticed an important discrepancy / the paint stratigraphy records / The student who reviewed","answer":"The student who reviewed the paint stratigraphy records noticed an important discrepancy.","why":"관계절로 설명 추가의 문장 구조와 주어-동사 관계를 확인하세요."},{"fragments":"If the team had checked / it might have reached a / different conclusion / the later overpainting evidence earlier,","answer":"If the team had checked the later overpainting evidence earlier, it might have reached a different conclusion.","why":"조건절로 가능성 제시의 문장 구조와 주어-동사 관계를 확인하세요."},{"fragments":"examined did the committee approve / Only after the records related / the report / to art conservation had been","answer":"Only after the records related to art conservation had been examined did the committee approve the report.","why":"Only after 도치의 문장 구조와 주어-동사 관계를 확인하세요."},{"fragments":"A project involving art conservation / requires not only reliable evidence / of its limitations / but also a clear account","answer":"A project involving art conservation requires not only reliable evidence but also a clear account of its limitations.","why":"Not only A but also B 병렬의 문장 구조와 주어-동사 관계를 확인하세요."}],"emailTask":"You are a student preparing a paper on a restored portrait. Email the museum conservator to ask whether the chemical analysis summary and non-flash photographs are available for educational use; explain your project and request the correct citation for the conservation report.","emailSample":"Dear Museum Conservation Team,\n\nI am preparing a university paper on the recent examination of the seventeenth-century portrait displayed in your collection. I am particularly interested in how pigment analysis informed the decision to retain part of the later blue repainting.\n\nWould it be possible to obtain the public summary of the chemical findings and permission to reproduce a non-flash photograph in my coursework? I would also be grateful for the preferred citation of the conservation report and any restrictions on distributing the image beyond my class.\n\nThank you for supporting student research into the ethical dimensions of conservation.\n\nYours sincerely,\nAlex","discussionTask":"Professor: Should museums remove historical restorations to reveal artworks as they originally appeared?\n\nStudent A — Emily: Yes, where safe: visitors should be able to study the original artist’s technique and intentions.\n\nStudent B — Daniel: Not automatically: later restorations may be culturally significant and removing them can be irreversible.","discussionSample":"Historical restorations should not automatically be removed simply because they were completed after an artwork was created. I understand the desire to reveal an artist’s original technique; discovering a later pigment can provide valuable information about the object's history. But an overpainted detail may have shaped how the public understood the work for generations. Furthermore, cleaning is not always reversible. A solvent capable of removing a later layer might damage the original beneath it. I would therefore support small-scale testing, careful documentation, and an explicit explanation of what historical information could be lost. Museums can also use digital imaging to show alternative appearances without making irreversible changes. This approach values authenticity while recognizing that an object can have more than one historically significant phase."},"vocabulary":[{"term":"pigment analysis","meaning":"안료 분석","collocation":"perform pigment analysis","example":"In their final presentation, conservators described what it meant to perform pigment analysis.","synonym":"analysis of coloring materials","nuance":"","group":"core"},{"term":"paint stratigraphy","meaning":"도막 층위 구조","collocation":"examine paint stratigraphy","example":"Careful documentation enabled conservators to examine paint stratigraphy without repeating the same mistake.","synonym":"sequence of paint layers","nuance":"","group":"core"},{"term":"later overpainting","meaning":"후대 덧칠","collocation":"document later overpainting","example":"In a subsequent case, conservators had to document later overpainting under rather different conditions.","synonym":"subsequent repainting","nuance":"","group":"core"},{"term":"conservation treatment","meaning":"보존 처리","collocation":"plan a conservation treatment","example":"The final recommendation urged conservators to plan a conservation treatment before proceeding.","synonym":"restoration procedure","nuance":"","group":"core"},{"term":"irreversible removal","meaning":"비가역적 제거","collocation":"avoid irreversible removal","example":"In the first trial, conservators were not yet able to avoid irreversible removal consistently.","synonym":"removal that cannot be reversed","nuance":"","group":"core"},{"term":"archival photograph","meaning":"기록 사진","collocation":"compare archival photographs","example":"The absence of reliable records made it difficult for conservators to compare archival photographs.","synonym":"historical image record","nuance":"","group":"core"},{"term":"material stability","meaning":"재료 안정성","collocation":"assess material stability","example":"The project team provided a checklist to help conservators assess material stability.","synonym":"physical durability","nuance":"","group":"core"},{"term":"solvent test","meaning":"용제 시험","collocation":"conduct a solvent test","example":"Students observed how conservators attempted to conduct a solvent test despite incomplete information.","synonym":"solvent compatibility check","nuance":"","group":"core"},{"term":"microscopic sample","meaning":"현미경 시료","collocation":"inspect a microscopic sample","example":"A meaningful comparison would require conservators to inspect a microscopic sample independently.","synonym":"very small specimen","nuance":"","group":"core"},{"term":"historical reception","meaning":"역사적 수용 양상","collocation":"study historical reception","example":"A cautious interpretation allowed conservators to study historical reception while acknowledging uncertainty.","synonym":"later public interpretation","nuance":"","group":"core"},{"term":"original brushwork","meaning":"원래의 붓질","collocation":"reveal original brushwork","example":"Several independent observations led conservators to reveal original brushwork before publication.","synonym":"brush marks from the original artist","nuance":"","group":"core"},{"term":"surface varnish","meaning":"표면 바니시","collocation":"remove surface varnish","example":"A request from the university encouraged conservators to remove surface varnish more transparently.","synonym":"protective surface coating","nuance":"","group":"core"},{"term":"ethical conservation","meaning":"윤리적 보존","collocation":"practice ethical conservation","example":"Rather than generalizing from one case, conservators sought to practice ethical conservation in several settings.","synonym":"ethical heritage care","nuance":"","group":"core"},{"term":"restoration history","meaning":"복원 이력","collocation":"reconstruct restoration history","example":"The investigation would be less credible if conservators neglected to reconstruct restoration history.","synonym":"history of interventions","nuance":"","group":"core"},{"term":"viewing gallery","meaning":"관람 갤러리","collocation":"observe from a viewing gallery","example":"The procedures were revised so that conservators could observe from a viewing gallery consistently.","synonym":"observation area","nuance":"","group":"core"},{"term":"material authenticity","meaning":"재료의 진정성","collocation":"investigate material authenticity","example":"Before finalizing the interpretation, conservators decided to investigate material authenticity.","synonym":"authenticity of constituent materials","nuance":"","group":"advanced"},{"term":"historical layering","meaning":"역사적 층위","collocation":"document historical layering","example":"The students challenged conservators to document historical layering without overlooking contrary evidence.","synonym":"layers of historical change","nuance":"","group":"advanced"},{"term":"surface abrasion","meaning":"표면 마모","collocation":"measure surface abrasion","example":"The instructor proposed that conservators should first measure surface abrasion and then compare outcomes.","synonym":"wear of the surface","nuance":"","group":"advanced"},{"term":"conservation ethics","meaning":"보존윤리","collocation":"apply conservation ethics","example":"When the initial explanation failed, conservators returned to the data to apply conservation ethics.","synonym":"principles of preservation","nuance":"","group":"advanced"},{"term":"curatorial judgment","meaning":"큐레이터의 판단","collocation":"exercise curatorial judgment","example":"The group discovered that it was possible to exercise curatorial judgment without assuming a single cause.","synonym":"professional museum judgment","nuance":"","group":"advanced"},{"term":"archival evidence","meaning":"기록물 증거","collocation":"consult archival evidence","example":"A second research team challenged conservators to consult archival evidence with different assumptions.","synonym":"historical documentation","nuance":"","group":"advanced"},{"term":"irreversible intervention","meaning":"비가역적 개입","collocation":"avoid irreversible intervention","example":"The revised protocol gave conservators a systematic way to avoid irreversible intervention.","synonym":"permanent alteration","nuance":"","group":"advanced"},{"term":"contextual significance","meaning":"맥락적 중요성","collocation":"assess contextual significance","example":"To address a practical difficulty, conservators chose to assess contextual significance under controlled conditions.","synonym":"importance of historical context","nuance":"","group":"advanced"},{"term":"chemical composition","meaning":"화학 조성","collocation":"determine chemical composition","example":"It proved especially important for conservators to determine chemical composition during the second assessment.","synonym":"constituent chemical makeup","nuance":"","group":"advanced"},{"term":"artistic intention","meaning":"작가의 의도","collocation":"infer artistic intention","example":"In response to the reviewers, conservators agreed to infer artistic intention using an explicit procedure.","synonym":"artist's intended design","nuance":"","group":"advanced"},{"term":"repainting chronology","meaning":"재도색의 시기 순서","collocation":"reconstruct repainting chronology","example":"A single unexpected result persuaded conservators to reconstruct repainting chronology more carefully.","synonym":"sequence of later painting","nuance":"","group":"advanced"},{"term":"material incompatibility","meaning":"재료 간 부적합성","collocation":"detect material incompatibility","example":"When the instruments returned inconsistent readings, conservators attempted to detect material incompatibility.","synonym":"materials that react poorly together","nuance":"","group":"advanced"},{"term":"conservation risk","meaning":"보존상 위험","collocation":"minimize conservation risk","example":"The supervising committee asked conservators to minimize conservation risk and explain the criteria.","synonym":"chance of conservation damage","nuance":"","group":"advanced"},{"term":"heritage interpretation","meaning":"문화유산 해석","collocation":"revise heritage interpretation","example":"Only after a careful review could conservators begin to revise heritage interpretation.","synonym":"explanation of cultural heritage","nuance":"","group":"advanced"},{"term":"ethical dilemma","meaning":"윤리적 딜레마","collocation":"address an ethical dilemma","example":"Under the new conditions, conservators were asked to address an ethical dilemma at an earlier stage.","synonym":"conflict between ethical principles","nuance":"","group":"advanced"}],"meta":{"sourceType":"original practice content","etsOfficial":false,"benchmark":"TOEFL iBT January 2026 task-type descriptions / ETS sample 1","studyMinutes":120,"revision":"2026-11-23-diversity-v3","discipline":"Art History / Chemistry","genre":"case"}};</script>
