const talkAudio=`When conservation scientists restore a damaged ecosystem, they often begin by asking what the landscape looked like before major human disturbance. Historical records can provide a useful reference point. However, using the past as a fixed restoration target creates several challenges.

First, ecosystems have never been completely static. Climate variation, migration, and natural disturbances have altered plant and animal communities for thousands of years. Consequently, selecting a single historical period as the ideal condition may oversimplify ecological history.

Second, even where reliable historical data exist, current environmental conditions may make a complete return to the past impossible. Rising temperatures or changes in water availability can prevent previously dominant species from surviving in the same locations.

This does not mean historical evidence should be disregarded. Rather, ecologists increasingly combine historical knowledge with projections of future conditions. For example, a restoration project may prioritize ecological functions, such as maintaining soil stability or supporting pollinators, instead of attempting to recreate an exact historical species composition.

The central challenge, then, is not simply deciding which past ecosystem to reproduce. It is determining which ecological goals remain realistic and valuable under conditions that are themselves changing.`;

const readingAcademicPassage=`<h3>When Educational Interventions Appear More Effective Than They Are</h3><p>Universities increasingly rely on learning analytics to assess whether new instructional methods improve student performance. Although such evaluations can generate valuable insights, apparently successful interventions do not always produce the benefits attributed to them.</p><p>Consider a program offered exclusively to students who performed unusually poorly on their first assessment. If those students achieve higher scores on a subsequent test, administrators might conclude that the program was effective. Yet some improvement could occur even without the intervention. Students selected because of exceptionally low initial results may, on average, perform closer to their typical level when reassessed. This statistical phenomenon, known as <em>regression to the mean</em>, can create the appearance of progress where little genuine improvement has occurred.</p><p>A second challenge concerns selection effects. Instructors who voluntarily adopt a new teaching platform may be particularly motivated or willing to experiment with innovative practices. Their students' outcomes might therefore reflect the instructors' broader teaching approaches rather than the platform itself.</p><p>Randomized experiments can help address such concerns by distributing relevant characteristics across treatment and comparison groups. However, random assignment does not automatically guarantee that the findings will apply elsewhere. An intervention tested among highly motivated volunteers, for example, may yield different results when implemented across a more diverse student population.</p><p>Where randomized trials are impractical, researchers can strengthen their conclusions by examining multiple sources of evidence, tracking outcomes over time, and clearly documenting methodological limitations. Such approaches cannot eliminate every competing explanation, but they can help determine how confidently an observed improvement should be attributed to a particular intervention.</p><p>The appropriate response to imperfect evidence, therefore, is neither unconditional acceptance nor wholesale rejection. It is to ensure that the strength of a claim remains proportional to the quality of the evidence supporting it.</p>`;

const discussionExample=`I largely agree with Emily that statistical literacy should be a core component of university education, although I share Daniel's concern about placing additional demands on students' schedules.

The primary benefit of studying statistics extends beyond the ability to perform calculations. Students learn to distinguish correlation from causation, evaluate uncertainty, and recognize misleading interpretations of data. These skills are relevant not only to scientific research but also to public policy, journalism, and everyday decision-making.

For example, a student evaluating the effectiveness of a new educational program should understand why an improvement in average test scores does not necessarily demonstrate a causal relationship.

Nevertheless, universities should avoid imposing an identical course on every student. Instead, they could offer discipline-specific options that teach fundamental statistical reasoning through relevant applications. This would preserve the educational benefits while addressing some of the practical concerns Daniel raises.`;

function vState(){return state.vocab;}
function vKnownCount(){return vocabularyWords.filter((_,i)=>!!vState().studied[i]).length;}
function vWrongIds(){return vocabularyWords.map((_,i)=>i).filter(i=>!!vState().mistakes[i]);}
function vScore(mode){let a=vState();if(!a.quizChecked[mode])return null;let qs=mode==='meaning'?vocabularyMeaningIds:mode==='cloze'?vocabularyClozeItems:vocabularyWriteItems;return qs.filter((q,i)=>vIsCorrect(mode,i)).length;}
function vNormalize(text){return String(text||'').trim().toLowerCase().replace(/[.?!,;:]+$/,'').replace(/\s+/g,' ');}
function vIsCorrect(mode,i){let a=vState();if(mode==='meaning'){let idx=vocabularyMeaningIds[i];return Number(a.meaningAnswers[i])===vocabChoices(idx).correct;}
if(mode==='cloze')return vNormalize(a.clozeAnswers[i])===vNormalize(vocabularyClozeItems[i].answer);
let t=String(a.writingAnswers[i]||'').trim();return vocabularyWriteItems[i].pattern.test(t)&&t.split(/\s+/).length>=10;}
function vocabChoices(idx){let options=[(idx+5)%30,(idx+11)%30,(idx+17)%30];let correct=idx%4;options.splice(correct,0,idx);return {options,correct};}
function vocabTabBar(){let options=[['wordbook','01 단어장'],['flash','02 플래시카드'],['quiz','03 단어 시험'],['mistakes','04 오답 복습']];return `<div class="vtabbar" role="tablist" aria-label="Vocabulary 학습 모드">${options.map(([k,label])=>`<button role="tab" aria-selected="${vState().tab===k}" class="vtab ${vState().tab===k?'active':''}" data-vtab="${k}">${label}${k==='mistakes'&&vWrongIds().length?` <span class="vcount">${vWrongIds().length}</span>`:''}</button>`).join('')}</div>`;}
function vocabWordbook(){let v=vState();return `<div class="vsection-head"><div><h3>Academic Wordbook</h3><p>Core 15개 + 확장 15개 · 문맥·유의어·예문을 함께 학습하세요.</p></div><span class="pill mint">총 ${vocabularyWords.length}개</span></div><div class="vwordtools"><input id="vocabSearch" class="inputline" data-vsearch="1" value="${esc(v.query)}" placeholder="영단어, 뜻, 예문 검색" aria-label="Vocabulary 검색" autocomplete="off"><div class="vfilters">${[['all','전체'],['core','핵심 15'],['advanced','확장 15'],['unknown','미암기']].map(([k,t])=>`<button class="vfilter ${v.filter===k?'selected':''}" data-vfilter="${k}">${t}</button>`).join('')}</div></div><div class="count" id="vocabShown" style="margin-bottom:9px"></div><div class="vocabscroll"><table class="vocabtable vwordtable"><thead><tr><th style="width:20%">Word / Phrase</th><th style="width:22%">한국어 의미 · 유의어</th><th>Academic collocation · Example</th><th style="min-width:115px">학습 확인</th></tr></thead><tbody>${vocabularyWords.map((w,i)=>`<tr data-vrow="${i}"><td><strong>${esc(w.term)}</strong><br><span class="vtag">${w.group==='core'?'CORE':'ADVANCED'}</span></td><td>${esc(w.meaning)}<div class="vsub">≈ ${esc(w.synonym)}</div></td><td><b class="vcolloc">${esc(w.collocation)}</b><div class="vsub">${esc(w.example)}</div></td><td><div class="vactions"><button class="viconbutton" data-vsound="${i}" title="발음 재생" aria-label="${esc(w.term)} 발음 듣기">▶</button><button class="vlearn ${v.studied[i]?'islearned':''}" data-vlearn="${i}">${v.studied[i]?'✓ 암기 완료':'○ 암기 표시'}</button></div></td></tr>`).join('')}</tbody></table></div><div class="note">단어를 암기 완료로 표시하면 진도에 반영됩니다. 플래시카드에서 ‘다시 학습’을 누르거나 시험에서 틀린 표현은 오답 복습으로 이동합니다.</div>`;}
function vocabFlashIds(){let v=vState();return vocabularyWords.map((_,i)=>i).filter(i=>v.flashFilter==='unknown'?!v.studied[i]:v.flashFilter==='mistakes'?!!v.mistakes[i]:true);}
function vocabFlash(){let v=vState(),ids=vocabFlashIds(),idx=Math.max(0,Math.min(Number(v.cardIndex)||0,ids.length-1)),id=ids[idx],w=vocabularyWords[id];return `<div class="vsection-head"><div><h3>Active Recall Flashcards</h3><p>앞면은 뜻을 말해 보고, 뒷면에서 collocation과 문장을 확인하세요.</p></div><div class="vfilters">${[['all','전체'],['unknown','미암기'],['mistakes','오답']].map(([k,t])=>`<button class="vfilter ${v.flashFilter===k?'selected':''}" data-vflashfilter="${k}">${t}</button>`).join('')}</div></div>${!w?`<div class="vempty">해당 조건의 카드가 없습니다. 다른 필터를 선택하거나 새 문제를 풀어보세요.</div>`:`<div class="vflashstats"><strong>${idx+1} / ${ids.length}</strong><span>${v.studied[id]?'✓ 암기 표시됨':'미암기'} · ${w.group==='core'?'Core':'Advanced'}</span></div><button class="vflash ${v.flashFlipped?'flipped':''}" data-vflip="1" aria-label="카드를 뒤집어 뜻 보기"><span class="vsmall">${v.flashFlipped?'ANSWER · 설명':'WORD · 의미를 떠올려 보세요'}</span>${v.flashFlipped?`<strong>${esc(w.meaning)}</strong><div class="vflashdetail"><b>${esc(w.term)}</b> <span class="vsub">≈ ${esc(w.synonym)}</span><p>${esc(w.collocation)}</p><p>${esc(w.example)}</p></div>`:`<strong>${esc(w.term)}</strong><span class="vflashhint">탭하면 뜻과 예문이 표시됩니다.</span>`}</button><div class="vcardcontrols"><button class="btn ghost" data-vstep="-1" ${idx===0?'disabled':''}>← 이전</button><button class="btn ghost" data-vsound="${id}">▶ 발음</button><button class="btn ghost" data-vflip="1">${v.flashFlipped?'앞면 보기':'정답 확인'}</button><button class="btn ghost" data-vstep="1" ${idx===ids.length-1?'disabled':''}>다음 →</button></div><div class="vcardcontrols"><button class="btn warn" data-vforget="${id}">↺ 다시 학습 · 오답 등록</button><button class="btn mint" data-vmaster="${id}">✓ 알아요 · 암기 완료</button></div><div class="count">‘다시 학습’을 선택한 카드는 오답 복습에 자동 등록됩니다.</div>`}`;}
function vocabQuiz(){let v=vState(),mode=v.quizMode,score=vScore(mode);return `<div class="vsection-head"><div><h3>Vocabulary Quiz</h3><p>객관식·문맥 빈칸은 자동 채점, 영작은 목표 표현 사용 여부를 자동 확인합니다.</p></div><span class="pill gold">Practice · Not ETS Scoring</span></div><div class="vquizmodes">${[['meaning','뜻 선택 · 10문항'],['cloze','문맥 빈칸 · 10문항'],['writing','영작 · 5문항']].map(([k,t])=>`<button class="vfilter ${mode===k?'selected':''}" data-vmode="${k}">${t}${v.quizChecked[k]?` ✓`:''}</button>`).join('')}</div>${mode==='meaning'?vocabularyMeaningIds.map((id,i)=>{let w=vocabularyWords[id],opts=vocabChoices(id),selected=v.meaningAnswers[i];return `<div class="vquizquestion"><h4>${i+1}. <em>${esc(w.term)}</em>의 가장 적절한 뜻은?</h4><div class="options">${opts.options.map((choice,j)=>`<button class="option ${Number(selected)===j?'selected':''} ${v.quizChecked.meaning&&opts.correct===j?'correct':''} ${v.quizChecked.meaning&&Number(selected)===j&&j!==opts.correct?'wrong':''}" data-vchoose="${i}" data-voption="${j}"><span class="letter">${'ABCD'[j]}</span><span>${esc(vocabularyWords[choice].meaning)}</span></button>`).join('')}</div>${v.quizChecked.meaning?`<div class="explain ${vIsCorrect(mode,i)?'good':''}"><b>${vIsCorrect(mode,i)?'✓ 정답':'정답: '+ 'ABCD'[opts.correct]}</b> · ${esc(w.collocation)}<br>${esc(w.example)}</div>`:''}</div>`;}).join(''):mode==='cloze'?vocabularyClozeItems.map((q,i)=>`<div class="vquizquestion"><h4>${i+1}. Complete the expression.</h4><p class="vquoted">${esc(q.sentence)}</p><input data-vcloze="${i}" class="inputline" value="${esc(v.clozeAnswers[i]||'')}" placeholder="영어 단어 또는 표현 입력" autocomplete="off"><div class="vsub">힌트: ${esc(q.hint)}</div>${v.quizChecked.cloze?`<div class="explain ${vIsCorrect(mode,i)?'good':''}"><b>${vIsCorrect(mode,i)?'✓ 정답':'정답: '+esc(q.answer)}</b><br>${esc(vocabularyWords[q.id].example)}</div>`:''}</div>`).join(''):vocabularyWriteItems.map((q,i)=>`<div class="vquizquestion"><h4>${i+1}. Target: <em>${esc(vocabularyWords[q.id].term)}</em></h4><p>${esc(q.ko)}</p><textarea data-vwrite="${i}" style="min-height:95px" placeholder="영어 문장 한 개를 완성하세요.">${esc(v.writingAnswers[i]||'')}</textarea><div class="vsub">표현 포함 + 10단어 이상을 자동 확인합니다. 문법·의미·자연스러움은 직접 검토해야 합니다.</div>${v.quizChecked.writing?`<div class="explain ${vIsCorrect(mode,i)?'good':''}"><b>${vIsCorrect(mode,i)?'✓ 표현 및 분량 조건 충족':'표현 또는 분량 조건 미충족'}</b><br>모범 문장: ${esc(q.example)}</div>`:''}</div>`).join('')}<div class="answerbar"><div><b class="score">${score===null?'채점 전':`결과 ${score}/${mode==='writing'?5:10}`}</b><div class="count">${mode==='writing'?'자동 검사 결과는 공인 영작 점수가 아닙니다.':'채점 시 틀린 단어는 오답 노트에 추가됩니다.'}</div></div><div class="vcardcontrols"><button class="btn ghost" data-vquizreset="${mode}">이 유형 다시 풀기</button><button class="btn" data-vgrade="${mode}">${score===null?'채점 및 해설':'다시 채점하기'}</button></div></div>`;}
function vocabMistakes(){let v=vState(),ids=vWrongIds(),idx=Math.min(Math.max(0,Number(v.reviewIndex)||0),Math.max(0,ids.length-1)),id=ids[idx],w=vocabularyWords[id];return `<div class="vsection-head"><div><h3>Targeted Mistake Review</h3><p>틀린 단어와 ‘다시 학습’ 카드를 모아 뜻을 다시 맞힐 때까지 복습합니다.</p></div><span class="pill gold">현재 오답 ${ids.length}개</span></div>${!w?`<div class="vempty"><b>복습할 오답이 없습니다.</b><p>플래시카드에서 ‘다시 학습’을 표시하거나 Vocabulary Quiz를 풀면 취약 표현이 여기에 모입니다.</p><button class="btn ghost" data-vtab="quiz">단어 시험으로 이동 →</button></div>`:`<div class="vflashstats"><b>복습 ${idx+1}/${ids.length}</b><span>오답이 사라지려면 정답을 선택하세요.</span></div><div class="vquizquestion"><h4>표현 <em>${esc(w.term)}</em>의 의미로 가장 적절한 것은?</h4><div class="options">${vocabChoices(id).options.map((option,j)=>`<button class="option ${v.reviewAnswers[id]===j?'selected':''} ${v.reviewAnswers[id]!==undefined&&vocabChoices(id).correct===j?'correct':''} ${v.reviewAnswers[id]===j&&j!==vocabChoices(id).correct?'wrong':''}" data-vreviewchoose="${j}" data-vreviewid="${id}"><span class="letter">${'ABCD'[j]}</span><span>${esc(vocabularyWords[option].meaning)}</span></button>`).join('')}</div>${v.reviewAnswers[id]!==undefined?`<div class="explain ${v.reviewAnswers[id]===vocabChoices(id).correct?'good':''}"><b>${v.reviewAnswers[id]===vocabChoices(id).correct?'정답':'다시 확인'}</b> · ${esc(w.meaning)}<br>${esc(w.example)}</div>`:''}</div><div class="vcardcontrols"><button class="btn ghost" data-vreviewstep="-1" ${idx===0?'disabled':''}>← 이전</button><button class="btn ghost" data-vsound="${id}">▶ 발음</button><button class="btn ghost" data-vreviewstep="1" ${idx===ids.length-1?'disabled':''}>다음 →</button></div>`}<h3 class="blocktitle">나만의 어휘 오답 노트</h3><p class="blockmeta">혼동한 단어와 이유를 적어두세요. 브라우저에 자동 저장됩니다.</p><textarea data-vnote="1" style="min-height:125px" placeholder="예: corroborate는 그냥 support가 아니라 독립된 증거로 뒷받침한다는 뜻이다.">${esc(v.notes||'')}</textarea>`;}
function vocabulary(){let v=vState(),known=vKnownCount(),wrong=vWrongIds().length,exams=['meaning','cloze','writing'].filter(k=>v.quizChecked[k]).length;return panel(secHeader('Vocabulary Lab','단어장 · 플래시카드 · 3종 시험 · 오답 복습','4-IN-1')+`<p class="subtitle">Core 15 + Advanced 15. 기본 10분 복습 후, 플래시카드와 단어 시험은 선택형 확장 학습으로 활용하세요.</p><div class="grid3 vsummary"><div class="kpi"><small>총 고급 표현</small><strong>30</strong><p>학술적 인과·논증·연구 표현</p></div><div class="kpi"><small>암기 완료</small><strong>${known}<span class="vdenom"> / 30</span></strong><div class="bars"><div style="width:${Math.round(known/30*100)}%"></div></div></div><div class="kpi"><small>복습 필요</small><strong>${wrong}</strong><p>단어 시험 ${exams}/3유형 완료</p></div></div>${vocabTabBar()}<div class="vtabcontent">${v.tab==='wordbook'?vocabWordbook():v.tab==='flash'?vocabFlash():v.tab==='quiz'?vocabQuiz():vocabMistakes()}</div>`);}
function applyVocabFilter(){let v=vState(),shown=0;document.querySelectorAll('[data-vrow]').forEach(row=>{let idx=Number(row.dataset.vrow),w=vocabularyWords[idx],search=(w.term+' '+w.meaning+' '+w.collocation+' '+w.example+' '+w.synonym).toLowerCase(),visible=(!v.query||search.includes(v.query.trim().toLowerCase()))&&(v.filter==='all'||(v.filter==='unknown'?!v.studied[idx]:w.group===v.filter));row.hidden=!visible;if(visible)shown++;});let count=document.getElementById('vocabShown');if(count)count.textContent=`${shown}개 표시 · 암기 완료 ${vKnownCount()}/30` ;}
function setQuizMistakes(mode){let q=mode==='meaning'?vocabularyMeaningIds:mode==='cloze'?vocabularyClozeItems:vocabularyWriteItems;for(let i=0;i<q.length;i++){if(!vIsCorrect(mode,i)){let id=mode==='meaning'?q[i]:q[i].id;vState().mistakes[id]=true;vState().studied[id]=false;}}}
function vocabGrade(mode){let v=vState(),size=mode==='meaning'?vocabularyMeaningIds.length:mode==='cloze'?vocabularyClozeItems.length:vocabularyWriteItems.length,answers=mode==='meaning'?v.meaningAnswers:mode==='cloze'?v.clozeAnswers:v.writingAnswers,filled=Array.from({length:size},(_,i)=>String(answers[i]??'').trim()).filter(Boolean).length;if(filled<size){toast(`먼저 ${size}문항에 모두 답변해 주세요. 현재 ${filled}/${size}`);return;}v.quizChecked[mode]=true;setQuizMistakes(mode);save();render();toast(`채점 완료 · ${vScore(mode)}/${size}. 틀린 표현은 오답 복습에 저장했습니다.`);}

const groups={rd:dailyReading,ra:academicReading,rp:precisionReading,lq:listeningQuick,lc:listeningConv,lt:listeningTalk};
const groupName={rd:'실생활 독해',ra:'학술 독해',rp:'추가 추론',lq:'응답 선택',lc:'대화 듣기',lt:'학술 강의 듣기'};
const initial={page:'overview',answer:{},checked:{},cloze:{},build:{},writing:{},interview:{},checks:{},seen:{},elapsed:0,timerOn:false,vocab:{tab:'wordbook',filter:'all',query:'',studied:{},cardIndex:0,flashFlipped:false,flashFilter:'all',quizMode:'meaning',meaningAnswers:{},clozeAnswers:{},writingAnswers:{},quizChecked:{},mistakes:{},reviewAnswers:{},reviewIndex:0,notes:''}};
let state=JSON.parse(JSON.stringify(initial));
try{const saved=JSON.parse(localStorage.getItem('toefl110day2-v1')||'null');if(saved && typeof saved==='object'){state={...initial,...saved,timerOn:false,page:'overview'};}}catch(_){/* storage unavailable */}
state.vocab={...initial.vocab,...(state.vocab||{})};
function save(){try{localStorage.setItem('toefl110day2-v1',JSON.stringify({...state,timerOn:false}));}catch(_){}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function timeFmt(s){let h=Math.floor(s/3600),m=Math.floor((s%3600)/60),ss=s%60;return [h,m,ss].map(x=>String(x).padStart(2,'0')).join(':');}
function progress(){let total=6+2+5+2+1+2+3+5+6+4+2+5+30,done=0;for(let i=0;i<6;i++)if(String(state.cloze[i]||'').trim())done++;for(const [id,items] of Object.entries(groups))items.forEach((_,i)=>{if(state.answer[id+'-'+i]!==undefined)done++});for(let i=0;i<5;i++)if(String(state.build[i]||'').trim())done++;for(let i=0;i<6;i++)if(state.checks['repeat'+i])done++;for(let i=0;i<4;i++)if(String(state.interview[i]||'').trim())done++;for(let id of ['email','discussion'])if(String(state.writing[id]||'').trim())done++;for(let i=0;i<5;i++)if(state.checks['review'+i])done++;done+=vKnownCount();return {done,total,pct:Math.round(done/total*100)};}
function toast(msg){let t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2400);}
function navTo(page){state.page=page;save();render();window.scrollTo({top:0,behavior:'smooth'});}
function sidebar(){const prog=progress();document.getElementById('sidebar').innerHTML=`<div class="brand"><div class="logo">T</div><div><strong>TOEFL 110+</strong><small>ADVANCED ACADEMY</small></div></div><div class="side-group">Study Workspace</div>${nav.map(n=>`<button class="navbtn ${state.page===n[0]?'active':''}" data-nav="${n[0]}"><span class="navico">${n[1]}</span>${n[2]}${['reading','listening','speaking','writing'].includes(n[0])?`<span class="num">DAY 2</span>`:''}</button>`).join('')}<div class="sidefoot"><strong><span class="activeDot"></span> 학습 내역 자동 저장</strong>진도 ${prog.done}/${prog.total}개 · ${prog.pct}%<div class="bars" style="margin-top:9px;background:#ffffff29"><div style="width:${prog.pct}%"></div></div><p style="margin-bottom:0">이 브라우저에만 답변이 저장됩니다.</p></div>`;
document.getElementById('mobilebar').innerHTML=nav.map(n=>`<button data-nav="${n[0]}" class="${state.page===n[0]?'active':''}">${n[2]}</button>`).join('');document.getElementById('crumb').textContent=nav.find(n=>n[0]===state.page)?.[2]||'학습 개요';}
function panel(content){return `<section class="panel">${content}</section>`;}
function secHeader(title,sub,badge){return `<div class="section-header"><div><h2 class="sectiontitle">${title}</h2><p class="subtitle">${sub}</p></div>${badge?`<span class="pill">${badge}</span>`:''}</div>`;}
function questions(id,items){const allSelected=items.every((_,i)=>state.answer[id+'-'+i]!==undefined);return `<div class="qgroup">${items.map((q,i)=>{const key=id+'-'+i,selected=state.answer[key],checked=!!state.checked[id];return `<div class="question"><h4>${i+1}. ${esc(q.q)}</h4><div class="options">${q.options.map((o,j)=>`<button class="option ${selected===j?'selected':''} ${checked&&j===q.answer?'correct':''} ${checked&&selected===j&&j!==q.answer?'wrong':''}" data-choose="${key}" data-value="${j}"><span class="letter">${'ABCD'[j]}</span><span>${esc(o)}</span></button>`).join('')}</div>${checked?`<div class="explain ${selected===q.answer?'good':''}"><b>${selected===q.answer?'✓ 정답':'정답: '+('ABCD'[q.answer])}</b><div>${esc(q.why)}</div></div>`:''}</div>`}).join('')}<div class="answerbar"><span class="status">${items.filter((q,i)=>state.answer[id+'-'+i]!==undefined).length}/${items.length}개 응답 ${state.checked[id]?`· <b>정답 ${items.filter((q,i)=>state.answer[id+'-'+i]===q.answer).length}/${items.length}</b>`:''}</span><button class="btn" data-check="${id}" ${!allSelected?'disabled':''}>${state.checked[id]?'다시 채점':'정답 채점 · 해설'}</button></div></div>`;}
function overview(){let p=progress();return `<div class="hero"><span class="eyebrow">Personalized 8-week program · Day 02</span><h1>Academic Precision.<br>Measurable Progress.</h1><p>TOEFL iBT 고득점자를 위한 2026 개편형 학습 공간. 학술적 추론, 화자 의도, 즉흥 발화와 논증 능력을 하나의 루틴으로 훈련합니다.</p><div class="stats"><div><b>110+</b><span>기존 점수 목표</span></div><div><b>2h</b><span>하루 집중 학습</span></div><div><b>8 weeks</b><span>총 96시간</span></div></div></div><div class="grid3"><div class="kpi"><small>총 학습 진도</small><strong>${p.pct}%</strong><div class="bars"><div style="width:${p.pct}%"></div></div><p style="margin-top:9px">${p.done}/${p.total}개 학습 항목</p></div><div class="kpi"><small>현재 레벨</small><strong>106+</strong><p>기존 120점 척도 기준</p></div><div class="kpi"><small>목표 레벨</small><strong>110+</strong><p>2026 척도 상향 목표 6.0</p></div></div>${panel(`<h3 class="blocktitle" style="margin-top:0">오늘의 120분</h3><p class="subtitle">Day 2 · Evaluating Evidence and Making Decisions</p><table class="schedule"><thead><tr><th>영역</th><th>시간</th><th>집중 항목</th></tr></thead><tbody>${[['Reading','30분','Complete the Words · 실생활 및 학술 독해'],['Listening','25분','응답 선택 · 대화 · 학술 강의'],['Speaking','25분','Listen and Repeat · Interview'],['Writing','30분','Build a Sentence · Email · Academic Discussion'],['Review','10분','오답 및 어휘 정리']].map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')}</tbody></table><div class="answerbar"><span class="status">음성 듣기는 브라우저 내장 TTS를 사용합니다.</span><button class="btn" data-nav="reading">Day 2 시작하기 →</button></div>`)}${panel(`<h3 class="blocktitle" style="margin-top:0">8주 맞춤형 로드맵</h3><p class="subtitle">매주 6일 × 2시간 · 일요일 휴식 또는 가벼운 복습</p><div class="weeklist">${weeks.map((w,i)=>`<div class="week ${i===0?'current':''}"><b>WEEK ${String(i+1).padStart(2,'0')}</b><div><strong>${w[0]}</strong><small>${w[1]}</small></div><div class="target">${w[2]}</div></div>`).join('')}</div><div class="note">정확도를 공식 점수로 직접 환산하지 않습니다. 2026년 TOEFL은 1–6점 척도를 사용하며, 110점이라는 목표는 이전 120점 척도를 기준으로 이해합니다.</div>`)}${panel(`<h3 class="blocktitle" style="margin-top:0">공식 자료 참고</h3><p class="subtitle">이 웹페이지의 문제는 새롭게 작성한 연습문제이며 ETS 공식 기출이 아닙니다.</p><p><a href="https://www.ets.org/toefl/test-takers/ibt/prepare.html" target="_blank" rel="noopener">ETS 공식 TOEFL 준비 자료 ↗</a></p><p><a href="https://www.ets.org/toefl/test-takers/ibt/about.html" target="_blank" rel="noopener">TOEFL iBT 시험 소개 ↗</a></p>`)}<div class="footer">TOEFL 110+ · Advanced Study Workspace · 개인 학습용</div>`;}
function reading(){return panel(secHeader('Reading','정밀 독해 · 논리적 추론 · 조건부 주장 분석','30 MIN')+`<h3 class="blocktitle">01. Complete the Words</h3><p class="blockmeta">5분 · 문맥과 품사를 참고해 완성된 단어를 입력하세요.</p><div class="passage"><p>Even when a research finding appears <b>convi_____</b> (1), scientists must distinguish correlation from <b>caus_____</b> (2). An apparent relationship may be <b>conf_____</b> (3) by factors that the original investigators failed to measure.</p><p>Consequently, a rigorous study should include <b>indep_____</b> (4) samples, make its analytical procedures <b>transp_____</b> (5), and assess whether the findings remain consistent under <b>alter_____</b> (6) assumptions.</p></div><div class="clozegroup" style="margin-top:16px">${cloze.map((w,i)=>`<div class="clozeitem"><label>${i+1}. ${['convi_____','caus_____','conf_____','indep_____','transp_____','alter_____'][i]}</label><input class="inputline" data-cloze="${i}" value="${esc(state.cloze[i]||'')}" placeholder="완성된 단어 입력" autocomplete="off">${state.checked.cloze?`<div class="hint ${norm(state.cloze[i])===w[0]?'right':'wrongtxt'}">${norm(state.cloze[i])===w[0]?'✓':'✗'} ${w[0]} · ${w[1]}</div>`:''}</div>`).join('')}</div><div class="answerbar"><span class="status">6문항 · 철자 및 문맥 정확도</span><button class="btn" data-check="cloze">채점 · 정답 보기</button></div><h3 class="blocktitle">02. Read in Daily Life</h3><p class="blockmeta">5분 · 공지의 목적, 조건, 예외 사항 파악</p><div class="passage">${readingDailyPassage}</div><div style="margin-top:15px">${questions('rd',dailyReading)}</div><h3 class="blocktitle">03. Read an Academic Passage</h3><p class="blockmeta">15분 · 인과 추론, 표본 선택 편향, 외적 타당도</p><div class="passage">${readingAcademicPassage}</div><div style="margin-top:15px">${questions('ra',academicReading)}</div><h3 class="blocktitle">04. Precision Check</h3><p class="blockmeta">5분 · 핵심 논지를 한 단계 더 정확하게 파악하기</p>${questions('rp',precisionReading)}<div class="callout"><b>고득점 독해 메모</b><br>‘do not always’, ‘might’, ‘does not automatically guarantee’는 완전 부정이 아닙니다. 시험에서 절대 표현이 포함된 선택지를 특히 신중하게 검토하세요.</div>`);}
function audioBox(id,title,sub,text,questionId,items){return `<h3 class="blocktitle">${title}</h3><p class="blockmeta">${sub}</p><div class="audiohead"><button class="audio" data-speak="${id}">▶ 영어 음성 듣기</button><button class="btn ghost" data-transcript="${id}">${state.seen['tr'+id]?'스크립트 숨기기':'스크립트 보기'}</button><span class="status">브라우저 내장 음성합성 · 가능하면 먼저 듣고 정답 선택</span></div>${state.seen['tr'+id]?`<div class="transcript">${esc(text)}</div>`:''}${questions(questionId,items)}`;}
function listening(){return panel(secHeader('Listening','질문의 표면 의미와 실제 의도를 구분하는 고난도 훈련','25 MIN')+`<div class="note">실제 녹음 음원이 아니라 브라우저 TTS를 사용합니다. 음성 환경과 화자 억양은 공식 시험과 다를 수 있습니다.</div>${audioBox('quick','01. Listen and Choose a Response','3분 · 짧은 발화에서 핵심 전제 파악',quickAudio,'lq',listeningQuick)}${audioBox('conv','02. Listen to a Conversation','7분 · 학내 연구실 예약 및 조건 파악',convAudio,'lc',listeningConv)}${audioBox('talk','03. Listen to an Academic Talk','10분 · Ecological Restoration and Historical Baselines',talkAudio,'lt',listeningTalk)}<h3 class="blocktitle">04. 화자 의도 핵심 표현</h3><table class="vocabtable"><thead><tr><th>표현</th><th>화용적 기능</th></tr></thead><tbody>${[['I was under the impression that…','이전의 이해나 전제를 언급'],['Not exactly.','상대의 이해를 완곡하게 수정'],["I’m afraid not.",'정중한 거절 또는 부정'],['This does not mean…','잘못된 결론을 선제적으로 방지'],['Rather,…','앞선 설명을 수정하거나 대체'],['Consequently,…','인과관계에 따른 결론 제시']].map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</tbody></table>`);}
function speaking(){return panel(secHeader('Speaking','Listen and Repeat · Take an Interview','25 MIN')+`<h3 class="blocktitle">01. Listen and Repeat</h3><p class="blockmeta">10분 · 문장 음성을 듣고 원문을 보지 않고 반복합니다. 복잡한 문장 강세와 의미 단위에 집중하세요.</p><div class="note">먼저 각 문장의 ‘영어 음성 듣기’를 누르세요. 듣고 반복한 후에 원문을 확인하고 완료를 표시할 수 있습니다.</div>${repeatLines.map((t,i)=>`<div class="question"><div class="toolbar"><b style="font-size:13px">Sentence ${i+1}</b><div><button class="audio" data-repeat="${i}">▶ 영어 음성 듣기</button> <button class="tiny" data-visible="repeat${i}">${state.seen['repeat'+i]?'원문 숨기기':'원문 보기'}</button></div></div>${state.seen['repeat'+i]?`<div class="revealframe" style="font-size:13px">${esc(t)}</div>`:'<p class="helptext">문장을 들은 뒤 직접 말해보세요.</p>'}<label class="checkrow"><input type="checkbox" data-tick="repeat${i}" ${state.checks['repeat'+i]?'checked':''}> <span>문장을 정확하게 반복하고 발음·강세를 확인했습니다.</span></label></div>`).join('')}<h3 class="blocktitle">02. Take an Interview</h3><p class="blockmeta">15분 · 다음 질문마다 연습용으로 45~60초 동안 답변한 뒤 자신의 핵심 논지를 짧게 메모하세요.</p>${interviews.map((t,i)=>`<div class="question"><h4>Question ${i+1}. ${esc(t)}</h4><textarea data-interview="${i}" placeholder="답변을 녹음한 뒤 핵심 논점이나 개선 사항을 기록하세요." style="min-height:90px">${esc(state.interview[i]||'')}</textarea><div class="count">${wc(state.interview[i]||'')} words</div></div>`).join('')}<div class="toolbar"><button class="btn ghost" data-visible="speakingExample">${state.seen.speakingExample?'모범 답변 숨기기':'Q2 모범 답변 보기'}</button></div>${state.seen.speakingExample?`<div class="model">${esc(speakingExample)}</div>`:''}<div class="callout"><b>고득점 포인트</b><br>입장을 먼저 말하고, 근거와 사례를 연결하고, 필요하면 자신의 초기 판단을 어떻게 수정했는지 설명하세요. 말의 속도보다 의미 전달의 정확성과 자연스러움을 우선합니다.</div>`);}
function writing(){return panel(secHeader('Writing','Sentence Accuracy · Email · Academic Discussion','30 MIN')+`<h3 class="blocktitle">01. Build a Sentence</h3><p class="blockmeta">6분 · 제공된 어구를 빠짐없이 사용하여 문법적으로 완전한 문장을 작성하세요.</p>${buildQs.map((q,i)=>`<div class="question"><h4>Sentence ${i+1}</h4><div class="promptbox">${esc(q.f)}</div><textarea data-build="${i}" placeholder="완성 문장을 작성하세요." style="min-height:85px;margin-top:12px">${esc(state.build[i]||'')}</textarea>${state.seen['build'+i]?`<div class="explain"><b>모범 답안:</b> ${esc(q.a)}<br>${esc(q.why)}</div>`:''}<div class="toolbar"><span class="status">어순 · 품사 · 도치 구조</span><button class="btn ghost" data-visible="build${i}">${state.seen['build'+i]?'답안 숨기기':'모범 답안 보기'}</button></div></div>`).join('')}<h3 class="blocktitle">02. Write an Email</h3><p class="blockmeta">7분 · 목적 달성, 요구 사항 누락 방지, 공손한 어조</p><div class="promptbox">${esc(emailTask)}</div><textarea data-writing="email" placeholder="Dear Student Services Team,…" style="margin-top:15px;min-height:230px">${esc(state.writing.email||'')}</textarea><div class="toolbar"><span class="count" id="wordEmail">${wc(state.writing.email||'')} words</span><button class="btn ghost" data-visible="emailExample">${state.seen.emailExample?'모범 답안 숨기기':'모범 답안 보기'}</button></div>${state.seen.emailExample?`<div class="model">${esc(emailExample)}</div>`:''}<h3 class="blocktitle">03. Write for an Academic Discussion</h3><p class="blockmeta">10분 작성 + 7분 분석 · 권장 연습 목표 140~170단어(공식 의무 분량 아님)</p><div class="promptbox">${esc(discussionTask)}</div><textarea data-writing="discussion" placeholder="I largely agree that…" style="margin-top:15px;min-height:280px">${esc(state.writing.discussion||'')}</textarea><div class="toolbar"><span class="count" id="wordDiscussion">${wc(state.writing.discussion||'')} words</span><button class="btn ghost" data-visible="discussionExample">${state.seen.discussionExample?'모범 답안 숨기기':'모범 답안 보기'}</button></div>${state.seen.discussionExample?`<div class="model">${esc(discussionExample)}</div>`:''}<div class="callout"><b>Writing 검토 순서</b><br>① 질문에 직접 답했는가? ② 주장의 근거가 충분한가? ③ 다른 관점을 정확히 이해했는가? ④ 문법·관사·수일치 오류가 없는가? ⑤ 불필요한 반복은 없는가?</div>`);}
function review(){const p=progress();let correct=0,totalScored=0;for(const [id,items] of Object.entries(groups))items.forEach((q,i)=>{if(state.checked[id]){totalScored++;if(state.answer[id+'-'+i]===q.answer)correct++;}});if(state.checked.cloze){cloze.forEach((c,i)=>{totalScored++;if(norm(state.cloze[i])===c[0])correct++;});}return panel(secHeader('학습 기록','정답률 · 진행 현황 · 자가 평가 · 내보내기','LOCAL SAVE')+`<div class="grid3"><div class="kpi"><small>학습 항목 완료</small><strong>${p.done}/${p.total}</strong><p>${p.pct}% 진행</p></div><div class="kpi"><small>채점된 문제</small><strong>${totalScored?`${correct}/${totalScored}`:'—'}</strong><p>정답률 ${totalScored?Math.round(correct/totalScored*100)+'%':'아직 채점 전'}</p></div><div class="kpi"><small>누적 학습시간</small><strong>${Math.floor(state.elapsed/60)}분</strong><p>타이머 기준 · 이 브라우저에 보관</p></div></div><h3 class="blocktitle">영역별 채점 내역</h3><table class="schedule"><thead><tr><th>문항 묶음</th><th>완료 여부</th><th>결과</th></tr></thead><tbody>${Object.entries(groups).map(([id,items])=>`<tr><td>${groupName[id]}</td><td>${state.checked[id]?'채점 완료':'미채점'}</td><td>${state.checked[id]?`${items.filter((q,i)=>state.answer[id+'-'+i]===q.answer).length}/${items.length}`:'—'}</td></tr>`).join('')}<tr><td>단어 복원</td><td>${state.checked.cloze?'채점 완료':'미채점'}</td><td>${state.checked.cloze?`${cloze.filter((c,i)=>norm(state.cloze[i])===c[0]).length}/6`:'—'}</td></tr></tbody></table><div class="note"><b>Vocabulary Lab</b> · 암기 완료 ${vKnownCount()}/30 · 복습 필요 ${vWrongIds().length}개 · 단어 시험 ${['meaning','cloze','writing'].filter(x=>state.vocab.quizChecked[x]).length}/3 유형 완료. <button class="linklike" data-nav="vocab">Vocabulary로 이동</button></div><h3 class="blocktitle">오늘의 체크리스트</h3><div class="reviewbox">${['고난도 추론에서 절대 표현을 신중히 확인했다.','Listening에서 화자의 수정·유보 표현을 인식했다.','Speaking 답변을 실제로 소리 내어 연습했다.','Writing에서 주요 요구사항과 오류를 검토했다.','틀린 문제의 이유를 한 문장으로 설명할 수 있다.'].map((t,i)=>`<label class="checkrow"><input type="checkbox" data-tick="review${i}" ${state.checks['review'+i]?'checked':''}>${t}</label>`).join('')}</div><h3 class="blocktitle">오늘의 오답 노트</h3><textarea data-writing="reviewNotes" placeholder="영역 / 오답 원인 / 다음에 적용할 수정 전략&#10;예: Reading - ‘does not always’를 완전 부정으로 잘못 해석. 정량적 표현 검토." style="min-height:190px">${esc(state.writing.reviewNotes||'')}</textarea><div class="toolbar"><button class="btn" id="exportAnswers">↓ 모든 답변 TXT 내보내기</button><button class="btn ghost" id="resetAll">↺ 학습 데이터 초기화</button></div><div class="note">개인 답안은 별도의 서버로 전송되지 않고 현재 브라우저의 로컬 저장소에 보관됩니다. 브라우저 데이터 삭제·시크릿 모드 등에서는 저장된 내용이 사라질 수 있으므로 중요한 답변은 TXT로 내려받으세요.</div>`);}
function norm(x){return String(x||'').trim().toLowerCase();}function wc(t){return String(t||'').trim()?String(t).trim().split(/\s+/).length:0;}
function render(){sidebar();document.getElementById('view').innerHTML=({overview,reading,listening,speaking,writing,vocab:vocabulary,review}[state.page]||overview)();document.getElementById('clock').textContent=timeFmt(state.elapsed);document.getElementById('timerBtn').textContent=state.timerOn?'Ⅱ 일시정지':'▶ 학습 시작';if(state.page==='vocab'&&state.vocab.tab==='wordbook')applyVocabFilter();}
function speak(text){if(!('speechSynthesis' in window)){toast('이 브라우저는 음성합성을 지원하지 않습니다.');return;}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.91;u.pitch=1;let v=speechSynthesis.getVoices().find(x=>x.lang.startsWith('en-US'));if(v)u.voice=v;speechSynthesis.speak(u);toast('영어 음성 재생 중 · 다시 누르면 처음부터 재생됩니다.');}
function exportAnswers(){const lines=['TOEFL 110+ DAY 2 · 학습 기록','작성일: '+new Date().toLocaleString('ko-KR'),'누적 학습 시간: '+timeFmt(state.elapsed),''];for(const [id,items] of Object.entries(groups)){lines.push('['+groupName[id]+']');items.forEach((q,i)=>lines.push(`${i+1}. ${q.q}\n답변: ${state.answer[id+'-'+i]===undefined?'미응답':'ABCD'[state.answer[id+'-'+i]]} / 정답: ${'ABCD'[q.answer]}`));lines.push('');}lines.push('[Complete the Words]');cloze.forEach((c,i)=>lines.push(`${i+1}. ${state.cloze[i]||'미응답'} (정답: ${c[0]})`));lines.push('','[Build a Sentence]');buildQs.forEach((q,i)=>lines.push(`${i+1}. ${state.build[i]||'미응답'}`));lines.push('','[Interview Notes]');interviews.forEach((q,i)=>lines.push(`${i+1}. ${q}\n${state.interview[i]||''}`));for(let k of ['email','discussion','vocabSentences','reviewNotes'])lines.push('',`[${k}]`,state.writing[k]||'');lines.push('','[Vocabulary Lab]');vocabularyWords.forEach((w,i)=>{if(state.vocab.studied[i]||state.vocab.mistakes[i])lines.push(`${w.term}: ${state.vocab.studied[i]?'암기 완료':'미암기'} / ${state.vocab.mistakes[i]?'오답 복습 필요':'오답 없음'}`)});lines.push('','[Vocabulary Quiz]');for(const mode of ['meaning','cloze','writing']){lines.push('시험 유형: '+mode+' / 채점 여부: '+Boolean(state.vocab.quizChecked[mode]));let a=mode==='meaning'?state.vocab.meaningAnswers:mode==='cloze'?state.vocab.clozeAnswers:state.vocab.writingAnswers;Object.entries(a).forEach(([k,value])=>lines.push(`${Number(k)+1}. ${value}`));}lines.push('','[Vocabulary Notes]',state.vocab.notes||'');const blob=new Blob([lines.join('\n')],{type:'text/plain;charset=utf-8'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='TOEFL_110_Day2_Study_Answers.txt';document.body.append(a);a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);a.remove();toast('학습 답안 TXT 파일을 저장했습니다.');}
function handleInput(el){let v=el.value;if(el.hasAttribute('data-cloze'))state.cloze[el.dataset.cloze]=v;else if(el.hasAttribute('data-build'))state.build[el.dataset.build]=v;else if(el.hasAttribute('data-writing')){state.writing[el.dataset.writing]=v;let word=document.getElementById('word'+el.dataset.writing[0].toUpperCase()+el.dataset.writing.slice(1));if(word)word.textContent=wc(v)+' words';}else if(el.hasAttribute('data-interview'))state.interview[el.dataset.interview]=v;save();}
document.addEventListener('input',e=>{let el=e.target,v=vState();if(el.matches('[data-vsearch]')){v.query=el.value;save();applyVocabFilter();}else if(el.matches('[data-vcloze]')){v.clozeAnswers[el.dataset.vcloze]=el.value;v.quizChecked.cloze=false;save();}else if(el.matches('[data-vwrite]')){v.writingAnswers[el.dataset.vwrite]=el.value;v.quizChecked.writing=false;save();}else if(el.matches('[data-vnote]')){v.notes=el.value;save();}});
document.addEventListener('click',e=>{let el=e.target.closest('button');if(!el)return;let v=vState();
if(el.dataset.vtab){v.tab=el.dataset.vtab;v.reviewIndex=0;save();render();return;}
if(el.dataset.vfilter){v.filter=el.dataset.vfilter;save();render();return;}
if(el.dataset.vflashfilter){v.flashFilter=el.dataset.vflashfilter;v.cardIndex=0;v.flashFlipped=false;save();render();return;}
if(el.dataset.vsound!==undefined){let w=vocabularyWords[Number(el.dataset.vsound)];if(w)speak(w.term.replace('A to B','the result to its cause')+'. '+w.example);return;}
if(el.dataset.vlearn!==undefined){let id=Number(el.dataset.vlearn);if(v.studied[id])delete v.studied[id];else v.studied[id]=true;save();render();applyVocabFilter();return;}
if(el.dataset.vflip){v.flashFlipped=!v.flashFlipped;save();render();return;}
if(el.dataset.vstep){let ids=vocabFlashIds();v.cardIndex=Math.max(0,Math.min(ids.length-1,(Number(v.cardIndex)||0)+Number(el.dataset.vstep)));v.flashFlipped=false;save();render();return;}
if(el.dataset.vforget!==undefined){let id=Number(el.dataset.vforget);v.mistakes[id]=true;delete v.studied[id];let count=vocabFlashIds().length;v.cardIndex=Math.max(0,Math.min(Number(v.cardIndex)||0,count-1));v.flashFlipped=false;save();render();toast('오답 복습에 추가했습니다.');return;}
if(el.dataset.vmaster!==undefined){let id=Number(el.dataset.vmaster);v.studied[id]=true;let count=vocabFlashIds().length;v.cardIndex=Math.max(0,Math.min(Number(v.cardIndex)||0,count-1));v.flashFlipped=false;save();render();toast('암기 완료로 표시했습니다.');return;}
if(el.dataset.vmode){v.quizMode=el.dataset.vmode;save();render();return;}
if(el.dataset.vchoose!==undefined){v.meaningAnswers[el.dataset.vchoose]=Number(el.dataset.voption);v.quizChecked.meaning=false;save();render();return;}
if(el.dataset.vgrade){vocabGrade(el.dataset.vgrade);return;}
if(el.dataset.vquizreset){let mode=el.dataset.vquizreset;if(!confirm('선택한 시험 유형의 답변을 초기화하고 다시 풀까요? 오답 노트는 그대로 유지됩니다.'))return;if(mode==='meaning')v.meaningAnswers={};if(mode==='cloze')v.clozeAnswers={};if(mode==='writing')v.writingAnswers={};v.quizChecked[mode]=false;save();render();toast('이 시험 유형의 답변을 초기화했습니다.');return;}
if(el.dataset.vreviewstep){let count=vWrongIds().length;v.reviewIndex=Math.max(0,Math.min(count-1,(Number(v.reviewIndex)||0)+Number(el.dataset.vreviewstep)));save();render();return;}
if(el.dataset.vreviewchoose!==undefined){let id=Number(el.dataset.vreviewid),selected=Number(el.dataset.vreviewchoose);v.reviewAnswers[id]=selected;if(selected===vocabChoices(id).correct){delete v.mistakes[id];v.studied[id]=true;delete v.reviewAnswers[id];v.reviewIndex=Math.max(0,Math.min(v.reviewIndex,vWrongIds().length-1));save();render();toast('정답입니다. 오답 복습에서 해제하고 암기 완료로 표시했습니다.');}else{save();render();toast('오답입니다. 예문과 뜻을 확인한 뒤 다시 선택하세요.');}return;}
});

document.addEventListener('input',e=>{if(e.target.matches('[data-cloze],[data-build],[data-writing],[data-interview]'))handleInput(e.target);});
document.addEventListener('change',e=>{let t=e.target;if(t.matches('[data-tick]')){state.checks[t.dataset.tick]=t.checked;save();sidebar();}});
document.addEventListener('click',e=>{const el=e.target.closest('button');if(!el)return;
if(el.dataset.nav){navTo(el.dataset.nav);return;}
if(el.dataset.choose){state.answer[el.dataset.choose]=Number(el.dataset.value);let group=el.dataset.choose.split('-')[0];state.checked[group]=false;save();render();return;}
if(el.dataset.check){state.checked[el.dataset.check]=true;save();render();toast('채점 결과와 정답 해설을 표시했습니다.');return;}
if(el.dataset.speak){speak(({quick:quickAudio,conv:convAudio,talk:talkAudio})[el.dataset.speak]);return;}
if(el.dataset.repeat!==undefined){speak(repeatLines[Number(el.dataset.repeat)]);return;}
if(el.dataset.transcript){let k='tr'+el.dataset.transcript;state.seen[k]=!state.seen[k];save();render();return;}
if(el.dataset.visible){state.seen[el.dataset.visible]=!state.seen[el.dataset.visible];save();render();return;}
if(el.id==='timerBtn'){state.timerOn=!state.timerOn;save();el.textContent=state.timerOn?'Ⅱ 일시정지':'▶ 학습 시작';toast(state.timerOn?'학습 타이머를 시작했습니다.':'학습 타이머를 일시정지했습니다.');return;}
if(el.id==='saveBtn'||el.id==='exportAnswers'){exportAnswers();return;}
if(el.id==='resetAll'){if(confirm('이 브라우저에 저장된 TOEFL Day 2 답변과 타이머를 모두 삭제할까요? 먼저 TXT로 내보내는 것을 권장합니다.')){state=JSON.parse(JSON.stringify(initial));save();render();toast('학습 내역을 초기화했습니다.');}return;}
});
setInterval(()=>{if(state.timerOn){state.elapsed++;document.getElementById('clock').textContent=timeFmt(state.elapsed);if(state.elapsed%10===0)save();}},1000);
window.addEventListener('beforeunload',save);
render();
</script>
</body>
</html>
